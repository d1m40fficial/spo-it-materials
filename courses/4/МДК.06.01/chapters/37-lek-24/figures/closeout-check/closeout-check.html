<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чек-лист закрытия проекта</title>
<style>
  :root { --bg:#EDE5D2; --paper:#FBF6EA; --ink:#2B2A26; --muted:#6B6250; --accent:#9A7300; --soft:#F3EAD3; --rule:#D8CBB0; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--bg); border:1px solid var(--rule); border-radius:12px; padding:16px 16px 12px; }
  .eyebrow { margin:0 0 4px; font:600 9px/1.3 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); }
  h3 { margin:0 0 4px; font-size:18px; line-height:1.2; }
  svg { display:block; width:100%; height:auto; }
  .co-item { cursor:pointer; }
  .co-item rect { fill:#FFFDF7; stroke:#D8CBB0; stroke-width:1.2; transition:fill .15s, stroke .15s; }
  .co-item.done rect { fill:#F3EAD3; stroke:#9A7300; stroke-width:1.6; }
  .co-item .mark { opacity:0; }
  .co-item.done .mark { opacity:1; }
  .co-item:focus { outline:none; }
  .co-item:focus rect { stroke:#9A7300; stroke-width:2; }
  .note { margin:8px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  @media (max-width:560px) { .frame { padding:12px; } h3 { font-size:16px; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Завершение · контроль</p>
  <h3>Можно ли подписывать акт</h3>
  <svg viewBox="0 0 680 272" role="img" aria-labelledby="cc-t cc-d">
    <title id="cc-t">Чек-лист закрытия проекта</title>
    <desc id="cc-d">Восемь условий закрытия проекта. Отмечайте выполненные: счётчик и полоса готовности показывают, остались ли обязательства без документа.</desc>
    <g font-family="'Segoe UI',system-ui,sans-serif">
      <g class="co-item" data-k="0" tabindex="0" role="button" aria-pressed="false">
        <rect x="14" y="18" width="420" height="25" rx="6"/>
        <text x="28" y="35" font-size="9.8" fill="#2B2A26">Система работает на всех площадках</text>
        <text class="mark" x="414" y="35" font-size="11" fill="#9A7300" text-anchor="middle">✓</text>
      </g>
      <g class="co-item" data-k="1" tabindex="0" role="button" aria-pressed="false">
        <rect x="14" y="47" width="420" height="25" rx="6"/>
        <text x="28" y="64" font-size="9.8" fill="#2B2A26">Принимающая сторона выполнила операции сама</text>
        <text class="mark" x="414" y="64" font-size="11" fill="#9A7300" text-anchor="middle">✓</text>
      </g>
      <g class="co-item" data-k="2" tabindex="0" role="button" aria-pressed="false">
        <rect x="14" y="76" width="420" height="25" rx="6"/>
        <text x="28" y="93" font-size="9.8" fill="#2B2A26">Документация совпадает с версией</text>
        <text class="mark" x="414" y="93" font-size="11" fill="#9A7300" text-anchor="middle">✓</text>
      </g>
      <g class="co-item" data-k="3" tabindex="0" role="button" aria-pressed="false">
        <rect x="14" y="105" width="420" height="25" rx="6"/>
        <text x="28" y="122" font-size="9.8" fill="#2B2A26">Доступы переданы, пароли сменены</text>
        <text class="mark" x="414" y="122" font-size="11" fill="#9A7300" text-anchor="middle">✓</text>
      </g>
      <g class="co-item" data-k="4" tabindex="0" role="button" aria-pressed="false">
        <rect x="14" y="134" width="420" height="25" rx="6"/>
        <text x="28" y="151" font-size="9.8" fill="#2B2A26">Копии проверены восстановлением</text>
        <text class="mark" x="414" y="151" font-size="11" fill="#9A7300" text-anchor="middle">✓</text>
      </g>
      <g class="co-item" data-k="5" tabindex="0" role="button" aria-pressed="false">
        <rect x="14" y="163" width="420" height="25" rx="6"/>
        <text x="28" y="180" font-size="9.8" fill="#2B2A26">Открытые дефекты имеют срок и владельца</text>
        <text class="mark" x="414" y="180" font-size="11" fill="#9A7300" text-anchor="middle">✓</text>
      </g>
      <g class="co-item" data-k="6" tabindex="0" role="button" aria-pressed="false">
        <rect x="14" y="192" width="420" height="25" rx="6"/>
        <text x="28" y="209" font-size="9.8" fill="#2B2A26">Перенесённые требования в плане релиза</text>
        <text class="mark" x="414" y="209" font-size="11" fill="#9A7300" text-anchor="middle">✓</text>
      </g>
      <g class="co-item" data-k="7" tabindex="0" role="button" aria-pressed="false">
        <rect x="14" y="221" width="420" height="25" rx="6"/>
        <text x="28" y="238" font-size="9.8" fill="#2B2A26">Акты, счета и лицензии закрыты</text>
        <text class="mark" x="414" y="238" font-size="11" fill="#9A7300" text-anchor="middle">✓</text>
      </g>

      <rect x="448" y="18" width="218" height="236" rx="10" fill="#FFFDF7" stroke="#D8CBB0"/>
      <text x="462" y="40" font-family="Consolas,monospace" font-size="8.5" letter-spacing="1.2" fill="#6B6250">ГОТОВНОСТЬ</text>
      <text id="co-count" x="557" y="76" text-anchor="middle" font-size="24" font-weight="600" fill="#9A7300">0 / 8</text>
      <rect x="462" y="90" width="190" height="10" rx="4" fill="#F3EAD3" stroke="#D8CBB0"/>
      <rect id="co-fill" x="462" y="90" width="0" height="10" rx="4" fill="#9A7300"/>
      <text id="co-msg" x="462" y="128" font-size="11" font-weight="600" fill="#2B2A26">закрывать нельзя</text>
      <text id="co-sub1" x="462" y="148" font-size="9" fill="#6B6250">открытых пунктов: 8</text>
      <text id="co-sub2" x="462" y="164" font-size="9" fill="#6B6250">каждый пункт закрывается документом</text>
      <text x="462" y="238" font-size="8.5" fill="#9A7300">«почти» считается «нет»</text>
    </g>
  </svg>
  <p class="note">Отметьте пункты, которые действительно закрыты. Ответ «почти» оставляет обязательство, а проект с обязательством не закрыт.</p>
</div>
<script>
(function () {
  var items = [].slice.call(document.querySelectorAll('.co-item'));
  var count = document.getElementById('co-count');
  var fill = document.getElementById('co-fill');
  var msg = document.getElementById('co-msg');
  var sub1 = document.getElementById('co-sub1');
  var sub2 = document.getElementById('co-sub2');

  function sync() {
    var done = items.filter(function (i) { return i.classList.contains('done'); }).length;
    var left = items.length - done;
    count.textContent = done + ' / ' + items.length;
    fill.setAttribute('width', (190 * done / items.length).toFixed(1));
    if (left === 0) {
      msg.textContent = 'можно подписывать';
      sub1.textContent = 'все восемь пунктов закрыты';
      sub2.textContent = 'обязательств без документа нет';
    } else {
      msg.textContent = 'закрывать нельзя';
      sub1.textContent = 'открытых пунктов: ' + left;
      sub2.textContent = 'каждый пункт закрывается документом';
    }
  }
  function toggle(el) {
    el.classList.toggle('done');
    el.setAttribute('aria-pressed', el.classList.contains('done') ? 'true' : 'false');
    sync();
  }
  items.forEach(function (el) {
    el.addEventListener('click', function () { toggle(el); });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(el); }
    });
  });
  sync();
})();
</script>
</body>
</html>
