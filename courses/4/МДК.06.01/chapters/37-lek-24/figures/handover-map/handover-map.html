<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Что передают в сопровождение</title>
<style>
  :root { --bg:#EDE5D2; --paper:#FBF6EA; --ink:#2B2A26; --muted:#6B6250; --accent:#9A7300; --soft:#F3EAD3; --rule:#D8CBB0; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--bg); border:1px solid var(--rule); border-radius:12px; padding:16px 16px 12px; }
  .eyebrow { margin:0 0 6px; font:600 9px/1.3 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .note { margin:8px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Завершение · передача</p>
  <svg viewBox="0 0 680 312" role="img" aria-labelledby="hm-t hm-d">
    <title id="hm-t">Пять пакетов передачи в сопровождение</title>
    <desc id="hm-d">Система, доступы, документы, знания и обязательства передаются принимающей стороне. У каждого пакета есть доказательство выполнения, а вместе они дают работу без команды внедрения.</desc>
    <defs>
      <marker id="hm-arw" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
        <polygon points="0 0, 9 3.5, 0 7" fill="#9A7300"/>
      </marker>
    </defs>

    <g font-family="'Segoe UI',system-ui,sans-serif">
      <rect x="14" y="18" width="200" height="70" rx="9" fill="#FFFDF7" stroke="#D8CBB0"/>
      <text x="28" y="38" font-size="11" font-weight="600" fill="#2B2A26">система</text>
      <text x="28" y="54" font-size="8.8" fill="#6B6250">рабочая и тестовая база,</text>
      <text x="28" y="66" font-size="8.8" fill="#6B6250">схема, версии</text>
      <text x="28" y="81" font-size="7.8" fill="#9A7300">доказательство: запуск и сверка</text>

      <rect x="466" y="18" width="200" height="70" rx="9" fill="#FFFDF7" stroke="#D8CBB0"/>
      <text x="480" y="38" font-size="11" font-weight="600" fill="#2B2A26">доступы</text>
      <text x="480" y="54" font-size="8.8" fill="#6B6250">учётные записи, ключи,</text>
      <text x="480" y="66" font-size="8.8" fill="#6B6250">панель, репозиторий</text>
      <text x="480" y="81" font-size="7.8" fill="#9A7300">доказательство: вход и смена пароля</text>

      <rect x="14" y="114" width="200" height="70" rx="9" fill="#FFFDF7" stroke="#D8CBB0"/>
      <text x="28" y="134" font-size="11" font-weight="600" fill="#2B2A26">документы</text>
      <text x="28" y="150" font-size="8.8" fill="#6B6250">руководства, регламент,</text>
      <text x="28" y="162" font-size="8.8" fill="#6B6250">инструкции</text>
      <text x="28" y="177" font-size="7.8" fill="#9A7300">доказательство: операция без подсказки</text>

      <rect x="466" y="114" width="200" height="70" rx="9" fill="#FFFDF7" stroke="#D8CBB0"/>
      <text x="480" y="134" font-size="11" font-weight="600" fill="#2B2A26">знания</text>
      <text x="480" y="150" font-size="8.8" fill="#6B6250">разбор сбоев, наставник,</text>
      <text x="480" y="162" font-size="8.8" fill="#6B6250">запись занятий</text>
      <text x="480" y="177" font-size="7.8" fill="#9A7300">доказательство: задача своими руками</text>

      <rect x="240" y="232" width="200" height="70" rx="9" fill="#FFFDF7" stroke="#D8CBB0"/>
      <text x="254" y="252" font-size="11" font-weight="600" fill="#2B2A26">обязательства</text>
      <text x="254" y="268" font-size="8.8" fill="#6B6250">гарантия, дефекты,</text>
      <text x="254" y="280" font-size="8.8" fill="#6B6250">лицензии, счета</text>
      <text x="254" y="295" font-size="7.8" fill="#9A7300">доказательство: документ и срок</text>

      <rect x="240" y="118" width="200" height="70" rx="10" fill="#F3EAD3" stroke="#9A7300" stroke-width="1.6"/>
      <text x="340" y="142" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2B2A26">система живёт</text>
      <text x="340" y="158" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2B2A26">без команды</text>
      <text x="340" y="174" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2B2A26">внедрения</text>

      <g stroke="#9A7300" stroke-width="1.4" fill="none" marker-end="url(#hm-arw)">
        <path d="M214 58 L240 128"/>
        <path d="M466 58 L440 128"/>
        <path d="M214 149 L236 149"/>
        <path d="M466 149 L444 149"/>
        <path d="M340 232 L340 192"/>
      </g>
    </g>
  </svg>
  <p class="note">Пакет считается переданным не после рассказа, а после того, как принимающая сторона повторила действие сама.</p>
</div>
</body>
</html>
