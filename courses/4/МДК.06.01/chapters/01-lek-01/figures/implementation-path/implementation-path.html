<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Этапы внедрения и их результаты</title>
<style>
  :root { --paper:#FAF7EF; --card:#FFFDF8; --ink:#2A2620; --muted:#6B6252; --rule:#E3D8C2; --accent:#9A7300; --soft:#EDE5D2; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px; }
  .eyebrow { margin:0 0 6px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  .note { margin:10px 2px 0; font:12px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Внедрение · этапы и артефакты</p>
  <svg viewBox="0 0 680 404" role="img" aria-labelledby="ip-title ip-desc">
    <title id="ip-title">Шесть этапов внедрения и результат каждого</title>
    <desc id="ip-desc">Обследование, требования, настройка и миграция, обучение, опытная эксплуатация, передача. У каждого этапа есть проверяемый артефакт и вопрос, на который он отвечает.</desc>

    <text x="16" y="20" font-family="Consolas,monospace" font-size="10" fill="#6B6252">ПОКУПКА ЛИЦЕНЗИЙ И УСТАНОВКА</text>
    <rect x="16" y="28" width="648" height="30" rx="6" fill="#FFFFFF" stroke="#C9BCA2" stroke-dasharray="4 3"/>
    <text x="28" y="47" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#2A2620">акт передачи лицензий, сервер запущен, меню показано</text>
    <text x="540" y="47" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#6B6252">работа не изменилась</text>

    <line x1="42" y1="72" x2="42" y2="360" stroke="#D9CBB0" stroke-width="2"/>

    <g font-family="Segoe UI,system-ui,sans-serif">
      <g>
        <circle cx="42" cy="88" r="12" fill="#EDE5D2" stroke="#9A7300" stroke-width="1.5"/>
        <text x="42" y="92" text-anchor="middle" font-size="10" font-weight="700" fill="#9A7300">01</text>
        <rect x="66" y="70" width="360" height="40" rx="6" fill="#FFFDF8" stroke="#C9BCA2"/>
        <text x="78" y="87" font-size="13" font-weight="600" fill="#2A2620">Обследование</text>
        <text x="78" y="102" font-size="10.5" fill="#6B6252">как организация работает сейчас и где теряет время</text>
        <text x="440" y="86" font-size="10" fill="#6B6252">результат</text>
        <text x="440" y="101" font-size="10.5" font-weight="600" fill="#9A7300">отчёт, карта процессов, проблемы</text>
      </g>

      <g>
        <circle cx="42" cy="140" r="12" fill="#EDE5D2" stroke="#9A7300" stroke-width="1.5"/>
        <text x="42" y="144" text-anchor="middle" font-size="10" font-weight="700" fill="#9A7300">02</text>
        <rect x="66" y="122" width="360" height="40" rx="6" fill="#FFFDF8" stroke="#C9BCA2"/>
        <text x="78" y="139" font-size="13" font-weight="600" fill="#2A2620">Требования</text>
        <text x="78" y="154" font-size="10.5" fill="#6B6252">что должно измениться и как это проверить</text>
        <text x="440" y="138" font-size="10" fill="#6B6252">результат</text>
        <text x="440" y="153" font-size="10.5" font-weight="600" fill="#9A7300">реестр требований, критерии</text>
      </g>

      <g>
        <circle cx="42" cy="192" r="12" fill="#EDE5D2" stroke="#9A7300" stroke-width="1.5"/>
        <text x="42" y="196" text-anchor="middle" font-size="10" font-weight="700" fill="#9A7300">03</text>
        <rect x="66" y="174" width="360" height="40" rx="6" fill="#FFFDF8" stroke="#C9BCA2"/>
        <text x="78" y="191" font-size="13" font-weight="600" fill="#2A2620">Настройка и миграция</text>
        <text x="78" y="206" font-size="10.5" fill="#6B6252">как система обеспечит новые правила</text>
        <text x="440" y="190" font-size="10" fill="#6B6252">результат</text>
        <text x="440" y="205" font-size="10.5" font-weight="600" fill="#9A7300">роли, справочники, данные</text>
      </g>

      <g>
        <circle cx="42" cy="244" r="12" fill="#EDE5D2" stroke="#9A7300" stroke-width="1.5"/>
        <text x="42" y="248" text-anchor="middle" font-size="10" font-weight="700" fill="#9A7300">04</text>
        <rect x="66" y="226" width="360" height="40" rx="6" fill="#FFFDF8" stroke="#C9BCA2"/>
        <text x="78" y="243" font-size="13" font-weight="600" fill="#2A2620">Обучение</text>
        <text x="78" y="258" font-size="10.5" fill="#6B6252">кто и как будет выполнять операции</text>
        <text x="440" y="242" font-size="10" fill="#6B6252">результат</text>
        <text x="440" y="257" font-size="10.5" font-weight="600" fill="#9A7300">программы по ролям, журнал</text>
      </g>

      <g>
        <circle cx="42" cy="296" r="12" fill="#EDE5D2" stroke="#9A7300" stroke-width="1.5"/>
        <text x="42" y="300" text-anchor="middle" font-size="10" font-weight="700" fill="#9A7300">05</text>
        <rect x="66" y="278" width="360" height="40" rx="6" fill="#FFFDF8" stroke="#C9BCA2"/>
        <text x="78" y="295" font-size="13" font-weight="600" fill="#2A2620">Опытная эксплуатация</text>
        <text x="78" y="310" font-size="10.5" fill="#6B6252">выдерживает ли система реальный поток</text>
        <text x="440" y="294" font-size="10" fill="#6B6252">результат</text>
        <text x="440" y="309" font-size="10.5" font-weight="600" fill="#9A7300">журнал замечаний, решение</text>
      </g>

      <g>
        <circle cx="42" cy="348" r="12" fill="#9A7300" stroke="#9A7300" stroke-width="1.5"/>
        <text x="42" y="352" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">06</text>
        <rect x="66" y="330" width="360" height="40" rx="6" fill="#EDE5D2" stroke="#9A7300" stroke-width="1.6"/>
        <text x="78" y="347" font-size="13" font-weight="600" fill="#2A2620">Передача</text>
        <text x="78" y="362" font-size="10.5" fill="#6B6252">кто отвечает за систему после проекта</text>
        <text x="440" y="346" font-size="10" fill="#6B6252">результат</text>
        <text x="440" y="361" font-size="10.5" font-weight="600" fill="#9A7300">акт, регламент, комплект</text>
      </g>
    </g>

    <text x="16" y="390" font-family="Consolas,monospace" font-size="9.5" fill="#6B6252">ЭТАП ЗАКОНЧЕН, КОГДА ЕСТЬ АРТЕФАКТ, А НЕ КОГДА ПРОВЕДЕНО СОВЕЩАНИЕ</text>
  </svg>
  <p class="note">Слева номера этапов, справа их результат. Сопровождение начинается после передачи и возвращает изменения в требования.</p>
</div>
</body>
</html>
