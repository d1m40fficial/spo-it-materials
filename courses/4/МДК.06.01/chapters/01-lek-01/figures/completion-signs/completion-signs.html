<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Четыре признака завершённого внедрения</title>
<style>
  :root { --paper:#FAF7EF; --card:#FFFDF8; --ink:#2A2620; --muted:#6B6252; --rule:#E3D8C2; --accent:#9A7300; --soft:#EDE5D2; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px; }
  .eyebrow { margin:0 0 6px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  .note { margin:10px 2px 0; font:12px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Внедрение · готовность</p>
  <svg viewBox="0 0 680 306" role="img" aria-labelledby="cs-title cs-desc">
    <title id="cs-title">Четыре признака завершённого внедрения</title>
    <desc id="cs-desc">Операции идут в системе, метрики достигнуты, есть владелец и регламент, комплект передан. Внизу показан контраст: акт подписан, а работа осталась прежней.</desc>

    <g font-family="Segoe UI,system-ui,sans-serif">
      <g>
        <rect x="16" y="24" width="316" height="104" rx="9" fill="#FFFDF8" stroke="#C9BCA2"/>
        <circle cx="38" cy="46" r="11" fill="#9A7300"/>
        <text x="38" y="50" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">1</text>
        <text x="58" y="50" font-size="13" font-weight="700" fill="#2A2620">Операции идут в системе</text>
        <text x="30" y="72" font-size="10.5" fill="#6B6252">заказ оформляется в системе, а не переносится</text>
        <text x="30" y="87" font-size="10.5" fill="#6B6252">из блокнота; накладная и счёт рождаются там же</text>
        <text x="30" y="108" font-size="10.5" font-weight="600" fill="#9A7300">проверка: доля операций без обходного файла</text>
      </g>

      <g>
        <rect x="348" y="24" width="316" height="104" rx="9" fill="#FFFDF8" stroke="#C9BCA2"/>
        <circle cx="370" cy="46" r="11" fill="#9A7300"/>
        <text x="370" y="50" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">2</text>
        <text x="390" y="50" font-size="13" font-weight="700" fill="#2A2620">Метрики достигнуты</text>
        <text x="362" y="72" font-size="10.5" fill="#6B6252">время заказа, доля ошибок, остатки обновляются</text>
        <text x="362" y="87" font-size="10.5" fill="#6B6252">по факту, а не по обещанию поставщика</text>
        <text x="362" y="108" font-size="10.5" font-weight="600" fill="#9A7300">проверка: базовые значения до запуска</text>
      </g>

      <g>
        <rect x="16" y="142" width="316" height="104" rx="9" fill="#FFFDF8" stroke="#C9BCA2"/>
        <circle cx="38" cy="164" r="11" fill="#9A7300"/>
        <text x="38" y="168" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">3</text>
        <text x="58" y="168" font-size="13" font-weight="700" fill="#2A2620">Есть владелец и регламент</text>
        <text x="30" y="190" font-size="10.5" fill="#6B6252">назначен администратор, описаны заявка на</text>
        <text x="30" y="205" font-size="10.5" fill="#6B6252">изменение, копии, действия при сбое</text>
        <text x="30" y="226" font-size="10.5" font-weight="600" fill="#9A7300">проверка: сотрудник знает, к кому идти</text>
      </g>

      <g>
        <rect x="348" y="142" width="316" height="104" rx="9" fill="#FFFDF8" stroke="#C9BCA2"/>
        <circle cx="370" cy="164" r="11" fill="#9A7300"/>
        <text x="370" y="168" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">4</text>
        <text x="390" y="168" font-size="13" font-weight="700" fill="#2A2620">Комплект передан</text>
        <text x="362" y="190" font-size="10.5" fill="#6B6252">документация, доступы, журнал изменений,</text>
        <text x="362" y="205" font-size="10.5" fill="#6B6252">инструкции и контакты сопровождения</text>
        <text x="362" y="226" font-size="10.5" font-weight="600" fill="#9A7300">проверка: проект закрывается без долгов</text>
      </g>
    </g>

    <rect x="16" y="260" width="648" height="30" rx="6" fill="#FFFFFF" stroke="#C9BCA2" stroke-dasharray="4 3"/>
    <text x="30" y="279" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#6B6252">Акт подписан, лицензии оплачены, но менеджеры по-прежнему ведут заказы в Excel: внедрение не закончено.</text>
  </svg>
  <p class="note">Четыре признака проверяются по свидетельствам: журнал операций, замеры метрик, приказ о владельце, опись переданного комплекта.</p>
</div>
</body>
</html>
