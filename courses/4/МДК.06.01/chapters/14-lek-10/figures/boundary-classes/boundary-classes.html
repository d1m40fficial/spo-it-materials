<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Классы и границы значений</title>
<style>
  :root { --paper:#EDE5D2; --ink:#2A2618; --muted:#6F6449; --accent:#9A7300; --rule:#D8CCB2; --card:#FBF7EC; --soft:#F3EAD6; --bad:#8A4B2A; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:14px; padding:14px; }
  .eyebrow { margin:0 0 4px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  h3 { margin:0 0 4px; font-size:19px; line-height:1.2; }
  svg { display:block; width:100%; height:auto; margin-top:4px; }
  .note { margin:8px 2px 0; font-size:12.5px; line-height:1.45; color:var(--ink); }
  .note b { color:var(--accent); }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Тест-дизайн · границы</p>
  <h3>Количество при остатке 20</h3>
  <svg viewBox="0 0 680 238" role="img" aria-label="Классы эквивалентности и граничные значения для количества при остатке 20">
    <defs>
      <marker id="arw-b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6F6449"/></marker>
    </defs>
    <rect x="30" y="88" width="150" height="46" rx="6" fill="#FBF7EC" stroke="#8A4B2A" stroke-width="1.2"/>
    <text x="105" y="108" text-anchor="middle" font-size="13" fill="#8A4B2A">отрицательное</text>
    <text x="105" y="125" text-anchor="middle" font-size="11" fill="#6F6449">отказ с сообщением</text>

    <rect x="180" y="88" width="280" height="46" rx="6" fill="#F3EAD6" stroke="#9A7300" stroke-width="1.6"/>
    <text x="320" y="108" text-anchor="middle" font-size="13" fill="#2A2618">допустимое количество</text>
    <text x="320" y="125" text-anchor="middle" font-size="11" fill="#6F6449">от 1 до 20, резерв растёт</text>

    <rect x="460" y="88" width="190" height="46" rx="6" fill="#FBF7EC" stroke="#8A4B2A" stroke-width="1.2"/>
    <text x="555" y="108" text-anchor="middle" font-size="13" fill="#8A4B2A">больше остатка</text>
    <text x="555" y="125" text-anchor="middle" font-size="11" fill="#6F6449">отказ, резерв не меняется</text>

    <line x1="34" y1="152" x2="646" y2="152" stroke="#6F6449" stroke-width="1.4" marker-end="url(#arw-b)"/>
    <g stroke="#6F6449" stroke-width="1.2">
      <line x1="180" y1="146" x2="180" y2="158"/><line x1="194" y1="146" x2="194" y2="158"/>
      <line x1="446" y1="146" x2="446" y2="158"/><line x1="460" y1="146" x2="460" y2="158"/>
    </g>
    <g font-family="Consolas,monospace" text-anchor="middle" fill="#2A2618">
      <text x="180" y="178" font-size="13">0</text>
      <text x="194" y="178" font-size="13">1</text>
      <text x="446" y="178" font-size="13">20</text>
      <text x="460" y="178" font-size="13">21</text>
    </g>
    <g font-size="11" fill="#6F6449" text-anchor="middle">
      <text x="140" y="200">нижняя граница</text>
      <text x="320" y="200">20 из 20: успех, доступно 0</text>
      <text x="510" y="200">21 из 20: отказ</text>
    </g>
    <text x="340" y="224" text-anchor="middle" font-family="Consolas,monospace" font-size="10.5" fill="#9A7300">ПРОВЕРЯЙТЕ 0, 1, 19, 20 И 21, А НЕ ТОЛЬКО СЕРЕДИНУ</text>
  </svg>
  <p class="note"><b>Почему границы.</b> Условие <code>количество &lt;= остаток</code> ломается на 21, а условие <code>количество &gt; 0</code> на нуле. Середина класса обычно проходит, даже если знак неравенства перепутан.</p>
</div>
</body>
</html>
