<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Маршрут обращения</title>
<style>
  :root { --bg:#EDE5D2; --paper:#FBF6EA; --ink:#2B2A26; --muted:#6B6250; --accent:#9A7300; --soft:#F3EAD3; --rule:#D8CBB0; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--bg); border:1px solid var(--rule); border-radius:12px; padding:16px 16px 12px; }
  .eyebrow { margin:0 0 6px; font:600 9px/1.3 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .note { margin:8px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Поддержка · маршрут</p>
  <svg viewBox="0 0 680 282" role="img" aria-labelledby="sr-t sr-d">
    <title id="sr-t">Маршрут обращения между линиями поддержки</title>
    <desc id="sr-d">Обращение проходит канал, первую линию, вторую линию и завершается ответом пользователю. Ниже показаны состояния заявки, отметки времени и два вида эскалации.</desc>
    <defs>
      <marker id="sr-arw" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
        <polygon points="0 0, 9 3.5, 0 7" fill="#9A7300"/>
      </marker>
    </defs>

    <text x="14" y="15" font-family="Consolas,monospace" font-size="8.5" letter-spacing="1.6" fill="#6B6250">ПУТЬ ОБРАЩЕНИЯ</text>

    <g font-family="'Segoe UI',system-ui,sans-serif" text-anchor="middle">
      <rect x="14" y="28" width="104" height="52" rx="8" fill="#FFFDF7" stroke="#9A7300" stroke-width="1.2"/>
      <text x="66" y="48" font-size="11.5" font-weight="600" fill="#2B2A26">обращение</text>
      <text x="66" y="62" font-size="9" fill="#6B6250">проблема или</text>
      <text x="66" y="73" font-size="9" fill="#6B6250">вопрос</text>

      <rect x="136" y="28" width="104" height="52" rx="8" fill="#FFFDF7" stroke="#D8CBB0"/>
      <text x="188" y="48" font-size="11.5" font-weight="600" fill="#2B2A26">канал</text>
      <text x="188" y="62" font-size="9" fill="#6B6250">телефон, портал,</text>
      <text x="188" y="73" font-size="9" fill="#6B6250">почта, чат</text>

      <rect x="258" y="28" width="140" height="52" rx="8" fill="#F3EAD3" stroke="#9A7300" stroke-width="1.4"/>
      <text x="328" y="48" font-size="11.5" font-weight="600" fill="#2B2A26">1 линия</text>
      <text x="328" y="62" font-size="9" fill="#2B2A26">номер, скрипт,</text>
      <text x="328" y="73" font-size="9" fill="#2B2A26">до 15 минут</text>

      <rect x="416" y="28" width="124" height="52" rx="8" fill="#FFFDF7" stroke="#D8CBB0"/>
      <text x="478" y="48" font-size="11.5" font-weight="600" fill="#2B2A26">2 линия</text>
      <text x="478" y="62" font-size="9" fill="#6B6250">причина, права,</text>
      <text x="478" y="73" font-size="9" fill="#6B6250">журналы</text>

      <rect x="558" y="28" width="108" height="52" rx="8" fill="#F3EAD3" stroke="#9A7300" stroke-width="1.4"/>
      <text x="612" y="48" font-size="11.5" font-weight="600" fill="#2B2A26">решение</text>
      <text x="612" y="62" font-size="9" fill="#2B2A26">ответ и</text>
      <text x="612" y="73" font-size="9" fill="#2B2A26">статья</text>
    </g>

    <g stroke="#9A7300" stroke-width="1.6" fill="none" marker-end="url(#sr-arw)">
      <path d="M118 54h14"/><path d="M240 54h14"/><path d="M398 54h14"/><path d="M540 54h14"/>
    </g>

    <text x="14" y="104" font-family="Consolas,monospace" font-size="8.5" letter-spacing="1.4" fill="#6B6250">СОСТОЯНИЯ ЗАЯВКИ: ЧАСЫ ИДУТ ИЛИ СТОЯТ</text>

    <g font-family="'Segoe UI',system-ui,sans-serif" text-anchor="middle">
      <rect x="14" y="112" width="212" height="40" rx="7" fill="#FFFDF7" stroke="#D8CBB0"/>
      <text x="120" y="128" font-size="10" font-weight="600" fill="#2B2A26">в работе</text>
      <text x="120" y="142" font-size="8.8" fill="#6B6250">срок идёт</text>

      <rect x="230" y="112" width="212" height="40" rx="7" fill="#FFFDF7" stroke="#D8CBB0"/>
      <text x="336" y="128" font-size="10" font-weight="600" fill="#2B2A26">ждём пользователя</text>
      <text x="336" y="142" font-size="8.8" fill="#6B6250">пауза, если записана в SLA</text>

      <rect x="446" y="112" width="220" height="40" rx="7" fill="#FFFDF7" stroke="#D8CBB0"/>
      <text x="556" y="128" font-size="10" font-weight="600" fill="#2B2A26">ждём поставщика</text>
      <text x="556" y="142" font-size="8.8" fill="#6B6250">пауза с отметкой в заявке</text>
    </g>

    <text x="14" y="176" font-family="Consolas,monospace" font-size="8.5" letter-spacing="1.4" fill="#6B6250">ОТМЕТКИ ВРЕМЕНИ</text>
    <line x1="24" y1="198" x2="656" y2="198" stroke="#9A7300" stroke-width="1.4"/>
    <g font-family="Consolas,monospace" font-size="8.5" fill="#6B6250">
      <line x1="24" y1="193" x2="24" y2="203" stroke="#9A7300" stroke-width="1.4"/>
      <line x1="220" y1="193" x2="220" y2="203" stroke="#9A7300" stroke-width="1.4"/>
      <line x1="440" y1="193" x2="440" y2="203" stroke="#9A7300" stroke-width="1.4"/>
      <line x1="650" y1="193" x2="650" y2="203" stroke="#9A7300" stroke-width="1.4"/>
      <text x="24" y="187">регистрация</text>
      <text x="220" y="187" text-anchor="middle">первая реакция</text>
      <text x="440" y="187" text-anchor="middle">решение</text>
      <text x="650" y="187" text-anchor="end">подтверждение</text>
    </g>

    <g font-family="'Segoe UI',system-ui,sans-serif" text-anchor="middle">
      <rect x="14" y="216" width="210" height="54" rx="7" fill="#F3EAD3" stroke="#9A7300"/>
      <text x="119" y="234" font-size="10.5" font-weight="600" fill="#2B2A26">функциональная</text>
      <text x="119" y="248" font-size="8.8" fill="#2B2A26">нет знаний или прав,</text>
      <text x="119" y="260" font-size="8.8" fill="#2B2A26">нужен специалист</text>

      <rect x="236" y="216" width="204" height="54" rx="7" fill="#FFFDF7" stroke="#D8CBB0"/>
      <text x="338" y="234" font-size="10.5" font-weight="600" fill="#2B2A26">иерархическая</text>
      <text x="338" y="248" font-size="8.8" fill="#6B6250">нарушен срок</text>
      <text x="338" y="260" font-size="8.8" fill="#6B6250">или конфликт</text>

      <rect x="452" y="216" width="214" height="54" rx="7" fill="#FFFDF7" stroke="#D8CBB0"/>
      <text x="559" y="234" font-size="10.5" font-weight="600" fill="#2B2A26">3 линия</text>
      <text x="559" y="248" font-size="8.8" fill="#6B6250">поставщик, разработчик,</text>
      <text x="559" y="260" font-size="8.8" fill="#6B6250">смежная система</text>
    </g>
  </svg>
  <p class="note">Номер, канал и четыре отметки времени превращают разговор в работу, которую можно передать, посчитать и разобрать.</p>
</div>
</body>
</html>
