<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Жизненный цикл документа</title>
<style>
  :root { --paper:#EDE5D2; --ink:#2A2618; --muted:#6F6449; --accent:#9A7300; --rule:#D8CCB2; --card:#FBF7EC; --soft:#F3EAD6; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:14px; padding:14px; }
  .eyebrow { margin:0 0 4px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  h3 { margin:0 0 4px; font-size:19px; line-height:1.2; }
  svg { display:block; width:100%; height:auto; margin-top:4px; }
  .note { margin:8px 2px 0; font-size:12.5px; line-height:1.45; color:var(--ink); }
  .note b { color:var(--accent); }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Документ · версии</p>
  <h3>Статус, версия и возврат на проверку</h3>
  <svg viewBox="0 0 680 252" role="img" aria-label="Статусы документа и события, возвращающие его на проверку">
    <defs>
      <marker id="arw-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9A7300"/></marker>
      <marker id="arw-m" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6F6449"/></marker>
    </defs>
    <g font-family="Segoe UI,system-ui,sans-serif" text-anchor="middle">
      <rect x="18" y="42" width="136" height="58" rx="8" fill="#FBF7EC" stroke="#9A7300" stroke-width="1.3"/>
      <text x="86" y="66" font-size="12" fill="#2A2618">черновик</text>
      <text x="86" y="84" font-size="10.5" fill="#6F6449">пишет автор</text>

      <rect x="176" y="42" width="148" height="58" rx="8" fill="#FBF7EC" stroke="#9A7300" stroke-width="1.3"/>
      <text x="250" y="66" font-size="12" fill="#2A2618">на согласовании</text>
      <text x="250" y="84" font-size="10.5" fill="#6F6449">проверяет владелец</text>

      <rect x="346" y="42" width="140" height="58" rx="8" fill="#F3EAD6" stroke="#9A7300" stroke-width="1.9"/>
      <text x="416" y="66" font-size="12" fill="#2A2618">действует</text>
      <text x="416" y="84" font-size="10.5" fill="#6F6449">ссылка в системе</text>

      <rect x="508" y="42" width="154" height="58" rx="8" fill="#FBF7EC" stroke="#D8CCB2" stroke-width="1.3"/>
      <text x="585" y="66" font-size="12" fill="#2A2618">архив</text>
      <text x="585" y="84" font-size="10.5" fill="#6F6449">с датой версии</text>
    </g>
    <g stroke="#9A7300" stroke-width="1.6" fill="none" marker-end="url(#arw-l)">
      <path d="M154 71h16"/><path d="M324 71h16"/><path d="M486 71h16"/>
    </g>

    <g font-family="Segoe UI,system-ui,sans-serif" text-anchor="middle">
      <rect x="18" y="146" width="196" height="58" rx="7" fill="#FBF7EC" stroke="#D8CCB2" stroke-width="1.2"/>
      <text x="116" y="168" font-size="11.5" fill="#2A2618">выпуск обновления</text>
      <text x="116" y="186" font-size="10.5" fill="#6F6449">проверить затронутые страницы</text>

      <rect x="242" y="146" width="196" height="58" rx="7" fill="#FBF7EC" stroke="#D8CCB2" stroke-width="1.2"/>
      <text x="340" y="168" font-size="11.5" fill="#2A2618">повтор обращения</text>
      <text x="340" y="186" font-size="10.5" fill="#6F6449">дописать раздел</text>

      <rect x="464" y="146" width="198" height="58" rx="7" fill="#FBF7EC" stroke="#D8CCB2" stroke-width="1.2"/>
      <text x="563" y="168" font-size="11.5" fill="#2A2618">новая роль или склад</text>
      <text x="563" y="186" font-size="10.5" fill="#6F6449">добавить сценарий</text>
    </g>
    <g stroke="#6F6449" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arw-m)">
      <path d="M116 146v-34h54"/>
      <path d="M340 146v-34h0"/>
      <path d="M563 146v-34h-72"/>
    </g>
    <text x="340" y="226" text-anchor="middle" font-family="Consolas,monospace" font-size="10.5" fill="#6F6449">ЛЮБОЕ СОБЫТИЕ ВОЗВРАЩАЕТ ДОКУМЕНТ В ЧЕРНОВИК, А НЕ В АРХИВ</text>
    <text x="340" y="244" text-anchor="middle" font-family="Consolas,monospace" font-size="10.5" fill="#9A7300">СТАРАЯ ВЕРСИЯ ОСТАЕТСЯ ДО ПУБЛИКАЦИИ НОВОЙ</text>
  </svg>
  <p class="note"><b>Архив не свалка.</b> Он хранит версии, по которым работали, и дату, с которой версия перестала действовать.</p>
</div>
</body>
</html>
