<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Читатели документации</title>
<style>
  :root { --paper:#EDE5D2; --ink:#2A2618; --muted:#6F6449; --accent:#9A7300; --rule:#D8CCB2; --card:#FBF7EC; --soft:#F3EAD6; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:14px; padding:14px; }
  .eyebrow { margin:0 0 4px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  h3 { margin:0 0 4px; font-size:19px; line-height:1.2; }
  svg { display:block; width:100%; height:auto; margin-top:4px; }
  .note { margin:8px 2px 0; font-size:12.5px; line-height:1.45; color:var(--ink); }
  .note b { color:var(--accent); }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Документация · читатели</p>
  <h3>Один вопрос, один документ</h3>
  <svg viewBox="0 0 680 236" role="img" aria-label="Три читателя документации и их документы">
    <defs>
      <marker id="arw-r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9A7300"/></marker>
    </defs>
    <g font-family="Segoe UI,system-ui,sans-serif" text-anchor="middle">
      <rect x="20" y="26" width="196" height="64" rx="8" fill="#F3EAD6" stroke="#9A7300" stroke-width="1.6"/>
      <text x="118" y="52" font-size="13" font-weight="600" fill="#2A2618">пользователь</text>
      <text x="118" y="72" font-size="11" fill="#6F6449">как выполнить операцию</text>

      <rect x="242" y="26" width="196" height="64" rx="8" fill="#FBF7EC" stroke="#9A7300" stroke-width="1.4"/>
      <text x="340" y="52" font-size="13" font-weight="600" fill="#2A2618">администратор</text>
      <text x="340" y="72" font-size="11" fill="#6F6449">как обслужить систему</text>

      <rect x="464" y="26" width="196" height="64" rx="8" fill="#FBF7EC" stroke="#9A7300" stroke-width="1.4"/>
      <text x="562" y="52" font-size="13" font-weight="600" fill="#2A2618">руководитель</text>
      <text x="562" y="72" font-size="11" fill="#6F6449">по каким правилам</text>

      <rect x="20" y="134" width="196" height="52" rx="7" fill="#FBF7EC" stroke="#D8CCB2" stroke-width="1.2"/>
      <text x="118" y="156" font-size="11.5" fill="#2A2618">руководство, памятка</text>
      <text x="118" y="173" font-size="10.5" fill="#6F6449">шаги и результат</text>

      <rect x="242" y="134" width="196" height="52" rx="7" fill="#FBF7EC" stroke="#D8CCB2" stroke-width="1.2"/>
      <text x="340" y="156" font-size="11.5" fill="#2A2618">руководство, журнал</text>
      <text x="340" y="173" font-size="10.5" fill="#6F6449">копии и восстановление</text>

      <rect x="464" y="134" width="196" height="52" rx="7" fill="#FBF7EC" stroke="#D8CCB2" stroke-width="1.2"/>
      <text x="562" y="156" font-size="11.5" fill="#2A2618">регламент, акт</text>
      <text x="562" y="173" font-size="10.5" fill="#6F6449">сроки и ответственность</text>
    </g>
    <g stroke="#9A7300" stroke-width="1.5" fill="none" marker-end="url(#arw-r)">
      <path d="M118 92v36"/>
      <path d="M340 92v36"/>
      <path d="M562 92v36"/>
    </g>
    <text x="340" y="212" text-anchor="middle" font-family="Consolas,monospace" font-size="10.5" fill="#6F6449">СМЕШЕНИЕ ЧИТАТЕЛЕЙ ДЕЛАЕТ ТЕКСТ НЕУДОБНЫМ ДЛЯ ВСЕХ</text>
    <text x="340" y="228" text-anchor="middle" font-family="Consolas,monospace" font-size="10.5" fill="#9A7300">У КАЖДОГО ДОКУМЕНТА ЕСТЬ ВЛАДЕЛЕЦ</text>
  </svg>
  <p class="note"><b>Четвёртый читатель это поддержка.</b> Ей нужны типовые обращения, известные дефекты и границы эскалации, а не полное руководство пользователя.</p>
</div>
</body>
</html>
