<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Путь замечания</title>
<style>
  :root { --paper:#F7F1E3; --ink:#2A2620; --muted:#6B6459; --accent:#9A7300; --soft:#EDE5D2; --rule:#D8CBB0; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px 16px 12px; }
  .eyebrow { margin:0 0 6px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.15em; text-transform:uppercase; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
  .note { margin:9px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Опытная эксплуатация · замечания</p>
  <svg viewBox="0 0 680 288" role="img" aria-labelledby="rr-title rr-desc">
    <title id="rr-title">Путь замечания от записи до закрытия</title>
    <desc id="rr-desc">Запись в журнале, триаж, критичность, обход или исправление, проверка, закрытие и запись в базу знаний.</desc>

    <g font-family="Consolas,monospace" text-anchor="middle">
      <rect x="16" y="28" width="112" height="60" rx="7" fill="#FFFDF6" stroke="#8C8171"/>
      <text x="72" y="49" font-size="7.6" fill="#9A7300">запись</text>
      <text x="72" y="64" font-size="6.8" fill="#2A2620">действие,</text>
      <text x="72" y="76" font-size="6.8" fill="#2A2620">данные, факт</text>

      <rect x="144" y="28" width="112" height="60" rx="7" fill="#FFFDF6" stroke="#8C8171"/>
      <text x="200" y="49" font-size="7.6" fill="#9A7300">триаж</text>
      <text x="200" y="64" font-size="6.8" fill="#2A2620">критичность,</text>
      <text x="200" y="76" font-size="6.8" fill="#2A2620">приоритет</text>

      <rect x="272" y="28" width="112" height="60" rx="7" fill="#EDE5D2" stroke="#9A7300" stroke-width="1.6"/>
      <text x="328" y="49" font-size="7.6" fill="#9A7300">решение</text>
      <text x="328" y="64" font-size="6.8" fill="#2A2620">обход или</text>
      <text x="328" y="76" font-size="6.8" fill="#2A2620">исправление</text>

      <rect x="400" y="28" width="112" height="60" rx="7" fill="#FFFDF6" stroke="#8C8171"/>
      <text x="456" y="49" font-size="7.6" fill="#9A7300">проверка</text>
      <text x="456" y="64" font-size="6.8" fill="#2A2620">ключевой</text>
      <text x="456" y="76" font-size="6.8" fill="#2A2620">пользователь</text>

      <rect x="528" y="28" width="136" height="60" rx="7" fill="#FFFDF6" stroke="#8C8171"/>
      <text x="596" y="49" font-size="7.6" fill="#9A7300">закрытие</text>
      <text x="596" y="64" font-size="6.8" fill="#2A2620">ответ автору,</text>
      <text x="596" y="76" font-size="6.8" fill="#2A2620">база знаний</text>
    </g>

    <g stroke="#8C8171" stroke-width="1.4" fill="none" marker-end="url(#arw4)">
      <path d="M128 58h12"/><path d="M256 58h12"/><path d="M384 58h12"/><path d="M512 58h12"/>
    </g>

    <rect x="16" y="120" width="204" height="92" rx="8" fill="#FFFDF6" stroke="#D8CBB0"/>
    <text x="30" y="140" font-family="Consolas,monospace" font-size="7.2" fill="#6B6459">КРИТИЧНОЕ</text>
    <text x="30" y="158" font-family="Consolas,monospace" font-size="7.4" fill="#2A2620">работа стоит, данные искажены</text>
    <text x="30" y="176" font-family="Consolas,monospace" font-size="7.4" fill="#2A2620">обход обязателен, срок сегодня</text>
    <text x="30" y="196" font-family="Consolas,monospace" font-size="7.4" fill="#9A7300">этап может быть приостановлен</text>

    <rect x="238" y="120" width="204" height="92" rx="8" fill="#FFFDF6" stroke="#D8CBB0"/>
    <text x="252" y="140" font-family="Consolas,monospace" font-size="7.2" fill="#6B6459">СУЩЕСТВЕННОЕ</text>
    <text x="252" y="158" font-family="Consolas,monospace" font-size="7.4" fill="#2A2620">есть дорогой обход</text>
    <text x="252" y="176" font-family="Consolas,monospace" font-size="7.4" fill="#2A2620">срок три рабочих дня</text>
    <text x="252" y="196" font-family="Consolas,monospace" font-size="7.4" fill="#9A7300">без обхода блокирует выход</text>

    <rect x="460" y="120" width="204" height="92" rx="8" fill="#FFFDF6" stroke="#D8CBB0"/>
    <text x="474" y="140" font-family="Consolas,monospace" font-size="7.2" fill="#6B6459">НЕЗНАЧИТЕЛЬНОЕ</text>
    <text x="474" y="158" font-family="Consolas,monospace" font-size="7.4" fill="#2A2620">работе не мешает</text>
    <text x="474" y="176" font-family="Consolas,monospace" font-size="7.4" fill="#2A2620">срок до месяца</text>
    <text x="474" y="196" font-family="Consolas,monospace" font-size="7.4" fill="#9A7300">в текущий список правок</text>

    <text x="340" y="244" text-anchor="middle" font-family="Consolas,monospace" font-size="7.8" fill="#2A2620">повторяющиеся вопросы объединяют в одно замечание и добавляют памятку</text>
    <text x="340" y="270" text-anchor="middle" font-family="Consolas,monospace" font-size="7.4" fill="#9A7300">ЗАМЕЧАНИЕ БЕЗ АВТОРА И ДАННЫХ НЕЛЬЗЯ ВОСПРОИЗВЕСТИ</text>

    <defs>
      <marker id="arw4" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8C8171"/></marker>
    </defs>
  </svg>
  <p class="note">Один журнал, один владелец, один срок. Классификацию ставит тот, кто разбирает, а не автор записи.</p>
</div>
</body>
</html>
