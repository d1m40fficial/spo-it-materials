<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Глубина отката</title>
<style>
  :root { --paper:#EDE5D2; --card:#FBF6E9; --ink:#2b2517; --muted:#6b5f45; --rule:#cdbf9f; --accent:#9A7300; --soft:#F3E9CE; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .demo { background:var(--paper); border:1px solid var(--rule); border-radius:14px; padding:16px; }
  .head { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; padding-bottom:8px; border-bottom:1px solid var(--rule); }
  .eyebrow { margin:0 0 4px; font:600 9.5px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  h3 { margin:0; font-size:19px; line-height:1.2; }
  .hint { font:10.5px/1.35 Consolas,monospace; color:var(--muted); white-space:nowrap; }
  svg { display:block; width:100%; height:auto; margin-top:6px; }
  .layer rect { fill:#FBF6E9; stroke:#8d7d5b; stroke-width:1.3; transition:fill .2s, stroke .2s; }
  .layer.on rect { fill:var(--soft); stroke:var(--accent); stroke-width:2.2; }
  .layer text { font:8px Consolas,monospace; fill:#2b2517; }
  .layer .tag { font:7px Consolas,monospace; fill:#6b5f45; }
  .controls { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  button { font:600 11px/1 "Segoe UI",system-ui,sans-serif; padding:7px 9px; border-radius:8px; border:1px solid var(--rule); background:var(--card); color:var(--ink); cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .status { margin-top:8px; padding:9px 11px; border-radius:8px; background:var(--soft); font:11.5px/1.45 "Segoe UI",system-ui,sans-serif; }
  .status b { color:var(--accent); }
  @media (max-width:560px) { .demo { padding:11px; } .hint { display:none; } }
</style>
</head>
<body>
<div class="demo">
  <div class="head">
    <div><p class="eyebrow">Откат · глубина</p><h3>Что придётся вернуть</h3></div>
    <div class="hint">выберите изменение</div>
  </div>
  <svg viewBox="0 0 680 240" role="img" aria-labelledby="rd-title rd-desc">
    <title id="rd-title">Три слоя отката</title>
    <desc id="rd-desc">Отчёт отключается на уровне программы, поле в заказе требует вернуть версию и сохранить новые данные, миграция базы требует восстановления копии и сверки.</desc>

    <g class="layer" data-k="report">
      <rect x="40" y="24" width="600" height="46" rx="8"/>
      <text x="60" y="44">программа</text>
      <text class="tag" x="60" y="58">модуль, флаг функции, пакет обновления</text>
      <text x="622" y="52" text-anchor="end" font-size="7.4" fill="#9A7300">выключить</text>
    </g>
    <g class="layer" data-k="field">
      <rect x="40" y="82" width="600" height="46" rx="8"/>
      <text x="60" y="102">настройка</text>
      <text class="tag" x="60" y="116">права роли, маршрут, шаблон</text>
      <text x="622" y="110" text-anchor="end" font-size="7.4" fill="#9A7300">вернуть прежнюю</text>
    </g>
    <g class="layer" data-k="migration">
      <rect x="40" y="140" width="600" height="46" rx="8"/>
      <text x="60" y="160">данные</text>
      <text class="tag" x="60" y="174">новая схема, новые записи, копия базы</text>
      <text x="622" y="168" text-anchor="end" font-size="7.4" fill="#9A7300">восстановить и сверить</text>
    </g>

    <text x="340" y="218" text-anchor="middle" font-family="Consolas,monospace" font-size="7.6" fill="#6b5f45">чем ниже слой, тем дороже возврат и тем важнее проверенная копия</text>
  </svg>
  <div class="status" id="status"></div>
  <div class="controls">
    <button data-k="report" class="on">Новый отчёт</button>
    <button data-k="field">Поле в заказе</button>
    <button data-k="migration">Миграция базы</button>
  </div>
</div>
<script>
(function () {
  var data = {
    report: '<b>Новый отчёт.</b> Откат около 15 минут: отчёт выключен флагом, заказы и остатки не затронуты. Потери данных нет.',
    field: '<b>Поле в заказе.</b> Откат 1-2 часа: вернуть версию и выгрузить значения нового поля. Иначе отсрочки, уже проставленные менеджерами, исчезнут.',
    migration: '<b>Миграция базы.</b> Откат 4-8 часов: восстановить копию, сверить контрольные суммы и перенести записи, созданные после запуска. Риск потери данных высокий.'
  };
  var layers = document.querySelectorAll('.layer');
  var buttons = document.querySelectorAll('button[data-k]');
  function apply(key) {
    document.getElementById('status').innerHTML = data[key];
    layers.forEach(function (l) { l.classList.toggle('on', l.dataset.k === key); });
    buttons.forEach(function (b) { b.classList.toggle('on', b.dataset.k === key); });
  }
  buttons.forEach(function (b) { b.addEventListener('click', function () { apply(b.dataset.k); }); });
  apply('report');
})();
</script>
</body>
</html>
