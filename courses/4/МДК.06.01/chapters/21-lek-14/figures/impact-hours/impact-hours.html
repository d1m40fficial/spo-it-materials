<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оценка влияния по часам</title>
<style>
  :root { --paper:#EDE5D2; --ink:#2b2517; --muted:#6b5f45; --rule:#cdbf9f; --accent:#9A7300; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .demo { background:var(--paper); border:1px solid var(--rule); border-radius:14px; padding:16px; }
  .eyebrow { margin:0 0 4px; font:600 9.5px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  h3 { margin:0 0 2px; font-size:19px; line-height:1.2; }
  .sub { margin:0; font:10.5px/1.4 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; margin-top:4px; }
  .note { margin:8px 2px 0; font:11px/1.45 Consolas,monospace; color:var(--muted); }
  @media (max-width:560px) { .demo { padding:11px; } }
</style>
</head>
<body>
<div class="demo">
  <p class="eyebrow">Изменение ЗИ-014 · оценка</p>
  <h3>Двадцать шесть часов, а не два</h3>
  <p class="sub">часы команды по шести сторонам влияния</p>
  <svg viewBox="0 0 680 300" role="img" aria-labelledby="ih-title ih-desc">
    <title id="ih-title">Оценка влияния изменения по шести сторонам</title>
    <desc id="ih-desc">Данные 4 часа, функции 6, права 3, интеграции 5, документы 3, обучение 5. Итого 26 часов.</desc>

    <line x1="200" y1="42" x2="200" y2="246" stroke="#6b5f45" stroke-width="1.2"/>
    <g font-family="Consolas,monospace" font-size="7.4" fill="#6b5f45">
      <line x1="200" y1="246" x2="620" y2="246" stroke="#6b5f45" stroke-width="1.2"/>
      <text x="200" y="262" text-anchor="middle">0</text>
      <text x="305" y="262" text-anchor="middle">2</text>
      <text x="410" y="262" text-anchor="middle">4</text>
      <text x="515" y="262" text-anchor="middle">6</text>
      <text x="620" y="262" text-anchor="middle">8 ч</text>
      <line x1="305" y1="42" x2="305" y2="246" stroke="#cdbf9f" stroke-width="1" stroke-dasharray="3 4"/>
      <line x1="410" y1="42" x2="410" y2="246" stroke="#cdbf9f" stroke-width="1" stroke-dasharray="3 4"/>
      <line x1="515" y1="42" x2="515" y2="246" stroke="#cdbf9f" stroke-width="1" stroke-dasharray="3 4"/>
    </g>

    <g font-family="Consolas,monospace" font-size="8.2" fill="#2b2517">
      <text x="188" y="62" text-anchor="end">данные</text>
      <text x="188" y="94" text-anchor="end">функции</text>
      <text x="188" y="126" text-anchor="end">права</text>
      <text x="188" y="158" text-anchor="end">интеграции</text>
      <text x="188" y="190" text-anchor="end">документы</text>
      <text x="188" y="222" text-anchor="end">обучение</text>
    </g>

    <g>
      <rect x="200" y="50" width="210" height="18" rx="3" fill="#9A7300"/>
      <rect x="200" y="82" width="315" height="18" rx="3" fill="#9A7300"/>
      <rect x="200" y="114" width="157" height="18" rx="3" fill="#B08A1E"/>
      <rect x="200" y="146" width="262" height="18" rx="3" fill="#9A7300"/>
      <rect x="200" y="178" width="157" height="18" rx="3" fill="#B08A1E"/>
      <rect x="200" y="210" width="262" height="18" rx="3" fill="#9A7300"/>
    </g>

    <g font-family="Consolas,monospace" font-size="8" fill="#2b2517">
      <text x="420" y="63">4 ч</text>
      <text x="525" y="95">6 ч</text>
      <text x="367" y="127">3 ч</text>
      <text x="472" y="159">5 ч</text>
      <text x="367" y="191">3 ч</text>
      <text x="472" y="223">5 ч</text>
    </g>

    <text x="620" y="286" text-anchor="end" font-family="Consolas,monospace" font-size="8.4" fill="#9A7300">итого 26 часов команды</text>
  </svg>
  <p class="note">Поле в базе занимает два часа. Остальные двадцать четыре часа уходят на права, выгрузку, документы и обучение.</p>
</div>
</body>
</html>
