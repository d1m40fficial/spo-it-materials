<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Устройство практикума</title>
<style>
  :root { --paper:#EDE5D2; --ink:#2A2618; --muted:#6F6449; --accent:#9A7300; --rule:#D8CCB2; --card:#FBF7EC; --soft:#F3EAD6; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:14px; padding:14px; }
  .eyebrow { margin:0 0 4px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  h3 { margin:0 0 4px; font-size:19px; line-height:1.2; }
  svg { display:block; width:100%; height:auto; margin-top:4px; }
  .note { margin:8px 2px 0; font-size:12.5px; line-height:1.45; color:var(--ink); }
  .note b { color:var(--accent); }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Практикум · структура</p>
  <h3>Двадцать процентов показа, восемьдесят работы</h3>
  <svg viewBox="0 0 680 250" role="img" aria-label="Структура практикума и точки повторения после занятия">
    <defs>
      <marker id="arw-s" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9A7300"/></marker>
    </defs>

    <g font-family="Segoe UI,system-ui,sans-serif" text-anchor="middle">
      <rect x="18" y="34" width="86" height="58" rx="7" fill="#FBF7EC" stroke="#9A7300" stroke-width="1.3"/>
      <text x="61" y="57" font-size="11.5" fill="#2A2618">вход</text>
      <text x="61" y="74" font-size="10.5" fill="#6F6449">цель и место</text>

      <rect x="112" y="34" width="120" height="58" rx="7" fill="#F3EAD6" stroke="#9A7300" stroke-width="1.3"/>
      <text x="172" y="57" font-size="11.5" fill="#2A2618">показ</text>
      <text x="172" y="74" font-size="10.5" fill="#6F6449">вслух, целиком</text>

      <rect x="240" y="34" width="150" height="58" rx="7" fill="#F3EAD6" stroke="#9A7300" stroke-width="1.3"/>
      <text x="315" y="57" font-size="11.5" fill="#2A2618">совместная работа</text>
      <text x="315" y="74" font-size="10.5" fill="#6F6449">шаг за шагом</text>

      <rect x="398" y="34" width="176" height="58" rx="7" fill="#FBF7EC" stroke="#9A7300" stroke-width="1.8"/>
      <text x="486" y="57" font-size="11.5" fill="#2A2618">самостоятельная работа</text>
      <text x="486" y="74" font-size="10.5" fill="#6F6449">свои данные, свои права</text>

      <rect x="582" y="34" width="80" height="58" rx="7" fill="#FBF7EC" stroke="#9A7300" stroke-width="1.3"/>
      <text x="622" y="57" font-size="11.5" fill="#2A2618">разбор</text>
      <text x="622" y="74" font-size="10.5" fill="#6F6449">частые ошибки</text>
    </g>

    <g stroke="#D8CCB2" stroke-width="1.2">
      <line x1="104" y1="34" x2="104" y2="92"/>
      <line x1="232" y1="34" x2="232" y2="92"/>
      <line x1="390" y1="34" x2="390" y2="92"/>
      <line x1="574" y1="34" x2="574" y2="92"/>
    </g>
    <rect x="112" y="102" width="120" height="7" rx="3" fill="#9A7300" opacity=".45"/>
    <rect x="240" y="102" width="150" height="7" rx="3" fill="#9A7300" opacity=".55"/>
    <rect x="398" y="102" width="176" height="7" rx="3" fill="#9A7300"/>
    <rect x="582" y="102" width="80" height="7" rx="3" fill="#9A7300" opacity=".55"/>
    <text x="486" y="126" text-anchor="middle" font-family="Consolas,monospace" font-size="10.5" fill="#9A7300">ОСНОВНОЕ ВРЕМЯ УХОДИТ НА СОБСТВЕННЫЕ ДЕЙСТВИЯ</text>

    <g font-family="Segoe UI,system-ui,sans-serif" text-anchor="middle">
      <circle cx="172" cy="166" r="6" fill="#9A7300"/>
      <circle cx="340" cy="166" r="6" fill="#9A7300"/>
      <circle cx="508" cy="166" r="6" fill="#9A7300"/>
      <text x="172" y="190" font-size="11" fill="#2A2618">сразу после</text>
      <text x="340" y="190" font-size="11" fill="#2A2618">на следующий день</text>
      <text x="508" y="190" font-size="11" fill="#2A2618">через неделю</text>
      <text x="172" y="207" font-size="10.5" fill="#6F6449">тренажёр</text>
      <text x="340" y="207" font-size="10.5" fill="#6F6449">по памяти</text>
      <text x="508" y="207" font-size="10.5" fill="#6F6449">рабочий темп</text>
    </g>
    <g stroke="#9A7300" stroke-width="1.4" fill="none" marker-end="url(#arw-s)">
      <path d="M178 166h156"/>
      <path d="M346 166h156"/>
    </g>
    <text x="340" y="236" text-anchor="middle" font-family="Consolas,monospace" font-size="10.5" fill="#6F6449">ПОВТОРЕНИЕ ПО ПАМЯТИ ПРОЧНЕЕ ПОВТОРНОГО ЧТЕНИЯ</text>
  </svg>
  <p class="note"><b>Показ не исчезает.</b> Он задаёт порядок и показывает результат. Но если показ занимает больше половины занятия, группа уходит без навыка.</p>
</div>
</body>
</html>
