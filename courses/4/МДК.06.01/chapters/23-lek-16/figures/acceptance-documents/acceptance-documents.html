<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Документы приёмки</title>
<style>
  :root { --paper:#F7F1E3; --ink:#2A2620; --muted:#6B6459; --accent:#9A7300; --soft:#EDE5D2; --rule:#D8CBB0; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px 16px 12px; }
  .eyebrow { margin:0 0 6px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.15em; text-transform:uppercase; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
  .note { margin:9px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Приёмка · документы</p>
  <svg viewBox="0 0 680 286" role="img" aria-labelledby="ad-title ad-desc">
    <title id="ad-title">Путь доказательств от требования до акта</title>
    <desc id="ad-desc">Требование превращается в проверку программы, проверка в запись протокола, протокол и перечень отклонений становятся приложениями акта.</desc>

    <g font-family="Consolas,monospace" text-anchor="middle">
      <rect x="16" y="30" width="118" height="62" rx="7" fill="#FFFDF6" stroke="#8C8171"/>
      <text x="75" y="52" font-size="8" fill="#9A7300">требование</text>
      <text x="75" y="68" font-size="7" fill="#2A2620">время, данные,</text>
      <text x="75" y="80" font-size="7" fill="#2A2620">права</text>

      <rect x="154" y="30" width="118" height="62" rx="7" fill="#FFFDF6" stroke="#8C8171"/>
      <text x="213" y="52" font-size="8" fill="#9A7300">программа</text>
      <text x="213" y="68" font-size="7" fill="#2A2620">данные, действие,</text>
      <text x="213" y="80" font-size="7" fill="#2A2620">критерий</text>

      <rect x="292" y="30" width="118" height="62" rx="7" fill="#EDE5D2" stroke="#9A7300" stroke-width="1.6"/>
      <text x="351" y="52" font-size="8" fill="#9A7300">протокол</text>
      <text x="351" y="68" font-size="7" fill="#2A2620">факт и вердикт</text>
      <text x="351" y="80" font-size="7" fill="#2A2620">по каждому пункту</text>

      <rect x="430" y="30" width="112" height="62" rx="7" fill="#FFFDF6" stroke="#8C8171"/>
      <text x="486" y="52" font-size="8" fill="#9A7300">отклонения</text>
      <text x="486" y="68" font-size="7" fill="#2A2620">критичность,</text>
      <text x="486" y="80" font-size="7" fill="#2A2620">срок, владелец</text>

      <rect x="562" y="30" width="102" height="62" rx="7" fill="#EDE5D2" stroke="#9A7300" stroke-width="1.6"/>
      <text x="613" y="52" font-size="8" fill="#9A7300">акт</text>
      <text x="613" y="68" font-size="7" fill="#2A2620">что принято</text>
      <text x="613" y="80" font-size="7" fill="#2A2620">и на каких условиях</text>
    </g>

    <g stroke="#8C8171" stroke-width="1.4" fill="none" marker-end="url(#arw2)">
      <path d="M134 61h12"/><path d="M272 61h12"/><path d="M410 61h12"/><path d="M542 61h12"/>
    </g>

    <rect x="16" y="118" width="648" height="58" rx="8" fill="#FFFDF6" stroke="#D8CBB0"/>
    <text x="30" y="138" font-family="Consolas,monospace" font-size="7.4" fill="#6B6459">ПРИЛОЖЕНИЯ АКТА</text>
    <text x="30" y="158" font-family="Consolas,monospace" font-size="8" fill="#2A2620">программа испытаний · протокол · перечень отклонений · опись документов</text>

    <rect x="16" y="192" width="316" height="58" rx="8" fill="#FFFDF6" stroke="#D8CBB0"/>
    <text x="30" y="212" font-family="Consolas,monospace" font-size="7.4" fill="#6B6459">ЧТО ДОКАЗЫВАЕТ</text>
    <text x="30" y="232" font-family="Consolas,monospace" font-size="8" fill="#2A2620">проверку можно повторить и получить тот же вывод</text>

    <rect x="348" y="192" width="316" height="58" rx="8" fill="#FFFDF6" stroke="#D8CBB0"/>
    <text x="362" y="212" font-family="Consolas,monospace" font-size="7.4" fill="#6B6459">ЧЕГО НЕ ХВАТАЕТ БЕЗ ДОКУМЕНТА</text>
    <text x="362" y="232" font-family="Consolas,monospace" font-size="8" fill="#2A2620">основания для оплаты и границы ответственности</text>

    <text x="340" y="276" text-anchor="middle" font-family="Consolas,monospace" font-size="7.4" fill="#9A7300">АКТ БЕЗ ПРИЛОЖЕНИЙ ПОДТВЕРЖДАЕТ ТОЛЬКО ФАКТ ВСТРЕЧИ</text>

    <defs>
      <marker id="arw2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8C8171"/></marker>
    </defs>
  </svg>
  <p class="note">Документы идут цепочкой: каждый следующий опирается на предыдущий и не заменяет его.</p>
</div>
</body>
</html>
