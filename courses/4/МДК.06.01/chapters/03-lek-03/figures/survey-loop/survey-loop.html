<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цикл обследования</title>
<style>
  :root { --paper:#FAF7EF; --card:#FFFDF8; --ink:#2A2620; --muted:#6B6252; --rule:#E3D8C2; --accent:#9A7300; --soft:#EDE5D2; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px; }
  .eyebrow { margin:0 0 6px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  .note { margin:10px 2px 0; font:12px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Обследование · цикл</p>
  <svg viewBox="0 0 680 348" role="img" aria-labelledby="sl-title sl-desc">
    <title id="sl-title">Цикл обследования организации</title>
    <desc id="sl-desc">Цель, план, сбор, запись, проверка и отчёт. Проверка возвращает новые вопросы в план, а отчёт опирается на решение проекта.</desc>

    <defs>
      <marker id="sl-arw" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
        <polygon points="0 0, 8 3.5, 0 7" fill="#9A7300"/>
      </marker>
    </defs>

    <g stroke="#9A7300" stroke-width="1.6" fill="none" marker-end="url(#sl-arw)">
      <path d="M420 58 Q500 66 520 96"/>
      <path d="M578 122 Q602 160 578 198"/>
      <path d="M500 248 Q458 286 420 292"/>
      <path d="M260 292 Q218 286 176 248"/>
      <path d="M122 198 Q98 160 122 122"/>
      <path d="M176 96 Q200 66 260 58"/>
    </g>

    <g font-family="Segoe UI,system-ui,sans-serif" text-anchor="middle">
      <g>
        <rect x="265" y="26" width="150" height="54" rx="9" fill="#EDE5D2" stroke="#9A7300" stroke-width="1.5"/>
        <text x="340" y="46" font-size="12" font-weight="700" fill="#2A2620">1. Цель</text>
        <text x="340" y="64" font-size="10" fill="#6B6252">какое решение принять</text>
      </g>
      <g>
        <rect x="485" y="84" width="150" height="54" rx="9" fill="#FFFDF8" stroke="#C9BCA2"/>
        <text x="560" y="104" font-size="12" font-weight="700" fill="#2A2620">2. План</text>
        <text x="560" y="122" font-size="10" fill="#6B6252">кто, что, каким методом</text>
      </g>
      <g>
        <rect x="485" y="210" width="150" height="54" rx="9" fill="#FFFDF8" stroke="#C9BCA2"/>
        <text x="560" y="230" font-size="12" font-weight="700" fill="#2A2620">3. Сбор</text>
        <text x="560" y="248" font-size="10" fill="#6B6252">интервью, наблюдение</text>
      </g>
      <g>
        <rect x="265" y="270" width="150" height="54" rx="9" fill="#FFFDF8" stroke="#C9BCA2"/>
        <text x="340" y="290" font-size="12" font-weight="700" fill="#2A2620">4. Запись</text>
        <text x="340" y="308" font-size="10" fill="#6B6252">факт, число, источник</text>
      </g>
      <g>
        <rect x="45" y="210" width="150" height="54" rx="9" fill="#FFFDF8" stroke="#C9BCA2"/>
        <text x="120" y="230" font-size="12" font-weight="700" fill="#2A2620">5. Проверка</text>
        <text x="120" y="248" font-size="10" fill="#6B6252">триангуляция</text>
      </g>
      <g>
        <rect x="45" y="84" width="150" height="54" rx="9" fill="#EDE5D2" stroke="#9A7300" stroke-width="1.5"/>
        <text x="120" y="104" font-size="12" font-weight="700" fill="#2A2620">6. Отчёт</text>
        <text x="120" y="122" font-size="10" fill="#6B6252">проблемы и выводы</text>
      </g>
    </g>

    <circle cx="340" cy="175" r="62" fill="#FFFFFF" stroke="#E3D8C2"/>
    <text x="340" y="166" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="600" fill="#9A7300">РЕШЕНИЕ</text>
    <text x="340" y="183" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10.5" fill="#6B6252">проекта</text>
    <text x="340" y="199" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#6B6252">что меняем</text>

    <text x="340" y="338" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#6B6252">НОВЫЕ ВОПРОСЫ ВОЗВРАЩАЮТСЯ В ПЛАН, А НЕ В КОНЕЦ ОТЧЁТА</text>
  </svg>
  <p class="note">Цикл начинается с решения, а не с документа. Если проверка открывает новую причину, план дополняется, и сбор продолжается.</p>
</div>
</body>
</html>
