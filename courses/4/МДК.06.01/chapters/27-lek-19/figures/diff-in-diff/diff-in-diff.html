<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Разность разностей</title>
<style>
  :root { --paper:#EDE5D2; --card:#FBF7EC; --ink:#2B2518; --muted:#6B6047; --accent:#9A7300; --rule:#CDBE9C; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px 16px 12px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .note { margin:10px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  @media (max-width:560px) { .frame { padding:12px 10px 10px; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Оценка эффекта · контрольная группа</p>
  <svg viewBox="0 0 680 330" role="img" aria-labelledby="dd-title dd-desc">
    <title id="dd-title">Разность разностей на двух складах</title>
    <desc id="dd-desc">В Твери время заказа упало с 18 до 7 минут, в Калуге с 19 до 17. Эффект системы около 9 минут.</desc>

    <rect x="0" y="0" width="680" height="330" fill="#FBF7EC" rx="8"/>

    <g stroke="#CDBE9C" stroke-width="1">
      <line x1="60" y1="240" x2="640" y2="240"/>
      <line x1="60" y1="50" x2="60" y2="240"/>
      <line x1="60" y1="145" x2="640" y2="145" stroke-dasharray="3 4"/>
      <line x1="60" y1="97" x2="640" y2="97" stroke-dasharray="3 4"/>
      <line x1="60" y1="193" x2="640" y2="193" stroke-dasharray="3 4"/>
    </g>
    <g font-family="Consolas,monospace" font-size="7" fill="#6B6047" text-anchor="end">
      <text x="52" y="53">20</text>
      <text x="52" y="100">15</text>
      <text x="52" y="148">10</text>
      <text x="52" y="196">5</text>
      <text x="52" y="243">0</text>
    </g>
    <text x="60" y="22" font-family="Consolas,monospace" font-size="8" fill="#6B6047">МИНУТ НА ЗАКАЗ</text>

    <line x1="500" y1="40" x2="500" y2="240" stroke="#9A7300" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text transform="translate(492 150) rotate(-90)" font-family="Consolas,monospace" font-size="7" fill="#9A7300" text-anchor="middle">ЗАПУСК В ТВЕРИ</text>

    <g font-family="Consolas,monospace" font-size="8" fill="#6B6047" text-anchor="middle">
      <text x="110" y="258">январь</text>
      <text x="260" y="258">февраль</text>
      <text x="410" y="258">март</text>
      <text x="580" y="258">апрель</text>
    </g>

    <path d="M110 69 L260 74 L410 79 L580 174" fill="none" stroke="#9A7300" stroke-width="2.8"/>
    <path d="M110 60 L260 63 L410 66 L580 79" fill="none" stroke="#8C826C" stroke-width="2.2" stroke-dasharray="6 4"/>

    <g fill="#9A7300">
      <circle cx="110" cy="69" r="3.6"/><circle cx="260" cy="74" r="3.6"/><circle cx="410" cy="79" r="3.6"/><circle cx="580" cy="174" r="4.2"/>
    </g>
    <g fill="#8C826C">
      <circle cx="110" cy="60" r="3.2"/><circle cx="260" cy="63" r="3.2"/><circle cx="410" cy="66" r="3.2"/><circle cx="580" cy="79" r="3.4"/>
    </g>

    <g font-family="Consolas,monospace" font-size="7.6" fill="#2B2518">
      <text x="590" y="178">7</text>
      <text x="590" y="83">17</text>
      <text x="86" y="78">18</text>
      <text x="86" y="55">19</text>
    </g>

    <path d="M410 92 V166" stroke="#9A7300" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="400" y="124" text-anchor="end" font-family="Consolas,monospace" font-size="7.4" fill="#9A7300">Тверь: минус 11</text>
    <path d="M410 66 V73" stroke="#8C826C" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="400" y="58" text-anchor="end" font-family="Consolas,monospace" font-size="7.2" fill="#8C826C">Калуга: минус 2</text>

    <rect x="60" y="272" width="580" height="42" rx="7" fill="#EDE5D2" stroke="#CDBE9C"/>
    <text x="74" y="289" font-family="Consolas,monospace" font-size="7.6" fill="#2B2518">РАЗНОСТЬ РАЗНОСТЕЙ: (7 МИНУС 18) МИНУС (17 МИНУС 19) = МИНУС 11 МИНУС (МИНУС 2) = МИНУС 9 МИНУТ</text>
    <text x="74" y="304" font-family="Consolas,monospace" font-size="7.2" fill="#6B6047">системе разумно приписать 9 минут, а не все 11: две минуты объясняются общим фоном</text>

    <g font-family="Consolas,monospace" font-size="7.2">
      <line x1="444" y1="24" x2="470" y2="24" stroke="#9A7300" stroke-width="2.4"/>
      <text x="476" y="27" fill="#9A7300">Тверь, пилот</text>
      <line x1="560" y1="24" x2="586" y2="24" stroke="#8C826C" stroke-width="2" stroke-dasharray="5 3"/>
      <text x="592" y="27" fill="#8C826C">Калуга</text>
    </g>
  </svg>
  <p class="note">Одна и та же метрика, два склада и один месяц. Разница между изменениями устойчивее, чем простое сравнение до и после.</p>
</div>
</body>
</html>
