<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Базовая линия и фон</title>
<style>
  :root { --paper:#EDE5D2; --card:#FBF7EC; --ink:#2B2518; --muted:#6B6047; --accent:#9A7300; --rule:#CDBE9C; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px 16px 12px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .note { margin:10px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  @media (max-width:560px) { .frame { padding:12px 10px 10px; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Оценка эффекта · три периода</p>
  <svg viewBox="0 0 680 332" role="img" aria-labelledby="eb-title eb-desc">
    <title id="eb-title">Базовая линия, запуск и период после запуска</title>
    <desc id="eb-desc">График времени заказа: до запуска около 18 минут, после запуска около 7 минут. Внизу отмечены сезонность, найм, обучение и контрольная группа.</desc>

    <rect x="0" y="0" width="680" height="332" fill="#FBF7EC" rx="8"/>

    <g font-family="Consolas,monospace" font-size="8" fill="#6B6047">
      <text x="60" y="24">ВРЕМЯ ЗАКАЗА, МИНУТ</text>
      <text x="592" y="24">КОНТРОЛЬНАЯ ГРУППА</text>
    </g>

    <g stroke="#CDBE9C" stroke-width="1">
      <line x1="60" y1="220" x2="640" y2="220"/>
      <line x1="60" y1="60" x2="60" y2="220"/>
      <line x1="60" y1="140" x2="640" y2="140" stroke-dasharray="3 4"/>
      <line x1="60" y1="100" x2="640" y2="100" stroke-dasharray="3 4"/>
    </g>
    <g font-family="Consolas,monospace" font-size="7" fill="#6B6047" text-anchor="end">
      <text x="52" y="63">20</text>
      <text x="52" y="103">15</text>
      <text x="52" y="143">10</text>
      <text x="52" y="183">5</text>
      <text x="52" y="223">0</text>
    </g>

    <rect x="60" y="36" width="270" height="184" fill="#E4D8BC" opacity=".45"/>
    <rect x="356" y="36" width="284" height="184" fill="#F3EAD4" opacity=".7"/>
    <line x1="340" y1="36" x2="340" y2="220" stroke="#9A7300" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="346" y="50" font-family="Consolas,monospace" font-size="8" fill="#9A7300">ЗАПУСК</text>
    <text x="76" y="50" font-family="Consolas,monospace" font-size="8" fill="#6B6047">БАЗА, 3 МЕСЯЦА</text>
    <text x="396" y="50" font-family="Consolas,monospace" font-size="8" fill="#6B6047">ПОСЛЕ ЗАПУСКА, 3 МЕСЯЦА</text>

    <path d="M70 76 L120 80 L170 75 L220 79 L270 77 L320 78 L338 77"
          fill="none" stroke="#2B2518" stroke-width="2.4"/>
    <path d="M338 77 L360 150 L390 162 L430 164 L480 163 L540 165 L620 164"
          fill="none" stroke="#2B2518" stroke-width="2.4"/>
    <path d="M70 68 L120 70 L170 67 L220 71 L270 69 L320 70 L338 70"
          fill="none" stroke="#8C826C" stroke-width="1.8" stroke-dasharray="5 4"/>
    <path d="M338 70 L380 78 L430 81 L500 83 L620 84"
          fill="none" stroke="#8C826C" stroke-width="1.8" stroke-dasharray="5 4"/>

    <circle cx="338" cy="77" r="3.5" fill="#9A7300"/>
    <circle cx="430" cy="164" r="3.5" fill="#9A7300"/>
    <g font-family="Consolas,monospace" font-size="8" fill="#2B2518">
      <text x="88" y="95">18 мин</text>
      <text x="444" y="156">7 мин</text>
    </g>
    <g font-family="Consolas,monospace" font-size="7" fill="#8C826C">
      <text x="88" y="61">19 мин</text>
      <text x="500" y="76">17 мин</text>
    </g>

    <g font-family="Consolas,monospace" font-size="7" fill="#6B6047">
      <text x="60" y="240">ФОН, КОТОРЫЙ НАДО ВЫЧЕСТЬ</text>
    </g>
    <g font-family="Consolas,monospace" font-size="7.2">
      <rect x="60" y="250" width="132" height="24" rx="5" fill="#FBF7EC" stroke="#CDBE9C"/>
      <text x="70" y="265" fill="#2B2518">сезон стройки</text>
      <rect x="200" y="250" width="132" height="24" rx="5" fill="#FBF7EC" stroke="#CDBE9C"/>
      <text x="210" y="265" fill="#2B2518">найм 2 человек</text>
      <rect x="340" y="250" width="132" height="24" rx="5" fill="#FBF7EC" stroke="#CDBE9C"/>
      <text x="350" y="265" fill="#2B2518">обучение</text>
      <rect x="480" y="250" width="160" height="24" rx="5" fill="#FBF7EC" stroke="#CDBE9C"/>
      <text x="490" y="265" fill="#2B2518">рост цен</text>
    </g>
    <text x="60" y="300" font-family="Consolas,monospace" font-size="7.4" fill="#9A7300">ЭФФЕКТ = ИЗМЕНЕНИЕ В ПИЛОТЕ МИНУС ИЗМЕНЕНИЕ В КОНТРОЛЬНОЙ ГРУППЕ</text>
    <text x="60" y="316" font-family="Consolas,monospace" font-size="7.2" fill="#6B6047">без контрольной группы вывод слабее: сравнивают с прошлым годом и метрикой-плацебо</text>
  </svg>
  <p class="note">Базовая линия это не одно число, а правило и период. Всё, что менялось в это же время, нужно назвать и по возможности вычесть.</p>
</div>
</body>
</html>
