<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пилот как эксперимент и как демонстрация</title>
<style>
  :root { --paper:#FAF7EF; --card:#FFFDF8; --ink:#2A2620; --muted:#6B6252; --rule:#E3D8C2; --accent:#9A7300; --soft:#EDE5D2; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px; }
  .eyebrow { margin:0 0 6px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  .note { margin:10px 2px 0; font:12px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Внедрение · пилот</p>
  <svg viewBox="0 0 680 306" role="img" aria-labelledby="pt-title pt-desc">
    <title id="pt-title">Условия полезного пилота и его ловушки</title>
    <desc id="pt-desc">Слева четыре условия эксперимента: типичная площадка, обычные сотрудники, измеримые критерии, план расширения. Справа четыре ловушки: удобная площадка, отобранные люди, бесконечная доработка, расширение без разбора.</desc>

    <g font-family="Segoe UI,system-ui,sans-serif">
      <rect x="16" y="24" width="316" height="34" rx="7" fill="#EDE5D2" stroke="#9A7300"/>
      <text x="30" y="46" font-size="13" font-weight="700" fill="#2A2620">Пилот как эксперимент</text>

      <rect x="348" y="24" width="316" height="34" rx="7" fill="#FFFFFF" stroke="#C9BCA2"/>
      <text x="362" y="46" font-size="13" font-weight="700" fill="#6B6252">Пилот как демонстрация</text>

      <g>
        <circle cx="34" cy="82" r="9" fill="#9A7300"/>
        <text x="34" y="86" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">✓</text>
        <text x="52" y="80" font-size="11.5" font-weight="600" fill="#2A2620">Типичная площадка</text>
        <text x="52" y="96" font-size="10" fill="#6B6252">по объёму, ассортименту и людям</text>

        <circle cx="34" cy="126" r="9" fill="#9A7300"/>
        <text x="34" y="130" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">✓</text>
        <text x="52" y="124" font-size="11.5" font-weight="600" fill="#2A2620">Обычные сотрудники</text>
        <text x="52" y="140" font-size="10" fill="#6B6252">без отбора лучших и без лишних рук</text>

        <circle cx="34" cy="170" r="9" fill="#9A7300"/>
        <text x="34" y="174" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">✓</text>
        <text x="52" y="168" font-size="11.5" font-weight="600" fill="#2A2620">Измеримые критерии</text>
        <text x="52" y="184" font-size="10" fill="#6B6252">время, ошибки, обращения, доля операций</text>

        <circle cx="34" cy="214" r="9" fill="#9A7300"/>
        <text x="34" y="218" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">✓</text>
        <text x="52" y="212" font-size="11.5" font-weight="600" fill="#2A2620">План расширения</text>
        <text x="52" y="228" font-size="10" fill="#6B6252">кто, когда и по каким данным идёт дальше</text>
      </g>

      <g>
        <circle cx="366" cy="82" r="9" fill="#FFFFFF" stroke="#9A7300" stroke-width="1.4"/>
        <text x="366" y="86" text-anchor="middle" font-size="10" font-weight="700" fill="#9A7300">×</text>
        <text x="384" y="80" font-size="11.5" font-weight="600" fill="#2A2620">Удобная площадка</text>
        <text x="384" y="96" font-size="10" fill="#6B6252">самый спокойный склад с простым товаром</text>

        <circle cx="366" cy="126" r="9" fill="#FFFFFF" stroke="#9A7300" stroke-width="1.4"/>
        <text x="366" y="130" text-anchor="middle" font-size="10" font-weight="700" fill="#9A7300">×</text>
        <text x="384" y="124" font-size="11.5" font-weight="600" fill="#2A2620">Отобранные люди</text>
        <text x="384" y="140" font-size="10" fill="#6B6252">специальная команда, которой не будет потом</text>

        <circle cx="366" cy="170" r="9" fill="#FFFFFF" stroke="#9A7300" stroke-width="1.4"/>
        <text x="366" y="174" text-anchor="middle" font-size="10" font-weight="700" fill="#9A7300">×</text>
        <text x="384" y="168" font-size="11.5" font-weight="600" fill="#2A2620">Бесконечная доработка</text>
        <text x="384" y="184" font-size="10" fill="#6B6252">«ещё не всё идеально», критериев нет</text>

        <circle cx="366" cy="214" r="9" fill="#FFFFFF" stroke="#9A7300" stroke-width="1.4"/>
        <text x="366" y="218" text-anchor="middle" font-size="10" font-weight="700" fill="#9A7300">×</text>
        <text x="384" y="212" font-size="11.5" font-weight="600" fill="#2A2620">Расширение без разбора</text>
        <text x="384" y="228" font-size="10" fill="#6B6252">сразу на следующую площадку, без выводов</text>
      </g>
    </g>

    <rect x="16" y="252" width="648" height="38" rx="6" fill="#EDE5D2"/>
    <text x="30" y="268" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="600" fill="#2A2620">Критерий выхода фиксируется до старта пилота, а не после первых впечатлений.</text>
    <text x="30" y="283" font-family="Segoe UI,system-ui,sans-serif" font-size="10.5" fill="#6B6252">Если показатель не достигнут, пилот продлевается или возвращается на доработку.</text>
  </svg>
  <p class="note">Слева условия, которые делают пилот доказательством. Справа ловушки, которые превращают его в показательное выступление.</p>
</div>
</body>
</html>
