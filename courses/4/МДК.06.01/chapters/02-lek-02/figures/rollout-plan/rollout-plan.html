<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Комбинированный план перехода</title>
<style>
  :root { --paper:#FAF7EF; --card:#FFFDF8; --ink:#2A2620; --muted:#6B6252; --rule:#E3D8C2; --accent:#9A7300; --soft:#EDE5D2; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px; }
  .eyebrow { margin:0 0 6px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  .note { margin:10px 2px 0; font:12px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Внедрение · календарь перехода</p>
  <svg viewBox="0 0 680 318" role="img" aria-labelledby="rp-title rp-desc">
    <title id="rp-title">Пилот в Твери, параллельные счета и поэтапный перевод складов</title>
    <desc id="rp-desc">Календарь на десять недель: обучение и запуск Твери, две недели параллельного учёта счетов, затем Москва, Тула и Калуга по очереди.</desc>

    <g font-family="Consolas,monospace" font-size="9" fill="#6B6252" text-anchor="middle">
      <text x="160" y="20">нед -2</text>
      <text x="240" y="20">0</text>
      <text x="320" y="20">+2</text>
      <text x="400" y="20">+4</text>
      <text x="480" y="20">+6</text>
      <text x="560" y="20">+8</text>
      <text x="640" y="20">+10</text>
    </g>
    <g stroke="#E3D8C2" stroke-width="1">
      <line x1="160" y1="26" x2="160" y2="272"/>
      <line x1="240" y1="26" x2="240" y2="272"/>
      <line x1="320" y1="26" x2="320" y2="272"/>
      <line x1="400" y1="26" x2="400" y2="272"/>
      <line x1="480" y1="26" x2="480" y2="272"/>
      <line x1="560" y1="26" x2="560" y2="272"/>
      <line x1="640" y1="26" x2="640" y2="272"/>
    </g>

    <g font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#2A2620">
      <text x="14" y="54">Тверь</text>
      <text x="14" y="100">Бухгалтерия</text>
      <text x="14" y="146">Москва</text>
      <text x="14" y="192">Тула</text>
      <text x="14" y="238">Калуга</text>
    </g>

    <g>
      <rect x="160" y="40" width="80" height="22" rx="4" fill="#EDE5D2" stroke="#9A7300"/>
      <text x="200" y="55" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="#2A2620">обучение</text>
      <rect x="240" y="40" width="80" height="22" rx="4" fill="#9A7300"/>
      <text x="280" y="55" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="#FFFFFF">запуск</text>
      <rect x="240" y="66" width="80" height="14" rx="3" fill="#D6A520"/>
      <text x="280" y="77" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="8.5" fill="#2A2620">поддержка на площадке</text>
    </g>

    <g>
      <rect x="240" y="86" width="80" height="22" rx="4" fill="#FFFFFF" stroke="#9A7300" stroke-dasharray="4 2"/>
      <text x="280" y="101" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="8.8" fill="#9A7300">сверка счетов</text>
    </g>

    <g>
      <rect x="320" y="132" width="40" height="22" rx="4" fill="#EDE5D2" stroke="#9A7300"/>
      <text x="340" y="147" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="8.5" fill="#2A2620">обуч.</text>
      <rect x="360" y="132" width="80" height="22" rx="4" fill="#9A7300"/>
      <text x="400" y="147" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="#FFFFFF">запуск</text>
      <rect x="400" y="158" width="40" height="12" rx="3" fill="#D6A520"/>
    </g>

    <g>
      <rect x="400" y="178" width="40" height="22" rx="4" fill="#EDE5D2" stroke="#9A7300"/>
      <text x="420" y="193" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="8.5" fill="#2A2620">обуч.</text>
      <rect x="440" y="178" width="80" height="22" rx="4" fill="#9A7300"/>
      <text x="480" y="193" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="#FFFFFF">запуск</text>
      <rect x="480" y="204" width="40" height="12" rx="3" fill="#D6A520"/>
    </g>

    <g>
      <rect x="480" y="224" width="40" height="22" rx="4" fill="#EDE5D2" stroke="#9A7300"/>
      <text x="500" y="239" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="8.5" fill="#2A2620">обуч.</text>
      <rect x="520" y="224" width="80" height="22" rx="4" fill="#9A7300"/>
      <text x="560" y="239" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="#FFFFFF">запуск</text>
      <rect x="560" y="250" width="40" height="12" rx="3" fill="#D6A520"/>
    </g>

    <g font-family="Consolas,monospace" font-size="8.5" fill="#6B6252">
      <text x="330" y="120">разбор и решение о расширении</text>
      <text x="410" y="172">разбор</text>
      <text x="490" y="218">разбор</text>
      <text x="570" y="264">разбор</text>
    </g>

    <text x="16" y="292" font-family="Segoe UI,system-ui,sans-serif" font-size="10.5" fill="#6B6252">Золотая полоса: работа в новой системе. Светлая: обучение. Штрих: параллельный учёт счетов.</text>
    <text x="16" y="308" font-family="Consolas,monospace" font-size="9" fill="#9A7300">СЛЕДУЮЩАЯ ПЛОЩАДКА СТАРТУЕТ ПОСЛЕ РАЗБОРА, А НЕ ПО КАЛЕНДАРЮ</text>
  </svg>
  <p class="note">Календарь показывает порядок и зависимости. Длины полос условны и намеренно коротки: решение о расширении принимается по критериям, а не по номеру недели.</p>
</div>
</body>
</html>
