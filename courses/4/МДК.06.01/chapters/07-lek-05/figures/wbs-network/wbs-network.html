<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сеть работ внедрения</title>
<style>
  :root { --paper:#EDE5D2; --card:#FFFDF7; --ink:#2B2519; --muted:#6E6350; --rule:#D6C7A8; --accent:#9A7300; --soft:#F3EAD3; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px 16px 12px; }
  .eyebrow { margin:0 0 6px; font:600 9.5px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .note { margin:8px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">План · сеть работ</p>
  <svg viewBox="0 0 680 318" role="img" aria-labelledby="wn-title wn-desc">
    <title id="wn-title">Восемь работ внедрения и связи между ними</title>
    <desc id="wn-desc">Цепочка A, B, C, E, F, G, H длиной 56 дней. Работа D идёт параллельно C и имеет резерв два дня.</desc>

    <text x="16" y="20" font-family="Consolas,monospace" font-size="9" fill="#6E6350">ВОСЕМЬ РАБОТ, ОДИН РЕЗУЛЬТАТ НА КАЖДУЮ</text>

    <g font-family="Consolas,monospace" text-anchor="middle">
      <g>
        <rect x="16" y="74" width="72" height="52" rx="6" fill="#F7F0DF" stroke="#9A7300" stroke-width="1.6"/>
        <text x="52" y="92" font-size="10" fill="#9A7300">A · 10</text>
        <text x="52" y="108" font-size="7.5" fill="#2B2519">требования</text>
      </g>
      <g>
        <rect x="112" y="74" width="72" height="52" rx="6" fill="#F7F0DF" stroke="#9A7300" stroke-width="1.6"/>
        <text x="148" y="92" font-size="10" fill="#9A7300">B · 8</text>
        <text x="148" y="108" font-size="7.5" fill="#2B2519">настройка</text>
      </g>
      <g>
        <rect x="208" y="40" width="72" height="52" rx="6" fill="#F7F0DF" stroke="#9A7300" stroke-width="1.6"/>
        <text x="244" y="58" font-size="10" fill="#9A7300">C · 12</text>
        <text x="244" y="74" font-size="7.5" fill="#2B2519">миграция</text>
      </g>
      <g>
        <rect x="208" y="112" width="72" height="52" rx="6" fill="#FFFDF7" stroke="#C9B996"/>
        <text x="244" y="130" font-size="10" fill="#6E6350">D · 10</text>
        <text x="244" y="146" font-size="7.5" fill="#2B2519">интеграция</text>
      </g>
      <g>
        <rect x="304" y="74" width="72" height="52" rx="6" fill="#F7F0DF" stroke="#9A7300" stroke-width="1.6"/>
        <text x="340" y="92" font-size="10" fill="#9A7300">E · 5</text>
        <text x="340" y="108" font-size="7.5" fill="#2B2519">обучение</text>
      </g>
      <g>
        <rect x="400" y="74" width="72" height="52" rx="6" fill="#F7F0DF" stroke="#9A7300" stroke-width="1.6"/>
        <text x="436" y="92" font-size="10" fill="#9A7300">F · 10</text>
        <text x="436" y="108" font-size="7.5" fill="#2B2519">пилот</text>
      </g>
      <g>
        <rect x="496" y="74" width="72" height="52" rx="6" fill="#F7F0DF" stroke="#9A7300" stroke-width="1.6"/>
        <text x="532" y="92" font-size="10" fill="#9A7300">G · 8</text>
        <text x="532" y="108" font-size="7.5" fill="#2B2519">тираж</text>
      </g>
      <g>
        <rect x="592" y="74" width="72" height="52" rx="6" fill="#F7F0DF" stroke="#9A7300" stroke-width="1.6"/>
        <text x="628" y="92" font-size="10" fill="#9A7300">H · 3</text>
        <text x="628" y="108" font-size="7.5" fill="#2B2519">приёмка</text>
      </g>
    </g>

    <g stroke="#9A7300" stroke-width="1.3" fill="none" marker-end="url(#arw-wn)">
      <path d="M88 100h18"/>
      <path d="M184 100h12v-34h6"/>
      <path d="M184 100h12v38h6"/>
      <path d="M280 66h12v34h6"/>
      <path d="M280 138h12v-38h6"/>
      <path d="M376 100h18"/>
      <path d="M472 100h18"/>
      <path d="M568 100h18"/>
    </g>

    <text x="196" y="52" font-family="Consolas,monospace" font-size="7.5" fill="#8A6A2A">+12</text>
    <text x="196" y="176" font-family="Consolas,monospace" font-size="7.5" fill="#8A6A2A">параллельно</text>

    <rect x="16" y="196" width="648" height="44" rx="7" fill="#FFFDF7" stroke="#D6C7A8"/>
    <text x="30" y="214" font-family="Consolas,monospace" font-size="8" fill="#6E6350">КРИТИЧЕСКИЙ ПУТЬ</text>
    <text x="30" y="231" font-size="10.5" fill="#2B2519">A → B → C → E → F → G → H = 10 + 8 + 12 + 5 + 10 + 8 + 3 = 56 рабочих дней</text>

    <text x="16" y="264" font-family="Consolas,monospace" font-size="9" fill="#9A7300">ПОЧЕМУ D НЕ В ПУТИ</text>
    <text x="16" y="282" font-size="10.5" fill="#2B2519">D заканчивается на день 28, а E начинается на день 31: у интеграции есть резерв два дня.</text>
    <text x="16" y="300" font-size="10.5" fill="#2B2519">Добавление людей не сокращает путь: работы на нём связаны результатами, а не количеством исполнителей.</text>

    <defs>
      <marker id="arw-wn" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9A7300"/></marker>
    </defs>
  </svg>
  <p class="note">Золотым выделены работы критического пути. D идёт параллельно миграции и имеет резерв.</p>
</div>
</body>
</html>
