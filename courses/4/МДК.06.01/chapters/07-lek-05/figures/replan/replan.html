<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пересчёт после задержки</title>
<style>
  :root { --paper:#EDE5D2; --card:#FFFDF7; --ink:#2B2519; --muted:#6E6350; --rule:#D6C7A8; --accent:#9A7300; --soft:#F3EAD3; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px 16px 12px; }
  .eyebrow { margin:0 0 6px; font:600 9.5px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .note { margin:8px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">План · пересчёт сроков</p>
  <svg viewBox="0 0 680 340" role="img" aria-labelledby="rp-title rp-desc">
    <title id="rp-title">Сдвиг финиша после задержки интеграции</title>
    <desc id="rp-desc">Базовая линия заканчивается на 56 день. Задержка интеграции на пять дней сдвигает финиш на три дня, до 59, потому что два дня были резервом.</desc>

    <text x="16" y="24" font-family="Consolas,monospace" font-size="9" fill="#6E6350">БАЗОВЫЙ ПЛАН · ФИНИШ 56</text>
    <line x1="180" y1="34" x2="640" y2="34" stroke="#C9B996" stroke-dasharray="2 3"/>

    <g font-family="Consolas,monospace" font-size="7.5" fill="#6E6350">
      <text x="16" y="52">D интеграция</text>
      <text x="16" y="72">E обучение</text>
      <text x="16" y="92">F пилот</text>
      <text x="16" y="112">H приёмка</text>
    </g>
    <g>
      <rect x="180" y="42" width="115" height="12" rx="3" fill="#FFFDF7" stroke="#C9B996"/>
      <text x="238" y="51" text-anchor="middle" font-family="Consolas,monospace" font-size="6.5" fill="#6E6350">19-28</text>
      <rect x="318" y="62" width="58" height="12" rx="3" fill="#F3EAD3" stroke="#9A7300"/>
      <text x="347" y="71" text-anchor="middle" font-family="Consolas,monospace" font-size="6.5" fill="#9A7300">31-35</text>
      <rect x="375" y="82" width="115" height="12" rx="3" fill="#F3EAD3" stroke="#9A7300"/>
      <text x="432" y="91" text-anchor="middle" font-family="Consolas,monospace" font-size="6.5" fill="#9A7300">36-45</text>
      <rect x="582" y="102" width="35" height="12" rx="3" fill="#F3EAD3" stroke="#9A7300"/>
      <text x="599" y="111" text-anchor="middle" font-family="Consolas,monospace" font-size="6.5" fill="#9A7300">54-56</text>
    </g>
    <text x="180" y="130" font-family="Consolas,monospace" font-size="8" fill="#8A6A2A">пунктир: резерв работы D, 2 дня</text>
    <line x1="290" y1="48" x2="318" y2="68" stroke="#8A6A2A" stroke-width="1" stroke-dasharray="3 2"/>

    <line x1="16" y1="138" x2="664" y2="138" stroke="#D6C7A8"/>

    <text x="16" y="164" font-family="Consolas,monospace" font-size="9" fill="#9A7300">ПОСЛЕ ЗАДЕРЖКИ D НА 5 ДНЕЙ · ФИНИШ 59</text>

    <g font-family="Consolas,monospace" font-size="7.5" fill="#6E6350">
      <text x="16" y="192">D интеграция</text>
      <text x="16" y="212">E обучение</text>
      <text x="16" y="232">F пилот</text>
      <text x="16" y="252">H приёмка</text>
    </g>
    <g>
      <rect x="180" y="182" width="172" height="12" rx="3" fill="#F3EAD3" stroke="#9A7300" stroke-width="1.5"/>
      <text x="264" y="191" text-anchor="middle" font-family="Consolas,monospace" font-size="6.5" fill="#9A7300">19-33</text>
      <rect x="352" y="202" width="58" height="12" rx="3" fill="#F3EAD3" stroke="#9A7300"/>
      <text x="381" y="211" text-anchor="middle" font-family="Consolas,monospace" font-size="6.5" fill="#9A7300">34-38</text>
      <rect x="409" y="222" width="115" height="12" rx="3" fill="#F3EAD3" stroke="#9A7300"/>
      <text x="466" y="231" text-anchor="middle" font-family="Consolas,monospace" font-size="6.5" fill="#9A7300">39-48</text>
      <rect x="616" y="242" width="35" height="12" rx="3" fill="#F3EAD3" stroke="#9A7300"/>
      <text x="633" y="251" text-anchor="middle" font-family="Consolas,monospace" font-size="6.5" fill="#9A7300">57-59</text>
    </g>

    <rect x="16" y="272" width="648" height="42" rx="7" fill="#FFFDF7" stroke="#D6C7A8"/>
    <text x="30" y="290" font-family="Consolas,monospace" font-size="8" fill="#6E6350">ЦЕНА ЗАДЕРЖКИ</text>
    <text x="30" y="306" font-size="10.5" fill="#2B2519">5 дней задержки дали 3 дня сдвига: два дня поглотил резерв D, остаток перешёл на финиш.</text>

    <text x="16" y="332" font-size="10" fill="#6E6350">После пересчёта D стала критической, а у миграции C появился резерв три дня.</text>
  </svg>
  <p class="note">Сверху исходная цепочка, снизу факт. Масштаб дней одинаков, поэтому разницу видно без вычислений.</p>
</div>
</body>
</html>
