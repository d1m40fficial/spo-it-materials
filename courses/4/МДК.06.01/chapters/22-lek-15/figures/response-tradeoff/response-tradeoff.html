<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Выбор меры реагирования</title>
<style>
  :root { --paper:#EDE5D2; --card:#FBF6E9; --ink:#2b2517; --muted:#6b5f45; --rule:#cdbf9f; --accent:#9A7300; --soft:#F3E9CE; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .demo { background:var(--paper); border:1px solid var(--rule); border-radius:14px; padding:16px; }
  .head { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; padding-bottom:8px; border-bottom:1px solid var(--rule); }
  .eyebrow { margin:0 0 4px; font:600 9.5px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  h3 { margin:0; font-size:19px; line-height:1.2; }
  .hint { font:10.5px/1.35 Consolas,monospace; color:var(--muted); white-space:nowrap; }
  svg { display:block; width:100%; height:auto; margin-top:6px; }
  .opt rect { fill:#FBF6E9; stroke:#8d7d5b; stroke-width:1.3; transition:fill .2s, stroke .2s; }
  .opt.on rect { fill:var(--soft); stroke:var(--accent); stroke-width:2.2; }
  .opt text { font-family:Consolas,monospace; fill:#2b2517; }
  .controls { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  button { font:600 11px/1 "Segoe UI",system-ui,sans-serif; padding:7px 9px; border-radius:8px; border:1px solid var(--rule); background:var(--card); color:var(--ink); cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .status { margin-top:8px; padding:9px 11px; border-radius:8px; background:var(--soft); font:11.5px/1.45 "Segoe UI",system-ui,sans-serif; }
  .status b { color:var(--accent); }
  @media (max-width:560px) { .demo { padding:11px; } .hint { display:none; } }
</style>
</head>
<body>
<div class="demo">
  <div class="head">
    <div><p class="eyebrow">Риск · реагирование</p><h3>Четыре способа ответить</h3></div>
    <div class="hint">выберите риск</div>
  </div>
  <svg viewBox="0 0 680 280" role="img" aria-labelledby="rt-title rt-desc">
    <title id="rt-title">Стратегии реагирования на риск</title>
    <desc id="rt-desc">Избежание меняет план, снижение уменьшает вероятность или ущерб, передача переносит последствия, принятие резервирует время или деньги.</desc>

    <g class="opt" data-k="avoid">
      <rect x="14" y="34" width="152" height="210" rx="10"/>
      <text x="90" y="58" text-anchor="middle" font-size="9" fill="#9A7300">избежание</text>
      <text x="90" y="80" text-anchor="middle" font-size="7.4">меняем план,</text>
      <text x="90" y="92" text-anchor="middle" font-size="7.4">чтобы риск</text>
      <text x="90" y="104" text-anchor="middle" font-size="7.4">не возник</text>
      <text x="90" y="132" text-anchor="middle" font-size="7" fill="#6b5f45">цена: теряем</text>
      <text x="90" y="144" text-anchor="middle" font-size="7" fill="#6b5f45">часть объёма</text>
      <text x="90" y="176" text-anchor="middle" font-size="7" fill="#6b5f45">пример: сайт</text>
      <text x="90" y="188" text-anchor="middle" font-size="7" fill="#6b5f45">подключают позже</text>
    </g>
    <g class="opt" data-k="reduce">
      <rect x="178" y="34" width="152" height="210" rx="10"/>
      <text x="254" y="58" text-anchor="middle" font-size="9" fill="#9A7300">снижение</text>
      <text x="254" y="80" text-anchor="middle" font-size="7.4">уменьшаем</text>
      <text x="254" y="92" text-anchor="middle" font-size="7.4">вероятность</text>
      <text x="254" y="104" text-anchor="middle" font-size="7.4">или ущерб</text>
      <text x="254" y="132" text-anchor="middle" font-size="7" fill="#6b5f45">цена: время</text>
      <text x="254" y="144" text-anchor="middle" font-size="7" fill="#6b5f45">команды</text>
      <text x="254" y="176" text-anchor="middle" font-size="7" fill="#6b5f45">пример: очистка</text>
      <text x="254" y="188" text-anchor="middle" font-size="7" fill="#6b5f45">дублей до загрузки</text>
    </g>
    <g class="opt" data-k="transfer">
      <rect x="342" y="34" width="152" height="210" rx="10"/>
      <text x="418" y="58" text-anchor="middle" font-size="9" fill="#9A7300">передача</text>
      <text x="418" y="80" text-anchor="middle" font-size="7.4">переносим</text>
      <text x="418" y="92" text-anchor="middle" font-size="7.4">последствия</text>
      <text x="418" y="104" text-anchor="middle" font-size="7.4">на другую сторону</text>
      <text x="418" y="132" text-anchor="middle" font-size="7" fill="#6b5f45">цена: договор</text>
      <text x="418" y="144" text-anchor="middle" font-size="7" fill="#6b5f45">и контроль</text>
      <text x="418" y="176" text-anchor="middle" font-size="7" fill="#6b5f45">пример: штраф</text>
      <text x="418" y="188" text-anchor="middle" font-size="7" fill="#6b5f45">за задержку API</text>
    </g>
    <g class="opt" data-k="accept">
      <rect x="506" y="34" width="160" height="210" rx="10"/>
      <text x="586" y="58" text-anchor="middle" font-size="9" fill="#9A7300">принятие</text>
      <text x="586" y="80" text-anchor="middle" font-size="7.4">резервируем</text>
      <text x="586" y="92" text-anchor="middle" font-size="7.4">время или</text>
      <text x="586" y="104" text-anchor="middle" font-size="7.4">деньги</text>
      <text x="586" y="132" text-anchor="middle" font-size="7" fill="#6b5f45">цена: резерв</text>
      <text x="586" y="144" text-anchor="middle" font-size="7" fill="#6b5f45">простаивает</text>
      <text x="586" y="176" text-anchor="middle" font-size="7" fill="#6b5f45">пример: три дня</text>
      <text x="586" y="188" text-anchor="middle" font-size="7" fill="#6b5f45">резерва в плане</text>
    </g>

    <text x="340" y="266" text-anchor="middle" font-family="Consolas,monospace" font-size="7.4" fill="#6b5f45">принятие отличается от игнорирования тем, что оно записано и у него есть владелец</text>
  </svg>
  <div class="status" id="status"></div>
  <div class="controls">
    <button data-k="api" class="on">API задерживается</button>
    <button data-k="data">Потеря данных</button>
    <button data-k="people">Люди работают по-старому</button>
    <button data-k="dup">Дубли клиентов</button>
    <button data-k="vendor">Подрядчик уходит</button>
  </div>
</div>
<script>
(function () {
  var data = {
    api: { k:'avoid', t:'<b>API задерживается.</b> Разумно избежание: подключение сайта переносят на месяц, склады запускают без него. Проект теряет часть объёма, но сохраняет главный результат.' },
    data: { k:'reduce', t:'<b>Потеря данных.</b> Разумно снижение: копия, сверка контрольных сумм и пробное восстановление до загрузки. Мера стоит времени, но дешевле повторного ввода.' },
    people: { k:'reduce', t:'<b>Люди работают по-старому.</b> Разумно снижение: наставник, разбор случаев и участие в приёмке. Приказ без поддержки меняет отчётность, а не работу.' },
    dup: { k:'reduce', t:'<b>Дубли клиентов.</b> Разумно снижение: очистка до загрузки и правило проверки при каждой следующей выгрузке. Полностью риск не исчезает.' },
    vendor: { k:'transfer', t:'<b>Подрядчик уходит.</b> Разумно передача: договор, экспорт данных и доступы у заказчика. Риск не исчезает, но платит и действует другая сторона.' }
  };
  var opts = document.querySelectorAll('.opt');
  var buttons = document.querySelectorAll('button[data-k]');
  function apply(key) {
    var d = data[key];
    document.getElementById('status').innerHTML = d.t;
    opts.forEach(function (o) { o.classList.toggle('on', o.dataset.k === d.k); });
    buttons.forEach(function (b) { b.classList.toggle('on', b.dataset.k === key); });
  }
  buttons.forEach(function (b) { b.addEventListener('click', function () { apply(b.dataset.k); }); });
  apply('api');
})();
</script>
</body>
</html>
