<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цикл работы с риском</title>
<style>
  :root { --paper:#EDE5D2; --ink:#2b2517; --muted:#6b5f45; --rule:#cdbf9f; --accent:#9A7300; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .demo { background:var(--paper); border:1px solid var(--rule); border-radius:14px; padding:16px; }
  .eyebrow { margin:0 0 4px; font:600 9.5px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  h3 { margin:0 0 2px; font-size:19px; line-height:1.2; }
  .sub { margin:0; font:10.5px/1.4 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; margin-top:4px; }
  .note { margin:8px 2px 0; font:11px/1.45 Consolas,monospace; color:var(--muted); }
  @media (max-width:560px) { .demo { padding:11px; } }
</style>
</head>
<body>
<div class="demo">
  <p class="eyebrow">Риск · цикл</p>
  <h3>Риск живёт, пока проект идёт</h3>
  <p class="sub">пять шагов, которые повторяются на каждом совещании</p>
  <svg viewBox="0 0 680 310" role="img" aria-labelledby="rc-title rc-desc">
    <title id="rc-title">Цикл работы с риском</title>
    <desc id="rc-desc">Выявить, оценить, выбрать меру, следить, закрыть. В центре владелец, срок и триггер.</desc>

    <defs>
      <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#8d7d5b"/></marker>
    </defs>

    <g font-family="Consolas,monospace" text-anchor="middle">
      <g>
        <rect x="270" y="28" width="140" height="44" rx="9" fill="#F3E9CE" stroke="#9A7300" stroke-width="1.8"/>
        <text x="340" y="46" font-size="8.4" fill="#9A7300">1 · выявить</text>
        <text x="340" y="60" font-size="7" fill="#6b5f45">причина, событие, следствие</text>
      </g>
      <g>
        <rect x="500" y="98" width="140" height="44" rx="9" fill="#FBF6E9" stroke="#8d7d5b" stroke-width="1.3"/>
        <text x="570" y="116" font-size="8.4" fill="#2b2517">2 · оценить</text>
        <text x="570" y="130" font-size="7" fill="#6b5f45">вероятность на ущерб</text>
      </g>
      <g>
        <rect x="450" y="228" width="140" height="44" rx="9" fill="#FBF6E9" stroke="#8d7d5b" stroke-width="1.3"/>
        <text x="520" y="246" font-size="8.4" fill="#2b2517">3 · выбрать меру</text>
        <text x="520" y="260" font-size="7" fill="#6b5f45">избежать, снизить, передать</text>
      </g>
      <g>
        <rect x="190" y="228" width="140" height="44" rx="9" fill="#FBF6E9" stroke="#8d7d5b" stroke-width="1.3"/>
        <text x="260" y="246" font-size="8.4" fill="#2b2517">4 · следить</text>
        <text x="260" y="260" font-size="7" fill="#6b5f45">триггер и остаточная оценка</text>
      </g>
      <g>
        <rect x="40" y="98" width="140" height="44" rx="9" fill="#FBF6E9" stroke="#8d7d5b" stroke-width="1.3"/>
        <text x="110" y="116" font-size="8.4" fill="#2b2517">5 · закрыть</text>
        <text x="110" y="130" font-size="7" fill="#6b5f45">дата и причина, не удаление</text>
      </g>
    </g>

    <g fill="none" stroke="#8d7d5b" stroke-width="1.5" marker-end="url(#arr)">
      <path d="M410 52 C460 62 490 80 508 96"/>
      <path d="M570 142 C570 175 552 205 536 226"/>
      <path d="M450 250 L332 250"/>
      <path d="M190 250 C160 235 138 200 124 144"/>
      <path d="M180 108 C210 88 238 72 268 62"/>
    </g>

    <rect x="245" y="140" width="190" height="62" rx="10" fill="#FBF6E9" stroke="#cdbf9f"/>
    <text x="340" y="160" text-anchor="middle" font-family="Consolas,monospace" font-size="7.8" fill="#9A7300">у каждой строки есть</text>
    <text x="340" y="177" text-anchor="middle" font-family="Consolas,monospace" font-size="7.8" fill="#2b2517">владелец · срок · триггер</text>
    <text x="340" y="192" text-anchor="middle" font-family="Consolas,monospace" font-size="7.2" fill="#6b5f45">без них запись остаётся пожеланием</text>

    <text x="340" y="298" text-anchor="middle" font-family="Consolas,monospace" font-size="7.4" fill="#6b5f45">цикл повторяется раз в неделю и внепланово при смене плана</text>
  </svg>
  <p class="note">Закрытый риск не удаляют: строка с датой и причиной сохраняет опыт для следующего проекта.</p>
</div>
</body>
</html>
