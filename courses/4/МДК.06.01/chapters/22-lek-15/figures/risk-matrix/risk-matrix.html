<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Матрица рисков</title>
<style>
  :root { --paper:#EDE5D2; --card:#FBF6E9; --ink:#2b2517; --muted:#6b5f45; --rule:#cdbf9f; --accent:#9A7300; --soft:#F3E9CE; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .demo { background:var(--paper); border:1px solid var(--rule); border-radius:14px; padding:16px; }
  .head { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; padding-bottom:8px; border-bottom:1px solid var(--rule); }
  .eyebrow { margin:0 0 4px; font:600 9.5px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  h3 { margin:0; font-size:19px; line-height:1.2; }
  .hint { font:10.5px/1.35 Consolas,monospace; color:var(--muted); white-space:nowrap; }
  svg { display:block; width:100%; height:auto; margin-top:6px; }
  .cell { cursor:pointer; }
  .cell rect { stroke:#b7a780; stroke-width:1; transition:stroke .15s, stroke-width .15s; }
  .cell:hover rect { stroke:#9A7300; stroke-width:2; }
  .cell.sel rect { stroke:#2b2517; stroke-width:2.4; }
  .zone { font:6.6px Consolas,monospace; fill:#6b5f45; text-anchor:middle; }
  .axis { font:7.6px Consolas,monospace; fill:#2b2517; }
  .status { margin-top:8px; padding:9px 11px; border-radius:8px; background:var(--soft); font:11.5px/1.45 "Segoe UI",system-ui,sans-serif; }
  .status b { color:var(--accent); }
  @media (max-width:560px) { .demo { padding:11px; } .hint { display:none; } }
</style>
</head>
<body>
<div class="demo">
  <div class="head">
    <div><p class="eyebrow">Риск · оценка</p><h3>Вероятность на ущерб</h3></div>
    <div class="hint">нажмите клетку</div>
  </div>
  <svg viewBox="0 0 680 430" role="img" aria-labelledby="rm-title rm-desc">
    <title id="rm-title">Матрица вероятности и ущерба</title>
    <desc id="rm-desc">Пять на пять клеток. Ранг равен произведению вероятности и ущерба. Зелёная зона до 4, жёлтая от 5 до 9, красная от 10. Точки R-01 до R-09 показывают риски проекта.</desc>

    <text x="100" y="20" class="axis" font-weight="700">ущерб</text>
    <text x="410" y="20" class="axis" text-anchor="end">вероятность</text>
    <g id="grid"></g>

    <g id="points" font-family="Consolas,monospace" font-size="6.6"></g>

    <g font-family="Consolas,monospace" font-size="7.6" fill="#2b2517">
      <text x="100" y="392" text-anchor="middle">1</text>
      <text x="162" y="392" text-anchor="middle">2</text>
      <text x="224" y="392" text-anchor="middle">3</text>
      <text x="286" y="392" text-anchor="middle">4</text>
      <text x="348" y="392" text-anchor="middle">5</text>
      <text x="60" y="82" text-anchor="end">5</text>
      <text x="60" y="144" text-anchor="end">4</text>
      <text x="60" y="206" text-anchor="end">3</text>
      <text x="60" y="268" text-anchor="end">2</text>
      <text x="60" y="330" text-anchor="end">1</text>
      <text x="34" y="190" transform="rotate(-90 34 190)" text-anchor="middle">ущерб</text>
    </g>

    <g font-family="Consolas,monospace" font-size="7.2">
      <rect x="440" y="60" width="12" height="12" fill="#DCE8D2" stroke="#8d9a72"/>
      <text x="460" y="70" fill="#2b2517">до 4: принять и наблюдать</text>
      <rect x="440" y="86" width="12" height="12" fill="#F3E4B8" stroke="#b7a780"/>
      <text x="460" y="96" fill="#2b2517">5-9: план и срок</text>
      <rect x="440" y="112" width="12" height="12" fill="#E8C7B8" stroke="#b58e7e"/>
      <text x="460" y="122" fill="#2b2517">10 и выше: решение сразу</text>
      <text x="440" y="152" fill="#6b5f45">точки 01-09:</text>
      <text x="440" y="168" fill="#2b2517">риски R-01 ... R-09</text>
      <text x="440" y="184" fill="#2b2517">из реестра проекта</text>
    </g>

    <text x="340" y="418" text-anchor="middle" font-family="Consolas,monospace" font-size="7.4" fill="#6b5f45">ранг не отменяет здравый смысл: ущерб 5 держат на контроле и при вероятности 1</text>
  </svg>
  <div class="status" id="status"></div>
</div>
<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var grid = document.getElementById('grid');
  var colors = { green:'#DCE8D2', yellow:'#F3E4B8', red:'#E8C7B8' };
  function zone(rank) { return rank <= 4 ? 'green' : (rank <= 9 ? 'yellow' : 'red'); }
  var risks = {
    '4-3': ['R-01'], '3-4': ['R-02'], '2-5': ['R-03','R-07'], '3-3': ['R-04'],
    '5-2': ['R-05'], '2-3': ['R-06'], '4-2': ['R-08'], '1-4': ['R-09']
  };
  for (var d = 5; d >= 1; d--) {
    for (var p = 1; p <= 5; p++) {
      var rank = p * d;
      var x = 100 + (p - 1) * 62;
      var y = 50 + (5 - d) * 62;
      var g = document.createElementNS(NS, 'g');
      g.setAttribute('class', 'cell');
      g.setAttribute('data-p', p);
      g.setAttribute('data-d', d);
      var r = document.createElementNS(NS, 'rect');
      r.setAttribute('x', x); r.setAttribute('y', y);
      r.setAttribute('width', 62); r.setAttribute('height', 62);
      r.setAttribute('fill', colors[zone(rank)]);
      g.appendChild(r);
      var t = document.createElementNS(NS, 'text');
      t.setAttribute('x', x + 31); t.setAttribute('y', y + 36);
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('font-family', 'Consolas,monospace');
      t.setAttribute('font-size', '9');
      t.setAttribute('fill', '#2b2517');
      t.textContent = rank;
      g.appendChild(t);
      grid.appendChild(g);
    }
  }

  var points = document.getElementById('points');
  var offsets = { 'R-01':[0,0], 'R-02':[0,0], 'R-03':[-9,-4], 'R-04':[0,0], 'R-05':[0,0], 'R-06':[0,0], 'R-07':[9,5], 'R-08':[0,0], 'R-09':[0,0] };
  var pos = { 'R-01':[4,3], 'R-02':[3,4], 'R-03':[2,5], 'R-04':[3,3], 'R-05':[5,2], 'R-06':[2,3], 'R-07':[2,5], 'R-08':[4,2], 'R-09':[1,4] };
  Object.keys(pos).forEach(function (id) {
    var p = pos[id][0], d = pos[id][1];
    var cx = 100 + (p - 1) * 62 + 31 + offsets[id][0];
    var cy = 50 + (5 - d) * 62 + 22 + offsets[id][1];
    var c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', 7);
    c.setAttribute('fill', '#FBF6E9'); c.setAttribute('stroke', '#2b2517'); c.setAttribute('stroke-width', '1.4');
    points.appendChild(c);
    var t = document.createElementNS(NS, 'text');
    t.setAttribute('x', cx); t.setAttribute('y', cy + 2.2); t.setAttribute('text-anchor', 'middle');
    t.setAttribute('fill', '#2b2517');
    t.textContent = id.slice(2);
    points.appendChild(t);
  });

  var status = document.getElementById('status');
  function show(p, d) {
    var rank = p * d;
    var z = zone(rank);
    var text;
    if (z === 'green') text = 'Принять и наблюдать, владелец следит за триггером';
    else if (z === 'yellow') text = 'Нужен план мер со сроком и ответственным';
    else text = 'Решение принимает руководитель проекта или заказчик, работа начинается сразу';
    var here = risks[p + '-' + d] ? ' В этой клетке: ' + risks[p + '-' + d].join(', ') + '.' : '';
    status.innerHTML = '<b>Вероятность ' + p + ', ущерб ' + d + ', ранг ' + rank + '.</b> ' + text + '.' + here;
  }
  var cells = document.querySelectorAll('.cell');
  cells.forEach(function (c) {
    c.addEventListener('click', function () {
      cells.forEach(function (o) { o.classList.remove('sel'); });
      c.classList.add('sel');
      show(Number(c.dataset.p), Number(c.dataset.d));
    });
  });
  show(4, 3);
  cells.forEach(function (c) { if (c.dataset.p === '4' && c.dataset.d === '3') c.classList.add('sel'); });
})();
</script>
</body>
</html>
