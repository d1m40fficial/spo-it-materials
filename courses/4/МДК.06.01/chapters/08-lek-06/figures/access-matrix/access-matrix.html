<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Матрица прав по ролям</title>
<style>
  :root { --paper:#EDE5D2; --card:#FFFDF7; --ink:#2B2519; --muted:#6E6350; --rule:#D6C7A8; --accent:#9A7300; --soft:#F3EAD3; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .demo { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px; }
  .head { display:flex; justify-content:space-between; align-items:flex-end; gap:14px; padding-bottom:8px; border-bottom:1px solid var(--rule); }
  .eyebrow { margin:0 0 3px; font:600 9.5px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  h3 { margin:0; font-size:18px; line-height:1.2; }
  .hint { font:10.5px/1.3 Consolas,monospace; color:var(--muted); white-space:nowrap; }
  svg { display:block; width:100%; height:auto; margin-top:8px; }
  .obj { fill:#FFFDF7; stroke:#C9B996; }
  .perm { fill:#F3EAD3; }
  .deny { fill:#F7F0DF; }
  .rowline { stroke:#D6C7A8; stroke-width:.8; }
  .status { min-height:56px; margin-top:6px; padding:10px 12px; border-radius:8px; background:var(--soft); font-size:12.5px; line-height:1.45; }
  .status b { color:var(--accent); }
  .controls { display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; }
  button { font:600 11.5px/1 "Segoe UI",system-ui,sans-serif; padding:8px 10px; border-radius:8px; border:1px solid var(--rule); background:var(--card); color:var(--ink); cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  @media (max-width:560px) { .demo { padding:12px; } .hint { display:none; } }
</style>
</head>
<body>
<div class="demo">
  <div class="head">
    <div><p class="eyebrow">Настройка · права доступа</p><h3>Что видит роль</h3></div>
    <div class="hint">выберите роль</div>
  </div>
  <svg viewBox="0 0 680 276" role="img" aria-labelledby="am-title am-desc">
    <title id="am-title">Права ролей на объекты складской системы</title>
    <desc id="am-desc">Пять объектов и права выбранной роли. Запрещённые действия показаны серым, разрешённые золотым.</desc>
    <text x="18" y="22" font-family="Consolas,monospace" font-size="8.5" fill="#6E6350">ОБЪЕКТ</text>
    <text x="180" y="22" font-family="Consolas,monospace" font-size="8.5" fill="#6E6350">ДЕЙСТВИЯ РОЛИ</text>
    <g id="rows"></g>
  </svg>
  <div class="status" id="status"></div>
  <div class="controls" id="roles"></div>
</div>
<script>
(function () {
  var objects = ['Заказы', 'Товары', 'Остатки', 'Счета', 'Пользователи'];
  var roles = {
    director: { name:'Директор', perm:['просмотр', 'просмотр', 'просмотр', 'просмотр', 'нет доступа'],
      note:'<b>Директор.</b> Видит сводные данные по компании, но не меняет справочники и не проводит документы.' },
    commercial: { name:'Коммерческий директор', perm:['просмотр и согласование', 'просмотр', 'просмотр', 'просмотр', 'нет доступа'],
      note:'<b>Коммерческий директор.</b> Согласует скидки и отсрочки. Проверка: он не должен удалять товар или менять учётные записи.' },
    manager: { name:'Менеджер', perm:['создание и просмотр своих', 'просмотр', 'просмотр', 'нет доступа', 'нет доступа'],
      note:'<b>Менеджер.</b> Работает со своими заказами. Негативный тест: чужой заказ и закупочная цена недоступны.' },
    store: { name:'Кладовщик', perm:['просмотр задания', 'просмотр', 'просмотр своего склада', 'нет доступа', 'нет доступа'],
      note:'<b>Кладовщик.</b> Видит задания и остатки своего склада. Негативный тест: суммы заказов и чужой склад закрыты.' },
    accountant: { name:'Бухгалтер', perm:['просмотр для счёта', 'просмотр', 'нет доступа', 'создание и проведение', 'нет доступа'],
      note:'<b>Бухгалтер.</b> Работает со счетами, но не со складскими остатками. Проверка: счёт нельзя провести без основания.' },
    admin: { name:'Администратор ИС', perm:['нет доступа', 'просмотр', 'нет доступа', 'нет доступа', 'изменение'],
      note:'<b>Администратор ИС.</b> Настраивает систему и учётные записи, но не проводит бизнес-документы: иначе он сможет изменить заказ и сам его подписать.' }
  };
  var current = 'store';
  var rowsG = document.getElementById('rows');
  var status = document.getElementById('status');
  var roleBox = document.getElementById('roles');
  var NS = 'http://www.w3.org/2000/svg';
  var refs = [];

  function el(n, a) { var e = document.createElementNS(NS, n); for (var k in a) e.setAttribute(k, a[k]); return e; }

  objects.forEach(function (name, i) {
    var y = 36 + i * 46;
    var g = el('g', {});
    g.appendChild(el('rect', { x:16, y:y, width:140, height:34, rx:6, class:'obj' }));
    var t = el('text', { x:28, y:y + 21, 'font-size':'11', fill:'#2B2519' });
    t.textContent = name;
    g.appendChild(t);
    var chip = el('rect', { x:168, y:y, width:496, height:34, rx:6, class:'perm' });
    g.appendChild(chip);
    var p = el('text', { x:180, y:y + 21, 'font-size':'11', fill:'#2B2519' });
    g.appendChild(p);
    rowsG.appendChild(g);
    refs.push({ chip:chip, text:p });
  });

  function apply(key) {
    current = key;
    var r = roles[key];
    r.perm.forEach(function (v, i) {
      refs[i].text.textContent = v;
      var deny = v === 'нет доступа';
      refs[i].chip.setAttribute('class', deny ? 'deny' : 'perm');
      refs[i].text.setAttribute('fill', deny ? '#8A8375' : '#2B2519');
    });
    status.innerHTML = r.note;
    roleBox.querySelectorAll('button').forEach(function (b) {
      b.className = b.getAttribute('data-k') === key ? 'on' : '';
    });
  }

  Object.keys(roles).forEach(function (k) {
    var b = document.createElement('button');
    b.textContent = roles[k].name;
    b.setAttribute('data-k', k);
    b.addEventListener('click', function () { apply(k); });
    roleBox.appendChild(b);
  });

  apply(current);
})();
</script>
</body>
</html>
