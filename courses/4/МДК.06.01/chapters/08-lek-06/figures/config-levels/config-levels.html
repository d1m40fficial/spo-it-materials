<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Три уровня работы с системой</title>
<style>
  :root { --paper:#EDE5D2; --card:#FFFDF7; --ink:#2B2519; --muted:#6E6350; --rule:#D6C7A8; --accent:#9A7300; --soft:#F3EAD3; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px 16px 12px; }
  .eyebrow { margin:0 0 6px; font:600 9.5px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .note { margin:8px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Настройка · три уровня</p>
  <svg viewBox="0 0 680 322" role="img" aria-labelledby="cl-title cl-desc">
    <title id="cl-title">Настройка, конфигурирование и доработка</title>
    <desc id="cl-desc">Сначала используют штатные параметры, затем штатные правила и поля, только потом код. Стоимость сопровождения и риск при обновлении растут сверху вниз.</desc>

    <text x="16" y="20" font-family="Consolas,monospace" font-size="9" fill="#6E6350">ПОРЯДОК ВЫБОРА</text>

    <rect x="16" y="32" width="420" height="70" rx="8" fill="#FFFDF7" stroke="#9A7300" stroke-width="1.8"/>
    <text x="30" y="52" font-family="Consolas,monospace" font-size="9" fill="#9A7300">1 · НАСТРОЙКА</text>
    <text x="30" y="70" font-size="11" fill="#2B2519">параметры продукта: подразделения, склады, роли,</text>
    <text x="30" y="86" font-size="11" fill="#2B2519">валюта, единицы, статусы, права</text>

    <rect x="16" y="112" width="480" height="70" rx="8" fill="#FFFDF7" stroke="#C9B996"/>
    <text x="30" y="132" font-family="Consolas,monospace" font-size="9" fill="#6E6350">2 · КОНФИГУРИРОВАНИЕ</text>
    <text x="30" y="150" font-size="11" fill="#2B2519">штатные правила и поля: формулы, условия маршрута,</text>
    <text x="30" y="166" font-size="11" fill="#2B2519">пользовательские поля, отчёты, шаблоны</text>

    <rect x="16" y="192" width="540" height="70" rx="8" fill="#FFFDF7" stroke="#C9B996" stroke-dasharray="5 3"/>
    <text x="30" y="212" font-family="Consolas,monospace" font-size="9" fill="#6E6350">3 · ДОРАБОТКА</text>
    <text x="30" y="230" font-size="11" fill="#2B2519">код: новый модуль, нестандартный расчёт, отдельный сервис.</text>
    <text x="30" y="246" font-size="11" fill="#2B2519">Требует тестов, документации и переноса при обновлении.</text>

    <path d="M410 102v8" stroke="#9A7300" stroke-width="1.3" fill="none" marker-end="url(#arw-cl)"/>
    <path d="M470 182v8" stroke="#9A7300" stroke-width="1.3" fill="none" marker-end="url(#arw-cl)"/>

    <text x="576" y="60" font-family="Consolas,monospace" font-size="8" fill="#9A7300">ДЕШЕВЛЕ</text>
    <text x="576" y="76" font-family="Consolas,monospace" font-size="8" fill="#6E6350">сохраняется</text>
    <text x="576" y="90" font-family="Consolas,monospace" font-size="8" fill="#6E6350">при обновлении</text>
    <text x="576" y="140" font-family="Consolas,monospace" font-size="8" fill="#6E6350">нужна проверка</text>
    <text x="576" y="154" font-family="Consolas,monospace" font-size="8" fill="#6E6350">после обновления</text>
    <text x="576" y="216" font-family="Consolas,monospace" font-size="8" fill="#8A6A2A">ДОРОЖЕ</text>
    <text x="576" y="230" font-family="Consolas,monospace" font-size="8" fill="#6E6350">свой цикл</text>
    <text x="576" y="244" font-family="Consolas,monospace" font-size="8" fill="#6E6350">сопровождения</text>

    <rect x="16" y="278" width="648" height="30" rx="6" fill="#F3EAD3"/>
    <text x="30" y="297" font-size="10.5" fill="#2B2519">Правило: если задача решается штатным механизмом, доработка не начинается.</text>

    <defs>
      <marker id="arw-cl" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9A7300"/></marker>
    </defs>
  </svg>
  <p class="note">Сверху вниз растут стоимость сопровождения и риск потерять настройку при обновлении продукта.</p>
</div>
</body>
</html>
