<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нагрузка в переходный период</title>
<style>
  :root { --paper:#EDE5D2; --ink:#2b2517; --muted:#6b5f45; --rule:#cdbf9f; --accent:#9A7300; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .demo { background:var(--paper); border:1px solid var(--rule); border-radius:14px; padding:16px; }
  .eyebrow { margin:0 0 4px; font:600 9.5px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  h3 { margin:0 0 2px; font-size:19px; line-height:1.2; }
  .sub { margin:0; font:10.5px/1.4 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; margin-top:4px; }
  .note { margin:8px 2px 0; font:11px/1.45 Consolas,monospace; color:var(--muted); }
  @media (max-width:560px) { .demo { padding:11px; } }
</style>
</head>
<body>
<div class="demo">
  <p class="eyebrow">Переход · нагрузка</p>
  <h3>Пик приходится на двойной ввод</h3>
  <p class="sub">условная нагрузка в процентах от прежней недели</p>
  <svg viewBox="0 0 680 300" role="img" aria-labelledby="tl-title tl-desc">
    <title id="tl-title">Нагрузка до, во время и после перехода</title>
    <desc id="tl-desc">До запуска нагрузка равна 100 процентам. В период двойного ввода она растёт до 160. После отключения старого способа опускается до 95, но обещанные 85 достигаются только при закреплении новой привычки.</desc>

    <rect x="70" y="40" width="570" height="190" fill="#FBF6E9" stroke="#cdbf9f"/>
    <rect x="150" y="40" width="180" height="190" fill="#F3E9CE" opacity=".75"/>
    <line x1="330" y1="40" x2="330" y2="230" stroke="#9A7300" stroke-width="1.4" stroke-dasharray="4 4"/>

    <line x1="70" y1="160" x2="640" y2="160" stroke="#b7a780" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="70" y1="185" x2="640" y2="185" stroke="#9A7300" stroke-width="1" stroke-dasharray="2 5"/>
    <line x1="70" y1="230" x2="70" y2="40" stroke="#6b5f45" stroke-width="1.2"/>
    <line x1="70" y1="230" x2="640" y2="230" stroke="#6b5f45" stroke-width="1.2"/>

    <path d="M90 160 L150 162 C185 150 205 80 280 80 L330 80 C360 96 372 148 396 158 C450 168 530 164 630 163"
          fill="none" stroke="#9A7300" stroke-width="2.8"/>
    <circle cx="150" cy="162" r="3.5" fill="#9A7300"/>
    <circle cx="280" cy="80" r="3.5" fill="#9A7300"/>
    <circle cx="330" cy="80" r="3.5" fill="#9A7300"/>
    <circle cx="396" cy="158" r="3.5" fill="#9A7300"/>

    <g font-family="Consolas,monospace" font-size="8" fill="#6b5f45">
      <text x="62" y="163" text-anchor="end">100</text>
      <text x="62" y="88" text-anchor="end">160</text>
      <text x="62" y="188" text-anchor="end">85</text>
      <text x="40" y="140" transform="rotate(-90 40 140)" text-anchor="middle">нагрузка, %</text>
      <text x="110" y="248" text-anchor="middle">неделя 1</text>
      <text x="240" y="248" text-anchor="middle">недели 2-4</text>
      <text x="405" y="248" text-anchor="middle">неделя 5</text>
      <text x="555" y="248" text-anchor="middle">недели 6-10</text>
    </g>

    <g font-family="Consolas,monospace" font-size="7.5">
      <text x="240" y="62" text-anchor="middle" fill="#9A7300">двойной ввод</text>
      <text x="240" y="72" text-anchor="middle" fill="#6b5f45">бумага и система</text>
      <text x="338" y="146" fill="#9A7300">отключение</text>
      <text x="338" y="156" fill="#9A7300">старого способа</text>
      <text x="520" y="154" text-anchor="middle" fill="#6b5f45">новая норма</text>
      <text x="520" y="198" text-anchor="middle" fill="#9A7300">обещанный эффект</text>
      <text x="520" y="209" text-anchor="middle" fill="#6b5f45">достигается позже</text>
    </g>

    <text x="355" y="278" text-anchor="middle" font-family="Consolas,monospace" font-size="8" fill="#6b5f45">пока тетрадь лежит в ящике, кривая не опускается</text>
  </svg>
  <p class="note">Форма кривой условна. Важен порядок: сначала рост из-за двух способов работы, затем спад, затем медленное закрепление.</p>
</div>
</body>
</html>
