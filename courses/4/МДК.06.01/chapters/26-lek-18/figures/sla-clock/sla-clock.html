<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Срок реакции в рабочих часах</title>
<style>
  :root { --paper:#F7F1E3; --card:#FFFDF6; --ink:#2A2620; --muted:#6B6459; --accent:#9A7300; --soft:#EDE5D2; --rule:#D8CBB0; --bad:#9B3A2E; --ok:#3D6B45; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .demo { background:var(--paper); border:1px solid var(--rule); border-radius:14px; padding:16px; }
  .head { display:flex; justify-content:space-between; align-items:flex-end; gap:14px; padding-bottom:8px; border-bottom:1px solid var(--rule); }
  .eyebrow { margin:0 0 4px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.13em; text-transform:uppercase; color:var(--accent); }
  h3 { margin:0; font-size:19px; line-height:1.2; }
  .hint { font:11px/1.4 Consolas,monospace; color:var(--muted); white-space:nowrap; }
  svg { display:block; width:100%; height:auto; margin-top:8px; }
  svg text { font-family:Consolas,monospace; fill:var(--ink); }
  .day { font-size:8px; fill:var(--muted); }
  .hour { font-size:6.4px; fill:#8C8171; }
  .status { min-height:58px; margin-top:8px; padding:10px 12px; border-radius:9px; background:var(--soft); font-size:12.5px; line-height:1.45; }
  .status b { color:var(--accent); }
  .controls { display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; }
  button { font:600 11.5px/1 "Segoe UI",system-ui,sans-serif; padding:8px 10px; border-radius:9px; border:1px solid var(--rule); background:var(--card); color:var(--ink); cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#FFFDF6; }
  @media (max-width:560px) { .demo { padding:11px; } .hint { display:none; } }
</style>
</head>
<body>
<div class="demo">
  <div class="head">
    <div><p class="eyebrow">Сопровождение · сроки</p><h3>Когда наступит срок</h3></div>
    <div class="hint">выберите заявку</div>
  </div>
  <svg viewBox="0 0 680 300" role="img" aria-label="Неделя с рабочими часами и двумя отметками: заявка и срок реакции">
    <g id="grid"></g>
    <text x="340" y="26" text-anchor="middle" font-family="Consolas,monospace" font-size="8" fill="#6B6459">поддержка работает пн-пт, 8:00-20:00 · закрашено рабочее время</text>
    <text x="340" y="282" text-anchor="middle" font-family="Consolas,monospace" font-size="7.4" fill="#9A7300">ВЫХОДНЫЕ И НОЧЬ НЕ СЧИТАЮТСЯ, ПОЭТОМУ ПЯТНИЧНАЯ ЗАЯВКА ЖДЁТ ДО ПОНЕДЕЛЬНИКА</text>
    <defs><marker id="arw6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9B3A2E"/></marker></defs>
  </svg>
  <div class="status" id="status"></div>
  <div class="controls">
    <button data-k="s1" class="on">Критичная, пт 23:00</button>
    <button data-k="s2">Обычная, пт 23:00</button>
    <button data-k="s3">Высокая, сб 12:00</button>
    <button data-k="s4">Консультация, вт 18:00</button>
  </div>
</div>
<script>
(function () {
  var DAY = ['ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ', 'ВС', 'ПН'];
  var X0 = 44, Y0 = 62, W = 620, H = 168, COL = W / 8;
  var grid = document.getElementById('grid');
  var svgNS = 'http://www.w3.org/2000/svg';
  function el(name, attrs, text) {
    var n = document.createElementNS(svgNS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text) n.textContent = text;
    grid.appendChild(n);
    return n;
  }
  DAY.forEach(function (d, i) {
    el('text', { x: X0 + COL * (i + 0.5), y: 48, 'text-anchor': 'middle', 'class': 'day' }, d);
    el('rect', { x: X0 + COL * i + 2, y: Y0, width: COL - 4, height: H, rx: 3, fill: '#FFFDF6', stroke: '#D8CBB0' });
    el('rect', { x: X0 + COL * i + 2, y: Y0 + H * 8 / 24, width: COL - 4, height: H * 12 / 24, fill: '#EDE5D2' });
    el('text', { x: X0 + COL * i + 6, y: Y0 + H * 8 / 24 - 3, 'class': 'hour' }, '8');
    el('text', { x: X0 + COL * i + 6, y: Y0 + H * 20 / 24 + 9, 'class': 'hour' }, '20');
  });
  el('line', { x1: X0, y1: Y0 + H + 4, x2: X0 + W, y2: Y0 + H + 4, stroke: '#8C8171', 'stroke-width': 1 });

  var scenarios = {
    s1: { day: 4, min: 23 * 60, need: 15, name: 'критичная', note: 'Реакция 15 минут. Заявка пришла в пятницу в 23:00, когда поддержка уже закрыта. Отсчёт начинается в понедельник в 8:00, срок наступает в 8:15.' },
    s2: { day: 4, min: 23 * 60, need: 240, name: 'обычная', note: 'Реакция 4 рабочих часа. В пятницу после 20:00 поддержка не работает, поэтому отсчёт идёт с понедельника 8:00 и заканчивается в 12:00.' },
    s3: { day: 5, min: 12 * 60, need: 60, name: 'высокая', note: 'Реакция 1 час. Суббота выходной, отсчёт начинается в понедельник в 8:00, срок наступает в 9:00.' },
    s4: { day: 1, min: 18 * 60, need: 480, name: 'консультация', note: 'Реакция 8 рабочих часов. Во вторник остаётся 2 часа до 20:00, остальные 6 часов приходятся на среду, срок наступает в 14:00.' }
  };
  function addWorking(day, min, need) {
    var d = day, m = min, guard = 0;
    while (guard++ < 100) {
      if (d % 7 >= 5) { d += 1; m = 0; continue; }
      if (m < 480) m = 480;
      if (m >= 1200) { d += 1; m = 0; continue; }
      var avail = 1200 - m;
      if (need <= avail) return { day: d, min: m + need };
      need -= avail; d += 1; m = 0;
    }
    return { day: d, min: m };
  }
  function fmt(day, min) {
    var h = Math.floor(min / 60), mm = Math.round(min % 60);
    return DAY[day % 8] + ' ' + String(h).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
  }
  function pos(day, min) {
    return { x: X0 + COL * Math.min(day, 7) + (min / 1440) * COL, y: Y0 + (min / 1440) * H };
  }
  function clearMarks() {
    grid.querySelectorAll('.mark').forEach(function (n) { n.remove(); });
  }
  function apply(k) {
    var s = scenarios[k];
    var end = addWorking(s.day, s.min, s.need);
    clearMarks();
    var a = pos(s.day, s.min), b = pos(end.day, end.min);
    var line = el('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: '#9B3A2E', 'stroke-width': 1.4, 'stroke-dasharray': '4 3', 'marker-end': 'url(#arw6)', 'class': 'mark' });
    el('circle', { cx: a.x, cy: a.y, r: 4, fill: '#9A7300', 'class': 'mark' });
    el('circle', { cx: b.x, cy: b.y, r: 4, fill: '#9B3A2E', 'class': 'mark' });
    var la = fmt(s.day, s.min), lb = fmt(end.day, end.min);
    var ta = el('text', { x: Math.max(4, Math.min(600, a.x - 4)), y: a.y + 16, 'text-anchor': 'end', 'font-size': 7.4, fill: '#9A7300', 'class': 'mark' }, 'заявка ' + la);
    var tb = el('text', { x: Math.max(30, Math.min(640, b.x + 2)), y: b.y - 7, 'text-anchor': 'start', 'font-size': 7.4, fill: '#9B3A2E', 'class': 'mark' }, 'срок ' + lb);
    if (b.x - a.x < 140) { ta.setAttribute('x', a.x + 6); ta.setAttribute('text-anchor', 'start'); }
    document.getElementById('status').innerHTML = '<b>Срок реакции: ' + lb + '.</b> ' + s.note;
    document.querySelectorAll('button[data-k]').forEach(function (btn) { btn.classList.toggle('on', btn.dataset.k === k); });
  }
  document.querySelectorAll('button[data-k]').forEach(function (btn) {
    btn.addEventListener('click', function () { apply(btn.dataset.k); });
  });
  apply('s1');
})();
</script>
</body>
</html>
