<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Окно обслуживания</title>
<style>
  :root { --paper:#F7F1E3; --ink:#2A2620; --muted:#6B6459; --accent:#9A7300; --soft:#EDE5D2; --rule:#D8CBB0; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px 16px 12px; }
  .eyebrow { margin:0 0 6px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.15em; text-transform:uppercase; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
  .note { margin:9px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Сопровождение · окно</p>
  <svg viewBox="0 0 680 292" role="img" aria-labelledby="mw-title mw-desc">
    <title id="mw-title">Ночное окно обслуживания</title>
    <desc id="mw-desc">С 22:00 до 02:00 идут подготовка, остановка обмена, установка, проверки и включение. Точка отката отмечена после остановки обмена.</desc>

    <text x="24" y="30" font-family="Consolas,monospace" font-size="8" fill="#6B6459">ВОСКРЕСЕНЬЕ · ОКНО 22:00-02:00</text>
    <line x1="24" y1="58" x2="656" y2="58" stroke="#8C8171" stroke-width="1.4"/>
    <g font-family="Consolas,monospace" font-size="7" fill="#6B6459" text-anchor="middle">
      <text x="24" y="48">22:00</text>
      <text x="130" y="48">22:30</text>
      <text x="236" y="48">23:00</text>
      <text x="342" y="48">00:00</text>
      <text x="448" y="48">00:30</text>
      <text x="554" y="48">01:00</text>
      <text x="656" y="48">02:00</text>
    </g>

    <g font-family="Consolas,monospace" text-anchor="middle">
      <rect x="24" y="70" width="106" height="44" rx="5" fill="#EDE5D2" stroke="#9A7300"/>
      <text x="77" y="88" font-size="7" fill="#9A7300">копия</text>
      <text x="77" y="102" font-size="6.6" fill="#2A2620">проверка</text>

      <rect x="136" y="70" width="100" height="44" rx="5" fill="#FFFDF6" stroke="#8C8171"/>
      <text x="186" y="88" font-size="7" fill="#9A7300">стоп обмена</text>
      <text x="186" y="102" font-size="6.6" fill="#2A2620">сайт в очереди</text>

      <rect x="242" y="70" width="200" height="44" rx="5" fill="#FFFDF6" stroke="#8C8171"/>
      <text x="342" y="88" font-size="7" fill="#9A7300">установка обновления</text>
      <text x="342" y="102" font-size="6.6" fill="#2A2620">на рабочей копии базы</text>

      <rect x="448" y="70" width="104" height="44" rx="5" fill="#FFFDF6" stroke="#8C8171"/>
      <text x="500" y="88" font-size="7" fill="#9A7300">проверки</text>
      <text x="500" y="102" font-size="6.6" fill="#2A2620">сценарии</text>

      <rect x="558" y="70" width="98" height="44" rx="5" fill="#EDE5D2" stroke="#9A7300"/>
      <text x="607" y="88" font-size="7" fill="#9A7300">включение</text>
      <text x="607" y="102" font-size="6.6" fill="#2A2620">и наблюдение</text>
    </g>

    <line x1="136" y1="124" x2="136" y2="160" stroke="#9B3A2E" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="140" y="146" font-family="Consolas,monospace" font-size="7.2" fill="#9B3A2E">точка отката: копия перед изменением</text>

    <line x1="500" y1="124" x2="500" y2="160" stroke="#9A7300" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="504" y="146" font-family="Consolas,monospace" font-size="7.2" fill="#9A7300">после 00:30 новое обновление не начинают</text>

    <rect x="24" y="176" width="306" height="48" rx="7" fill="#FFFDF6" stroke="#D8CBB0"/>
    <text x="36" y="194" font-family="Consolas,monospace" font-size="6.8" fill="#6B6459">ДО ОКНА</text>
    <text x="36" y="211" font-family="Consolas,monospace" font-size="7.2" fill="#2A2620">объявить за 3 дня, напомнить за час, проверить копию</text>

    <rect x="342" y="176" width="314" height="48" rx="7" fill="#FFFDF6" stroke="#D8CBB0"/>
    <text x="354" y="194" font-family="Consolas,monospace" font-size="6.8" fill="#6B6459">ПОСЛЕ ОКНА</text>
    <text x="354" y="211" font-family="Consolas,monospace" font-size="7.2" fill="#2A2620">включить обмен, проверить первые документы, отчёт</text>

    <rect x="24" y="238" width="632" height="34" rx="7" fill="#EDE5D2"/>
    <text x="340" y="259" text-anchor="middle" font-family="Consolas,monospace" font-size="7.4" fill="#9A7300">ОКНО СТРОЯТ ВОКРУГ БИЗНЕС-ЦИКЛА, А НЕ ВОКРУГ УДОБСТВА ИНЖЕНЕРА</text>
  </svg>
  <p class="note">Если обновление не уложилось до контрольного времени, его останавливают и откатывают, а не растягивают окно на рабочий день.</p>
</div>
</body>
</html>
