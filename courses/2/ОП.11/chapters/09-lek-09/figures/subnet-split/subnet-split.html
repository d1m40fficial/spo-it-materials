<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Деление сети на подсети</title>
<style>
  :root { --paper:#faf6f3; --ink:#2d3142; --muted:#5b5560; --accent:#D04A28; --soft:#F4E1D8; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .note { margin:10px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Подсети · маска переменной длины</p>
  <svg viewBox="0 0 680 300" role="img" aria-labelledby="sub-title sub-desc">
    <title id="sub-title">Сеть 192.168.1.0/24 делится на четыре подсети /26</title>
    <desc id="sub-desc">Каждая подсеть содержит 64 адреса, из них 62 для узлов. Адреса сетей: 0, 64, 128 и 192.</desc>

    <text x="20" y="26" font-family="Consolas,monospace" font-size="9" letter-spacing=".1em" fill="#5b5560">192.168.1.0/24 · 256 АДРЕСОВ</text>

    <g font-family="Consolas,monospace" text-anchor="middle">
      <rect x="30" y="44" width="148" height="52" fill="#F4E1D8" stroke="#D04A28"/><text x="104" y="66" font-size="10" font-weight="600" fill="#D04A28">.0/26</text><text x="104" y="84" font-size="8" fill="#5b5560">0-63</text>
      <rect x="180" y="44" width="148" height="52" fill="#ffffff" stroke="#2d3142"/><text x="254" y="66" font-size="10" font-weight="600" fill="#2d3142">.64/26</text><text x="254" y="84" font-size="8" fill="#5b5560">64-127</text>
      <rect x="330" y="44" width="148" height="52" fill="#F4E1D8" stroke="#D04A28"/><text x="404" y="66" font-size="10" font-weight="600" fill="#D04A28">.128/26</text><text x="404" y="84" font-size="8" fill="#5b5560">128-191</text>
      <rect x="480" y="44" width="148" height="52" fill="#ffffff" stroke="#2d3142"/><text x="554" y="66" font-size="10" font-weight="600" fill="#2d3142">.192/26</text><text x="554" y="84" font-size="8" fill="#5b5560">192-255</text>
    </g>

    <text x="30" y="126" font-family="Consolas,monospace" font-size="10" fill="#2d3142">маска /26: 255.255.255.192 · 64 адреса · 62 узла</text>

    <g font-family="Consolas,monospace" font-size="9">
      <rect x="30" y="144" width="300" height="44" rx="7" fill="#ffffff" stroke="#2d3142"/><text x="44" y="162" fill="#5b5560">сеть</text><text x="44" y="178" fill="#2d3142">192.168.1.0</text>
      <rect x="344" y="144" width="300" height="44" rx="7" fill="#ffffff" stroke="#2d3142"/><text x="358" y="162" fill="#5b5560">широковещательный</text><text x="358" y="178" fill="#2d3142">192.168.1.63</text>

      <rect x="30" y="198" width="300" height="44" rx="7" fill="#ffffff" stroke="#2d3142"/><text x="44" y="216" fill="#5b5560">первый узел</text><text x="44" y="232" fill="#2d3142">192.168.1.1</text>
      <rect x="344" y="198" width="300" height="44" rx="7" fill="#ffffff" stroke="#2d3142"/><text x="358" y="216" fill="#5b5560">последний узел</text><text x="358" y="232" fill="#2d3142">192.168.1.62</text>
    </g>

    <text x="340" y="274" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#5b5560">АДРЕС СЕТИ И ШИРОКОВЕЩАТЕЛЬНЫЙ НЕЛЬЗЯ НАЗНАЧАТЬ УЗЛАМ</text>
    <text x="340" y="290" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#D04A28">/25 ДАЁТ 2 ПОДСЕТИ, /26 ЧЕТЫРЕ, /27 ВОСЕМЬ</text>
  </svg>
  <p class="note">Каждый дополнительный бит маски удваивает число подсетей и уменьшает число узлов вдвое.</p>
</div>
</body>
</html>
