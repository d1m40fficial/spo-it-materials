<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Коммутатор учит MAC-таблицу</title>
<style>
  :root { --paper:#faf6f3; --card:#fffdfb; --ink:#1a1916; --muted:#6b6459; --rule:#e4d8cf; --accent:#D04A28; --soft:#F4E1D8; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .demo { background:var(--paper); border:1px solid var(--rule); border-radius:14px; padding:18px; }
  .head { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; padding-bottom:10px; border-bottom:1px solid var(--rule); }
  .eyebrow { margin:0 0 4px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  h3 { margin:0; font-size:20px; line-height:1.2; }
  .hint { font:11px/1.4 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
  table { width:100%; border-collapse:collapse; margin-top:10px; font:12px/1.4 Consolas,monospace; }
  th, td { padding:7px 9px; border-bottom:1px solid var(--rule); text-align:left; }
  th { font:600 8.5px/1.2 Consolas,monospace; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  tr.hit td { background:var(--soft); }
  .empty { color:var(--muted); font-size:12px; }
  .status { min-height:44px; margin-top:10px; padding:10px 12px; border-radius:9px; background:var(--soft); font-size:12.5px; line-height:1.45; }
  .status b { color:var(--accent); }
  .controls { display:flex; gap:7px; flex-wrap:wrap; margin-top:10px; }
  button { font:600 12px/1 "Segoe UI",system-ui,sans-serif; padding:8px 11px; border-radius:9px; border:1px solid var(--rule); background:var(--card); color:var(--ink); cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover { background:#a83a1f; color:#fff; }
  @media (max-width:560px) { .demo { padding:12px; } }
</style>
</head>
<body>
<div class="demo">
  <div class="head">
    <div><p class="eyebrow">Коммутатор · MAC-таблица</p><h3>Обучение и пересылка</h3></div>
    <div class="hint" id="count">записей: 0</div>
  </div>
  <svg viewBox="0 0 680 270" role="img" aria-label="Коммутатор и четыре компьютера">
    <g stroke="#b9ac9f" stroke-width="2">
      <line x1="120" y1="70" x2="300" y2="120"/>
      <line x1="560" y1="70" x2="380" y2="120"/>
      <line x1="120" y1="200" x2="300" y2="145"/>
      <line x1="560" y1="200" x2="380" y2="145"/>
    </g>
    <rect x="300" y="105" width="80" height="55" rx="8" fill="#F4E1D8" stroke="#D04A28"/>
    <text x="340" y="128" text-anchor="middle" font-family="Consolas,monospace" font-size="9" font-weight="600" fill="#D04A28">switch</text>
    <text x="340" y="144" text-anchor="middle" font-family="Consolas,monospace" font-size="7.5" fill="#5b5560">4 порта</text>

    <g font-family="Consolas,monospace" text-anchor="middle">
      <circle id="h-A" cx="100" cy="60" r="24" fill="#fff" stroke="#2d3142"/><text x="100" y="65" font-size="10" fill="#2d3142">A</text>
      <text x="100" y="98" font-size="8" fill="#5b5560">AA:01 · порт 1</text>
      <circle id="h-B" cx="580" cy="60" r="24" fill="#fff" stroke="#2d3142"/><text x="580" y="65" font-size="10" fill="#2d3142">B</text>
      <text x="580" y="98" font-size="8" fill="#5b5560">BB:02 · порт 2</text>
      <circle id="h-C" cx="100" cy="210" r="24" fill="#fff" stroke="#2d3142"/><text x="100" y="215" font-size="10" fill="#2d3142">C</text>
      <text x="100" y="248" font-size="8" fill="#5b5560">CC:03 · порт 3</text>
      <circle id="h-D" cx="580" cy="210" r="24" fill="#fff" stroke="#2d3142"/><text x="580" y="215" font-size="10" fill="#2d3142">D</text>
      <text x="580" y="248" font-size="8" fill="#5b5560">DD:04 · порт 4</text>
    </g>
  </svg>
  <table>
    <thead><tr><th>Порт</th><th>MAC</th><th>Устройство</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="status" id="status">Таблица пуста. Нажмите кнопку, чтобы отправить кадр.</div>
  <div class="controls">
    <button class="primary" data-src="A" data-dst="C">A → C</button>
    <button data-src="C" data-dst="A">C → A</button>
    <button data-src="D" data-dst="A">D → A</button>
    <button data-src="B" data-dst="D">B → D</button>
    <button id="reset">Сброс</button>
  </div>
</div>
<script>
(function () {
  var hosts = {
    A: { mac: 'AA:01', port: 1, host: 'A' },
    B: { mac: 'BB:02', port: 2, host: 'B' },
    C: { mac: 'CC:03', port: 3, host: 'C' },
    D: { mac: 'DD:04', port: 4, host: 'D' }
  };
  var table = {};
  var rows = document.getElementById('rows');
  var status = document.getElementById('status');
  var count = document.getElementById('count');

  function render() {
    rows.innerHTML = '';
    var keys = Object.keys(table);
    if (!keys.length) {
      var tr = document.createElement('tr');
      var td = document.createElement('td');
      td.colSpan = 3;
      td.className = 'empty';
      td.textContent = 'Записей пока нет.';
      tr.appendChild(td);
      rows.appendChild(tr);
    } else {
      keys.sort(function (a, b) { return table[a] - table[b]; }).forEach(function (mac) {
        var tr = document.createElement('tr');
        var p = document.createElement('td'); p.textContent = table[mac];
        var m = document.createElement('td'); m.textContent = mac;
        var h = document.createElement('td'); h.textContent = mac === 'AA:01' ? 'A' : mac === 'BB:02' ? 'B' : mac === 'CC:03' ? 'C' : 'D';
        tr.appendChild(p); tr.appendChild(m); tr.appendChild(h);
        rows.appendChild(tr);
      });
    }
    count.textContent = 'записей: ' + keys.length;
  }

  function highlight(host) {
    ['A', 'B', 'C', 'D'].forEach(function (name) {
      var el = document.getElementById('h-' + name);
      el.setAttribute('fill', name === host ? '#F4E1D8' : '#fff');
      el.setAttribute('stroke', name === host ? '#D04A28' : '#2d3142');
    });
  }

  function send(src, dst) {
    var s = hosts[src], d = hosts[dst];
    table[s.mac] = s.port;
    if (table[d.mac] === undefined) {
      highlight(dst);
      status.innerHTML = 'Кадр от <b>' + src + '</b> пришёл в порт ' + s.port + '. Коммутатор запомнил MAC <b>' + s.mac + '</b>, но MAC <b>' + d.mac + '</b> ещё не знает, поэтому рассылает кадр во все порты, кроме входящего.';
    } else {
      highlight(dst);
      status.innerHTML = 'Кадр от <b>' + src + '</b> пришёл в порт ' + s.port + '. MAC <b>' + d.mac + '</b> уже в таблице, кадр уходит только в порт <b>' + table[d.mac] + '</b>.';
    }
    render();
  }

  document.querySelectorAll('button[data-src]').forEach(function (b) {
    b.addEventListener('click', function () { send(b.dataset.src, b.dataset.dst); });
  });

  document.getElementById('reset').addEventListener('click', function () {
    table = {};
    highlight(null);
    status.textContent = 'Таблица пуста. Нажмите кнопку, чтобы отправить кадр.';
    render();
  });

  render();
})();
</script>
</body>
</html>
