<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSI и стек TCP/IP</title>
<style>
  :root { --paper:#faf6f3; --ink:#2d3142; --muted:#5b5560; --accent:#D04A28; --soft:#F4E1D8; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .note { margin:10px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Модели · сопоставление</p>
  <svg viewBox="0 0 680 360" role="img" aria-labelledby="map-title map-desc">
    <title id="map-title">Семь уровней OSI и четыре уровня TCP/IP</title>
    <desc id="map-desc">Прикладной, представления и сеансовый уровни OSI соответствуют прикладному уровню TCP/IP. Транспортный, сетевой и два нижних уровня образуют остальные три уровня стека.</desc>

    <text x="100" y="24" text-anchor="middle" font-family="Consolas,monospace" font-size="9" letter-spacing=".1em" fill="#5b5560">OSI</text>
    <text x="470" y="24" text-anchor="middle" font-family="Consolas,monospace" font-size="9" letter-spacing=".1em" fill="#D04A28">TCP/IP</text>

    <g font-family="Consolas,monospace" font-size="10">
      <rect x="20" y="36" width="200" height="40" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="34" y="61" fill="#2d3142">7 прикладной</text>
      <rect x="20" y="78" width="200" height="40" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="34" y="103" fill="#2d3142">6 представления</text>
      <rect x="20" y="120" width="200" height="40" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="34" y="145" fill="#2d3142">5 сеансовый</text>
      <rect x="20" y="162" width="200" height="40" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="34" y="187" fill="#2d3142">4 транспортный</text>
      <rect x="20" y="204" width="200" height="40" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="34" y="229" fill="#2d3142">3 сетевой</text>
      <rect x="20" y="246" width="200" height="40" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="34" y="271" fill="#2d3142">2 канальный</text>
      <rect x="20" y="288" width="200" height="40" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="34" y="313" fill="#2d3142">1 физический</text>
    </g>

    <g stroke="#D04A28" stroke-width="1.3">
      <line x1="220" y1="56" x2="380" y2="56"/>
      <line x1="220" y1="98" x2="380" y2="98"/>
      <line x1="220" y1="140" x2="380" y2="140"/>
      <line x1="220" y1="182" x2="380" y2="182"/>
      <line x1="220" y1="224" x2="380" y2="224"/>
      <line x1="220" y1="266" x2="380" y2="266"/>
      <line x1="220" y1="308" x2="380" y2="308"/>
    </g>

    <g font-family="Consolas,monospace">
      <rect x="380" y="36" width="280" height="118" rx="8" fill="#F4E1D8" stroke="#D04A28"/>
      <text x="398" y="76" font-size="11" font-weight="600" fill="#D04A28">прикладной</text>
      <text x="398" y="96" font-size="9.5" fill="#5b5560">HTTP, DNS, SMTP, FTP</text>

      <rect x="380" y="158" width="280" height="40" rx="8" fill="#ffffff" stroke="#D04A28"/>
      <text x="398" y="183" font-size="11" font-weight="600" fill="#D04A28">транспортный</text>
      <text x="520" y="183" font-size="9.5" fill="#5b5560">TCP, UDP</text>

      <rect x="380" y="202" width="280" height="40" rx="8" fill="#ffffff" stroke="#D04A28"/>
      <text x="398" y="227" font-size="11" font-weight="600" fill="#D04A28">межсетевой</text>
      <text x="520" y="227" font-size="9.5" fill="#5b5560">IP, ICMP</text>

      <rect x="380" y="246" width="280" height="82" rx="8" fill="#ffffff" stroke="#D04A28"/>
      <text x="398" y="275" font-size="11" font-weight="600" fill="#D04A28">доступ к сети</text>
      <text x="398" y="295" font-size="9.5" fill="#5b5560">Ethernet, Wi-Fi</text>
      <text x="398" y="312" font-size="9.5" fill="#5b5560">кабель, оптика, радио</text>
    </g>

    <text x="340" y="350" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#5b5560">В ПРАКТИКЕ ИСПОЛЬЗУЮТ СТЕК TCP/IP, OSI ОСТАЁТСЯ СХЕМОЙ ОБЪЯСНЕНИЯ</text>
  </svg>
  <p class="note">Верхние три уровня OSI в стеке TCP/IP объединены в один прикладной уровень.</p>
</div>
</body>
</html>
