<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Порты, сокеты и пара соединений</title>
<style>
  :root { --paper:#faf6f3; --ink:#2d3142; --muted:#5b5560; --accent:#D04A28; --soft:#F4E1D8; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .note { margin:10px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Транспорт · сокеты</p>
  <svg viewBox="0 0 680 330" role="img" aria-labelledby="sock-title sock-desc">
    <title id="sock-title">Сокет и пара соединений</title>
    <desc id="sock-desc">Сервер слушает порт 443. Клиент использует порт 51000. Соединение определяется четырьмя значениями: адрес и порт клиента, адрес и порт сервера.</desc>

    <rect x="20" y="40" width="190" height="90" rx="8" fill="#ffffff" stroke="#2d3142"/>
    <text x="115" y="62" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#5b5560">КЛИЕНТ</text>
    <text x="115" y="86" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#2d3142">192.168.1.10</text>
    <text x="115" y="108" text-anchor="middle" font-family="Consolas,monospace" font-size="10" font-weight="600" fill="#D04A28">порт 51000</text>

    <rect x="20" y="160" width="190" height="78" rx="8" fill="#ffffff" stroke="#2d3142"/>
    <text x="115" y="182" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#5b5560">ВТОРОЙ КЛИЕНТ</text>
    <text x="115" y="206" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#2d3142">192.168.1.11</text>
    <text x="115" y="228" text-anchor="middle" font-family="Consolas,monospace" font-size="10" font-weight="600" fill="#D04A28">порт 51000</text>

    <rect x="470" y="86" width="190" height="120" rx="8" fill="#F4E1D8" stroke="#D04A28"/>
    <text x="565" y="108" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#5b5560">СЕРВЕР</text>
    <text x="565" y="132" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#2d3142">93.184.216.34</text>
    <text x="565" y="154" text-anchor="middle" font-family="Consolas,monospace" font-size="10" font-weight="600" fill="#D04A28">слушает 443</text>
    <text x="565" y="176" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#5b5560">0.0.0.0:443</text>

    <line x1="210" y1="85" x2="460" y2="125" stroke="#D04A28" stroke-width="1.5"/>
    <line x1="210" y1="205" x2="460" y2="165" stroke="#2d3142" stroke-width="1.5"/>

    <text x="335" y="52" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#D04A28">192.168.1.10:51000 → 93.184.216.34:443</text>
    <text x="335" y="298" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#5b5560">192.168.1.11:51000 → 93.184.216.34:443</text>

    <text x="340" y="258" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#2d3142">пара сокетов: адрес клиента, порт клиента, адрес сервера, порт сервера</text>
    <text x="340" y="276" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#5b5560">один и тот же порт клиента у разных адресов не мешает соединениям</text>

    <text x="340" y="320" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#D04A28">СЕРВЕР РАЗЛИЧАЕТ КЛИЕНТОВ ПО ПАРЕ АДРЕС И ПОРТ</text>
  </svg>
  <p class="note">Порт указывает приложение, а сокет связывает адрес, порт и протокол.</p>
</div>
</body>
</html>
