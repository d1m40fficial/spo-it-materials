<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Домен, контроллер и групповые политики</title>
<style>
  :root { --paper:#faf6f3; --ink:#2d3142; --muted:#5b5560; --accent:#D04A28; --soft:#F4E1D8; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .note { margin:10px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Сетевые ОС · домен</p>
  <svg viewBox="0 0 680 312" role="img" aria-labelledby="dom-title dom-desc">
    <title id="dom-title">Домен с контроллером, подразделениями и политиками</title>
    <desc id="dom-desc">Контроллер домена хранит каталог пользователей и компьютеров. Подразделения группируют учётные записи, групповые политики задают настройки.</desc>

    <rect x="240" y="20" width="200" height="56" rx="8" fill="#F4E1D8" stroke="#D04A28"/>
    <text x="340" y="42" text-anchor="middle" font-family="Consolas,monospace" font-size="10" font-weight="600" fill="#D04A28">контроллер домена</text>
    <text x="340" y="60" text-anchor="middle" font-family="Consolas,monospace" font-size="8" fill="#5b5560">каталог и проверка входа</text>

    <line x1="340" y1="76" x2="340" y2="96" stroke="#5b5560" stroke-width="1.4"/>
    <line x1="150" y1="96" x2="530" y2="96" stroke="#5b5560" stroke-width="1.4"/>
    <line x1="150" y1="96" x2="150" y2="116" stroke="#5b5560" stroke-width="1.4"/>
    <line x1="340" y1="96" x2="340" y2="116" stroke="#5b5560" stroke-width="1.4"/>
    <line x1="530" y1="96" x2="530" y2="116" stroke="#5b5560" stroke-width="1.4"/>

    <rect x="60" y="116" width="180" height="46" rx="7" fill="#ffffff" stroke="#2d3142"/>
    <text x="150" y="136" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#2d3142">OU Пользователи</text>
    <text x="150" y="152" text-anchor="middle" font-family="Consolas,monospace" font-size="8" fill="#5b5560">учётные записи</text>

    <rect x="250" y="116" width="180" height="46" rx="7" fill="#ffffff" stroke="#2d3142"/>
    <text x="340" y="136" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#2d3142">OU Компьютеры</text>
    <text x="340" y="152" text-anchor="middle" font-family="Consolas,monospace" font-size="8" fill="#5b5560">рабочие станции</text>

    <rect x="440" y="116" width="180" height="46" rx="7" fill="#ffffff" stroke="#D04A28"/>
    <text x="530" y="136" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#D04A28">GPO</text>
    <text x="530" y="152" text-anchor="middle" font-family="Consolas,monospace" font-size="8" fill="#5b5560">пароли, обои, ПО</text>

    <g font-family="Consolas,monospace" font-size="8.5" text-anchor="middle">
      <rect x="80" y="196" width="120" height="34" rx="6" fill="#fff" stroke="#2d3142"/><text x="140" y="217" fill="#2d3142">пользователь</text>
      <rect x="80" y="240" width="120" height="34" rx="6" fill="#fff" stroke="#2d3142"/><text x="140" y="261" fill="#2d3142">группа</text>
      <rect x="280" y="196" width="120" height="34" rx="6" fill="#fff" stroke="#2d3142"/><text x="340" y="217" fill="#2d3142">ПК 1</text>
      <rect x="280" y="240" width="120" height="34" rx="6" fill="#fff" stroke="#2d3142"/><text x="340" y="261" fill="#2d3142">ПК 2</text>
      <rect x="460" y="196" width="140" height="34" rx="6" fill="#fff" stroke="#2d3142"/><text x="530" y="217" fill="#2d3142">единый вход</text>
      <rect x="460" y="240" width="140" height="34" rx="6" fill="#fff" stroke="#2d3142"/><text x="530" y="261" fill="#2d3142">общие папки</text>
    </g>

    <line x1="150" y1="162" x2="140" y2="194" stroke="#5b5560"/>
    <line x1="340" y1="162" x2="340" y2="194" stroke="#5b5560"/>
    <line x1="520" y1="162" x2="530" y2="194" stroke="#D04A28"/>

    <text x="340" y="298" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#D04A28">ПОЛИТИКА ПРИМЕНЯЕТСЯ К ПОДРАЗДЕЛЕНИЮ, А НЕ К КАЖДОМУ ВРУЧНУЮ</text>
  </svg>
  <p class="note">Домен объединяет компьютеры общим каталогом пользователей и правилами.</p>
</div>
</body>
</html>
