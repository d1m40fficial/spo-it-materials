<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заголовок UDP</title>
<style>
  :root { --paper:#faf6f3; --ink:#2d3142; --muted:#5b5560; --accent:#D04A28; --soft:#F4E1D8; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .note { margin:10px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Транспорт · UDP</p>
  <svg viewBox="0 0 680 260" role="img" aria-labelledby="udp-title udp-desc">
    <title id="udp-title">Заголовок UDP из восьми байт</title>
    <desc id="udp-desc">Заголовок UDP содержит порт отправителя, порт получателя, длину и контрольную сумму. Нет номера последовательности и подтверждений.</desc>

    <text x="20" y="26" font-family="Consolas,monospace" font-size="9" letter-spacing=".1em" fill="#5b5560">8 БАЙТ · 4 ПОЛЯ ПО 16 БИТ</text>

    <g font-family="Consolas,monospace" text-anchor="middle">
      <rect x="20" y="44" width="155" height="56" rx="6" fill="#F4E1D8" stroke="#D04A28"/><text x="97" y="64" font-size="9" fill="#D04A28">порт отправителя</text><text x="97" y="84" font-size="11" font-weight="600" fill="#2d3142">51000</text>
      <rect x="180" y="44" width="155" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="257" y="64" font-size="9" fill="#5b5560">порт получателя</text><text x="257" y="84" font-size="11" font-weight="600" fill="#2d3142">53</text>
      <rect x="340" y="44" width="155" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="417" y="64" font-size="9" fill="#5b5560">длина</text><text x="417" y="84" font-size="11" font-weight="600" fill="#2d3142">29</text>
      <rect x="500" y="44" width="155" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="577" y="64" font-size="9" fill="#5b5560">контрольная сумма</text><text x="577" y="84" font-size="11" font-weight="600" fill="#2d3142">0x1a2b</text>
    </g>

    <rect x="20" y="112" width="635" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-dasharray="4 3"/>
    <text x="337" y="134" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#5b5560">данные приложения: запрос DNS</text>
    <text x="337" y="152" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#2d3142">example.ru A?</text>

    <text x="20" y="192" font-family="Consolas,monospace" font-size="9.5" fill="#2d3142">нет seq и ack: порядок и доставку приложение не проверяет</text>
    <text x="20" y="212" font-family="Consolas,monospace" font-size="9.5" fill="#2d3142">заголовок короткий, поэтому UDP быстрее и дешевле</text>
    <text x="20" y="238" font-family="Consolas,monospace" font-size="9" fill="#D04A28">ДЛИНА 29 = 8 БАЙТ ЗАГОЛОВКА + 21 БАЙТ ДАННЫХ</text>
  </svg>
  <p class="note">UDP подходит, когда важнее задержка, а потерю можно пережить или повторить на уровне приложения.</p>
</div>
</body>
</html>
