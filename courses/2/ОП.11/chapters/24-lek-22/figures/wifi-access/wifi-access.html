<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wi-Fi: общая среда и каналы</title>
<style>
  :root { --paper:#faf6f3; --ink:#2d3142; --muted:#5b5560; --accent:#D04A28; --soft:#F4E1D8; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .note { margin:10px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Беспроводная сеть · общая среда</p>
  <svg viewBox="0 0 680 310" role="img" aria-labelledby="wifi-title wifi-desc">
    <title id="wifi-title">Точка доступа, клиенты и каналы Wi-Fi</title>
    <desc id="wifi-desc">Три клиента делят радиосреду через точку доступа. Каналы 1, 6 и 11 не перекрываются в диапазоне 2,4 ГГц.</desc>

    <rect x="30" y="70" width="120" height="70" rx="8" fill="#F4E1D8" stroke="#D04A28"/>
    <text x="90" y="98" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#D04A28">точка доступа</text>
    <text x="90" y="114" text-anchor="middle" font-family="Consolas,monospace" font-size="8" fill="#5b5560">WPA3 · SSID</text>
    <text x="90" y="130" text-anchor="middle" font-family="Consolas,monospace" font-size="8" fill="#5b5560">канал 6</text>

    <g stroke="#b9ac9f" stroke-width="1.4">
      <line x1="150" y1="90" x2="230" y2="50"/>
      <line x1="150" y1="105" x2="230" y2="105"/>
      <line x1="150" y1="120" x2="230" y2="160"/>
    </g>
    <g font-family="Consolas,monospace" font-size="8" text-anchor="middle">
      <rect x="230" y="32" width="90" height="36" rx="6" fill="#fff" stroke="#2d3142"/><text x="275" y="54" fill="#2d3142">ноутбук</text>
      <rect x="230" y="87" width="90" height="36" rx="6" fill="#fff" stroke="#2d3142"/><text x="275" y="109" fill="#2d3142">телефон</text>
      <rect x="230" y="142" width="90" height="36" rx="6" fill="#fff" stroke="#2d3142"/><text x="275" y="164" fill="#2d3142">планшет</text>
    </g>

    <text x="90" y="210" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#5b5560">клиенты передают по очереди</text>
    <text x="90" y="226" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#D04A28">CSMA/CA: сначала слушают</text>

    <rect x="360" y="36" width="300" height="220" rx="10" fill="#ffffff" stroke="#2d3142"/>
    <text x="376" y="58" font-family="Consolas,monospace" font-size="9" letter-spacing=".1em" fill="#5b5560">КАНАЛЫ 2,4 ГГЦ</text>

    <g font-family="Consolas,monospace" font-size="8">
      <rect x="386" y="88" width="42" height="18" rx="3" fill="#F4E1D8" stroke="#D04A28"/><text x="407" y="101" text-anchor="middle" fill="#D04A28">1</text>
      <rect x="490" y="88" width="42" height="18" rx="3" fill="#F4E1D8" stroke="#D04A28"/><text x="511" y="101" text-anchor="middle" fill="#D04A28">6</text>
      <rect x="594" y="88" width="42" height="18" rx="3" fill="#F4E1D8" stroke="#D04A28"/><text x="615" y="101" text-anchor="middle" fill="#D04A28">11</text>
      <text x="407" y="124" text-anchor="middle" fill="#5b5560">2,412</text>
      <text x="511" y="124" text-anchor="middle" fill="#5b5560">2,437</text>
      <text x="615" y="124" text-anchor="middle" fill="#5b5560">2,462</text>
    </g>

    <text x="376" y="154" font-family="Consolas,monospace" font-size="9" fill="#2d3142">1, 6 и 11 не перекрываются</text>
    <text x="376" y="174" font-family="Consolas,monospace" font-size="9" fill="#5b5560">соседние точки ставят на разные каналы</text>
    <text x="376" y="194" font-family="Consolas,monospace" font-size="9" fill="#2d3142">5 ГГц: больше каналов, меньше помех</text>
    <text x="376" y="214" font-family="Consolas,monospace" font-size="9" fill="#D04A28">шифрование WPA2 или WPA3</text>
    <text x="376" y="234" font-family="Consolas,monospace" font-size="9" fill="#5b5560">открытая сеть не защищает трафик</text>

    <text x="340" y="288" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#5b5560">СКОРОСТЬ ДЕЛИТСЯ МЕЖДУ КЛИЕНТАМИ, А НЕ УМНОЖАЕТСЯ</text>
  </svg>
  <p class="note">Радиоканал общий: чем больше активных клиентов, тем меньше достаётся каждому.</p>
</div>
</body>
</html>
