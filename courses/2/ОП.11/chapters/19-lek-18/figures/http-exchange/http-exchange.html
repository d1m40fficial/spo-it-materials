<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTTP: запрос и ответ</title>
<style>
  :root { --paper:#faf6f3; --ink:#2d3142; --muted:#5b5560; --accent:#D04A28; --soft:#F4E1D8; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .note { margin:10px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">HTTP · обмен</p>
  <svg viewBox="0 0 680 330" role="img" aria-labelledby="http-title http-desc">
    <title id="http-title">HTTP-запрос и ответ</title>
    <desc id="http-desc">Клиент отправляет строку запроса, заголовки и пустую строку. Сервер отвечает статусом, заголовками и телом страницы.</desc>

    <rect x="20" y="36" width="310" height="170" rx="9" fill="#ffffff" stroke="#2d3142"/>
    <text x="34" y="58" font-family="Consolas,monospace" font-size="9" letter-spacing=".1em" fill="#D04A28">ЗАПРОС</text>
    <g font-family="Consolas,monospace" font-size="9.5">
      <text x="34" y="82" fill="#2d3142">GET /index.html HTTP/1.1</text>
      <text x="34" y="102" fill="#5b5560">Host: example.ru</text>
      <text x="34" y="122" fill="#5b5560">User-Agent: Mozilla/5.0</text>
      <text x="34" y="142" fill="#5b5560">Accept: text/html</text>
      <text x="34" y="162" fill="#5b5560">Connection: keep-alive</text>
      <text x="34" y="186" fill="#D04A28">пустая строка завершает заголовки</text>
    </g>

    <line x1="330" y1="90" x2="360" y2="90" stroke="#D04A28" stroke-width="1.6" marker-end="url(#arw-http)"/>
    <line x1="360" y1="150" x2="330" y2="150" stroke="#2d3142" stroke-width="1.6" marker-end="url(#arw-http2)"/>

    <rect x="360" y="36" width="300" height="170" rx="9" fill="#F4E1D8" stroke="#D04A28"/>
    <text x="374" y="58" font-family="Consolas,monospace" font-size="9" letter-spacing=".1em" fill="#D04A28">ОТВЕТ</text>
    <g font-family="Consolas,monospace" font-size="9.5">
      <text x="374" y="82" fill="#2d3142">HTTP/1.1 200 OK</text>
      <text x="374" y="102" fill="#5b5560">Content-Type: text/html</text>
      <text x="374" y="122" fill="#5b5560">Content-Length: 1256</text>
      <text x="374" y="142" fill="#5b5560">Cache-Control: max-age=300</text>
      <text x="374" y="164" fill="#5b5560">пустая строка</text>
      <text x="374" y="186" fill="#2d3142">тело: HTML-страница</text>
    </g>

    <rect x="20" y="230" width="640" height="70" rx="9" fill="#ffffff" stroke="#2d3142"/>
    <text x="36" y="250" font-family="Consolas,monospace" font-size="9" letter-spacing=".1em" fill="#5b5560">HTTPS</text>
    <text x="36" y="272" font-family="Consolas,monospace" font-size="9.5" fill="#2d3142">тот же HTTP, но внутри TLS: шифрование, целостность, сертификат сервера</text>
    <text x="36" y="290" font-family="Consolas,monospace" font-size="9.5" fill="#D04A28">порт 443 вместо 80, адрес и путь запроса видны только участникам</text>

    <text x="340" y="322" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#5b5560">HTTP НЕ ХРАНИТ СОСТОЯНИЕ: КАЖДЫЙ ЗАПРОС САМОСТОЯТЕЛЕН</text>

    <defs>
      <marker id="arw-http" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#D04A28"/></marker>
      <marker id="arw-http2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2d3142"/></marker>
    </defs>
  </svg>
  <p class="note">Коды состояния: 200 успех, 301 перенаправление, 404 не найдено, 500 ошибка сервера.</p>
</div>
</body>
</html>
