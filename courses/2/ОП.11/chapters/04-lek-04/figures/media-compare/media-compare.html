<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Среды передачи данных</title>
<style>
  :root { --paper:#faf6f3; --ink:#2d3142; --muted:#5b5560; --accent:#D04A28; --soft:#F4E1D8; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .note { margin:10px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Физический уровень · среды</p>
  <svg viewBox="0 0 680 320" role="img" aria-labelledby="med-title med-desc">
    <title id="med-title">Медь, оптика и радиоканал</title>
    <desc id="med-desc">Витая пара передаёт до 10 Гбит/с на 100 метров, оптика до 100 Гбит/с на километры, радиоканал делит общую среду и зависит от помех.</desc>

    <rect x="20" y="36" width="200" height="230" rx="10" fill="#ffffff" stroke="#2d3142"/>
    <text x="120" y="62" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#2d3142">Витая пара</text>
    <g stroke="#D04A28" stroke-width="2" fill="none">
      <path d="M70 92 C 85 82, 100 102, 115 92 S 145 82, 160 92"/>
      <path d="M70 104 C 85 94, 100 114, 115 104 S 145 94, 160 104"/>
    </g>
    <text x="36" y="140" font-family="Consolas,monospace" font-size="9" fill="#5b5560">скорость: до 10 Гбит/с</text>
    <text x="36" y="160" font-family="Consolas,monospace" font-size="9" fill="#5b5560">дальность: до 100 м</text>
    <text x="36" y="180" font-family="Consolas,monospace" font-size="9" fill="#5b5560">помехи: чувствительна</text>
    <text x="36" y="206" font-family="Consolas,monospace" font-size="9" fill="#2d3142">офис, квартира, стойка</text>
    <text x="36" y="228" font-family="Consolas,monospace" font-size="9" fill="#D04A28">вилка RJ-45</text>

    <rect x="240" y="36" width="200" height="230" rx="10" fill="#ffffff" stroke="#2d3142"/>
    <text x="340" y="62" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#2d3142">Оптика</text>
    <path d="M280 104 C 320 80, 360 120, 400 96" fill="none" stroke="#D04A28" stroke-width="2.5"/>
    <text x="256" y="140" font-family="Consolas,monospace" font-size="9" fill="#5b5560">скорость: до 100 Гбит/с</text>
    <text x="256" y="160" font-family="Consolas,monospace" font-size="9" fill="#5b5560">дальность: километры</text>
    <text x="256" y="180" font-family="Consolas,monospace" font-size="9" fill="#5b5560">помехи: почти нет</text>
    <text x="256" y="206" font-family="Consolas,monospace" font-size="9" fill="#2d3142">магистрали, между зданиями</text>
    <text x="256" y="228" font-family="Consolas,monospace" font-size="9" fill="#D04A28">разъёмы LC, SC</text>

    <rect x="460" y="36" width="200" height="230" rx="10" fill="#ffffff" stroke="#2d3142"/>
    <text x="560" y="62" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#2d3142">Радиоканал</text>
    <g fill="none" stroke="#D04A28" stroke-width="1.6">
      <circle cx="560" cy="110" r="8"/>
      <path d="M574 98 a 18 18 0 0 1 0 24"/>
      <path d="M582 90 a 28 28 0 0 1 0 40"/>
      <path d="M546 98 a 18 18 0 0 0 0 24"/>
    </g>
    <text x="476" y="150" font-family="Consolas,monospace" font-size="9" fill="#5b5560">скорость: зависит от Wi-Fi</text>
    <text x="476" y="170" font-family="Consolas,monospace" font-size="9" fill="#5b5560">дальность: десятки метров</text>
    <text x="476" y="190" font-family="Consolas,monospace" font-size="9" fill="#5b5560">помехи: стены, соседи</text>
    <text x="476" y="216" font-family="Consolas,monospace" font-size="9" fill="#2d3142">общая среда, доступ по очереди</text>
    <text x="476" y="238" font-family="Consolas,monospace" font-size="9" fill="#D04A28">антенны, каналы</text>

    <text x="340" y="296" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#5b5560">СРЕДА ЗАДАЁТ СКОРОСТЬ, ДАЛЬНОСТЬ И ЦЕНУ ОШИБКИ</text>
  </svg>
  <p class="note">Оптика не ловит электромагнитные помехи, но боится изгибов. Радиоканал делит среду между всеми клиентами.</p>
</div>
</body>
</html>
