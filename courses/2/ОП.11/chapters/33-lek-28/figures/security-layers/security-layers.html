<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Слои защиты сети</title>
<style>
  :root { --paper:#faf6f3; --card:#fffdfb; --ink:#1a1916; --muted:#6b6459; --rule:#e4d8cf; --accent:#D04A28; --soft:#F4E1D8; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .demo { background:var(--paper); border:1px solid var(--rule); border-radius:14px; padding:18px; }
  .head { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; padding-bottom:10px; border-bottom:1px solid var(--rule); }
  .eyebrow { margin:0 0 4px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  h3 { margin:0; font-size:20px; line-height:1.2; }
  .counter { font:11px/1.4 Consolas,monospace; color:var(--muted); white-space:nowrap; }
  svg { display:block; width:100%; height:auto; margin-top:6px; }
  .bar rect { fill:#fff; stroke:#2d3142; stroke-width:1.3; transition:fill .2s, stroke .2s; }
  .bar text { font-family:Consolas,monospace; font-size:9px; fill:#2d3142; }
  .bar.on rect { fill:var(--soft); stroke:var(--accent); stroke-width:2; }
  .bar.on text { fill:var(--accent); }
  .threat rect { fill:#fff; stroke:#2d3142; stroke-width:1.3; }
  .threat text { font-family:Consolas,monospace; font-size:9px; fill:#2d3142; text-anchor:middle; }
  .threat .cap { font-size:7.5px; fill:#6b6459; letter-spacing:.1em; }
  .arrow { fill:none; stroke:var(--accent); stroke-width:1.8; }
  .status { min-height:48px; margin-top:8px; padding:10px 12px; border-radius:9px; background:var(--soft); font-size:12.5px; line-height:1.45; }
  .status b { color:var(--accent); }
  .controls { display:flex; gap:7px; flex-wrap:wrap; margin-top:10px; }
  button { font:600 12px/1 "Segoe UI",system-ui,sans-serif; padding:8px 11px; border-radius:9px; border:1px solid var(--rule); background:var(--card); color:var(--ink); cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  @media (max-width:560px) { .demo { padding:12px; } }
</style>
</head>
<body>
<div class="demo">
  <div class="head">
    <div><p class="eyebrow">Безопасность · слои</p><h3>Где останавливается угроза</h3></div>
    <div class="counter">от внешнего слоя к внутреннему</div>
  </div>
  <svg viewBox="0 0 680 250" role="img" aria-label="Слои защиты сети и путь угрозы">
    <g class="threat" id="threat">
      <rect x="22" y="96" width="146" height="46" rx="8"/>
      <text x="95" y="116" class="cap">УГРОЗА</text>
      <text x="95" y="132" id="threat-name">перехват</text>
    </g>
    <polyline id="arrow" class="arrow" points="168,119 206,119 206,119 244,119"/>
    <g class="bar" data-layer="1"><rect x="250" y="24" width="410" height="30" rx="6"/><text x="264" y="43">сегментация · VLAN, отдельные сети</text></g>
    <g class="bar" data-layer="2"><rect x="250" y="66" width="410" height="30" rx="6"/><text x="264" y="85">фильтрация · правила межсетевого экрана</text></g>
    <g class="bar" data-layer="3"><rect x="250" y="108" width="410" height="30" rx="6"/><text x="264" y="127">шифрование · TLS, VPN, WPA3</text></g>
    <g class="bar" data-layer="4"><rect x="250" y="150" width="410" height="30" rx="6"/><text x="264" y="169">аутентификация · пароли, MFA, права</text></g>
    <g class="bar" data-layer="5"><rect x="250" y="192" width="410" height="30" rx="6"/><text x="264" y="211">журналы и резерв · события, копии</text></g>
    <defs>
      <marker id="arw-sec" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#D04A28"/></marker>
    </defs>
  </svg>
  <div class="status" id="status"></div>
  <div class="controls">
    <button data-k="sniff" class="on">Перехват</button>
    <button data-k="spoof">Подмена</button>
    <button data-k="worm">Червь</button>
    <button data-k="ddos">Отказ в обслуживании</button>
    <button data-k="brute">Подбор пароля</button>
  </div>
</div>
<script>
(function () {
  var cases = {
    sniff: {
      name: 'перехват', stop: 3, layers: [3],
      text: '<b>Перехват.</b> Шифрование делает записанный трафик бесполезным. Без TLS логин и пароль уходят открытым текстом, и первый слой их не спасает.'
    },
    spoof: {
      name: 'подмена', stop: 4, layers: [2, 4],
      text: '<b>Подмена.</b> Фильтрация отсекает чужие адреса, а аутентификация проверяет сторону: сертификат, ключ или пароль. Без проверки подменённый узел получает доверие.'
    },
    worm: {
      name: 'червь', stop: 1, layers: [1],
      text: '<b>Червь.</b> Сегментация не даёт заражению пройти дальше своего сегмента. В плоской сети один узел заражает все.'
    },
    ddos: {
      name: 'отказ в обслуживании', stop: 5, layers: [2, 5],
      text: '<b>Отказ в обслуживании.</b> Фильтрация и ограничение скорости снижают поток, резерв и второй канал дают работать дальше. Полностью убрать чужой поток нельзя.'
    },
    brute: {
      name: 'подбор пароля', stop: 4, layers: [4, 5],
      text: '<b>Подбор пароля.</b> Блокировка после нескольких попыток, MFA и длинный пароль останавливают подбор. Журнал показывает, откуда шли попытки.'
    }
  };
  var bars = document.querySelectorAll('.bar');
  var arrow = document.getElementById('arrow');
  var status = document.getElementById('status');
  var name = document.getElementById('threat-name');
  var buttons = document.querySelectorAll('button[data-k]');

  function apply(key) {
    var c = cases[key];
    bars.forEach(function (b) {
      var n = Number(b.dataset.layer);
      b.classList.toggle('on', c.layers.indexOf(n) !== -1);
    });
    var y = 39 + (c.stop - 1) * 42;
    arrow.setAttribute('points', '168,119 206,119 206,' + y + ' 244,' + y);
    arrow.setAttribute('marker-end', 'url(#arw-sec)');
    name.textContent = c.name;
    status.innerHTML = c.text;
    buttons.forEach(function (b) { b.classList.toggle('on', b.dataset.k === key); });
  }

  buttons.forEach(function (b) {
    b.addEventListener('click', function () { apply(b.dataset.k); });
  });

  apply('sniff');
})();
</script>
</body>
</html>
