<template id="world-tpl">
  <div data-composition-id="world-comp" data-width="1920" data-height="1080" data-duration="72.00">
    <div class="st-stage paper">
      <canvas id="backdrop" class="st-backdrop" data-layout-allow-overflow></canvas>

      <div id="cam-shake" class="st-cam-shake"><div id="cam-pivot" class="st-cam-pivot"><div id="cam" class="st-cam">

        <!-- conveyor line -->
        <div class="line" id="line" style="left:-1010px;top:118px;width:2020px"></div>
        <svg class="line-svg" width="2100" height="60" viewBox="-1050 -30 2100 60" style="left:-1050px;top:88px" data-layout-allow-overflow>
          <path id="trace" d="M -880 0 H 880" fill="none" stroke="#1D9E75" stroke-width="4" stroke-dasharray="14 12" opacity="0"/>
        </svg>

        <!-- s01: laptop -->
        <div id="laptop" class="laptop" style="left:-1090px;top:-210px">
          <div class="lap-lid">
            <div class="lap-screen">
              <div class="lap-bar" data-layout-ignore><i></i><i></i><i></i><span>requests.py</span></div>
              <div class="lap-code" data-layout-ignore>
                <div><b>def</b> create_request(user, text):</div>
                <div>&nbsp;&nbsp;db.insert(user, text)</div>
                <div>&nbsp;&nbsp;<b>return</b> <em>"ok"</em></div>
                <div class="dim"># пароль: admin123</div>
              </div>
              <div class="lap-ok" id="lap-ok">работает</div>
            </div>
          </div>
          <div class="lap-base"></div>
        </div>

        <div class="chip bad" id="fail1" style="left:-1360px;top:-300px">пароль в коде</div>
        <div class="chip bad" id="fail2" style="left:-1060px;top:-360px">установка в переписке</div>
        <div class="chip bad" id="fail3" style="left:-560px;top:-290px">пустой список</div>
        <div class="stamp" id="crash" style="left:-1035px;top:-150px">ПАДЕНИЕ</div>
        <div class="cal" id="cal" style="left:-700px;top:-280px"><b>30</b><span>дней</span></div>

        <div class="bg-word" data-layout-ignore id="bg2" style="left:520px;top:-330px">процесс</div>
        <div class="bg-word" data-layout-ignore id="bg3" style="left:1500px;top:-350px">цена ошибки</div>

        <!-- s02: process stations -->
        <div class="station" id="st1" style="left:-900px;top:40px"><span>1</span></div>
        <div class="station" id="st2" style="left:-450px;top:40px"><span>2</span></div>
        <div class="station" id="st3" style="left:0px;top:40px"><span>3</span></div>
        <div class="station" id="st4" style="left:450px;top:40px"><span>4</span></div>
        <div class="station" id="st5" style="left:900px;top:40px"><span>5</span></div>

        <div class="st-label" id="lb1" style="left:-900px;top:150px">Требования</div>
        <div class="st-label" id="lb2" style="left:-450px;top:150px">Проект</div>
        <div class="st-label" id="lb3" style="left:0px;top:150px">Код</div>
        <div class="st-label" id="lb4" style="left:450px;top:150px">Проверка</div>
        <div class="st-label" id="lb5" style="left:900px;top:150px">Выпуск</div>

        <div class="artifact" id="a1" style="left:-900px;top:-220px">список требований</div>
        <div class="artifact" id="a2" style="left:-450px;top:-220px">схема данных</div>
        <div class="artifact" id="a3" style="left:0px;top:-220px">код и тесты</div>
        <div class="artifact" id="a4" style="left:450px;top:-220px">отчёт о тестах</div>
        <div class="artifact" id="a5" style="left:900px;top:-220px">инструкция</div>

        <div class="product" id="product" style="left:0px;top:-380px">
          <div class="product-head">продукт</div>
          <div class="product-line"></div>
          <div class="product-line short"></div>
          <div class="product-tag">работает у других</div>
        </div>

        <!-- s03: defect and cost -->
        <div class="defect" id="defect" style="left:-900px;top:-120px">!</div>
        <div class="cost" id="cost1" style="left:-900px;top:-330px">1×</div>
        <div class="cost big" id="cost100" style="left:855px;top:-470px">100×</div>
        <div class="bar tall" id="bar5" style="left:1065px;top:-330px;height:290px"></div>
        <div class="note" id="case" style="left:-260px;top:-455px">система заявок: забыли фильтр по автору</div>
        <div class="chip early" id="early" style="left:-980px;top:250px">нашли раньше: минуты</div>
        <div class="chip late" id="late" style="left:700px;top:250px">нашли поздно: утечка</div>

        <!-- s04: close -->
        <div class="ok-stamp" id="okstamp" style="left:640px;top:-400px">ПРОДУКТ</div>
        <div class="final" id="final" style="left:-520px;top:-520px">качество<br>повторяемо</div>
      </div></div></div>
    </div>

    <script>
      const stage = ExplainerStage.create("world-comp");
      const S = (id) => stage.scene(id).start;
      const E = (id) => stage.scene(id).end;

      stage.camInit({ x: -820, y: 10, scale: 1.28 })
        .setDrift({ x: 18, y: 12, scale: 0.03, rot: 0.3, speed: 0.85 })
        .mountBackdrop("#backdrop", { preset: "paper", onDraw: (ctx, t, cam) => {
          ctx.save();
          ctx.globalAlpha = 0.5;
          ctx.strokeStyle = "#DFD8CB";
          ctx.lineWidth = 1;
          const step = 64, ox = ((cam.x * 0.06) % step + step) % step;
          for (let x = -step; x < 1920 + step; x += step) {
            ctx.beginPath(); ctx.moveTo(x + ox, 0); ctx.lineTo(x + ox, 1080); ctx.stroke();
          }
          for (let y = 0; y < 1080 + step; y += step) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1920, y); ctx.stroke();
          }
          ctx.restore();
        }});

      const C = (sid, phrase, fb) => stage.cue(sid, phrase, fb);

      // s01: the laptop works, then the product gap shows up
      stage.camTo(1.0, { scale: 1.34, dur: 4.6, ease: "none" });
      stage.camTo(C("s01", "падает", 6.1), { scale: 1.52, x: -800, dur: 0.45 });
      stage.shake(C("s01", "падает", 6.1) + 0.1, 0.35, 12);
      stage.camTo(C("s01", "падает", 6.1) + 0.7, { scale: 1.3, x: -830, dur: 1.6 });
      stage.popIn("#lap-ok", C("s01", "запускается", 0.6), { fromScale: 0.8, y: 10 });
      stage.popIn("#cal", C("s01", "месяц", 3.4), { fromScale: 0.7, y: -18 });
      stage.fadeOut("#lap-ok", C("s01", "падает", 6.0), 0.3);
      stage.popIn("#fail1", C("s01", "пароль", 9.6), { y: 14 });
      stage.popIn("#fail2", C("s01", "установка", 11.1), { y: 14 });
      stage.popIn("#fail3", C("s01", "пустой", 12.8), { y: 14 });
      stage.stampSlam("#crash", C("s01", "экран", 14.2), { rot: -9 });

      // s02: pull back to the process line, then name the phases and their artifacts
      ["#laptop", "#fail1", "#fail2", "#fail3", "#crash", "#cal"].forEach((sel) => {
        stage.fadeOut(sel, S("s02"), 0.45);
      });
      stage.camTo(S("s02"), { x: 0, y: -40, scale: 0.95, dur: 1.4 });
      stage.popIn("#line", S("s02") + 0.6, { y: 0 });
      ["#st1", "#st2", "#st3", "#st4", "#st5"].forEach((sel, i) => {
        stage.popIn(sel, S("s02") + 3.3 + i * 0.9, { fromScale: 0.6, y: 0 });
      });
      ["#lb1", "#lb2", "#lb3", "#lb4", "#lb5"].forEach((sel, i) => {
        stage.popIn(sel, S("s02") + 3.5 + i * 0.9, { y: 10 });
      });
      stage.drawStroke("#trace", S("s02") + 7.2, 1.2);

      stage.camTo(S("s02") + 7.4, { x: 0, y: -40, scale: 0.9, dur: 3.4, ease: "none" });
      stage.camTo(C("s02", "список", 11.5) - 0.9, { x: -900, y: 0, scale: 1.02, dur: 1.0 });
      stage.popIn("#a1", C("s02", "список", 11.7), { y: 18 });
      stage.camTo(C("s02", "схема", 12.9) - 0.7, { x: -450, y: 0, scale: 1.02, dur: 0.9 });
      stage.popIn("#a2", C("s02", "схема", 13.0), { y: 18 });
      stage.camTo(C("s02", "тесты", 13.6) - 0.6, { x: 0, y: 0, scale: 1.02, dur: 0.8 });
      stage.popIn("#a3", C("s02", "тесты", 13.7), { y: 18 });
      stage.camTo(C("s02", "инструкция", 14.3) - 0.6, { x: 450, y: 0, scale: 1.02, dur: 0.8 });
      stage.popIn("#a4", C("s02", "инструкция", 14.4), { y: 18 });
      stage.popIn("#a5", C("s02", "инструкция", 14.9), { y: 18 });
      stage.camTo(C("s02", "Артефакт", 16.2) - 0.5, { x: 0, y: -40, scale: 0.9, dur: 1.2 });
      stage.popIn("#product", C("s02", "Артефакт", 16.6), { y: 22, fromScale: 0.94 });
      stage.camTo(S("s02") + 18.6, { scale: 0.94, y: -50, dur: 1.5, ease: "none" });

      // s03: the defect at requirements, then the price of finding it in production
      stage.fadeOut("#product", S("s03"), 0.4);
      stage.camTo(S("s03"), { x: -700, y: -10, scale: 1.02, dur: 1.1 });
      stage.popIn("#defect", S("s03") + 0.25, { fromScale: 0.5 });
      stage.popIn("#cost1", C("s03", "безобидно", 1.6), { y: 16 });
      stage.popIn("#early", C("s03", "пока", 2.4), { y: 14 });
      stage.popIn("#case", C("s03", "Система", 8.8), { y: 20 });
      stage.camTo(S("s03") + 1.4, { x: -650, y: -20, scale: 1.04, dur: 10.0, ease: "none" });
      stage.camTo(S("s03") + 11.5, { x: 900, y: -50, scale: 0.95, dur: 7.0, ease: "sine.inOut" });
      stage.popIn("#cost100", C("s03", "утечка", 14.2) - 0.4, { y: 18 });
      stage.popIn("#bar5", C("s03", "утечка", 14.3) - 0.3, { fromScale: 0.85 });
      stage.popIn("#late", C("s03", "утечка", 14.8), { y: 14 });
      stage.kineticPunch("#cost100", C("s03", "утечка", 15.0), { fromScale: 1.22 });

      // s04: pull back, the process is repeatable, the product is the result
      ["#defect", "#cost1", "#cost100", "#bar5", "#case", "#early", "#late"].forEach((sel) => {
        stage.fadeOut(sel, S("s04"), 0.4);
      });
      stage.camTo(S("s04"), { x: 0, y: -30, scale: 0.9, dur: 1.2 });
      stage.camTo(S("s04") + 1.6, { x: 0, y: -60, scale: 0.97, dur: 9.6, ease: "none" });
      stage.popIn("#final", C("s04", "качество", 9.8), { y: 24 });
      stage.stampSlam("#okstamp", C("s04", "качество", 9.9) + 0.35, { rot: 7 });
      stage.finalize();
    </script>

    <style>
      .st-cam { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .line {
        position: absolute; height: 4px; border-radius: 2px;
        background: #1D9E75; opacity: .28;
      }
      .line-svg { position: absolute; }

      .laptop { position: absolute; width: 660px; height: 420px; }
      .lap-lid {
        width: 620px; height: 380px; margin: 0 auto; padding: 16px;
        border-radius: 22px; background: #24211D; box-shadow: 0 34px 60px #1A191626;
      }
      .lap-screen {
        position: relative; height: 100%; border-radius: 10px; overflow: hidden;
        background: #F8F6F0; padding: 34px 30px 20px;
      }
      .lap-bar {
        position: absolute; inset: 0 0 auto; height: 26px; background: #E9E4DA;
        display: flex; align-items: center; gap: 6px; padding: 0 10px;
      }
      .lap-bar i { width: 8px; height: 8px; border-radius: 50%; background: #C9C1B2; }
      .lap-bar span { margin-left: 8px; font: 600 11px ui-monospace, Consolas, monospace; color: #77705F; }
      .lap-code { font: 500 21px/1.75 ui-monospace, Consolas, monospace; color: #2B2921; }
      .lap-code b { color: #157A5B; }
      .lap-code em { color: #B45309; font-style: normal; }
      .lap-code .dim { color: #6B6558; }
      .lap-ok {
        position: absolute; right: 22px; bottom: 20px; padding: 8px 16px; border-radius: 999px;
        background: #157A5B; color: #fff; font: 700 20px/1 Inter, sans-serif;
      }
      .lap-base { width: 700px; height: 16px; margin: -6px 0 0 -20px; border-radius: 0 0 16px 16px; background: #322E28; }

      .chip, .artifact, .note {
        position: absolute; transform: translate(-50%, -50%); white-space: nowrap;
        padding: 12px 20px; border-radius: 12px; background: #fff; border: 2px solid #E2DACB;
        font: 600 24px/1 Inter, sans-serif; color: #2B2921; box-shadow: 0 12px 26px #1A191614;
      }
      .chip.bad { border-color: #C0392B; color: #8E2A20; background: #FBE9E5; }
      .chip.early { border-color: #1D9E75; color: #0F5A43; background: #E4F5EF; }
      .chip.late { border-color: #C0392B; color: #8E2A20; background: #FBE9E5; }
      .artifact { font-size: 22px; border-color: #BBD9CC; color: #145A44; background: #F1FAF6; }
      .artifact::before {
        content: ""; position: absolute; left: 50%; bottom: -195px; width: 2px; height: 190px;
        background: #BBD9CC; transform: translateX(-50%);
      }

      .stamp {
        position: absolute; transform: translate(-50%, -50%) rotate(-9deg);
        padding: 10px 26px; border: 5px solid #C0392B; border-radius: 10px;
        color: #C0392B; font: 800 42px/1 Inter, sans-serif; letter-spacing: .04em; opacity: .92;
      }
      .ok-stamp {
        position: absolute; transform: translate(-50%, -50%) rotate(7deg);
        padding: 12px 30px; border: 6px solid #1D9E75; border-radius: 12px;
        color: #157A5B; font: 800 48px/1 Inter, sans-serif; letter-spacing: .04em; background: #FFFDF6;
      }
      .cal {
        position: absolute; transform: translate(-50%, -50%); width: 118px; height: 118px;
        border-radius: 18px; background: #fff; border: 3px solid #E2DACB; text-align: center;
        display: grid; place-content: center; box-shadow: 0 14px 30px #1A19161A;
      }
      .cal b { font: 800 46px/1 Inter, sans-serif; color: #C0392B; }
      .cal span { font: 600 16px/1.4 Inter, sans-serif; color: #6B6558; }

      .station {
        position: absolute; width: 96px; height: 96px; margin: -48px 0 0 -48px;
        border-radius: 24px; background: #fff; border: 3px solid #1D9E75;
        display: grid; place-items: center; box-shadow: 0 14px 28px #1A191614;
      }
      .station span { font: 700 38px/1 Inter, sans-serif; color: #157A5B; }
      .st-label {
        position: absolute; transform: translate(-50%, 0); font: 700 22px/1 Inter, sans-serif;
        color: #3A362D; white-space: nowrap;
      }
      .product {
        position: absolute; transform: translate(-50%, 0); width: 330px; padding: 26px 26px 22px;
        border-radius: 18px; background: #fff; border: 3px solid #DCD3C3;
        box-shadow: 0 26px 50px #1A19161A; text-align: left;
      }
      .product-head { font: 800 34px/1 Inter, sans-serif; color: #145A44; margin-bottom: 20px; }
      .product-line { height: 10px; border-radius: 5px; background: #E7E0D2; margin-bottom: 12px; }
      .product-line.short { width: 66%; }
      .product-tag { margin-top: 18px; font: 600 16px/1.2 Inter, sans-serif; color: #6B6558; }

      .defect {
        position: absolute; transform: translate(-50%, -50%); width: 74px; height: 74px;
        border-radius: 50%; background: #C0392B; color: #fff; display: grid; place-items: center;
        font: 800 44px/1 Inter, sans-serif; box-shadow: 0 16px 30px #C0392B33;
      }
      .cost {
        position: absolute; transform: translate(-50%, -50%); font: 800 64px/1 Inter, sans-serif;
        color: #C0392B; letter-spacing: -.02em;
      }
      .cost.big { font-size: 132px; }
      .bar {
        position: absolute; width: 58px; border-radius: 10px 10px 0 0; background: #E9B3A9;
      }
      .bar.tall { background: #C0392B; width: 72px; }
      .note {
        font-size: 26px; background: #FFFDF6; border-color: #DCD3C3; color: #2B2921;
      }
      .final {
        position: absolute; font: 800 96px/1.02 Inter, sans-serif; color: #145A44; letter-spacing: -.03em;
      }
      .dot {
        position: absolute; width: 96px; height: 96px; margin: -48px 0 0 -48px;
        border-radius: 50%; background: #1D9E75; opacity: .16;
      }
      .bg-word {
        position: absolute; transform: translate(-50%, -50%); white-space: nowrap;
        font: 800 230px/0.86 Inter, sans-serif; color: #1D9E75; opacity: .055; letter-spacing: -.05em;
      }
    </style>
  </div>
</template>
