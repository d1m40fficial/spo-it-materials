<template id="world-tpl">
  <div data-composition-id="world-comp" data-width="1920" data-height="1080" data-duration="120.00">
    <div class="st-stage paper">
      <canvas id="backdrop" class="st-backdrop" data-layout-allow-overflow></canvas>
      <div id="cam-shake" class="st-cam-shake"><div id="cam-pivot" class="st-cam-pivot"><div id="cam" class="st-cam">

        <div class="bg-word" data-layout-ignore style="left:0;top:-360px">agile</div>
        <div class="bg-word" data-layout-ignore style="left:2200px;top:-380px">поток</div>

        <!-- s01 calendar -->
        <div class="art" id="cal">
          <div class="calendar">
            <div class="cal-head">План на год</div>
            <div class="months">
              <span>янв</span><span>фев</span><span>мар</span><span>апр</span>
              <span>май</span><span>июн</span><span>июл</span><span>авг</span>
              <span>сен</span><span>окт</span><span>ноя</span><span>дек</span>
            </div>
            <div class="cal-sub">фиксированный объём · изменения вне плана</div>
          </div>
          <div class="stamp" id="calStamp" style="left:0;top:250px">УСТАРЕЛ</div>
        </div>

        <!-- s02 values -->
        <div class="art" id="val">
          <div class="note" style="left:-360px;top:-260px">люди важнее<br>процессов</div>
          <div class="note" style="left:360px;top:-260px">продукт важнее<br>документов</div>
          <div class="note" style="left:-360px;top:60px">сотрудничество<br>важнее контракта</div>
          <div class="note" style="left:360px;top:60px">изменения<br>важнее плана</div>
          <div class="values-title" style="left:0;top:-400px">четыре ценности</div>
        </div>

        <!-- s03 scrum loop -->
        <div class="art" id="loop">
          <svg width="900" height="900" viewBox="-450 -450 900 900" style="left:-450px;top:-450px" data-layout-allow-overflow>
            <circle r="250" fill="none" stroke="#1D9E75" stroke-width="4" stroke-dasharray="14 12" opacity=".55"/>
            <path id="loopArrow" d="M -80 -236 A 250 250 0 0 1 236 -82" fill="none" stroke="#1D9E75" stroke-width="7" stroke-linecap="round"/>
            <circle cx="0" cy="-250" r="16" fill="#1D9E75"/>
            <circle cx="238" cy="-77" r="16" fill="#1D9E75"/>
            <circle cx="147" cy="202" r="16" fill="#1D9E75"/>
            <circle cx="-147" cy="202" r="16" fill="#1D9E75"/>
            <circle cx="-238" cy="-77" r="16" fill="#1D9E75"/>
          </svg>
          <div class="node-lbl" style="left:0;top:-330px">Планирование</div>
          <div class="node-lbl" style="left:330px;top:-90px">Спринт</div>
          <div class="node-lbl" style="left:220px;top:260px">Дейли</div>
          <div class="node-lbl" style="left:-220px;top:260px">Ревью</div>
          <div class="node-lbl" style="left:-330px;top:-90px">Ретро</div>
          <div class="clock" style="left:0;top:0"><b>2</b><span>недели</span></div>
          <div class="chip good" style="left:0;top:-430px">продакт-оунер · скрам-мастер · команда</div>
        </div>

        <!-- s04 kanban board -->
        <div class="art" id="board">
          <div class="col" style="left:-510px;top:-220px"><h4>Очередь</h4><i></i><i></i><i></i><i></i></div>
          <div class="col wip" style="left:-250px;top:-220px"><h4>В работе</h4><i></i><i></i><i></i><b class="wip-badge">3</b></div>
          <div class="col" style="left:10px;top:-220px"><h4>Проверка</h4><i></i><i></i></div>
          <div class="col" style="left:270px;top:-220px"><h4>Готово</h4><i></i><i></i><i></i></div>
          <div class="flow-line" style="left:-510px;top:150px;width:1040px"></div>
          <div class="chip good" style="left:0;top:-330px">WIP-лимит: не больше трёх</div>
          <div class="chip" style="left:0;top:250px">задачи идут потоком, без спринта</div>
        </div>

        <!-- s05 choice -->
        <div class="art" id="choice">
          <div class="lane" style="left:-420px;top:-200px">
            <div class="lane-title">продукт</div>
            <div class="lane-body">есть бэклог и приоритеты</div>
            <div class="lane-pick">Scrum: спринт</div>
          </div>
          <div class="lane" style="left:420px;top:-200px">
            <div class="lane-title">поддержка</div>
            <div class="lane-body">задачи приходят хаотично</div>
            <div class="lane-pick">Kanban: поток</div>
          </div>
          <div class="chip good" style="left:0;top:280px">гибрид: спринт для продукта, Kanban для поддержки</div>
        </div>

        <!-- s06 takeaway -->
        <div class="final" id="final" style="left:-560px;top:-440px">проверяй<br>и адаптируйся</div>
        <div class="ok-stamp" id="okStamp" style="left:560px;top:-340px">AGILE</div>

      </div></div></div>
    </div>

    <script>
      const stage = ExplainerStage.create("world-comp");
      const S = (id) => stage.scene(id).start;
      const D = (id) => stage.scene(id).end - stage.scene(id).start;
      const F = (id, f) => S(id) + D(id) * f;

      stage.camInit({ x: 0, y: 10, scale: 0.86 })
        .setDrift({ x: 18, y: 12, scale: 0.03, rot: 0.3, speed: 0.85 })
        .mountBackdrop("#backdrop", { preset: "paper", onDraw: (ctx, t, cam) => {
          ctx.save(); ctx.globalAlpha = 0.45; ctx.strokeStyle = "#DFD8CB"; ctx.lineWidth = 1;
          const step = 64, ox = ((cam.x * 0.05) % step + step) % step;
          for (let x = -step; x < 1920 + step; x += step) { ctx.beginPath(); ctx.moveTo(x + ox, 0); ctx.lineTo(x + ox, 1080); ctx.stroke(); }
          for (let y = 0; y < 1080 + step; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1920, y); ctx.stroke(); }
          ctx.restore();
        }});

      // s01: the yearly plan
      stage.popIn("#cal", 0.1, { y: 20 });
      stage.stampSlam("#calStamp", F("s01", 0.72), { rot: -7 });

      // s02: four values
      stage.fadeOut("#cal", S("s02"), 0.35);
      stage.popIn("#val", S("s02") + 0.1, { fromScale: 0.97, y: 0 });
      stage.camTo(S("s02"), { x: 0, y: -20, scale: 0.9, dur: 1.2 });
      ["#val .note"].forEach((sel, i) => stage.popIn(sel, F("s02", 0.28 + i * 0.12), { y: 18 }));

      // s03: the scrum loop
      stage.fadeOut("#val", S("s03"), 0.35);
      stage.camTo(S("s03"), { x: -900, y: -10, scale: 0.92, dur: 1.3 });
      stage.popIn("#loop", S("s03") + 0.1, { fromScale: 0.95, y: 0 });
      stage.drawStroke("#loopArrow", F("s03", 0.28), 1.6);
      ["#loop .node-lbl"].forEach((sel, i) => stage.popIn(sel, F("s03", 0.25 + i * 0.05), { y: 10 }));

      // s04: the kanban flow
      stage.fadeOut("#loop", S("s04"), 0.35);
      stage.camTo(S("s04"), { x: 900, y: -10, scale: 0.92, dur: 1.3 });
      stage.popIn("#board", S("s04") + 0.1, { fromScale: 0.97, y: 0 });
      ["#board .col"].forEach((sel, i) => stage.popIn(sel, F("s04", 0.12 + i * 0.1), { y: 16 }));

      // s05: product or support
      stage.fadeOut("#board", S("s05"), 0.35);
      stage.camTo(S("s05"), { x: 2200, y: -20, scale: 0.9, dur: 1.3 });
      stage.popIn("#choice", S("s05") + 0.1, { fromScale: 0.97, y: 0 });
      ["#choice .lane"].forEach((sel, i) => stage.popIn(sel, F("s05", 0.2 + i * 0.18), { y: 18 }));

      // s06: takeaway
      stage.fadeOut("#choice", S("s06"), 0.35);
      stage.camTo(S("s06"), { x: 0, y: -20, scale: 0.9, dur: 1.2 });
      stage.popIn("#final", F("s06", 0.08), { y: 24 });
      stage.stampSlam("#okStamp", F("s06", 0.4), { rot: 6 });
      stage.finalize();
    </script>

    <style>
      .st-cam { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .art { position: absolute; opacity: 0; }
      .art svg { position: absolute; }
      #loop { left: -900px; }
      #board { left: 900px; }
      #choice { left: 2200px; }
      .bg-word { position: absolute; transform: translate(-50%, -50%); white-space: nowrap;
        font: 800 250px/0.86 Inter, sans-serif; color: #1D9E75; opacity: .05; letter-spacing: -.05em; }
      .calendar { position: absolute; left: -400px; top: -260px; width: 800px; padding: 28px 30px;
        border-radius: 20px; background: #FFFDF7; border: 3px solid #DCD3C3; box-shadow: 0 30px 60px #1A19161F; }
      .cal-head { font: 800 44px/1 Inter, sans-serif; color: #1F1D18; margin-bottom: 20px; }
      .months { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
      .months span { display: grid; place-items: center; height: 64px; border-radius: 10px;
        background: #F1ECE1; color: #4A463B; font: 600 20px/1 Inter, sans-serif; }
      .cal-sub { margin-top: 18px; font: 500 20px/1.3 Inter, sans-serif; color: #6B6558; }
      .stamp { position: absolute; transform: translate(-50%, -50%) rotate(-7deg); padding: 10px 26px;
        border: 5px solid #C0392B; border-radius: 10px; color: #C0392B; background: #FFFDF7;
        font: 800 42px/1 Inter, sans-serif; letter-spacing: .04em; white-space: nowrap; }
      .note { position: absolute; width: 300px; min-height: 140px; padding: 22px 20px; border-radius: 14px;
        background: #FFFDF7; border: 3px solid #DCD3C3; box-shadow: 0 18px 34px #1A191614;
        font: 700 25px/1.3 Inter, sans-serif; color: #2B2921; transform: translate(-50%, -50%); }
      .values-title { position: absolute; transform: translate(-50%, -50%); font: 800 52px/1 Inter, sans-serif;
        color: #145A44; white-space: nowrap; }
      .node-lbl { position: absolute; transform: translate(-50%, -50%); font: 700 23px/1 Inter, sans-serif;
        color: #3A362D; white-space: nowrap; }
      .clock { position: absolute; transform: translate(-50%, -50%); width: 180px; height: 180px; border-radius: 50%;
        background: #FFFDF7; border: 4px solid #1D9E75; display: grid; place-content: center; text-align: center; }
      .clock b { font: 800 56px/1 Inter, sans-serif; color: #145A44; }
      .clock span { font: 600 17px/1.3 Inter, sans-serif; color: #6B6558; }
      .chip { position: absolute; transform: translate(-50%, -50%); padding: 12px 20px; border-radius: 12px;
        background: #fff; border: 2px solid #E2DACB; font: 600 22px/1 Inter, sans-serif; color: #2B2921;
        white-space: nowrap; box-shadow: 0 12px 26px #1A191614; }
      .chip.good { border-color: #1D9E75; color: #0F5A43; background: #E4F5EF; }
      .col { position: absolute; width: 220px; min-height: 390px; padding: 16px 14px; border-radius: 14px;
        background: #FFFDF7; border: 2px solid #DCD3C3; }
      .col h4 { margin: 0 0 14px; font: 700 22px/1 Inter, sans-serif; color: #3A362D; }
      .col i { display: block; height: 46px; margin-bottom: 10px; border-radius: 8px; background: #E9E3D6; }
      .col.wip { border-color: #C0392B; }
      .wip-badge { position: absolute; right: -16px; top: -18px; width: 44px; height: 44px; border-radius: 50%;
        background: #C0392B; color: #fff; display: grid; place-items: center; font: 800 20px/1 Inter, sans-serif; }
      .flow-line { position: absolute; height: 4px; background: #1D9E75; opacity: .4; border-radius: 2px; }
      .lane { position: absolute; width: 360px; padding: 26px 24px; border-radius: 18px; background: #FFFDF7;
        border: 3px solid #DCD3C3; box-shadow: 0 20px 40px #1A191614; transform: translate(-50%, -50%); }
      .lane-title { font: 800 38px/1 Inter, sans-serif; color: #1F1D18; margin-bottom: 12px; }
      .lane-body { font: 500 21px/1.35 Inter, sans-serif; color: #4A463B; }
      .lane-pick { margin-top: 16px; font: 700 20px/1 Inter, sans-serif; color: #157A5B; }
      .final { position: absolute; font: 800 100px/1.02 Inter, sans-serif; color: #145A44; letter-spacing: -.03em; opacity: 0; white-space: nowrap; }
      .ok-stamp { position: absolute; transform: translate(-50%, -50%) rotate(7deg); padding: 14px 34px;
        border: 6px solid #1D9E75; border-radius: 12px; color: #157A5B; background: #FFFDF6;
        font: 800 52px/1 Inter, sans-serif; letter-spacing: .04em; opacity: 0; }
    </style>
  </div>
</template>
