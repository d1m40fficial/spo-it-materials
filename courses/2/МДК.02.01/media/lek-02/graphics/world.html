<template id="world-tpl">
  <div data-composition-id="world-comp" data-width="1920" data-height="1080" data-duration="120.00">
    <div class="st-stage paper">
      <canvas id="backdrop" class="st-backdrop" data-layout-allow-overflow></canvas>
      <div id="cam-shake" class="st-cam-shake"><div id="cam-pivot" class="st-cam-pivot"><div id="cam" class="st-cam">

        <div class="bg-word" data-layout-ignore style="left:0;top:-360px">модели</div>
        <div class="bg-word" data-layout-ignore style="left:2800px;top:-380px">выбор</div>

        <!-- s01 hook -->
        <div class="proj" id="pL" style="left:-520px;top:-150px">
          <div class="proj-title">лендинг</div>
          <div class="proj-line">ошибка: правка текста</div>
          <div class="proj-line">риск низкий</div>
        </div>
        <div class="proj" id="pR" style="left:520px;top:-150px">
          <div class="proj-title">прибор</div>
          <div class="proj-line">ошибка: жизнь</div>
          <div class="proj-line">риск высокий</div>
        </div>
        <div class="question" id="q" style="left:0;top:-430px">когда узнаём об ошибке?</div>
        <div class="stamp" id="hookStamp" style="left:0;top:180px">РАЗНАЯ ЦЕНА</div>

        <!-- s02 waterfall -->
        <div class="art" id="wf">
          <svg width="1000" height="560" viewBox="-500 -300 1000 560" style="left:-1700px;top:-260px" data-layout-allow-overflow>
            <path id="wf-path" d="M -320 160 H -190 V 80 H -60 V 0 H 70 V -80 H 200 V -160 H 320" fill="none" stroke="#2B2921" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <path id="wf-back" d="M 320 -160 C 470 -310 -470 -310 -320 160" fill="none" stroke="#C0392B" stroke-width="5" stroke-dasharray="12 12" stroke-linecap="round"/>
            <circle cx="-320" cy="160" r="12" fill="#1D9E75"/>
            <circle cx="-190" cy="80" r="12" fill="#1D9E75"/>
            <circle cx="-60" cy="0" r="12" fill="#1D9E75"/>
            <circle cx="70" cy="-80" r="12" fill="#1D9E75"/>
            <circle cx="200" cy="-160" r="12" fill="#1D9E75"/>
            <circle cx="320" cy="-160" r="14" fill="#C0392B"/>
          </svg>
          <div class="lbl" style="left:-1520px;top:80px">требования</div>
          <div class="lbl" style="left:-1390px;top:0px">проект</div>
          <div class="lbl" style="left:-1260px;top:-80px">код</div>
          <div class="lbl" style="left:-1130px;top:-160px">проверка</div>
          <div class="lbl" style="left:-1000px;top:-240px">выпуск</div>
          <div class="chip bad" id="lateFeedback" style="left:-1050px;top:330px">обратная связь в конце</div>
          <div class="stamp" id="wfStamp" style="left:-850px;top:-380px">ПОЗДНО</div>
        </div>

        <!-- s03 iterations -->
        <div class="art" id="it">
          <svg width="1100" height="520" viewBox="-550 -260 1100 520" style="left:-550px;top:-230px" data-layout-allow-overflow>
            <path id="it-line" d="M -440 60 H 440" fill="none" stroke="#2B2921" stroke-width="5" stroke-linecap="round"/>
            <path id="loop1" d="M -440 60 C -440 -80 -160 -80 -160 60" fill="none" stroke="#1D9E75" stroke-width="6" stroke-linecap="round"/>
            <path id="loop2" d="M -160 60 C -160 -80 120 -80 120 60" fill="none" stroke="#1D9E75" stroke-width="6" stroke-linecap="round"/>
            <path id="loop3" d="M 120 60 C 120 -80 400 -80 400 60" fill="none" stroke="#1D9E75" stroke-width="6" stroke-linecap="round"/>
            <path id="it-arrow" d="M 440 60 h -1" fill="none" stroke="#2B2921" stroke-width="5"/>
          </svg>
          <div class="lbl" style="left:-440px;top:-180px">итерация 1</div>
          <div class="lbl" style="left:-120px;top:-180px">итерация 2</div>
          <div class="lbl" style="left:200px;top:-180px">итерация 3</div>
          <div class="chip good" id="inc" style="left:0px;top:-300px">работающий инкремент</div>
          <div class="chip good" id="twoWeeks" style="left:0px;top:240px">каждые 2 недели</div>
          <div class="stamp ok" id="itStamp" style="left:0px;top:360px">РАНЬШЕ</div>
        </div>

        <!-- s04 V + risk -->
        <div class="art" id="vs">
          <svg width="760" height="560" viewBox="-380 -300 760 560" style="left:780px;top:-260px" data-layout-allow-overflow>
            <path id="v-path" d="M -260 -180 L 0 180 L 260 -180" fill="none" stroke="#2B2921" stroke-width="6" stroke-linejoin="round"/>
            <path id="v-left" d="M -260 -180 V -240 M -130 -60 V -120 M 0 180 V 240" fill="none" stroke="#1D9E75" stroke-width="4"/>
            <path id="v-link1" d="M -260 -180 H 260" fill="none" stroke="#1D9E75" stroke-width="3" stroke-dasharray="10 10" opacity=".45"/>
            <path id="v-link2" d="M -130 -60 H 130" fill="none" stroke="#1D9E75" stroke-width="3" stroke-dasharray="10 10" opacity=".45"/>
            <circle cx="-260" cy="-180" r="12" fill="#1D9E75"/><circle cx="0" cy="180" r="12" fill="#1D9E75"/><circle cx="260" cy="-180" r="12" fill="#1D9E75"/>
          </svg>
          <div class="lbl" style="left:1020px;top:-390px">проект</div>
          <div class="lbl" style="left:1020px;top:200px">код</div>
          <div class="lbl" style="left:1340px;top:-390px">проверка</div>
          <div class="chip good" id="vPair" style="left:1030px;top:-270px">каждый этап с проверкой</div>

          <div class="risk" id="risk" style="left:1900px;top:-60px">
            <svg width="520" height="520" viewBox="-260 -260 520 520" style="left:-260px;top:-260px" data-layout-allow-overflow>
              <circle r="220" fill="none" stroke="#C0392B" stroke-width="4" opacity=".35"/>
              <circle r="150" fill="none" stroke="#C0392B" stroke-width="4" opacity=".5"/>
              <circle r="80" fill="none" stroke="#C0392B" stroke-width="4" opacity=".7"/>
              <path id="riskArrow" d="M 0 -220 A 220 220 0 0 1 190 110" fill="none" stroke="#C0392B" stroke-width="6" stroke-linecap="round"/>
            </svg>
            <div class="risk-label">риск</div>
          </div>
          <div class="stamp" id="vsStamp" style="left:1500px;top:-420px">ДОРОЖЕ</div>
        </div>

        <!-- s05 compass -->
        <div class="art" id="cmp">
          <svg width="760" height="760" viewBox="-380 -380 760 760" style="left:2420px;top:-380px" data-layout-allow-overflow>
            <circle r="260" fill="none" stroke="#2B2921" stroke-width="5"/>
            <circle r="250" fill="none" stroke="#1D9E75" stroke-width="3" opacity=".35"/>
            <path id="axis1" d="M 0 -260 V 260" fill="none" stroke="#2B2921" stroke-width="2" opacity=".25"/>
            <path id="axis2" d="M -225 130 L 225 -130" fill="none" stroke="#2B2921" stroke-width="2" opacity=".25"/>
            <path id="axis3" d="M 225 130 L -225 -130" fill="none" stroke="#2B2921" stroke-width="2" opacity=".25"/>
            <path id="needle" d="M 0 0 L 120 -190" fill="none" stroke="#C0392B" stroke-width="8" stroke-linecap="round"/>
            <circle r="18" fill="#2B2921"/>
          </svg>
          <div class="lbl" style="left:2800px;top:-400px">частота изменений</div>
          <div class="lbl" style="left:2520px;top:250px">цена ошибки</div>
          <div class="lbl" style="left:3080px;top:250px">масштаб</div>
          <div class="chip good" id="choice1" style="left:2380px;top:360px">стабильно: водопад</div>
          <div class="chip good" id="choice2" style="left:3000px;top:360px">меняется: итерации</div>
        </div>

        <!-- s06 takeaway -->
        <div class="final" id="final" style="left:-520px;top:-430px">модель<br>под риск</div>
        <div class="ok-stamp" id="okStamp" style="left:520px;top:-350px">ВЫБОР</div>

      </div></div></div>
    </div>

    <script>
      const stage = ExplainerStage.create("world-comp");
      const S = (id) => stage.scene(id).start;
      const D = (id) => stage.scene(id).end - stage.scene(id).start;
      const F = (id, f) => S(id) + D(id) * f;

      stage.camInit({ x: 0, y: 10, scale: 0.78 })
        .setDrift({ x: 18, y: 12, scale: 0.03, rot: 0.3, speed: 0.85 })
        .mountBackdrop("#backdrop", { preset: "paper", onDraw: (ctx, t, cam) => {
          ctx.save(); ctx.globalAlpha = 0.45; ctx.strokeStyle = "#DFD8CB"; ctx.lineWidth = 1;
          const step = 64, ox = ((cam.x * 0.05) % step + step) % step;
          for (let x = -step; x < 1920 + step; x += step) { ctx.beginPath(); ctx.moveTo(x + ox, 0); ctx.lineTo(x + ox, 1080); ctx.stroke(); }
          for (let y = 0; y < 1080 + step; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1920, y); ctx.stroke(); }
          ctx.restore();
        }});

      // s01: two projects, one question
      stage.popIn("#pL", 0.1, { y: 24 });
      stage.popIn("#pR", 0.25, { y: 24 });
      stage.popIn("#q", 0.45, { y: 18 });
      stage.stampSlam("#hookStamp", F("s01", 0.78), { rot: -6 });

      // s02: waterfall and the long way back
      ["#pL", "#pR", "#q", "#hookStamp"].forEach((s) => stage.fadeOut(s, S("s02"), 0.35));
      stage.camTo(S("s02"), { x: -1200, y: -10, scale: 0.95, dur: 1.2 });
      stage.camTo(S("s02") + 1.4, { x: -1180, y: -10, scale: 1.02, dur: Math.max(2, D("s02") - 1.8), ease: "none" });
      stage.popIn("#wf", S("s02") + 0.1, { fromScale: 0.97, y: 0 });
      stage.drawStroke("#wf-path", S("s02") + 0.3, 1.6);
      stage.popIn("#lateFeedback", F("s02", 0.72), { y: 14 });
      stage.drawStroke("#wf-back", F("s02", 0.62), 1.4);
      stage.stampSlam("#wfStamp", F("s02", 0.86), { rot: -8 });

      // s03: short loops with feedback
      stage.fadeOut("#wf", S("s03"), 0.35);
      stage.camTo(S("s03"), { x: 0, y: -10, scale: 0.95, dur: 1.2 });
      stage.camTo(S("s03") + 1.4, { x: 0, y: -14, scale: 1.01, dur: Math.max(2, D("s03") - 1.8), ease: "none" });
      stage.popIn("#it", S("s03") + 0.1, { fromScale: 0.97, y: 0 });
      stage.drawStroke("#it-line", S("s03") + 0.2, 0.8);
      ["#loop1", "#loop2", "#loop3"].forEach((s, i) => stage.drawStroke(s, S("s03") + 0.5 + i * 0.5, 1.0));
      stage.popIn("#inc", F("s03", 0.45), { y: 16 });
      stage.popIn("#twoWeeks", F("s03", 0.7), { y: 14 });
      stage.stampSlam("#itStamp", F("s03", 0.86), { rot: 6 });

      // s04: V-model and the risk spiral
      stage.fadeOut("#it", S("s04"), 0.35);
      stage.camTo(S("s04"), { x: 950, y: -20, scale: 0.9, dur: 1.2 });
      stage.camTo(S("s04") + 1.4, { x: 1900, y: -30, scale: 0.85, dur: Math.max(3, D("s04") - 1.8), ease: "sine.inOut" });
      stage.popIn("#vs", S("s04") + 0.1, { fromScale: 0.97, y: 0 });
      stage.drawStroke("#v-path", S("s04") + 0.2, 1.4);
      stage.drawStroke("#v-link1", S("s04") + 0.6, 0.7);
      stage.drawStroke("#v-link2", S("s04") + 0.8, 0.7);
      stage.popIn("#vPair", F("s04", 0.3), { y: 16 });
      stage.popIn("#risk", F("s04", 0.58), { fromScale: 0.9, y: 0 });
      stage.drawStroke("#riskArrow", F("s04", 0.68), 1.0);
      stage.stampSlam("#vsStamp", F("s04", 0.88), { rot: 7 });

      // s05: the compass
      stage.fadeOut("#vs", S("s05"), 0.35);
      stage.camTo(S("s05"), { x: 2800, y: -20, scale: 0.9, dur: 1.3 });
      stage.camTo(S("s05") + 1.5, { x: 2800, y: -24, scale: 0.95, dur: Math.max(2, D("s05") - 1.9), ease: "none" });
      stage.popIn("#cmp", S("s05") + 0.1, { fromScale: 0.97, y: 0 });
      stage.drawStroke("#needle", S("s05") + 0.4, 1.2);
      stage.popIn("#choice1", F("s05", 0.55), { y: 14 });
      stage.popIn("#choice2", F("s05", 0.7), { y: 14 });

      // s06: takeaway
      stage.fadeOut("#cmp", S("s06"), 0.35);
      stage.camTo(S("s06"), { x: 0, y: -20, scale: 0.9, dur: 1.2 });
      stage.camTo(S("s06") + 1.4, { x: 0, y: -25, scale: 0.95, dur: Math.max(2, D("s06") - 1.6), ease: "none" });
      stage.popIn("#final", F("s06", 0.35), { y: 24 });
      stage.stampSlam("#okStamp", F("s06", 0.5), { rot: 6 });
      stage.finalize();
    </script>

    <style>
      .st-cam { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .art { position: absolute; opacity: 0; }
      .art svg { position: absolute; }
      .proj { position: absolute; width: 400px; padding: 30px 28px; border-radius: 20px; background: #FFFDF7;
        border: 3px solid #DCD3C3; box-shadow: 0 30px 60px #1A19161F; transform: translate(-50%, 0); }
      .proj-title { font: 800 44px/1 Inter, sans-serif; color: #1F1D18; margin-bottom: 16px; }
      .proj-line { font: 500 24px/1.5 Inter, sans-serif; color: #4A463B; }
      .question { position: absolute; transform: translate(-50%, 0); font: 800 52px/1.05 Inter, sans-serif;
        color: #145A44; white-space: nowrap; }
      .stamp { position: absolute; transform: translate(-50%, -50%) rotate(-8deg); padding: 10px 24px;
        border: 5px solid #C0392B; border-radius: 10px; color: #C0392B; background: #FFFDF7;
        font: 800 40px/1 Inter, sans-serif; letter-spacing: .04em; white-space: nowrap; }
      .stamp.ok { border-color: #1D9E75; color: #157A5B; }
      .lbl { position: absolute; transform: translate(-50%, -50%); font: 700 22px/1 Inter, sans-serif;
        color: #3A362D; white-space: nowrap; }
      .chip { position: absolute; transform: translate(-50%, -50%); padding: 12px 20px; border-radius: 12px;
        background: #fff; border: 2px solid #E2DACB; font: 600 23px/1 Inter, sans-serif;
        color: #2B2921; white-space: nowrap; box-shadow: 0 12px 26px #1A191614; }
      .chip.bad { border-color: #C0392B; color: #8E2A20; background: #FBE9E5; }
      .chip.good { border-color: #1D9E75; color: #0F5A43; background: #E4F5EF; }
      .risk { position: absolute; width: 520px; height: 520px; }
      .risk-label { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%);
        font: 800 42px/1 Inter, sans-serif; color: #C0392B; }
      .final { position: absolute; font: 800 104px/1.02 Inter, sans-serif; color: #145A44; letter-spacing: -.03em; opacity: 0; white-space: nowrap; }
      .ok-stamp { position: absolute; transform: translate(-50%, -50%) rotate(7deg); padding: 14px 34px;
        border: 6px solid #1D9E75; border-radius: 12px; color: #157A5B; background: #FFFDF6;
        font: 800 52px/1 Inter, sans-serif; letter-spacing: .04em; opacity: 0; }
      .bg-word { position: absolute; transform: translate(-50%, -50%); white-space: nowrap;
        font: 800 250px/0.86 Inter, sans-serif; color: #1D9E75; opacity: .05; letter-spacing: -.05em; }
    </style>
  </div>
</template>
