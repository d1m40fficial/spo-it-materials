<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Граница системы</title>
<style>
  :root { --paper:#faf6f3; --card:#fffdfb; --ink:#2d3142; --muted:#5b5560; --accent:#0F8A63; --soft:#E1F5EE; --rule:#e4d8cf; --warn:#b07a1e; --bad:#b23a2b; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .demo { background:var(--paper); border:1px solid var(--rule); border-radius:14px; padding:18px; }
  .head { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; padding-bottom:10px; border-bottom:1px solid var(--rule); }
  .eyebrow { margin:0 0 4px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  h3 { margin:0; font-size:19px; line-height:1.2; }
  .hint { font:11px/1.4 Consolas,monospace; color:var(--muted); white-space:nowrap; }
  svg { display:block; width:100%; height:auto; margin-top:6px; }
  .zone rect { fill:#fff; stroke:#2d3142; stroke-width:1.3; transition:fill .2s, stroke .2s; }
  .zone.on rect { fill:var(--soft); stroke:var(--accent); stroke-width:2; }
  .zone text { font-family:Consolas,monospace; text-anchor:middle; }
  .zone .slot { font-size:9px; font-weight:700; fill:var(--ink); }
  .status { min-height:56px; margin-top:6px; padding:10px 12px; border-radius:9px; background:var(--soft); font-size:12.5px; line-height:1.45; }
  .status b { color:var(--accent); }
  .controls { display:flex; gap:7px; flex-wrap:wrap; margin-top:10px; }
  button { font:600 11.5px/1 "Segoe UI",system-ui,sans-serif; padding:8px 10px; border-radius:9px; border:1px solid var(--rule); background:var(--card); color:var(--ink); cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  @media (max-width:560px) { .demo { padding:12px; } .hint { display:none; } }
</style>
</head>
<body>
<div class="demo">
  <div class="head">
    <div><p class="eyebrow">Предметная область · границы</p><h3>Что внутри, что снаружи</h3></div>
    <div class="hint">выберите элемент</div>
  </div>
  <svg viewBox="0 0 680 300" role="img" aria-label="Три зоны ответственности: внутри границы, на границе и снаружи">
    <g class="zone" data-k="in">
      <rect x="16" y="24" width="200" height="160" rx="10"/>
      <text x="116" y="46" font-size="8.5" fill="#0F8A63">ВНУТРИ ГРАНИЦЫ</text>
      <text x="116" y="64" font-size="7" fill="#5b5560">команда отвечает за данные</text>
      <text x="116" y="78" font-size="7" fill="#5b5560">и правила</text>
      <text x="116" y="108" font-size="6.8" fill="#5b5560">заявки, статусы, права,</text>
      <text x="116" y="122" font-size="6.8" fill="#5b5560">отчёты по срокам</text>
      <text x="116" y="160" class="slot" data-slot="in">хранение заявок</text>
    </g>
    <g class="zone" data-k="edge">
      <rect x="240" y="24" width="200" height="160" rx="10"/>
      <text x="340" y="46" font-size="8.5" fill="#b07a1e">НА ГРАНИЦЕ</text>
      <text x="340" y="64" font-size="7" fill="#5b5560">есть контракт и владелец</text>
      <text x="340" y="78" font-size="7" fill="#5b5560">у каждой стороны</text>
      <text x="340" y="108" font-size="6.8" fill="#5b5560">вход, роли, форматы,</text>
      <text x="340" y="122" font-size="6.8" fill="#5b5560">ошибки, повторы</text>
      <text x="340" y="160" class="slot" data-slot="edge">вход через каталог</text>
    </g>
    <g class="zone" data-k="out">
      <rect x="464" y="24" width="200" height="160" rx="10"/>
      <text x="564" y="46" font-size="8.5" fill="#5b5560">СНАРУЖИ</text>
      <text x="564" y="64" font-size="7" fill="#5b5560">чужой владелец,</text>
      <text x="564" y="78" font-size="7" fill="#5b5560">свой график изменений</text>
      <text x="564" y="108" font-size="6.8" fill="#5b5560">каталог, почта, склад,</text>
      <text x="564" y="122" font-size="6.8" fill="#5b5560">бухгалтерия, календарь</text>
      <text x="564" y="160" class="slot" data-slot="out">корпоративная почта</text>
    </g>

    <g stroke="#5b5560" stroke-width="1.2" fill="none" marker-end="url(#arw-bs)">
      <path d="M216 104h20"/>
      <path d="M440 104h20"/>
    </g>
    <text x="340" y="212" text-anchor="middle" font-family="Consolas,monospace" font-size="7" fill="#5b5560">чем дальше элемент от центра, тем меньше команда управляет его изменениями</text>
    <text x="340" y="238" text-anchor="middle" font-family="Consolas,monospace" font-size="8" fill="#0F8A63">ГРАНИЦА ЭТО РАСПРЕДЕЛЕНИЕ ОТВЕТСТВЕННОСТИ</text>
    <defs>
      <marker id="arw-bs" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b5560"/></marker>
    </defs>
  </svg>
  <div class="status" id="status"></div>
  <div class="controls">
    <button data-k="requests" class="on">Хранение заявок</button>
    <button data-k="report">Отчёт по срокам</button>
    <button data-k="login">Вход через каталог</button>
    <button data-k="mail">Почта</button>
    <button data-k="warehouse">Склад</button>
  </div>
</div>
<script>
(function () {
  var data = {
    requests: { zone:'in', name:'хранение заявок', text:'<b>Внутри.</b> Заявки, комментарии и статусы принадлежат продукту. Команда отвечает за схему, права и сохранность данных.' },
    report: { zone:'in', name:'отчёт по срокам', text:'<b>Внутри.</b> Отчёт считается по данным продукта. Форму отчёта может согласовать заказчик, но правило расчёта остаётся в системе.' },
    login: { zone:'edge', name:'вход через каталог', text:'<b>На границе.</b> Учётные записи ведёт каталог, а решение о доступе к заявкам принимает продукт. Нужен контракт: что делать, если каталог недоступен.' },
    mail: { zone:'out', name:'корпоративная почта', text:'<b>Снаружи.</b> Доставку писем обеспечивает внешняя служба. Продукт отвечает за текст и момент отправки, но не за работу почтового сервера.' },
    warehouse: { zone:'out', name:'склад расходников', text:'<b>Снаружи.</b> Остатки ведёт склад. Система запрашивает их по контракту и не должна считать себя источником истины для склада.' }
  };
  var zones = document.querySelectorAll('.zone');
  var buttons = document.querySelectorAll('button[data-k]');
  var status = document.getElementById('status');
  var slots = { in: document.querySelector('[data-slot="in"]'), edge: document.querySelector('[data-slot="edge"]'), out: document.querySelector('[data-slot="out"]') };

  function apply(key) {
    var item = data[key];
    zones.forEach(function (z) { z.classList.toggle('on', z.dataset.k === item.zone); });
    buttons.forEach(function (b) { b.classList.toggle('on', b.dataset.k === key); });
    Object.keys(slots).forEach(function (z) { slots[z].textContent = ''; });
    slots[item.zone].textContent = item.name;
    status.innerHTML = item.text;
  }
  zones.forEach(function (z) { z.style.cursor = 'pointer'; z.addEventListener('click', function () {
    var found = Object.keys(data).filter(function (k) { return data[k].zone === z.dataset.k; });
    if (found.length) { apply(found[0]); }
  }); });
  buttons.forEach(function (b) { b.addEventListener('click', function () { apply(b.dataset.k); }); });
  apply('requests');
})();
</script>
</body>
</html>
