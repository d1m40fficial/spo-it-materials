<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V-модель и парные проверки</title>
<style>
  :root { --paper:#faf6f3; --ink:#2d3142; --muted:#5b5560; --accent:#0F8A63; --soft:#E1F5EE; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .note { margin:10px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Модели · V-модель</p>
  <svg viewBox="0 0 680 330" role="img" aria-labelledby="vt-title vt-desc">
    <title id="vt-title">V-модель: уровни проекта и парные проверки</title>
    <desc id="vt-desc">Слева идут требования, архитектура и детальный проект, внизу код, справа поднимаются модульные, интеграционные и приёмочные проверки. Пунктирные линии связывают каждый уровень проекта с его проверкой.</desc>

    <text x="20" y="18" font-family="Consolas,monospace" font-size="7.5" letter-spacing=".1em" fill="#5b5560">ПРОЕКТ</text>
    <text x="470" y="18" font-family="Consolas,monospace" font-size="7.5" letter-spacing=".1em" fill="#5b5560">ПРОВЕРКА</text>

    <g font-family="Consolas,monospace" font-size="8" text-anchor="middle">
      <rect x="20" y="30" width="190" height="42" rx="7" fill="#fff" stroke="#2d3142"/>
      <text x="115" y="48" fill="#2d3142">требования</text>
      <text x="115" y="62" font-size="6.8" fill="#5b5560">что нужно и зачем</text>

      <rect x="60" y="100" width="190" height="42" rx="7" fill="#fff" stroke="#2d3142"/>
      <text x="155" y="118" fill="#2d3142">архитектура</text>
      <text x="155" y="132" font-size="6.8" fill="#5b5560">части и контракты</text>

      <rect x="100" y="170" width="190" height="42" rx="7" fill="#fff" stroke="#2d3142"/>
      <text x="195" y="188" fill="#2d3142">детальный проект</text>
      <text x="195" y="202" font-size="6.8" fill="#5b5560">модули и интерфейсы</text>

      <rect x="245" y="248" width="190" height="42" rx="7" fill="#E1F5EE" stroke="#0F8A63" stroke-width="1.6"/>
      <text x="340" y="266" fill="#0F8A63">код</text>
      <text x="340" y="280" font-size="6.8" fill="#5b5560">единицы реализации</text>

      <rect x="470" y="170" width="190" height="42" rx="7" fill="#fff" stroke="#2d3142"/>
      <text x="565" y="188" fill="#2d3142">модульные тесты</text>
      <text x="565" y="202" font-size="6.8" fill="#5b5560">контракт модуля</text>

      <rect x="430" y="100" width="190" height="42" rx="7" fill="#fff" stroke="#2d3142"/>
      <text x="525" y="118" fill="#2d3142">интеграционные тесты</text>
      <text x="525" y="132" font-size="6.8" fill="#5b5560">стыки частей</text>

      <rect x="470" y="30" width="190" height="42" rx="7" fill="#E1F5EE" stroke="#0F8A63"/>
      <text x="565" y="48" fill="#0F8A63">приёмочные тесты</text>
      <text x="565" y="62" font-size="6.8" fill="#5b5560">нужность пользователю</text>
    </g>

    <g stroke="#5b5560" stroke-width="1.4" fill="none" marker-end="url(#arw-vt)">
      <path d="M150 72l30 22"/>
      <path d="M190 142l30 22"/>
      <path d="M230 212l50 30"/>
      <path d="M450 250l-50-32"/>
      <path d="M500 212l-30-24"/>
      <path d="M540 142l-30-24"/>
    </g>

    <g stroke="#b9ac9f" stroke-width="1.2" stroke-dasharray="4 3" fill="none">
      <path d="M212 51h256"/>
      <path d="M252 121h176"/>
      <path d="M292 191h136"/>
    </g>

    <g font-family="Consolas,monospace" font-size="6.8" fill="#0F8A63" text-anchor="middle">
      <text x="340" y="46">одно и то же требование</text>
      <text x="340" y="116">один и тот же контракт</text>
      <text x="340" y="186">один и тот же интерфейс</text>
    </g>

    <text x="340" y="314" text-anchor="middle" font-family="Consolas,monospace" font-size="7.4" fill="#0F8A63">ВЕРИФИКАЦИЯ ОТВЕЧАЕТ «ПРАВИЛЬНО ЛИ ПОСТРОИЛИ», ВАЛИДАЦИЯ «ТО ЛИ ПОСТРОИЛИ»</text>

    <defs>
      <marker id="arw-vt" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b5560"/></marker>
    </defs>
  </svg>
  <p class="note">Проверка проектируется вместе с уровнем, а не после сборки. Парная линия показывает, что именно доказывает тест.</p>
</div>
</body>
</html>
