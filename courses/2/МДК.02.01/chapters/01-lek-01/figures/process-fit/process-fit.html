<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вес процесса под задачу</title>
<style>
  :root { --paper:#faf6f3; --card:#fffdfb; --ink:#1a1916; --muted:#6b6459; --rule:#e4d8cf; --accent:#0F8A63; --soft:#E1F5EE; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .demo { background:var(--paper); border:1px solid var(--rule); border-radius:14px; padding:18px; }
  .head { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; padding-bottom:10px; border-bottom:1px solid var(--rule); }
  .eyebrow { margin:0 0 4px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  h3 { margin:0; font-size:20px; line-height:1.2; }
  .counter { font:11px/1.4 Consolas,monospace; color:var(--muted); white-space:nowrap; }
  svg { display:block; width:100%; height:auto; margin-top:6px; }
  .col rect { fill:#fff; stroke:#2d3142; stroke-width:1.3; transition:fill .2s, stroke .2s; }
  .col.on rect { fill:var(--soft); stroke:var(--accent); stroke-width:2; }
  .col text { font-family:Consolas,monospace; font-size:7.5px; fill:#2d3142; text-anchor:middle; }
  .col .big { font-size:8.5px; }
  .status { min-height:50px; margin-top:8px; padding:10px 12px; border-radius:9px; background:var(--soft); font-size:12.5px; line-height:1.45; }
  .status b { color:var(--accent); }
  .controls { display:flex; gap:7px; flex-wrap:wrap; margin-top:10px; }
  button { font:600 11.5px/1 "Segoe UI",system-ui,sans-serif; padding:8px 10px; border-radius:9px; border:1px solid var(--rule); background:var(--card); color:var(--ink); cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  @media (max-width:560px) { .demo { padding:12px; } }
</style>
</head>
<body>
<div class="demo">
  <div class="head">
    <div><p class="eyebrow">Процесс · масштаб</p><h3>Сколько процесса нужно</h3></div>
    <div class="counter">выберите класс системы</div>
  </div>
  <svg viewBox="0 0 680 218" role="img" aria-label="Три класса систем и вес процесса">
    <g class="col" data-k="study">
      <rect x="20" y="20" width="196" height="116" rx="9"/>
      <text x="118" y="42" class="big">учебный продукт</text>
      <text x="118" y="62">2-5 человек</text>
      <text x="118" y="78">требования меняются</text>
      <text x="118" y="94">цена ошибки низкая</text>
      <text x="118" y="116" fill="#0F8A63">короткие итерации</text>
    </g>
    <g class="col" data-k="product">
      <rect x="236" y="20" width="196" height="116" rx="9"/>
      <text x="334" y="42" class="big">коммерческий продукт</text>
      <text x="334" y="62">10-30 человек</text>
      <text x="334" y="78">частые релизы</text>
      <text x="334" y="94">пользователи снаружи</text>
      <text x="334" y="116" fill="#0F8A63">ревью, CI, метрики</text>
    </g>
    <g class="col" data-k="critical">
      <rect x="452" y="20" width="208" height="116" rx="9"/>
      <text x="556" y="42" class="big">критичная система</text>
      <text x="556" y="62">регламент и аудит</text>
      <text x="556" y="78">высокая цена ошибки</text>
      <text x="556" y="94">проверки обязательны</text>
      <text x="556" y="116" fill="#0F8A63">прослеживаемость</text>
    </g>

    <g font-family="Consolas,monospace" font-size="7" fill="#5b5560">
      <text x="20" y="158">вес процесса: минимум документов, быстрый цикл</text>
      <text x="236" y="158">вес процесса: итерации и автоматические проверки</text>
      <text x="452" y="158">вес процесса: формальные проверки и доказательства</text>
    </g>
    <text x="340" y="196" text-anchor="middle" font-family="Consolas,monospace" font-size="8" fill="#0F8A63">ПРОЦЕСС ДОЛЖЕН БЫТЬ СОРАЗМЕРЕН ЦЕНЕ ОШИБКИ</text>
  </svg>
  <div class="status" id="status"></div>
  <div class="controls">
    <button data-k="study" class="on">Учебный продукт</button>
    <button data-k="product">Коммерческий продукт</button>
    <button data-k="critical">Критичная система</button>
  </div>
</div>
<script>
(function () {
  var data = {
    study: '<b>Учебный продукт.</b> Достаточно коротких итераций, историй с критериями и тестов на главные сценарии. Тяжёлые согласования отнимают время у работы.',
    product: '<b>Коммерческий продукт.</b> Нужны ревью, автоматические проверки, релизы и метрики. Ошибка стоит денег и репутации, но не жизни.',
    critical: '<b>Критичная система.</b> Нужны прослеживаемость требований, формальные проверки, аудит и план отката. Цена ошибки требует доказательств, а не обещаний.'
  };
  var cols = document.querySelectorAll('.col');
  var buttons = document.querySelectorAll('button[data-k]');
  var status = document.getElementById('status');

  function apply(key) {
    cols.forEach(function (c) { c.classList.toggle('on', c.dataset.k === key); });
    buttons.forEach(function (b) { b.classList.toggle('on', b.dataset.k === key); });
    status.innerHTML = data[key];
  }
  cols.forEach(function (c) { c.addEventListener('click', function () { apply(c.dataset.k); }); });
  buttons.forEach(function (b) { b.addEventListener('click', function () { apply(b.dataset.k); }); });
  apply('study');
})();
</script>
</body>
</html>
