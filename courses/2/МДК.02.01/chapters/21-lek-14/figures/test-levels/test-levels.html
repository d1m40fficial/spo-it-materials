<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Уровни тестирования</title>
<style>
  :root { --paper:#faf6f3; --ink:#2d3142; --muted:#5b5560; --accent:#0F8A63; --soft:#E1F5EE; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .note { margin:10px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Тесты · уровни</p>
  <svg viewBox="0 0 680 236" role="img" aria-labelledby="tl-title tl-desc">
    <title id="tl-title">Пирамида уровней тестирования</title>
    <desc id="tl-desc">Много модульных тестов, меньше интеграционных и ещё меньше приёмочных.</desc>

    <g font-family="Consolas,monospace" text-anchor="middle">
      <polygon points="300,26 380,26 410,86 270,86" fill="#E1F5EE" stroke="#0F8A63"/>
      <text x="340" y="52" font-size="8" fill="#0F8A63">приёмочные</text>
      <text x="340" y="68" font-size="6.8" fill="#5b5560">сценарий целиком</text>

      <polygon points="270,90 410,90 450,150 230,150" fill="#fff" stroke="#2d3142"/>
      <text x="340" y="116" font-size="8" fill="#2d3142">интеграционные</text>
      <text x="340" y="132" font-size="6.8" fill="#5b5560">связи модулей и база</text>

      <polygon points="230,154 450,154 490,214 190,214" fill="#fff" stroke="#2d3142"/>
      <text x="340" y="180" font-size="8" fill="#2d3142">модульные</text>
      <text x="340" y="196" font-size="6.8" fill="#5b5560">функции и правила</text>
    </g>

    <g font-family="Consolas,monospace" font-size="6.8" fill="#5b5560">
      <text x="505" y="52">медленно, дорого, мало</text>
      <text x="505" y="186">быстро, дешево, много</text>
    </g>

    <text x="340" y="232" text-anchor="middle" font-family="Consolas,monospace" font-size="8" fill="#0F8A63">ОСНОВА ПИРАМИДЫ ДАЁТ БЫСТРУЮ ОБРАТНУЮ СВЯЗЬ</text>
  </svg>
  <p class="note">Приёмочный тест проверяет цель, но не заменяет проверку отдельных правил.</p>
</div>
</body>
</html>
