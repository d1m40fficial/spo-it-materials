<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Разметка записи changelog</title>
<style>
  :root { --paper:#faf6f3; --ink:#2d3142; --muted:#5b5560; --accent:#0F8A63; --soft:#E1F5EE; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .note { margin:10px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Документация · изменения</p>
  <svg viewBox="0 0 680 330" role="img" aria-labelledby="ca-title ca-desc">
    <title id="ca-title">Что входит в запись changelog</title>
    <desc id="ca-desc">Версия и дата, категории изменений, формулировка для пользователя, блок несовместимых изменений и ссылка на сравнение версий.</desc>

    <rect x="16" y="16" width="404" height="298" rx="10" fill="#fffdfb" stroke="#2d3142"/>

    <g font-family="Consolas,monospace">
      <text x="34" y="48" font-size="14" font-weight="700" fill="#0F8A63">## [1.3.0] - 2026-03-12</text>
      <text x="34" y="76" font-size="12" font-weight="700" fill="#2d3142">### Добавлено</text>
      <text x="34" y="95" font-size="11" fill="#2d3142">- экспорт заявок в CSV</text>

      <text x="34" y="124" font-size="12" font-weight="700" fill="#2d3142">### Исправлено</text>
      <text x="34" y="143" font-size="11" fill="#2d3142">- заявка с кавычкой в теме</text>
      <text x="34" y="158" font-size="11" fill="#2d3142">  больше не теряется</text>

      <text x="34" y="187" font-size="12" font-weight="700" fill="#2d3142">### Изменено</text>
      <text x="34" y="206" font-size="11" fill="#2d3142">- status принимает closed</text>

      <rect x="26" y="218" width="382" height="44" rx="5" fill="#F7E3DE" stroke="#B04A3A"/>
      <text x="34" y="236" font-size="12" font-weight="700" fill="#B04A3A">### Несовместимо</text>
      <text x="34" y="254" font-size="10.5" fill="#8a3f32">- удалено author_name, используйте author.login</text>

      <text x="34" y="288" font-size="9.5" fill="#5b5560">[1.3.0]: /compare/v1.2.0...v1.3.0</text>
    </g>

    <g font-family="Consolas,monospace">
      <circle cx="450" cy="44" r="10" fill="#E1F5EE" stroke="#0F8A63"/>
      <text x="450" y="48" font-size="10" fill="#0F8A63" text-anchor="middle">1</text>
      <text x="468" y="42" font-size="11" fill="#2d3142">версия и дата</text>
      <text x="468" y="56" font-size="9.5" fill="#5b5560">читатель находит свой выпуск</text>

      <circle cx="450" cy="90" r="10" fill="#E1F5EE" stroke="#0F8A63"/>
      <text x="450" y="94" font-size="10" fill="#0F8A63" text-anchor="middle">2</text>
      <text x="468" y="88" font-size="11" fill="#2d3142">категории</text>
      <text x="468" y="102" font-size="9.5" fill="#5b5560">добавлено, исправлено, изменено</text>

      <circle cx="450" cy="148" r="10" fill="#E1F5EE" stroke="#0F8A63"/>
      <text x="450" y="152" font-size="10" fill="#0F8A63" text-anchor="middle">3</text>
      <text x="468" y="146" font-size="11" fill="#2d3142">язык пользователя</text>
      <text x="468" y="160" font-size="9.5" fill="#5b5560">что перестанет болеть</text>

      <circle cx="450" cy="234" r="10" fill="#F7E3DE" stroke="#B04A3A"/>
      <text x="450" y="238" font-size="10" fill="#B04A3A" text-anchor="middle">4</text>
      <text x="468" y="232" font-size="11" fill="#2d3142">несовместимое изменение</text>
      <text x="468" y="246" font-size="9.5" fill="#5b5560">что сломается и чем заменить</text>

      <circle cx="450" cy="286" r="10" fill="#E1F5EE" stroke="#0F8A63"/>
      <text x="450" y="290" font-size="10" fill="#0F8A63" text-anchor="middle">5</text>
      <text x="468" y="284" font-size="11" fill="#2d3142">ссылка на сравнение</text>
      <text x="468" y="298" font-size="9.5" fill="#5b5560">весь дифф, если нужен</text>
    </g>

    <text x="340" y="326" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#0F8A63">ЗАПИСЬ ОТВЕЧАЕТ: ЧТО МНЕ ДЕЛАТЬ ПРИ ОБНОВЛЕНИИ</text>
  </svg>
  <p class="note">Список коммитов описывает работу команды. Changelog описывает изменение для читателя.</p>
</div>
</body>
</html>
