<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта документации</title>
<style>
  :root { --paper:#faf6f3; --ink:#2d3142; --muted:#5b5560; --accent:#0F8A63; --soft:#E1F5EE; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .note { margin:10px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Документация · читатель</p>
  <svg viewBox="0 0 680 238" role="img" aria-labelledby="dm-title dm-desc">
    <title id="dm-title">Виды документации по читателю</title>
    <desc id="dm-desc">README для разработчика, описание API для интегратора, руководство для пользователя, ADR для команды и changelog для всех.</desc>

    <g font-family="Consolas,monospace">
      <g>
        <rect x="18" y="24" width="200" height="76" rx="8" fill="#E1F5EE" stroke="#0F8A63"/>
        <text x="30" y="44" font-size="8.5" fill="#0F8A63">README</text>
        <text x="30" y="62" font-size="7" fill="#2d3142">для нового разработчика</text>
        <text x="30" y="78" font-size="6.8" fill="#5b5560">как установить и запустить</text>
      </g>
      <g>
        <rect x="232" y="24" width="200" height="76" rx="8" fill="#fff" stroke="#2d3142"/>
        <text x="244" y="44" font-size="8.5" fill="#2d3142">API</text>
        <text x="244" y="62" font-size="7" fill="#2d3142">для интегратора</text>
        <text x="244" y="78" font-size="6.8" fill="#5b5560">запросы, ответы, ошибки</text>
      </g>
      <g>
        <rect x="446" y="24" width="216" height="76" rx="8" fill="#fff" stroke="#2d3142"/>
        <text x="458" y="44" font-size="8.5" fill="#2d3142">РУКОВОДСТВО</text>
        <text x="458" y="62" font-size="7" fill="#2d3142">для пользователя</text>
        <text x="458" y="78" font-size="6.8" fill="#5b5560">сценарии и ошибки</text>
      </g>

      <g>
        <rect x="18" y="116" width="300" height="76" rx="8" fill="#fff" stroke="#2d3142"/>
        <text x="30" y="136" font-size="8.5" fill="#2d3142">ADR</text>
        <text x="30" y="154" font-size="7" fill="#2d3142">для команды</text>
        <text x="30" y="170" font-size="6.8" fill="#5b5560">какое решение приняли и почему</text>
      </g>
      <g>
        <rect x="332" y="116" width="330" height="76" rx="8" fill="#fff" stroke="#2d3142"/>
        <text x="344" y="136" font-size="8.5" fill="#2d3142">CHANGELOG</text>
        <text x="344" y="154" font-size="7" fill="#2d3142">для всех</text>
        <text x="344" y="170" font-size="6.8" fill="#5b5560">что изменилось между версиями</text>
      </g>
    </g>

    <text x="340" y="222" text-anchor="middle" font-family="Consolas,monospace" font-size="8" fill="#0F8A63">ДОКУМЕНТ ВЫБИРАЮТ ПО ЧИТАТЕЛЮ И ВОПРОСУ</text>
  </svg>
  <p class="note">Один документ на все вопросы быстро устаревает и никем не читается.</p>
</div>
</body>
</html>
