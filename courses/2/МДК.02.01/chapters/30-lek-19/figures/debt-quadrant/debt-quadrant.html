<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Виды технического долга</title>
<style>
  :root { --paper:#faf6f3; --ink:#2d3142; --muted:#5b5560; --accent:#0F8A63; --soft:#E1F5EE; --warn:#b23a2b; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .note { margin:10px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Сопровождение · долг</p>
  <svg viewBox="0 0 680 348" role="img" aria-labelledby="dq-title dq-desc">
    <title id="dq-title">Квадрант технического долга</title>
    <desc id="dq-desc">Сознательный и непреднамеренный долг, разумный и рискованный. В каждом квадранте пример и рекомендуемое действие.</desc>

    <g font-family="Consolas,monospace">
      <text x="24" y="34" font-size="7.4" fill="#5b5560">СОЗНАТЕЛЬНЫЙ</text>
      <text x="656" y="34" text-anchor="end" font-size="7.4" fill="#5b5560">НЕПРЕДНАМЕРЕННЫЙ</text>

      <rect x="24" y="46" width="304" height="118" rx="9" fill="#E1F5EE" stroke="#0F8A63" stroke-width="1.5"/>
      <text x="40" y="68" font-size="7.6" fill="#0F8A63">РАЗУМНЫЙ</text>
      <text x="40" y="90" font-size="8.4" fill="#2d3142">знаем, зачем берём</text>
      <text x="40" y="110" font-size="7" fill="#5b5560">быстрый выпуск ради срока,</text>
      <text x="40" y="124" font-size="7" fill="#5b5560">план возврата записан</text>
      <text x="40" y="146" font-size="7.2" fill="#0F8A63">действие: вернуть по плану</text>

      <rect x="352" y="46" width="304" height="118" rx="9" fill="#fff" stroke="#b9ac9f" stroke-width="1.3"/>
      <text x="368" y="68" font-size="7.6" fill="#5b5560">РАЗУМНЫЙ</text>
      <text x="368" y="90" font-size="8.4" fill="#2d3142">узнали лучшее решение позже</text>
      <text x="368" y="110" font-size="7" fill="#5b5560">команда выросла и увидела</text>
      <text x="368" y="124" font-size="7" fill="#5b5560">другой способ устройства</text>
      <text x="368" y="146" font-size="7.2" fill="#0F8A63">действие: учесть в следующем шаге</text>

      <rect x="24" y="180" width="304" height="118" rx="9" fill="#fbeeec" stroke="#b23a2b" stroke-width="1.5"/>
      <text x="40" y="202" font-size="7.6" fill="#b23a2b">РИСКОВАННЫЙ</text>
      <text x="40" y="224" font-size="8.4" fill="#2d3142">знаем, что делаем плохо</text>
      <text x="40" y="244" font-size="7" fill="#5b5560">«быстро и грязно»,</text>
      <text x="40" y="258" font-size="7" fill="#5b5560">потому что не хватает времени</text>
      <text x="40" y="280" font-size="7.2" fill="#b23a2b">действие: оценить риск и закрыть</text>

      <rect x="352" y="180" width="304" height="118" rx="9" fill="#fff" stroke="#b9ac9f" stroke-width="1.3"/>
      <text x="368" y="202" font-size="7.6" fill="#5b5560">РИСКОВАННЫЙ</text>
      <text x="368" y="224" font-size="8.4" fill="#2d3142">не знаем, что создаём проблему</text>
      <text x="368" y="244" font-size="7" fill="#5b5560">нет тестов, дублирование,</text>
      <text x="368" y="258" font-size="7" fill="#5b5560">пароль в коде</text>
      <text x="368" y="280" font-size="7.2" fill="#0F8A63">действие: обучение и проверки</text>

      <text x="340" y="326" text-anchor="middle" font-size="7.6" fill="#0F8A63">Долг это метафора: важен не ярлык, а решение вернуть или принять риск.</text>
      <text x="340" y="342" text-anchor="middle" font-size="6.8" fill="#5b5560">По материалам Martin Fowler, Technical Debt Quadrant, 2009.</text>
    </g>
  </svg>
  <p class="note">Разумный долг имеет план возврата. Рискованный долг без плана берёт проценты временем и безопасностью.</p>
</div>
</body>
</html>
