<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цикл сопровождения</title>
<style>
  :root { --paper:#faf6f3; --ink:#2d3142; --muted:#5b5560; --accent:#0F8A63; --soft:#E1F5EE; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .note { margin:10px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Сопровождение · цикл</p>
  <svg viewBox="0 0 680 226" role="img" aria-labelledby="ml-title ml-desc">
    <title id="ml-title">Цикл обработки обращений и технический долг</title>
    <desc id="ml-desc">Обращение, классификация, исправление и разбор. Технический долг накапливается и требует плана.</desc>

    <g font-family="Consolas,monospace" font-size="7.5" text-anchor="middle">
      <rect x="30" y="32" width="130" height="48" rx="7" fill="#fff" stroke="#2d3142"/><text x="95" y="52">обращение</text><text x="95" y="68" fill="#5b5560">инцидент или запрос</text>
      <rect x="200" y="32" width="130" height="48" rx="7" fill="#E1F5EE" stroke="#0F8A63"/><text x="265" y="52">классификация</text><text x="265" y="68" fill="#5b5560">важность и срок</text>
      <rect x="370" y="32" width="130" height="48" rx="7" fill="#fff" stroke="#2d3142"/><text x="435" y="52">исправление</text><text x="435" y="68" fill="#5b5560">выпуск или обход</text>
      <rect x="540" y="32" width="120" height="48" rx="7" fill="#fff" stroke="#2d3142"/><text x="600" y="52">разбор</text><text x="600" y="68" fill="#5b5560">причина и меры</text>
    </g>

    <g stroke="#5b5560" stroke-width="1.4" fill="none" marker-end="url(#arw-ml)">
      <path d="M160 56h32"/><path d="M330 56h32"/><path d="M500 56h32"/>
    </g>

    <path d="M600 86v52H95V84" stroke="#0F8A63" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arw-ml2)"/>
    <text x="340" y="128" text-anchor="middle" font-family="Consolas,monospace" font-size="7" fill="#0F8A63">постоянные причины возвращаются в план работ</text>

    <g font-family="Consolas,monospace">
      <rect x="30" y="158" width="290" height="48" rx="7" fill="#fff" stroke="#b9ac9f"/>
      <text x="44" y="176" font-size="7" fill="#5b5560">SLA</text>
      <text x="44" y="192" font-size="7.2" fill="#2d3142">срок реакции и решения по важности</text>

      <rect x="340" y="158" width="310" height="48" rx="7" fill="#fff" stroke="#b9ac9f"/>
      <text x="354" y="176" font-size="7" fill="#5b5560">ТЕХНИЧЕСКИЙ ДОЛГ</text>
      <text x="354" y="192" font-size="7.2" fill="#2d3142">обходы и отложенные правки</text>
    </g>

    <text x="340" y="222" text-anchor="middle" font-family="Consolas,monospace" font-size="8" fill="#0F8A63">СОПРОВОЖДЕНИЕ ЭТО РАБОТА, А НЕ ОЖИДАНИЕ СБОЯ</text>
    <defs>
      <marker id="arw-ml" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b5560"/></marker>
      <marker id="arw-ml2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0F8A63"/></marker>
    </defs>
  </svg>
  <p class="note">Инцидент закрывают быстро, причину разбирают отдельно.</p>
</div>
</body>
</html>
