<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Порядок отладки</title>
<style>
  :root { --paper:#faf6f3; --ink:#2d3142; --muted:#5b5560; --accent:#0F8A63; --soft:#E1F5EE; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .note { margin:10px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Отладка · порядок</p>
  <svg viewBox="0 0 680 232" role="img" aria-labelledby="df-title df-desc">
    <title id="df-title">Шаги отладки и возврат к гипотезе</title>
    <desc id="df-desc">Воспроизведение, факты, гипотеза, проверка и исправление. Если гипотеза не подтвердилась, возврат к фактам.</desc>

    <g font-family="Consolas,monospace" font-size="7.5" text-anchor="middle">
      <rect x="18" y="34" width="112" height="52" rx="7" fill="#fff" stroke="#2d3142"/><text x="74" y="56">воспроизвести</text><text x="74" y="72" fill="#5b5560">шаги и данные</text>
      <rect x="150" y="34" width="112" height="52" rx="7" fill="#fff" stroke="#2d3142"/><text x="206" y="56">собрать факты</text><text x="206" y="72" fill="#5b5560">журнал, стек</text>
      <rect x="282" y="34" width="112" height="52" rx="7" fill="#E1F5EE" stroke="#0F8A63"/><text x="338" y="56">гипотеза</text><text x="338" y="72" fill="#5b5560">что проверить</text>
      <rect x="414" y="34" width="112" height="52" rx="7" fill="#fff" stroke="#2d3142"/><text x="470" y="56">проверка</text><text x="470" y="72" fill="#5b5560">тест или лог</text>
      <rect x="546" y="34" width="112" height="52" rx="7" fill="#fff" stroke="#2d3142"/><text x="602" y="56">исправление</text><text x="602" y="72" fill="#5b5560">и повторный тест</text>
    </g>

    <g stroke="#5b5560" stroke-width="1.4" fill="none" marker-end="url(#arw-df)">
      <path d="M130 60h16"/><path d="M262 60h16"/><path d="M394 60h16"/><path d="M526 60h16"/>
    </g>

    <path d="M470 90v48H206V88" stroke="#0F8A63" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arw-df2)"/>
    <text x="338" y="132" text-anchor="middle" font-family="Consolas,monospace" font-size="7" fill="#0F8A63">гипотеза не подтвердилась: вернуться к фактам</text>

    <g font-family="Consolas,monospace" font-size="7.5">
      <rect x="18" y="164" width="300" height="44" rx="7" fill="#fff" stroke="#b9ac9f"/>
      <text x="32" y="182" fill="#5b5560">ЧТО ДАЁТ ЖУРНАЛ</text>
      <text x="32" y="198">время, уровень, сообщение, идентификатор запроса</text>

      <rect x="338" y="164" width="320" height="44" rx="7" fill="#fff" stroke="#b9ac9f"/>
      <text x="352" y="182" fill="#5b5560">ЧТО ДАЁТ BISECT</text>
      <text x="352" y="198">коммит, после которого поведение изменилось</text>
    </g>

    <text x="340" y="228" text-anchor="middle" font-family="Consolas,monospace" font-size="8" fill="#0F8A63">ОТЛАДКА СУЖАЕТ ПРИЧИНУ, А НЕ ПЕРЕБИРАЕТ ВСЁ ПОДРЯД</text>
    <defs>
      <marker id="arw-df" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b5560"/></marker>
      <marker id="arw-df2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0F8A63"/></marker>
    </defs>
  </svg>
  <p class="note">Каждая проверка должна подтвердить или отбросить одну гипотезу.</p>
</div>
</body>
</html>
