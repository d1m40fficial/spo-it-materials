<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Анатомия user story</title>
<style>
  :root { --paper:#faf6f3; --ink:#2d3142; --muted:#5b5560; --accent:#0F8A63; --soft:#E1F5EE; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .note { margin:10px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Требования · user story</p>
  <svg viewBox="0 0 680 236" role="img" aria-labelledby="st-title st-desc">
    <title id="st-title">Строение пользовательской истории и критерии INVEST</title>
    <desc id="st-desc">История состоит из роли, цели и ценности. Проверяется по шести критериям INVEST.</desc>

    <rect x="20" y="18" width="640" height="86" rx="10" fill="#fff" stroke="#2d3142"/>
    <text x="36" y="40" font-family="Consolas,monospace" font-size="7.5" letter-spacing=".1em" fill="#5b5560">ИСТОРИЯ</text>

    <rect x="34" y="50" width="150" height="34" rx="6" fill="#E1F5EE" stroke="#0F8A63"/>
    <text x="109" y="71" text-anchor="middle" font-family="Consolas,monospace" font-size="8" fill="#0F8A63">как библиотекарь</text>

    <rect x="196" y="50" width="280" height="34" rx="6" fill="#fff" stroke="#b9ac9f"/>
    <text x="336" y="71" text-anchor="middle" font-family="Consolas,monospace" font-size="8" fill="#2d3142">хочу видеть просроченные выдачи</text>

    <rect x="488" y="50" width="158" height="34" rx="6" fill="#fff" stroke="#b9ac9f"/>
    <text x="567" y="71" text-anchor="middle" font-family="Consolas,monospace" font-size="8" fill="#2d3142">чтобы напомнить</text>

    <text x="109" y="96" text-anchor="middle" font-family="Consolas,monospace" font-size="7" fill="#0F8A63">роль</text>
    <text x="336" y="96" text-anchor="middle" font-family="Consolas,monospace" font-size="7" fill="#5b5560">цель</text>
    <text x="567" y="96" text-anchor="middle" font-family="Consolas,monospace" font-size="7" fill="#5b5560">ценность</text>

    <text x="20" y="128" font-family="Consolas,monospace" font-size="7.5" letter-spacing=".1em" fill="#5b5560">ПРОВЕРКА INVEST</text>

    <g font-family="Consolas,monospace" text-anchor="middle">
      <rect x="20" y="138" width="98" height="42" rx="6" fill="#fff" stroke="#2d3142"/><text x="69" y="155" font-size="9" fill="#0F8A63">I</text><text x="69" y="170" font-size="6.5" fill="#2d3142">независима</text>
      <rect x="128" y="138" width="98" height="42" rx="6" fill="#fff" stroke="#2d3142"/><text x="177" y="155" font-size="9" fill="#0F8A63">N</text><text x="177" y="170" font-size="6.5" fill="#2d3142">обсуждаема</text>
      <rect x="236" y="138" width="98" height="42" rx="6" fill="#fff" stroke="#2d3142"/><text x="285" y="155" font-size="9" fill="#0F8A63">V</text><text x="285" y="170" font-size="6.5" fill="#2d3142">ценна</text>
      <rect x="344" y="138" width="98" height="42" rx="6" fill="#fff" stroke="#2d3142"/><text x="393" y="155" font-size="9" fill="#0F8A63">E</text><text x="393" y="170" font-size="6.5" fill="#2d3142">оцениваема</text>
      <rect x="452" y="138" width="98" height="42" rx="6" fill="#fff" stroke="#2d3142"/><text x="501" y="155" font-size="9" fill="#0F8A63">S</text><text x="501" y="170" font-size="6.5" fill="#2d3142">мала</text>
      <rect x="560" y="138" width="98" height="42" rx="6" fill="#fff" stroke="#2d3142"/><text x="609" y="155" font-size="9" fill="#0F8A63">T</text><text x="609" y="170" font-size="6.5" fill="#2d3142">проверяема</text>
    </g>

    <rect x="20" y="192" width="638" height="30" rx="7" fill="#fff" stroke="#b9ac9f"/>
    <text x="34" y="211" font-family="Consolas,monospace" font-size="7.5" fill="#2d3142">Критерий приёмки: список открыт, просроченные выделены, есть дата возврата и читатель.</text>

    <text x="340" y="234" text-anchor="middle" font-family="Consolas,monospace" font-size="8" fill="#0F8A63">ИСТОРИЯ БЕЗ ПРОВЕРЯЕМОГО КРИТЕРИЯ НЕ ГОТОВА К РАБОТЕ</text>
  </svg>
  <p class="note">Роль отвечает на «кто», цель на «что», ценность на «зачем». INVEST проверяет качество истории.</p>
</div>
</body>
</html>
