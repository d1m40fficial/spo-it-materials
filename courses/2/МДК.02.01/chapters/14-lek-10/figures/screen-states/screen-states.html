<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Состояния экрана</title>
<style>
  :root { --paper:#faf6f3; --ink:#2d3142; --muted:#5b5560; --accent:#0F8A63; --soft:#E1F5EE; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .note { margin:10px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Интерфейс · состояния</p>
  <svg viewBox="0 0 680 228" role="img" aria-labelledby="ss-title ss-desc">
    <title id="ss-title">Три состояния экрана заявок</title>
    <desc id="ss-desc">Пустой список, список с заявками и сообщение об ошибке с кнопкой повтора.</desc>

    <g font-family="Consolas,monospace">
      <g>
        <rect x="20" y="20" width="196" height="150" rx="8" fill="#fff" stroke="#2d3142"/>
        <line x1="20" y1="42" x2="216" y2="42" stroke="#e4d8cf"/>
        <circle cx="32" cy="31" r="3" fill="#e4d8cf"/><circle cx="43" cy="31" r="3" fill="#e4d8cf"/><circle cx="54" cy="31" r="3" fill="#e4d8cf"/>
        <text x="32" y="62" font-size="8" fill="#2d3142">Заявки</text>
        <text x="118" y="104" text-anchor="middle" font-size="7.5" fill="#5b5560">Пока нет заявок</text>
        <text x="118" y="118" text-anchor="middle" font-size="6.5" fill="#8a8078">создайте первую</text>
        <rect x="66" y="132" width="104" height="22" rx="5" fill="#E1F5EE" stroke="#0F8A63"/>
        <text x="118" y="147" text-anchor="middle" font-size="7" fill="#0F8A63">Создать заявку</text>
        <text x="118" y="190" text-anchor="middle" font-size="7.5" fill="#0F8A63">ПУСТО</text>
      </g>

      <g>
        <rect x="242" y="20" width="196" height="150" rx="8" fill="#fff" stroke="#2d3142"/>
        <line x1="242" y1="42" x2="438" y2="42" stroke="#e4d8cf"/>
        <circle cx="254" cy="31" r="3" fill="#e4d8cf"/><circle cx="265" cy="31" r="3" fill="#e4d8cf"/><circle cx="276" cy="31" r="3" fill="#e4d8cf"/>
        <text x="254" y="62" font-size="8" fill="#2d3142">Заявки</text>
        <g font-size="6.8">
          <rect x="254" y="74" width="172" height="22" rx="4" fill="#f7f3ec" stroke="#e4d8cf"/><text x="262" y="88">Лампа в 214</text><text x="412" y="88" text-anchor="end" fill="#0F8A63">новая</text>
          <rect x="254" y="102" width="172" height="22" rx="4" fill="#f7f3ec" stroke="#e4d8cf"/><text x="262" y="116">Замок в 310</text><text x="412" y="116" text-anchor="end" fill="#b07a1e">в работе</text>
          <rect x="254" y="130" width="172" height="22" rx="4" fill="#f7f3ec" stroke="#e4d8cf"/><text x="262" y="144">Стул в 214</text><text x="412" y="144" text-anchor="end" fill="#5b5560">выполнена</text>
        </g>
        <text x="340" y="190" text-anchor="middle" font-size="7.5" fill="#0F8A63">СПИСОК</text>
      </g>

      <g>
        <rect x="464" y="20" width="196" height="150" rx="8" fill="#fff" stroke="#2d3142"/>
        <line x1="464" y1="42" x2="660" y2="42" stroke="#e4d8cf"/>
        <circle cx="476" cy="31" r="3" fill="#e4d8cf"/><circle cx="487" cy="31" r="3" fill="#e4d8cf"/><circle cx="498" cy="31" r="3" fill="#e4d8cf"/>
        <text x="476" y="62" font-size="8" fill="#2d3142">Заявки</text>
        <text x="562" y="96" text-anchor="middle" font-size="7.5" fill="#b23a2b">Не удалось загрузить</text>
        <text x="562" y="110" text-anchor="middle" font-size="6.5" fill="#8a8078">сервер не ответил</text>
        <rect x="510" y="124" width="104" height="22" rx="5" fill="#fff" stroke="#b23a2b"/>
        <text x="562" y="139" text-anchor="middle" font-size="7" fill="#b23a2b">Повторить</text>
        <text x="562" y="190" text-anchor="middle" font-size="7.5" fill="#0F8A63">ОШИБКА</text>
      </g>
    </g>

    <text x="340" y="216" text-anchor="middle" font-family="Consolas,monospace" font-size="8" fill="#0F8A63">ЭКРАН ПРОЕКТИРУЮТ ВМЕСТЕ С ПУСТЫМ И ОШИБОЧНЫМ СОСТОЯНИЕМ</text>
  </svg>
  <p class="note">Состояние ошибки объясняет причину и даёт выход, а не только сообщает о сбое.</p>
</div>
</body>
</html>
