<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Объекты коммита</title>
<style>
  :root { --paper:#faf6f3; --ink:#2d3142; --muted:#5b5560; --accent:#0F8A63; --soft:#E1F5EE; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .note { margin:10px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Git · объекты и ссылки</p>
  <svg viewBox="0 0 680 262" role="img" aria-labelledby="go-title go-desc">
    <title id="go-title">Объекты двух коммитов</title>
    <desc id="go-desc">Коммит ссылается на дерево, дерево на файлы. Файл, который не менялся, представлен одним общим объектом в обоих коммитах.</desc>

    <g font-family="Consolas,monospace" text-anchor="middle">
      <rect x="18" y="24" width="138" height="58" rx="7" fill="#E1F5EE" stroke="#0F8A63" stroke-width="1.6"/>
      <text x="87" y="42" font-size="8" fill="#0F8A63">commit 9f3c1a</text>
      <text x="87" y="57" font-size="6.6" fill="#2d3142">автор, дата</text>
      <text x="87" y="70" font-size="6.6" fill="#2d3142">сообщение</text>

      <rect x="178" y="24" width="120" height="58" rx="7" fill="#fff" stroke="#2d3142"/>
      <text x="238" y="42" font-size="8">tree</text>
      <text x="238" y="57" font-size="6.6" fill="#5b5560">app.py</text>
      <text x="238" y="70" font-size="6.6" fill="#5b5560">README.md</text>

      <rect x="18" y="150" width="138" height="58" rx="7" fill="#fff" stroke="#2d3142"/>
      <text x="87" y="168" font-size="8">commit 2b7d04</text>
      <text x="87" y="183" font-size="6.6" fill="#2d3142">автор, дата</text>
      <text x="87" y="196" font-size="6.6" fill="#2d3142">сообщение</text>

      <rect x="178" y="150" width="120" height="58" rx="7" fill="#fff" stroke="#2d3142"/>
      <text x="238" y="168" font-size="8">tree</text>
      <text x="238" y="183" font-size="6.6" fill="#5b5560">app.py</text>
      <text x="238" y="196" font-size="6.6" fill="#5b5560">README.md</text>

      <rect x="340" y="8" width="178" height="44" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="429" y="26" font-size="7.4">blob 4b1c</text>
      <text x="429" y="41" font-size="6.6" fill="#5b5560">app.py, новая версия</text>

      <rect x="340" y="94" width="178" height="44" rx="6" fill="#E1F5EE" stroke="#0F8A63" stroke-width="1.6"/>
      <text x="429" y="112" font-size="7.4" fill="#0F8A63">blob 7d2e</text>
      <text x="429" y="127" font-size="6.6" fill="#0F8A63">README.md, общий</text>

      <rect x="340" y="180" width="178" height="44" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="429" y="198" font-size="7.4">blob 91af</text>
      <text x="429" y="213" font-size="6.6" fill="#5b5560">app.py, старая версия</text>
    </g>

    <g stroke="#5b5560" stroke-width="1.4" fill="none" marker-end="url(#arw-go)">
      <path d="M156 53h18"/>
      <path d="M156 179h18"/>
      <path d="M298 45l34-15"/>
      <path d="M298 60l34 50"/>
      <path d="M298 171l34-55"/>
      <path d="M298 186l34 16"/>
      <path d="M87 82v62"/>
    </g>
    <text x="97" y="118" font-family="Consolas,monospace" font-size="6.8" fill="#5b5560" text-anchor="start">parent</text>

    <text x="429" y="158" text-anchor="middle" font-family="Consolas,monospace" font-size="6.6" fill="#0F8A63">один объект на два коммита</text>

    <line x1="18" y1="234" x2="662" y2="234" stroke="#b9ac9f" stroke-width="1"/>
    <text x="340" y="252" text-anchor="middle" font-family="Consolas,monospace" font-size="7.2" fill="#0F8A63">ИМЯ ОБЪЕКТА = ХЕШ ЕГО СОДЕРЖИМОГО</text>

    <defs>
      <marker id="arw-go" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b5560"/></marker>
    </defs>
  </svg>
  <p class="note">Коммит не хранит копию файлов. Он указывает на дерево, а дерево на объекты. Неизменённый файл остаётся тем же объектом.</p>
</div>
</body>
</html>
