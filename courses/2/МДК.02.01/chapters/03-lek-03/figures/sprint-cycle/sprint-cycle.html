<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Спринт и доска</title>
<style>
  :root { --paper:#faf6f3; --ink:#2d3142; --muted:#5b5560; --accent:#0F8A63; --soft:#E1F5EE; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .note { margin:10px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Agile · спринт и поток</p>
  <svg viewBox="0 0 680 250" role="img" aria-labelledby="sp-title sp-desc">
    <title id="sp-title">Цикл спринта и доска Kanban</title>
    <desc id="sp-desc">Спринт идёт от планирования через ежедневные встречи к обзору и ретроспективе. Доска Kanban ограничивает число задач в работе.</desc>

    <circle cx="175" cy="120" r="82" fill="none" stroke="#cfc6bb" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="175" y="112" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#0F8A63">СПРИНТ</text>
    <text x="175" y="128" text-anchor="middle" font-family="Consolas,monospace" font-size="8" fill="#5b5560">1-2 недели</text>

    <g font-family="Consolas,monospace" font-size="8" text-anchor="middle">
      <rect x="115" y="20" width="120" height="30" rx="6" fill="#fff" stroke="#2d3142"/><text x="175" y="39">планирование</text>
      <rect x="278" y="104" width="110" height="30" rx="6" fill="#E1F5EE" stroke="#0F8A63"/><text x="333" y="123">ежедневно</text>
      <rect x="115" y="190" width="120" height="30" rx="6" fill="#fff" stroke="#2d3142"/><text x="175" y="209">обзор</text>
      <rect x="32" y="104" width="110" height="30" rx="6" fill="#fff" stroke="#2d3142"/><text x="87" y="123">ретроспектива</text>
    </g>

    <g stroke="#5b5560" stroke-width="1.4" fill="none" marker-end="url(#arw-sp)">
      <path d="M232 48c30 14 52 32 62 52"/>
      <path d="M322 138c-8 22-28 40-52 50"/>
      <path d="M112 188c-24-10-40-28-46-50"/>
      <path d="M76 96c8-22 26-40 48-50"/>
    </g>

    <rect x="400" y="24" width="256" height="196" rx="9" fill="#fff" stroke="#2d3142"/>
    <text x="414" y="44" font-family="Consolas,monospace" font-size="8.5" letter-spacing=".1em" fill="#5b5560">ДОСКА KANBAN</text>

    <g font-family="Consolas,monospace" font-size="7.5">
      <rect x="414" y="56" width="72" height="20" rx="4" fill="#f5f1ea" stroke="#cfc6bb"/><text x="450" y="69" text-anchor="middle" fill="#5b5560">к выполнению</text>
      <rect x="492" y="56" width="72" height="20" rx="4" fill="#E1F5EE" stroke="#0F8A63"/><text x="528" y="69" text-anchor="middle" fill="#0F8A63">в работе 2</text>
      <rect x="570" y="56" width="72" height="20" rx="4" fill="#f5f1ea" stroke="#cfc6bb"/><text x="606" y="69" text-anchor="middle" fill="#5b5560">готово</text>

      <rect x="414" y="86" width="72" height="26" rx="4" fill="#fff" stroke="#2d3142"/><text x="450" y="103" text-anchor="middle">история 5</text>
      <rect x="414" y="120" width="72" height="26" rx="4" fill="#fff" stroke="#2d3142"/><text x="450" y="137" text-anchor="middle">история 6</text>
      <rect x="414" y="154" width="72" height="26" rx="4" fill="#fff" stroke="#2d3142"/><text x="450" y="171" text-anchor="middle">история 7</text>

      <rect x="492" y="86" width="72" height="26" rx="4" fill="#E1F5EE" stroke="#0F8A63"/><text x="528" y="103" text-anchor="middle">история 3</text>
      <rect x="492" y="120" width="72" height="26" rx="4" fill="#E1F5EE" stroke="#0F8A63"/><text x="528" y="137" text-anchor="middle">история 4</text>
      <rect x="492" y="154" width="72" height="26" rx="4" fill="#fff" stroke="#cfc6bb" stroke-dasharray="3 3"/><text x="528" y="171" text-anchor="middle" fill="#8a8078">лимит 2</text>

      <rect x="570" y="86" width="72" height="26" rx="4" fill="#fff" stroke="#2d3142"/><text x="606" y="103" text-anchor="middle">история 1</text>
      <rect x="570" y="120" width="72" height="26" rx="4" fill="#fff" stroke="#2d3142"/><text x="606" y="137" text-anchor="middle">история 2</text>
    </g>

    <text x="175" y="243" text-anchor="middle" font-family="Consolas,monospace" font-size="8" fill="#0F8A63">КАЖДОЕ СОБЫТИЕ ДАЁТ РЕШЕНИЕ, А НЕ ОТЧЁТ</text>
    <defs>
      <marker id="arw-sp" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b5560"/></marker>
    </defs>
  </svg>
  <p class="note">Scrum задаёт ритм и роли, Kanban ограничивает число задач в работе.</p>
</div>
</body>
</html>
