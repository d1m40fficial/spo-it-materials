<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Строковые операции: живая лаборатория</title>
<style>
  :root { --paper:#f7f4ee; --card:#fffdf8; --ink:#1a1916; --muted:#6b6459; --rule:#ded6c8; --accent:#2f6f5e; --accent-soft:#ddebe5; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .demo { background:var(--paper); border:1px solid var(--rule); border-radius:14px; padding:18px; }
  .head { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; padding-bottom:10px; border-bottom:1px solid var(--rule); }
  .eyebrow { margin:0 0 4px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  h3 { margin:0; font-size:20px; line-height:1.2; }
  .len { font:12px/1.4 Consolas,monospace; color:var(--muted); }
  label { display:block; margin:14px 0 6px; font:600 11px/1.2 Consolas,monospace; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  input { width:100%; padding:11px 12px; font:15px/1.3 Consolas,monospace; color:var(--ink); background:var(--card); border:1px solid var(--rule); border-radius:9px; }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .controls { display:flex; flex-wrap:wrap; gap:7px; margin-top:12px; }
  button { font:600 12px/1 "Segoe UI",system-ui,sans-serif; padding:9px 11px; border-radius:9px; border:1px solid var(--rule); background:var(--card); color:var(--ink); cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .out { margin-top:14px; padding:12px; border:1px solid var(--rule); border-radius:10px; background:var(--card); }
  .out .lbl { font:600 9px/1.2 Consolas,monospace; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .out .val { margin-top:6px; font:15px/1.45 Consolas,monospace; color:var(--ink); word-break:break-word; white-space:pre-wrap; }
  .out .why { margin-top:8px; font-size:12px; line-height:1.5; color:var(--muted); }
  .empty { color:#b23a2b; }
  @media (max-width:560px) { .demo { padding:12px; } }
</style>
</head>
<body>
<div class="demo">
  <div class="head">
    <div><p class="eyebrow">Строка · лаборатория</p><h3>Строковые операции</h3></div>
    <div class="len">символов: <b id="len">13</b></div>
  </div>
  <label for="text">Строка</label>
  <input id="text" value="  Учебный текст  " spellcheck="false">
  <div class="controls">
    <button data-op="len">len()</button>
    <button data-op="upper">upper()</button>
    <button data-op="lower">lower()</button>
    <button data-op="title">title()</button>
    <button data-op="strip">strip()</button>
    <button data-op="replace">replace()</button>
    <button data-op="split">split()</button>
    <button data-op="reverse">[::-1]</button>
  </div>
  <div class="out">
    <div class="lbl" id="op-label">Результат</div>
    <div class="val" id="value">Нажмите кнопку, чтобы применить операцию.</div>
    <div class="why" id="why">Каждая операция возвращает новую строку. Исходная строка не меняется.</div>
  </div>
</div>
<script>
(function () {
  var input = document.getElementById('text');
  var len = document.getElementById('len');
  var value = document.getElementById('value');
  var why = document.getElementById('why');
  var label = document.getElementById('op-label');
  var buttons = document.querySelectorAll('button[data-op]');

  function show(text) { value.textContent = text; value.classList.remove('empty'); }

  function apply(op) {
    var s = input.value;
    label.textContent = op;
    buttons.forEach(function (b) { b.classList.toggle('on', b.dataset.op === op); });
    if (op === 'len') {
      show(String(s.length));
      why.textContent = 'len() считает символы, включая пробелы по краям.';
    } else if (op === 'upper') {
      show(s.toUpperCase());
      why.textContent = 'upper() переводит все буквы в верхний регистр.';
    } else if (op === 'lower') {
      show(s.toLowerCase());
      why.textContent = 'lower() переводит все буквы в нижний регистр. Так сравнивают ответы пользователя.';
    } else if (op === 'title') {
      show(s.toLowerCase().replace(/(^|\s)\S/g, function (c) { return c.toUpperCase(); }));
      why.textContent = 'title() делает заглавной первую букву каждого слова.';
    } else if (op === 'strip') {
      show('[' + s.trim() + ']');
      why.textContent = 'strip() убирает пробелы и переводы строк по краям. Скобки показывают границы.';
    } else if (op === 'replace') {
      show(s.split(' ').join('_'));
      why.textContent = 'replace(" ", "_") заменяет все пробелы на подчёркивания.';
    } else if (op === 'split') {
      var parts = s.trim().split(/\s+/);
      show('[' + parts.map(function (p) { return '"' + p + '"'; }).join(', ') + ']');
      why.textContent = 'split() без аргумента делит строку по пробелам и возвращает список слов.';
    } else if (op === 'reverse') {
      show(s.split('').reverse().join(''));
      why.textContent = 'Срез [::-1] читает строку с конца. Строка при этом не меняется.';
    }
  }

  input.addEventListener('input', function () { len.textContent = input.value.length; });
  buttons.forEach(function (b) { b.addEventListener('click', function () { apply(b.dataset.op); }); });
  len.textContent = input.value.length;
  apply('len');
})();
</script>
</body>
</html>
