<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Практика: от данных к отчёту</title>
<style>
  :root { --paper:#f7f4ee; --ink:#2d3142; --muted:#4f5d75; --accent:#bf4520; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Geist","Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 "Geist Mono",Consolas,ui-monospace,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Практика · Diagram Design</p>
  <svg viewBox="0 0 680 220" role="img" aria-labelledby="prac-title prac-desc">
    <title id="prac-title">Четыре шага программы расчёта</title>
    <desc id="prac-desc">Программа получает данные, сохраняет их в переменные, вычисляет выражение и печатает отчёт.</desc>
    <defs>
      <marker id="arw-prac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="arw-prac-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
    </defs>

    <g transform="translate(20 0)">
    <line x1="170" y1="115" x2="188" y2="115" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arw-prac)"/>
    <line x1="310" y1="115" x2="328" y2="115" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arw-prac)"/>
    <line x1="450" y1="115" x2="468" y2="115" stroke="#bf4520" stroke-width="1.3" marker-end="url(#arw-prac-accent)"/>

    <circle cx="110" cy="72" r="11" fill="#2d3142"/>
    <text x="110" y="76" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" fill="#f7f4ee">01</text>
    <rect x="50" y="90" width="120" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="110" y="116" text-anchor="middle" font-family="'Geist',sans-serif" font-size="12" font-weight="600" fill="#2d3142">Ввод</text>
    <text x="110" y="134" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="9" fill="#4f5d75">input()</text>

    <circle cx="250" cy="72" r="11" fill="#2d3142"/>
    <text x="250" y="76" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" fill="#f7f4ee">02</text>
    <rect x="190" y="90" width="120" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="250" y="116" text-anchor="middle" font-family="'Geist',sans-serif" font-size="12" font-weight="600" fill="#2d3142">Переменные</text>
    <text x="250" y="134" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="9" fill="#4f5d75">цена · кол-во</text>

    <circle cx="390" cy="72" r="11" fill="#2d3142"/>
    <text x="390" y="76" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" fill="#f7f4ee">03</text>
    <rect x="330" y="90" width="120" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="390" y="116" text-anchor="middle" font-family="'Geist',sans-serif" font-size="12" font-weight="600" fill="#2d3142">Выражение</text>
    <text x="390" y="134" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="9" fill="#4f5d75">сумма · скидка</text>

    <circle cx="530" cy="72" r="11" fill="#bf4520"/>
    <text x="530" y="76" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" fill="#f7f4ee">04</text>
    <rect x="470" y="90" width="120" height="60" rx="6" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="1.2"/>
    <text x="530" y="116" text-anchor="middle" font-family="'Geist',sans-serif" font-size="12" font-weight="600" fill="#bf4520">Вывод</text>
    <text x="530" y="134" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="9" fill="#bf4520">f-string</text>

    <line x1="50" y1="182" x2="590" y2="182" stroke="rgba(45,49,66,.12)" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="320" y="202" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8.5" fill="#4f5d75">ПРОВЕРКА: ОБЫЧНЫЕ · ГРАНИЧНЫЕ · ОШИБОЧНЫЕ ДАННЫЕ</text>
    </g>
  </svg>
</div>
</body>
</html>
