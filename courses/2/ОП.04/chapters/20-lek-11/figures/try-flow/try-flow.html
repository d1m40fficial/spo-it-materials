<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>try, except, else, finally</title>
<style>
  :root { --paper:#f7f4ee; --ink:#2d3142; --muted:#4f5d75; --accent:#2f6f5e; --bad:#b23a2b; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Исключения · порядок блоков</p>
  <svg viewBox="0 0 680 500" role="img" aria-labelledby="try-title try-desc">
    <title id="try-title">Порядок блоков try, except, else, finally</title>
    <desc id="try-desc">Блок try выполняет преобразование. При ошибке управление уходит в except, без ошибки в else. Блок finally выполняется в любом случае, затем работа продолжается.</desc>
    <defs>
      <marker id="arw-try" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#4f5d75"/></marker>
      <marker id="arw-try-bad" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#b23a2b"/></marker>
    </defs>

    <line x1="280" y1="60" x2="280" y2="76" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arw-try)"/>
    <line x1="280" y1="126" x2="280" y2="150" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arw-try)"/>
    <line x1="280" y1="238" x2="280" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arw-try)"/>
    <line x1="280" y1="320" x2="280" y2="358" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arw-try)"/>
    <line x1="280" y1="408" x2="280" y2="436" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arw-try)"/>

    <line x1="400" y1="194" x2="438" y2="194" stroke="#b23a2b" stroke-width="1.3" marker-end="url(#arw-try-bad)"/>
    <polyline points="540,216 540,383 392,383" fill="none" stroke="#b23a2b" stroke-width="1.2"/>
    <polyline points="280,238 280,246" stroke="#4f5d75" stroke-width="1.2"/>

    <rect x="210" y="20" width="140" height="40" rx="20" fill="rgba(45,49,66,.03)" stroke="#2d3142"/>
    <text x="280" y="45" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Начало</text>

    <rect x="190" y="76" width="180" height="50" rx="7" fill="#ffffff" stroke="#2d3142"/>
    <text x="280" y="98" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#2d3142">try:</text>
    <text x="280" y="114" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#2d3142">x = int(raw)</text>

    <polygon points="280,150 400,194 280,238 160,194" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="280" y="193" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#2d3142">Ошибка?</text>
    <text x="418" y="187" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#b23a2b">ДА</text>
    <text x="300" y="260" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#4f5d75">НЕТ</text>

    <rect x="210" y="272" width="180" height="48" rx="7" fill="#ddebe5" stroke="#2f6f5e"/>
    <text x="280" y="292" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#2d3142">else:</text>
    <text x="280" y="308" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#2f6f5e">число используется</text>

    <rect x="440" y="172" width="130" height="44" rx="7" fill="rgba(178,58,43,.07)" stroke="#b23a2b"/>
    <text x="505" y="190" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#2d3142">except</text>
    <text x="505" y="206" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#b23a2b">ValueError</text>

    <rect x="210" y="358" width="180" height="50" rx="7" fill="#ffffff" stroke="#2d3142"/>
    <text x="280" y="380" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#2d3142">finally:</text>
    <text x="280" y="396" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#4f5d75">выполняется всегда</text>

    <rect x="230" y="436" width="100" height="40" rx="20" fill="rgba(45,49,66,.03)" stroke="#2d3142"/>
    <text x="280" y="461" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Конец</text>

    <rect x="16" y="284" width="172" height="74" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-dasharray="4 4"/>
    <text x="102" y="304" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9.5" fill="#4f5d75">Порядок перехвата:</text>
    <text x="102" y="322" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#2d3142">ValueError</text>
    <text x="102" y="338" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#2d3142">затем Exception</text>

    <text x="340" y="492" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#4f5d75">СНАЧАЛА УЗКОЕ ИСКЛЮЧЕНИЕ, ПОТОМ ОБЩЕЕ</text>
  </svg>
</div>
</body>
</html>
