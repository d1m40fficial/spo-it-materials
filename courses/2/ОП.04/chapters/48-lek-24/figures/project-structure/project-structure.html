<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Структура учебного проекта</title>
<style>
  :root { --paper:#f7f4ee; --ink:#2d3142; --muted:#4f5d75; --accent:#2f6f5e; --accent-soft:#ddebe5; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .note { margin:10px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Проект · файлы и импорты</p>
  <svg viewBox="0 0 680 340" role="img" aria-labelledby="pr-title pr-desc">
    <title id="pr-title">Структура проекта и связи модулей</title>
    <desc id="pr-desc">В проекте есть main.py, пакет app с модулями readers, metrics и report, папка data и папка tests. main.py импортирует модули пакета, тесты проверяют metrics.</desc>

    <text x="20" y="26" font-family="Consolas,monospace" font-size="9" letter-spacing=".1em" fill="#4f5d75">ФАЙЛЫ</text>

    <rect x="20" y="38" width="300" height="256" rx="10" fill="#ffffff" stroke="#2d3142"/>
    <g font-family="Consolas,monospace" font-size="10.5">
      <text x="34" y="62" fill="#2f6f5e">project/</text>
      <text x="48" y="82" fill="#2d3142">main.py</text>
      <text x="48" y="102" fill="#4f5d75">data/</text>
      <text x="64" y="122" fill="#4f5d75">catalog.json</text>
      <text x="48" y="142" fill="#4f5d75">app/</text>
      <text x="64" y="162" fill="#4f5d75">__init__.py</text>
      <text x="64" y="182" fill="#2d3142">readers.py</text>
      <text x="64" y="202" fill="#2d3142">metrics.py</text>
      <text x="64" y="222" fill="#2d3142">report.py</text>
      <text x="48" y="242" fill="#4f5d75">tests/</text>
      <text x="64" y="262" fill="#4f5d75">test_metrics.py</text>
    </g>

    <text x="370" y="26" font-family="Consolas,monospace" font-size="9" letter-spacing=".1em" fill="#4f5d75">ИМПОРТЫ</text>
    <defs>
      <marker id="arw-pr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    </defs>

    <rect x="350" y="42" width="120" height="38" rx="7" fill="#ddebe5" stroke="#2f6f5e"/>
    <text x="410" y="66" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#2f6f5e">main.py</text>

    <rect x="350" y="112" width="120" height="38" rx="7" fill="#ffffff" stroke="#2d3142"/>
    <text x="410" y="136" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#2d3142">readers.py</text>

    <rect x="350" y="182" width="120" height="38" rx="7" fill="#ffffff" stroke="#2d3142"/>
    <text x="410" y="206" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#2d3142">metrics.py</text>

    <rect x="350" y="252" width="120" height="38" rx="7" fill="#ffffff" stroke="#2d3142"/>
    <text x="410" y="276" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#2d3142">report.py</text>

    <rect x="530" y="182" width="130" height="38" rx="7" fill="#ffffff" stroke="#2d3142"/>
    <text x="595" y="206" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#2d3142">test_metrics.py</text>

    <line x1="410" y1="80" x2="410" y2="110" stroke="#4f5d75" marker-end="url(#arw-pr)"/>
    <line x1="410" y1="150" x2="410" y2="180" stroke="#4f5d75" marker-end="url(#arw-pr)"/>
    <line x1="410" y1="220" x2="410" y2="250" stroke="#4f5d75" marker-end="url(#arw-pr)"/>
    <line x1="530" y1="201" x2="472" y2="201" stroke="#4f5d75" marker-end="url(#arw-pr)"/>

    <text x="418" y="98" font-family="Consolas,monospace" font-size="8" fill="#4f5d75">import</text>
    <text x="418" y="168" font-family="Consolas,monospace" font-size="8" fill="#4f5d75">import</text>
    <text x="418" y="238" font-family="Consolas,monospace" font-size="8" fill="#4f5d75">import</text>
    <text x="492" y="194" font-family="Consolas,monospace" font-size="8" fill="#4f5d75">import</text>

    <text x="350" y="316" font-family="Consolas,monospace" font-size="8.5" fill="#4f5d75">ЗАПУСК: python main.py · ТЕСТЫ: python -m unittest</text>
  </svg>
  <p class="note">Точка входа запускает конвейер, пакет хранит логику, тесты проверяют модули отдельно.</p>
</div>
</body>
</html>
