<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Матрица: строки, столбцы, индексы</title>
<style>
  :root { --paper:#f7f4ee; --ink:#2d3142; --muted:#4f5d75; --accent:#2f6f5e; --accent-soft:#ddebe5; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .note { margin:10px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Матрица · строки и столбцы</p>
  <svg viewBox="0 0 680 320" role="img" aria-labelledby="mx-title mx-desc">
    <title id="mx-title">Матрица три на четыре</title>
    <desc id="mx-desc">Матрица из трёх строк и четырёх столбцов. Элемент matrix[1][2] равен 7. Строка matrix[1] содержит 5, 6, 7, 8.</desc>

    <text x="150" y="30" text-anchor="middle" font-family="Consolas,monospace" font-size="9" letter-spacing=".1em" fill="#4f5d75">СТОЛБЦЫ</text>

    <g font-family="Consolas,monospace" text-anchor="middle" font-size="10" fill="#4f5d75">
      <text x="126" y="52">0</text><text x="196" y="52">1</text><text x="266" y="52">2</text><text x="336" y="52">3</text>
    </g>
    <text x="60" y="61" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#4f5d75">стр.</text>

    <text x="60" y="98" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#4f5d75">0</text>
    <text x="60" y="154" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#4f5d75">1</text>
    <text x="60" y="210" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#4f5d75">2</text>

    <g font-family="Consolas,monospace" text-anchor="middle" font-size="13" font-weight="600">
      <rect x="96" y="66" width="60" height="44" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="126" y="94" fill="#2d3142">1</text>
      <rect x="166" y="66" width="60" height="44" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="196" y="94" fill="#2d3142">2</text>
      <rect x="236" y="66" width="60" height="44" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="266" y="94" fill="#2d3142">3</text>
      <rect x="306" y="66" width="60" height="44" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="336" y="94" fill="#2d3142">4</text>

      <rect x="96" y="122" width="60" height="44" rx="6" fill="#ddebe5" stroke="#2f6f5e"/><text x="126" y="150" fill="#2f6f5e">5</text>
      <rect x="166" y="122" width="60" height="44" rx="6" fill="#ddebe5" stroke="#2f6f5e"/><text x="196" y="150" fill="#2f6f5e">6</text>
      <rect x="236" y="122" width="60" height="44" rx="6" fill="#2f6f5e" stroke="#2f6f5e"/><text x="266" y="150" fill="#ffffff">7</text>
      <rect x="306" y="122" width="60" height="44" rx="6" fill="#ddebe5" stroke="#2f6f5e"/><text x="336" y="150" fill="#2f6f5e">8</text>

      <rect x="96" y="178" width="60" height="44" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="126" y="206" fill="#2d3142">9</text>
      <rect x="166" y="178" width="60" height="44" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="196" y="206" fill="#2d3142">10</text>
      <rect x="236" y="178" width="60" height="44" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="266" y="206" fill="#2d3142">11</text>
      <rect x="306" y="178" width="60" height="44" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="336" y="206" fill="#2d3142">12</text>
    </g>

    <rect x="420" y="46" width="244" height="86" rx="8" fill="#ffffff" stroke="#2d3142"/>
    <text x="434" y="68" font-family="Consolas,monospace" font-size="10" fill="#2f6f5e">matrix[1]</text>
    <text x="434" y="88" font-family="Consolas,monospace" font-size="10" fill="#4f5d75">→ [5, 6, 7, 8]</text>
    <text x="434" y="110" font-family="Consolas,monospace" font-size="10" fill="#2f6f5e">matrix[1][2]</text>
    <text x="434" y="128" font-family="Consolas,monospace" font-size="10" fill="#4f5d75">→ 7</text>

    <rect x="420" y="146" width="244" height="86" rx="8" fill="#ffffff" stroke="#2d3142"/>
    <text x="434" y="168" font-family="Consolas,monospace" font-size="10" fill="#4f5d75">len(matrix) = 3</text>
    <text x="434" y="188" font-family="Consolas,monospace" font-size="10" fill="#4f5d75">len(matrix[0]) = 4</text>
    <text x="434" y="210" font-family="Segoe UI,sans-serif" font-size="9.5" fill="#4f5d75">сначала строка, потом столбец</text>

    <text x="150" y="252" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#4f5d75">matrix[1][2] подчёркнут: строка 1, столбец 2</text>
    <text x="340" y="288" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#4f5d75">Вложенный список: внешний индекс выбирает строку, внутренний столбец.</text>
  </svg>
  <p class="note">Матрица это список строк, а строка это список чисел. Порядок индексов всегда «строка, затем столбец».</p>
</div>
</body>
</html>
