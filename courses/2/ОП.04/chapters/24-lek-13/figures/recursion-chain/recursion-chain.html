<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Рекурсия: вызов вниз, возврат вверх</title>
<style>
  :root { --paper:#f7f4ee; --ink:#2d3142; --muted:#4f5d75; --accent:#2f6f5e; --accent-soft:#ddebe5; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .note { margin:10px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Рекурсия · факториал</p>
  <svg viewBox="0 0 680 340" role="img" aria-labelledby="rec-title rec-desc">
    <title id="rec-title">Цепочка вызовов factorial(4)</title>
    <desc id="rec-desc">Вызовы идут вниз от factorial(4) до базового случая factorial(1). Затем значения возвращаются вверх: 1, 2, 6, 24.</desc>
    <defs>
      <marker id="arw-rec" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="arw-rec-acc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2f6f5e"/></marker>
    </defs>

    <text x="60" y="18" font-family="Consolas,monospace" font-size="9" letter-spacing=".1em" fill="#4f5d75">ВЫЗОВ</text>
    <text x="470" y="18" font-family="Consolas,monospace" font-size="9" letter-spacing=".1em" fill="#2f6f5e">ВОЗВРАТ</text>

    <rect x="60" y="26" width="180" height="50" rx="8" fill="#ffffff" stroke="#2d3142"/>
    <text x="150" y="56" text-anchor="middle" font-family="Consolas,monospace" font-size="12" font-weight="600" fill="#2d3142">factorial(4)</text>
    <rect x="60" y="98" width="180" height="50" rx="8" fill="#ffffff" stroke="#2d3142"/>
    <text x="150" y="128" text-anchor="middle" font-family="Consolas,monospace" font-size="12" font-weight="600" fill="#2d3142">factorial(3)</text>
    <rect x="60" y="170" width="180" height="50" rx="8" fill="#ffffff" stroke="#2d3142"/>
    <text x="150" y="200" text-anchor="middle" font-family="Consolas,monospace" font-size="12" font-weight="600" fill="#2d3142">factorial(2)</text>
    <rect x="60" y="242" width="180" height="50" rx="8" fill="#ddebe5" stroke="#2f6f5e" stroke-width="1.4"/>
    <text x="150" y="272" text-anchor="middle" font-family="Consolas,monospace" font-size="12" font-weight="600" fill="#2f6f5e">factorial(1)</text>

    <line x1="150" y1="76" x2="150" y2="96" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arw-rec)"/>
    <line x1="150" y1="148" x2="150" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arw-rec)"/>
    <line x1="150" y1="220" x2="150" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arw-rec)"/>
    <text x="180" y="90" font-family="Consolas,monospace" font-size="8.5" fill="#4f5d75">4 * f(3)</text>
    <text x="180" y="162" font-family="Consolas,monospace" font-size="8.5" fill="#4f5d75">3 * f(2)</text>
    <text x="180" y="234" font-family="Consolas,monospace" font-size="8.5" fill="#4f5d75">2 * f(1)</text>

    <rect x="440" y="26" width="160" height="50" rx="8" fill="#ffffff" stroke="#2f6f5e"/>
    <text x="520" y="56" text-anchor="middle" font-family="Consolas,monospace" font-size="15" font-weight="600" fill="#2f6f5e">24</text>
    <rect x="440" y="98" width="160" height="50" rx="8" fill="#ffffff" stroke="#2f6f5e"/>
    <text x="520" y="128" text-anchor="middle" font-family="Consolas,monospace" font-size="15" font-weight="600" fill="#2f6f5e">6</text>
    <rect x="440" y="170" width="160" height="50" rx="8" fill="#ffffff" stroke="#2f6f5e"/>
    <text x="520" y="200" text-anchor="middle" font-family="Consolas,monospace" font-size="15" font-weight="600" fill="#2f6f5e">2</text>
    <rect x="440" y="242" width="160" height="50" rx="8" fill="#ddebe5" stroke="#2f6f5e" stroke-width="1.4"/>
    <text x="520" y="272" text-anchor="middle" font-family="Consolas,monospace" font-size="15" font-weight="600" fill="#2f6f5e">1</text>

    <line x1="520" y1="242" x2="520" y2="222" stroke="#2f6f5e" stroke-width="1.3" marker-end="url(#arw-rec-acc)"/>
    <line x1="520" y1="170" x2="520" y2="150" stroke="#2f6f5e" stroke-width="1.3" marker-end="url(#arw-rec-acc)"/>
    <line x1="520" y1="98" x2="520" y2="78" stroke="#2f6f5e" stroke-width="1.3" marker-end="url(#arw-rec-acc)"/>
    <text x="544" y="236" font-family="Consolas,monospace" font-size="8.5" fill="#2f6f5e">2 * 1</text>
    <text x="544" y="164" font-family="Consolas,monospace" font-size="8.5" fill="#2f6f5e">3 * 2</text>
    <text x="544" y="92" font-family="Consolas,monospace" font-size="8.5" fill="#2f6f5e">4 * 6</text>

    <line x1="240" y1="267" x2="438" y2="267" stroke="#2f6f5e" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arw-rec-acc)"/>
    <text x="340" y="258" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#2f6f5e">база: вернуть 1</text>

    <text x="340" y="328" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#4f5d75">БЕЗ БАЗОВОГО СЛУЧАЯ ВЫЗОВЫ НЕ ОСТАНОВЯТСЯ</text>
  </svg>
  <p class="note">Каждый вызов ждёт результата следующего. Работа заканчивается на базе и разворачивается обратно.</p>
</div>
</body>
</html>
