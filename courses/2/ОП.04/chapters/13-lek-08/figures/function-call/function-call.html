<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вызов функции: аргументы, тело, возврат</title>
<style>
  :root { --paper:#f7f4ee; --ink:#2d3142; --muted:#4f5d75; --accent:#2f6f5e; --accent-soft:#ddebe5; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Функция · вызов и возврат</p>
  <svg viewBox="0 0 680 400" role="img" aria-labelledby="fn-title fn-desc">
    <title id="fn-title">Вызов функции price_with_discount</title>
    <desc id="fn-desc">Вызов передаёт аргументы 1200 и 10 в параметры price и discount. Тело считает скидку и результат, затем return возвращает 1080 в переменную total.</desc>
    <defs>
      <marker id="arw-fn" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#4f5d75"/></marker>
      <marker id="arw-fn-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#2f6f5e"/></marker>
    </defs>

    <rect x="16" y="60" width="180" height="150" rx="10" fill="#ffffff" stroke="#2d3142"/>
    <text x="106" y="86" text-anchor="middle" font-family="Consolas,monospace" font-size="9" letter-spacing=".1em" fill="#4f5d75">ВЫЗОВ</text>
    <text x="30" y="116" font-family="Consolas,monospace" font-size="10" fill="#2d3142">total = price_with_</text>
    <text x="30" y="132" font-family="Consolas,monospace" font-size="10" fill="#2d3142">discount(1200, 10)</text>
    <rect x="30" y="150" width="152" height="44" rx="6" fill="#ddebe5" stroke="#2f6f5e"/>
    <text x="106" y="168" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#2f6f5e">1200 → price</text>
    <text x="106" y="184" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#2f6f5e">10 → discount</text>

    <line x1="196" y1="135" x2="228" y2="135" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#arw-fn)"/>

    <rect x="232" y="24" width="248" height="336" rx="10" fill="rgba(47,111,94,.05)" stroke="#2f6f5e" stroke-width="1.2"/>
    <text x="356" y="48" text-anchor="middle" font-family="Consolas,monospace" font-size="9" letter-spacing=".1em" fill="#2f6f5e">ТЕЛО ФУНКЦИИ</text>
    <text x="246" y="74" font-family="Consolas,monospace" font-size="9.5" fill="#2d3142">def price_with_discount(</text>
    <text x="246" y="88" font-family="Consolas,monospace" font-size="9.5" fill="#2d3142">    price, discount):</text>

    <rect x="246" y="104" width="220" height="52" rx="6" fill="#ffffff" stroke="#2d3142"/>
    <text x="258" y="122" font-family="Consolas,monospace" font-size="9.5" fill="#4f5d75">discount_value =</text>
    <text x="258" y="138" font-family="Consolas,monospace" font-size="9.5" fill="#2d3142">price * discount / 100</text>

    <rect x="246" y="170" width="220" height="46" rx="6" fill="#ffffff" stroke="#2d3142"/>
    <text x="258" y="188" font-family="Consolas,monospace" font-size="9.5" fill="#4f5d75">result =</text>
    <text x="258" y="204" font-family="Consolas,monospace" font-size="9.5" fill="#2d3142">price - discount_value</text>

    <rect x="246" y="230" width="220" height="44" rx="6" fill="#ddebe5" stroke="#2f6f5e"/>
    <text x="356" y="258" text-anchor="middle" font-family="Consolas,monospace" font-size="11" font-weight="600" fill="#2f6f5e">return result</text>

    <text x="246" y="306" font-family="Consolas,monospace" font-size="9" fill="#4f5d75">1200 * 10 / 100 = 120.0</text>
    <text x="246" y="322" font-family="Consolas,monospace" font-size="9" fill="#4f5d75">1200 - 120.0 = 1080.0</text>
    <text x="246" y="342" font-family="Consolas,monospace" font-size="9" fill="#2f6f5e">локальные имена видны</text>
    <text x="246" y="356" font-family="Consolas,monospace" font-size="9" fill="#2f6f5e">только внутри функции</text>

    <line x1="480" y1="135" x2="512" y2="135" stroke="#2f6f5e" stroke-width="1.4" marker-end="url(#arw-fn-accent)"/>

    <rect x="516" y="60" width="148" height="150" rx="10" fill="#ffffff" stroke="#2d3142"/>
    <text x="590" y="86" text-anchor="middle" font-family="Consolas,monospace" font-size="9" letter-spacing=".1em" fill="#4f5d75">РЕЗУЛЬТАТ</text>
    <text x="590" y="122" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#2d3142">total =</text>
    <text x="590" y="150" text-anchor="middle" font-family="Consolas,monospace" font-size="22" font-weight="600" fill="#2f6f5e">1080.0</text>
    <text x="590" y="174" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" fill="#4f5d75">значение вернулось</text>
    <text x="590" y="190" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" fill="#4f5d75">в место вызова</text>

    <line x1="16" y1="382" x2="664" y2="382" stroke="rgba(45,49,66,.12)" stroke-dasharray="4 4"/>
    <text x="340" y="396" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#4f5d75">БЕЗ RETURN ФУНКЦИЯ ВОЗВРАЩАЕТ NONE</text>
  </svg>
</div>
</body>
</html>
