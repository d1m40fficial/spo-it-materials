<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Класс и объекты</title>
<style>
  :root { --paper:#f7f4ee; --ink:#2d3142; --muted:#4f5d75; --accent:#2f6f5e; --accent-soft:#ddebe5; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .note { margin:10px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Класс · описание и экземпляры</p>
  <svg viewBox="0 0 680 356" role="img" aria-labelledby="cls-title cls-desc">
    <title id="cls-title">Класс Product и два объекта</title>
    <desc id="cls-desc">Класс Product описывает поля name, price, quantity и методы total и discount. Объекты Кружка и Блюдце хранят свои значения и считают итог по одним правилам.</desc>
    <defs>
      <marker id="arw-cls" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    </defs>

    <text x="30" y="26" font-family="Consolas,monospace" font-size="9" letter-spacing=".1em" fill="#4f5d75">КЛАСС · ЧЕРТЁЖ</text>

    <rect x="20" y="38" width="280" height="292" rx="10" fill="#ffffff" stroke="#2d3142"/>
    <rect x="20" y="38" width="280" height="40" rx="10" fill="#ddebe5"/>
    <text x="160" y="63" text-anchor="middle" font-family="Consolas,monospace" font-size="13" font-weight="600" fill="#2f6f5e">class Product</text>

    <text x="36" y="102" font-family="Consolas,monospace" font-size="10" fill="#2d3142">name</text>
    <text x="120" y="102" font-family="Consolas,monospace" font-size="10" fill="#4f5d75">str</text>
    <text x="36" y="122" font-family="Consolas,monospace" font-size="10" fill="#2d3142">price</text>
    <text x="120" y="122" font-family="Consolas,monospace" font-size="10" fill="#4f5d75">float</text>
    <text x="36" y="142" font-family="Consolas,monospace" font-size="10" fill="#2d3142">quantity</text>
    <text x="120" y="142" font-family="Consolas,monospace" font-size="10" fill="#4f5d75">int</text>

    <line x1="36" y1="158" x2="284" y2="158" stroke="rgba(45,49,66,.12)"/>

    <text x="36" y="180" font-family="Consolas,monospace" font-size="10" fill="#2f6f5e">def total(self):</text>
    <text x="36" y="198" font-family="Consolas,monospace" font-size="9" fill="#4f5d75">return self.price * self.quantity</text>

    <text x="36" y="226" font-family="Consolas,monospace" font-size="10" fill="#2f6f5e">def discount(self, percent):</text>
    <text x="36" y="244" font-family="Consolas,monospace" font-size="9" fill="#4f5d75">return self.total() * (1 - percent / 100)</text>

    <text x="160" y="292" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9.5" fill="#4f5d75">методы одни для всех объектов</text>
    <text x="160" y="310" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9.5" fill="#4f5d75">поля у каждого свои</text>

    <line x1="300" y1="120" x2="366" y2="110" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arw-cls)"/>
    <line x1="300" y1="220" x2="366" y2="250" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arw-cls)"/>
    <text x="330" y="100" text-anchor="middle" font-family="Consolas,monospace" font-size="8" fill="#4f5d75">создаёт</text>

    <rect x="370" y="38" width="290" height="140" rx="10" fill="#ffffff" stroke="#2f6f5e"/>
    <text x="386" y="62" font-family="Consolas,monospace" font-size="11" font-weight="600" fill="#2f6f5e">cup = Product("Кружка", 640, 3)</text>
    <text x="386" y="86" font-family="Consolas,monospace" font-size="10" fill="#4f5d75">name = "Кружка"</text>
    <text x="386" y="104" font-family="Consolas,monospace" font-size="10" fill="#4f5d75">price = 640   quantity = 3</text>
    <text x="386" y="128" font-family="Consolas,monospace" font-size="10" fill="#2d3142">cup.total() = 1920</text>
    <text x="386" y="148" font-family="Consolas,monospace" font-size="10" fill="#2d3142">cup.discount(10) = 1728.0</text>

    <rect x="370" y="190" width="290" height="140" rx="10" fill="#ffffff" stroke="#2f6f5e"/>
    <text x="386" y="214" font-family="Consolas,monospace" font-size="11" font-weight="600" fill="#2f6f5e">plate = Product("Блюдце", 420, 2)</text>
    <text x="386" y="238" font-family="Consolas,monospace" font-size="10" fill="#4f5d75">name = "Блюдце"</text>
    <text x="386" y="256" font-family="Consolas,monospace" font-size="10" fill="#4f5d75">price = 420   quantity = 2</text>
    <text x="386" y="280" font-family="Consolas,monospace" font-size="10" fill="#2d3142">plate.total() = 840</text>
    <text x="386" y="300" font-family="Consolas,monospace" font-size="10" fill="#2d3142">plate.discount(10) = 756.0</text>
  </svg>
  <p class="note">Объект это экземпляр класса с собственными значениями полей. Метод вызывается у конкретного объекта.</p>
</div>
</body>
</html>
