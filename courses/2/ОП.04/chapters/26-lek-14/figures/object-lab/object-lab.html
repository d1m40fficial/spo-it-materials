<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Объект: состояние и методы</title>
<style>
  :root { --paper:#f7f4ee; --card:#fffdf8; --ink:#1a1916; --muted:#6b6459; --rule:#ded6c8; --accent:#2f6f5e; --accent-soft:#ddebe5; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .demo { background:var(--paper); border:1px solid var(--rule); border-radius:14px; padding:18px; }
  .head { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; padding-bottom:10px; border-bottom:1px solid var(--rule); }
  .eyebrow { margin:0 0 4px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  h3 { margin:0; font-size:20px; line-height:1.2; }
  .class { font:11px/1.4 Consolas,monospace; color:var(--muted); }
  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:14px; }
  .cell { background:var(--card); border:1px solid var(--rule); border-radius:9px; padding:9px 11px; }
  .cell .k { font:600 8.5px/1.2 Consolas,monospace; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .cell .v { margin-top:4px; font:14px/1.3 Consolas,monospace; color:var(--ink); }
  .result { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:12px; padding:12px; border-radius:10px; background:var(--accent-soft); }
  .result .k { font:600 10px/1.2 Consolas,monospace; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); }
  .result .v { font:600 22px/1 Consolas,monospace; color:var(--accent); }
  .status { min-height:22px; margin-top:8px; font-size:12.5px; color:var(--muted); }
  .status b { color:var(--ink); }
  .controls { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  button { font:600 12.5px/1 "Segoe UI",system-ui,sans-serif; padding:9px 12px; border-radius:9px; border:1px solid var(--rule); background:var(--card); color:var(--ink); cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover { background:#245a4c; color:#fff; }
  @media (max-width:560px) { .grid { grid-template-columns:1fr; } .demo { padding:12px; } }
</style>
</head>
<body>
<div class="demo">
  <div class="head">
    <div><p class="eyebrow">Объект · лаборатория</p><h3>Кружка</h3></div>
    <div class="class">объект класса Product</div>
  </div>
  <div class="grid">
    <div class="cell"><div class="k">name</div><div class="v">"Кружка"</div></div>
    <div class="cell"><div class="k">price</div><div class="v" id="price">640.0</div></div>
    <div class="cell"><div class="k">quantity</div><div class="v" id="qty">3</div></div>
  </div>
  <div class="result">
    <span class="k">total()</span>
    <span class="v" id="total">1920.00</span>
  </div>
  <div class="status" id="status">Измените количество или примените скидку. Метод считает по текущему состоянию объекта.</div>
  <div class="controls">
    <button class="primary" id="add">Добавить единицу</button>
    <button id="discount">Скидка 10%</button>
    <button id="reset">Сброс</button>
  </div>
</div>
<script>
(function () {
  var start = { price: 640, quantity: 3 };
  var state = { price: start.price, quantity: start.quantity };
  var status = document.getElementById('status');

  function render() {
    document.getElementById('price').textContent = state.price.toFixed(1);
    document.getElementById('qty').textContent = state.quantity;
    document.getElementById('total').textContent = (state.price * state.quantity).toFixed(2);
  }

  function say(text) { status.innerHTML = text; }

  document.getElementById('add').addEventListener('click', function () {
    state.quantity += 1;
    say('quantity изменилось на <b>' + state.quantity + '</b>. total() пересчитан.');
    render();
  });

  document.getElementById('discount').addEventListener('click', function () {
    var before = state.price;
    state.price = state.price * 0.9;
    say('price: ' + before.toFixed(1) + ' → <b>' + state.price.toFixed(1) + '</b>. Скидка применена к полю, а не к итогу.');
    render();
  });

  document.getElementById('reset').addEventListener('click', function () {
    state = { price: start.price, quantity: start.quantity };
    say('Состояние восстановлено.');
    render();
  });

  render();
})();
</script>
</body>
</html>
