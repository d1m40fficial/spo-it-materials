<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Свойства алгоритма</title>
<style>
  :root { --paper:#f7f4ee; --ink:#2d3142; --muted:#4f5d75; --accent:#bf4520; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Geist","Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 "Geist Mono",Consolas,ui-monospace,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Свойства · Diagram Design</p>
  <svg viewBox="0 0 680 300" role="img" aria-labelledby="props-title props-desc">
    <title id="props-title">Пять свойств алгоритма</title>
    <desc id="props-desc">Алгоритм связан с пятью свойствами: дискретность, детерминированность, конечность, результативность и массовость.</desc>
    <defs>
      <marker id="arw-props" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    </defs>
    <rect x="38" y="130" width="116" height="94" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="160" y="130" width="116" height="94" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="282" y="130" width="116" height="94" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="404" y="130" width="116" height="94" rx="6" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="1.2"/>
    <rect x="526" y="130" width="116" height="94" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

    <line x1="340" y1="74" x2="96" y2="130" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#arw-props)"/>
    <line x1="340" y1="74" x2="218" y2="130" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#arw-props)"/>
    <line x1="340" y1="74" x2="340" y2="130" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#arw-props)"/>
    <line x1="340" y1="74" x2="462" y2="130" stroke="#bf4520" stroke-width="1.3" marker-end="url(#arw-props)"/>
    <line x1="340" y1="74" x2="584" y2="130" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#arw-props)"/>

    <rect x="245" y="22" width="190" height="52" rx="26" fill="rgba(45,49,66,.03)" stroke="#2d3142" stroke-width="1"/>
    <text x="340" y="54" text-anchor="middle" font-family="'Instrument Serif',Georgia,serif" font-size="18" fill="#2d3142">Алгоритм</text>

    <text x="96" y="158" text-anchor="middle" font-family="'Geist',sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">Дискретность</text>
    <text x="96" y="176" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" fill="#4f5d75">шаг за шагом</text>

    <text x="218" y="158" text-anchor="middle" font-family="'Geist',sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">Детерминированность</text>
    <text x="218" y="176" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" fill="#4f5d75">один и тот же</text>
    <text x="218" y="190" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" fill="#4f5d75">результат</text>

    <text x="340" y="158" text-anchor="middle" font-family="'Geist',sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">Конечность</text>
    <text x="340" y="176" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" fill="#4f5d75">шаги</text>
    <text x="340" y="190" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" fill="#4f5d75">заканчиваются</text>

    <text x="462" y="158" text-anchor="middle" font-family="'Geist',sans-serif" font-size="9.5" font-weight="600" fill="#bf4520">Результативность</text>
    <text x="462" y="176" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" fill="#bf4520">есть ответ</text>

    <text x="584" y="158" text-anchor="middle" font-family="'Geist',sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">Массовость</text>
    <text x="584" y="176" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" fill="#4f5d75">для класса</text>
    <text x="584" y="190" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" fill="#4f5d75">задач</text>

    <line x1="220" y1="258" x2="460" y2="258" stroke="rgba(45,49,66,.12)" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="340" y="278" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8.5" fill="#4f5d75" letter-spacing=".06em">ИСПОЛНИТЕЛЬ: КОМАНДЫ, СОСТОЯНИЕ, ОТКАЗ</text>
  </svg>
</div>
</body>
</html>
