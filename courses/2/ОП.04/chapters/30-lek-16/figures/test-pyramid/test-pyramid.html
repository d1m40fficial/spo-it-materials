<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пирамида тестов</title>
<style>
  :root { --paper:#f7f4ee; --ink:#2d3142; --muted:#4f5d75; --accent:#2f6f5e; --accent-soft:#ddebe5; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .note { margin:10px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Тесты · уровни проверки</p>
  <svg viewBox="0 0 680 300" role="img" aria-labelledby="pyr-title pyr-desc">
    <title id="pyr-title">Пирамида тестов</title>
    <desc id="pyr-desc">Внизу 24 быстрых модульных теста, в середине 8 интеграционных, наверху 3 приёмочных. Основание даёт быструю обратную связь.</desc>

    <polygon points="300,20 540,250 60,250" fill="rgba(47,111,94,.07)" stroke="#2f6f5e" stroke-width="1.4"/>
    <line x1="221" y1="96" x2="379" y2="96" stroke="#2f6f5e" stroke-width="1.2"/>
    <line x1="141" y1="172" x2="459" y2="172" stroke="#2f6f5e" stroke-width="1.2"/>

    <text x="300" y="76" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9.5" font-weight="600" fill="#2f6f5e">приёмочные</text>
    <text x="300" y="132" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10.5" font-weight="600" fill="#2f6f5e">интеграционные</text>
    <text x="300" y="212" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#2d3142">модульные тесты</text>

    <text x="560" y="66" text-anchor="middle" font-family="Consolas,monospace" font-size="15" font-weight="600" fill="#2d3142">3</text>
    <text x="560" y="86" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" fill="#4f5d75">приёмочных</text>

    <text x="560" y="132" text-anchor="middle" font-family="Consolas,monospace" font-size="15" font-weight="600" fill="#2d3142">8</text>
    <text x="560" y="152" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" fill="#4f5d75">интеграционных</text>

    <text x="560" y="206" text-anchor="middle" font-family="Consolas,monospace" font-size="15" font-weight="600" fill="#2d3142">24</text>
    <text x="560" y="226" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" fill="#4f5d75">модульных</text>

    <text x="618" y="252" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" fill="#4f5d75">основание: быстро</text>
    <text x="618" y="268" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" fill="#4f5d75">и дёшево</text>

    <text x="300" y="284" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#4f5d75">ЧЕМ НИЖЕ УРОВЕНЬ, ТЕМ БЫСТРЕЕ ОБРАТНАЯ СВЯЗЬ</text>
  </svg>
  <p class="note">Модульный тест проверяет одну функцию. Интеграционный проверяет связь частей. Приёмочный проверяет сценарий целиком.</p>
</div>
</body>
</html>
