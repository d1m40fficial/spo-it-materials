<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Блок-схема: сумма чисел</title>
<style>
  :root { --paper:#f7f4ee; --ink:#2d3142; --muted:#4f5d75; --accent:#bf4520; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Geist","Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 "Geist Mono",Consolas,ui-monospace,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Цикл</p>
  <svg viewBox="0 0 680 500" role="img" aria-labelledby="sum-title sum-desc">
    <title id="sum-title">Блок-схема суммы чисел от 1 до n</title>
    <desc id="sum-desc">Счётчик i начинается с 1, сумма s с 0. Пока i не больше n, к сумме прибавляется i, затем i увеличивается на 1. Когда условие ложно, выводится s.</desc>
    <defs>
      <marker id="arw-sum" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="arw-sum-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
    </defs>

    <g transform="translate(-70 0)">
    <line x1="340" y1="60" x2="340" y2="84" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arw-sum)"/>
    <line x1="340" y1="130" x2="340" y2="154" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arw-sum)"/>
    <line x1="340" y1="198" x2="340" y2="218" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arw-sum)"/>

    <line x1="340" y1="320" x2="340" y2="348" stroke="#bf4520" stroke-width="1.3" marker-end="url(#arw-sum-accent)"/>
    <line x1="340" y1="392" x2="340" y2="408" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arw-sum)"/>
    <polyline points="260,431 200,431 200,270 218,270" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arw-sum)"/>

    <line x1="460" y1="270" x2="488" y2="270" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arw-sum)"/>

    <rect x="270" y="20" width="140" height="40" rx="20" fill="rgba(45,49,66,.03)" stroke="#2d3142" stroke-width="1"/>
    <text x="340" y="45" text-anchor="middle" font-family="'Geist',sans-serif" font-size="12" font-weight="600" fill="#2d3142">Начало</text>

    <polygon points="260,84 440,84 420,130 240,130" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="340" y="111" text-anchor="middle" font-family="'Geist',sans-serif" font-size="12" font-weight="600" fill="#2d3142">Ввести n</text>

    <rect x="260" y="154" width="160" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="340" y="180" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="10.5" font-weight="600" fill="#2d3142">s = 0; i = 1</text>

    <polygon points="340,218 460,270 340,320 220,270" fill="#ffffff" stroke="#bf4520" stroke-width="1.2"/>
    <text x="340" y="266" text-anchor="middle" font-family="'Geist',sans-serif" font-size="11" font-weight="600" fill="#2d3142">i &lt;= n?</text>
    <rect x="346" y="322" width="20" height="12" rx="2" fill="#f7f4ee"/>
    <text x="356" y="331" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" letter-spacing=".1em" fill="#bf4520">ДА</text>
    <rect x="466" y="260" width="20" height="12" rx="2" fill="#f7f4ee"/>
    <text x="476" y="269" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" letter-spacing=".1em" fill="#4f5d75">НЕТ</text>

    <rect x="260" y="348" width="160" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="340" y="374" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="10.5" font-weight="600" fill="#2d3142">s = s + i</text>

    <rect x="260" y="408" width="160" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="340" y="434" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="10.5" font-weight="600" fill="#2d3142">i = i + 1</text>

    <text x="196" y="350" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" letter-spacing=".08em" fill="#4f5d75" transform="rotate(-90 196 350)">НАЗАД</text>

    <polygon points="500,248 630,248 610,292 480,292" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="1.2"/>
    <text x="555" y="275" text-anchor="middle" font-family="'Geist',sans-serif" font-size="12" font-weight="600" fill="#bf4520">Вывести s</text>
    </g>
  </svg>
</div>
</body>
</html>
