<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Биты, маски и операции</title>
<style>
  :root { --paper:#f7f4ee; --ink:#2d3142; --muted:#4f5d75; --accent:#2f6f5e; --accent-soft:#ddebe5; --bad:#bf4520; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .note { margin:10px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Биты · маски и операции</p>
  <svg viewBox="0 0 680 340" role="img" aria-labelledby="bit-title bit-desc">
    <title id="bit-title">Число 45 в двоичном виде</title>
    <desc id="bit-desc">Число 45 записывается как 00101101. Включены биты 32, 8, 4 и 1. Показаны операции И, ИЛИ и исключающее ИЛИ с маской 00001111.</desc>

    <text x="20" y="26" font-family="Consolas,monospace" font-size="9" letter-spacing=".1em" fill="#4f5d75">ЧИСЛО 45 · ВЕСА РАЗРЯДОВ</text>

    <g font-family="Consolas,monospace" text-anchor="middle">
      <text x="60" y="52" font-size="9" fill="#4f5d75">128</text><text x="130" y="52" font-size="9" fill="#4f5d75">64</text><text x="200" y="52" font-size="9" fill="#4f5d75">32</text><text x="270" y="52" font-size="9" fill="#4f5d75">16</text>
      <text x="340" y="52" font-size="9" fill="#4f5d75">8</text><text x="410" y="52" font-size="9" fill="#4f5d75">4</text><text x="480" y="52" font-size="9" fill="#4f5d75">2</text><text x="550" y="52" font-size="9" fill="#4f5d75">1</text>

      <rect x="30" y="62" width="60" height="46" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="60" y="92" font-size="16" fill="#b9b0a2">0</text>
      <rect x="100" y="62" width="60" height="46" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="130" y="92" font-size="16" fill="#b9b0a2">0</text>
      <rect x="170" y="62" width="60" height="46" rx="6" fill="#2f6f5e" stroke="#2f6f5e"/><text x="200" y="92" font-size="16" font-weight="600" fill="#ffffff">1</text>
      <rect x="240" y="62" width="60" height="46" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="270" y="92" font-size="16" fill="#b9b0a2">0</text>
      <rect x="310" y="62" width="60" height="46" rx="6" fill="#2f6f5e" stroke="#2f6f5e"/><text x="340" y="92" font-size="16" font-weight="600" fill="#ffffff">1</text>
      <rect x="380" y="62" width="60" height="46" rx="6" fill="#2f6f5e" stroke="#2f6f5e"/><text x="410" y="92" font-size="16" font-weight="600" fill="#ffffff">1</text>
      <rect x="450" y="62" width="60" height="46" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="480" y="92" font-size="16" fill="#b9b0a2">0</text>
      <rect x="520" y="62" width="60" height="46" rx="6" fill="#2f6f5e" stroke="#2f6f5e"/><text x="550" y="92" font-size="16" font-weight="600" fill="#ffffff">1</text>
    </g>

    <text x="30" y="132" font-family="Consolas,monospace" font-size="11" fill="#2d3142">00101101 = 32 + 8 + 4 + 1 = 45</text>
    <text x="30" y="154" font-family="Consolas,monospace" font-size="9.5" fill="#4f5d75">младший бит справа, старший слева</text>

    <line x1="20" y1="172" x2="660" y2="172" stroke="rgba(45,49,66,.12)" stroke-dasharray="4 4"/>

    <rect x="20" y="186" width="200" height="66" rx="8" fill="#ffffff" stroke="#2d3142"/>
    <text x="34" y="206" font-family="Consolas,monospace" font-size="10" fill="#2f6f5e">45 &amp; 15</text>
    <text x="34" y="224" font-family="Consolas,monospace" font-size="9" fill="#4f5d75">00101101 &amp; 00001111</text>
    <text x="34" y="242" font-family="Consolas,monospace" font-size="10" font-weight="600" fill="#2d3142">= 13 (00001101)</text>

    <rect x="240" y="186" width="200" height="66" rx="8" fill="#ffffff" stroke="#2d3142"/>
    <text x="254" y="206" font-family="Consolas,monospace" font-size="10" fill="#2f6f5e">45 | 128</text>
    <text x="254" y="224" font-family="Consolas,monospace" font-size="9" fill="#4f5d75">00101101 | 10000000</text>
    <text x="254" y="242" font-family="Consolas,monospace" font-size="10" font-weight="600" fill="#2d3142">= 173 (10101101)</text>

    <rect x="460" y="186" width="200" height="66" rx="8" fill="#ffffff" stroke="#2d3142"/>
    <text x="474" y="206" font-family="Consolas,monospace" font-size="10" fill="#bf4520">45 ^ 15</text>
    <text x="474" y="224" font-family="Consolas,monospace" font-size="9" fill="#4f5d75">00101101 ^ 00001111</text>
    <text x="474" y="242" font-family="Consolas,monospace" font-size="10" font-weight="600" fill="#2d3142">= 34 (00100010)</text>

    <text x="20" y="278" font-family="Consolas,monospace" font-size="9.5" fill="#4f5d75">45 &lt;&lt; 1 = 90 (сдвиг влево, умножение на 2)</text>
    <text x="20" y="296" font-family="Consolas,monospace" font-size="9.5" fill="#4f5d75">45 &gt;&gt; 1 = 22 (сдвиг вправо, деление на 2 без остатка)</text>

    <rect x="360" y="270" width="300" height="44" rx="8" fill="#ffffff" stroke="#2d3142" stroke-dasharray="4 4"/>
    <text x="374" y="288" font-family="Consolas,monospace" font-size="9" fill="#4f5d75">маска 00001111 включает младшие 4 бита</text>
    <text x="374" y="304" font-family="Consolas,monospace" font-size="9" fill="#4f5d75">AND читает, OR ставит, XOR переключает</text>
  </svg>
  <p class="note">Битовая маска это число, у которого нужные разряды равны единице. Операция выбирает или меняет эти разряды.</p>
</div>
</body>
</html>
