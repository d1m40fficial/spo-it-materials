<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Обход в ширину по шагам</title>
<style>
  :root { --paper:#f7f4ee; --card:#fffdf8; --ink:#1a1916; --muted:#6b6459; --rule:#ded6c8; --accent:#2f6f5e; --accent-soft:#ddebe5; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .demo { background:var(--paper); border:1px solid var(--rule); border-radius:14px; padding:18px; }
  .head { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; padding-bottom:10px; border-bottom:1px solid var(--rule); }
  .eyebrow { margin:0 0 4px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  h3 { margin:0; font-size:20px; line-height:1.2; }
  .counter { font:12px/1.4 Consolas,monospace; color:var(--muted); white-space:nowrap; }
  svg { display:block; width:100%; height:auto; }
  .node circle { fill:#fff; stroke:#4f5d75; stroke-width:1.6; transition:fill .2s,stroke .2s; }
  .node text { font-family:Consolas,monospace; font-size:13px; font-weight:600; fill:#2d3142; text-anchor:middle; }
  .node.done circle { fill:var(--accent-soft); stroke:var(--accent); }
  .node.done text { fill:var(--accent); }
  .node.cur circle { fill:var(--accent); stroke:var(--accent); }
  .node.cur text { fill:#fff; }
  .panel { margin-top:8px; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .box { background:var(--card); border:1px solid var(--rule); border-radius:9px; padding:9px 11px; font:12px/1.5 Consolas,monospace; }
  .box .k { font:600 8.5px/1.2 Consolas,monospace; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .box .v { margin-top:3px; color:var(--ink); word-break:break-word; }
  .status { min-height:44px; margin-top:10px; padding:10px 12px; border-radius:9px; background:var(--accent-soft); font-size:13px; line-height:1.45; }
  .status b { color:var(--accent); }
  .controls { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  button { font:600 12.5px/1 "Segoe UI",system-ui,sans-serif; padding:9px 12px; border-radius:9px; border:1px solid var(--rule); background:var(--card); color:var(--ink); cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover { background:#245a4c; color:#fff; }
  button:disabled { opacity:.45; cursor:default; }
  @media (max-width:620px) { .panel { grid-template-columns:1fr; } .demo { padding:12px; } }
</style>
</head>
<body>
<div class="demo">
  <div class="head">
    <div><p class="eyebrow">Граф · обход в ширину</p><h3>BFS из вершины A</h3></div>
    <div class="counter" id="counter">шаг 0 из 7</div>
  </div>
  <svg viewBox="0 0 680 280" role="img" aria-label="Граф для обхода в ширину">
    <g stroke="#4f5d75" stroke-width="1.5">
      <line x1="80" y1="60" x2="200" y2="40"/>
      <line x1="80" y1="60" x2="200" y2="140"/>
      <line x1="200" y1="40" x2="320" y2="90"/>
      <line x1="200" y1="140" x2="320" y2="90"/>
      <line x1="200" y1="140" x2="320" y2="200"/>
      <line x1="320" y1="90" x2="440" y2="140"/>
      <line x1="320" y1="200" x2="440" y2="140"/>
    </g>
    <g id="nodes"></g>
    <text x="250" y="256" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#4f5d75">соседи берутся в порядке списка смежности</text>
  </svg>
  <div class="panel">
    <div class="box"><div class="k">Очередь</div><div class="v" id="queue">A</div></div>
    <div class="box"><div class="k">Порядок обхода</div><div class="v" id="order">A</div></div>
  </div>
  <div class="status" id="status">Нажмите «Шаг», чтобы начать обход.</div>
  <div class="controls">
    <button class="primary" id="step">Шаг</button>
    <button id="reset">Сброс</button>
  </div>
</div>
<script>
(function () {
  var pos = {
    A: [80, 60], B: [200, 40], C: [200, 140],
    D: [320, 90], E: [320, 200], F: [440, 140]
  };
  var adj = {
    A: ['B', 'C'], B: ['A', 'D'], C: ['A', 'D', 'E'],
    D: ['B', 'C', 'F'], E: ['C', 'F'], F: ['D', 'E']
  };
  var steps = [
    { cur: 'A', add: [], text: 'Начало: вершина A помещена в очередь.' },
    { cur: 'A', add: ['B', 'C'], text: 'Извлекаем A. В очередь попадают соседи <b>B</b> и <b>C</b>.' },
    { cur: 'B', add: ['D'], text: 'Извлекаем B. Новый сосед это <b>D</b>, A уже посещена.' },
    { cur: 'C', add: ['E'], text: 'Извлекаем C. Соседи A и D уже посещены, новая вершина <b>E</b>.' },
    { cur: 'D', add: ['F'], text: 'Извлекаем D. Новая вершина <b>F</b>.' },
    { cur: 'E', add: [], text: 'Извлекаем E. Все её соседи уже посещены.' },
    { cur: 'F', add: [], text: 'Извлекаем F. Очередь пуста, обход завершён.' }
  ];
  var stepIndex = 0;
  var queue = ['A'];
  var visited = ['A'];
  var current = null;
  var nodesG = document.getElementById('nodes');
  var status = document.getElementById('status');
  var counter = document.getElementById('counter');
  var stepBtn = document.getElementById('step');

  function render() {
    nodesG.innerHTML = '';
    Object.keys(pos).forEach(function (name) {
      var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      var cls = 'node';
      if (visited.indexOf(name) >= 0) cls += ' done';
      if (name === current) cls += ' cur';
      g.setAttribute('class', cls);
      var c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', pos[name][0]); c.setAttribute('cy', pos[name][1]); c.setAttribute('r', 22);
      var t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', pos[name][0]); t.setAttribute('y', pos[name][1] + 5);
      t.textContent = name;
      g.appendChild(c); g.appendChild(t);
      nodesG.appendChild(g);
    });
    document.getElementById('queue').textContent = queue.length ? queue.join(', ') : 'пусто';
    document.getElementById('order').textContent = visited.join(', ');
    counter.textContent = 'шаг ' + stepIndex + ' из ' + steps.length;
    stepBtn.disabled = stepIndex >= steps.length;
  }

  function step() {
    if (stepIndex >= steps.length) return;
    var s = steps[stepIndex];
    current = s.cur;
    if (stepIndex > 0) {
      var at = queue.indexOf(s.cur);
      if (at >= 0) queue.splice(at, 1);
    }
    s.add.forEach(function (name) {
      if (visited.indexOf(name) < 0) {
        visited.push(name);
        queue.push(name);
      }
    });
    status.innerHTML = s.text + ' В очереди: ' + (queue.length ? queue.join(', ') : 'пусто') + '.';
    stepIndex += 1;
    render();
  }

  function reset() {
    stepIndex = 0;
    queue = ['A'];
    visited = ['A'];
    current = null;
    status.textContent = 'Нажмите «Шаг», чтобы начать обход.';
    render();
  }

  stepBtn.addEventListener('click', step);
  document.getElementById('reset').addEventListener('click', reset);
  render();
})();
</script>
</body>
</html>
