<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Обработка файла: открыть, прочитать, разобрать, записать</title>
<style>
  :root { --paper:#f7f4ee; --ink:#2d3142; --muted:#4f5d75; --accent:#2f6f5e; --accent-soft:#ddebe5; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Файл · конвейер обработки</p>
  <svg viewBox="0 0 680 300" role="img" aria-labelledby="file-title file-desc">
    <title id="file-title">Конвейер обработки файла</title>
    <desc id="file-desc">Файл открывают в кодировке utf-8, читают построчно, делят строку на поля и записывают сводку в новый файл. Контекстный менеджер with закрывает файл сам.</desc>
    <defs>
      <marker id="arw-file" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#4f5d75"/></marker>
    </defs>

    <rect x="16" y="52" width="150" height="120" rx="10" fill="#ffffff" stroke="#2d3142"/>
    <rect x="28" y="64" width="126" height="24" rx="5" fill="#ddebe5"/>
    <text x="91" y="80" text-anchor="middle" font-family="Consolas,monospace" font-size="9" font-weight="600" fill="#2f6f5e">open(..., "r")</text>
    <text x="91" y="110" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#2d3142">Открыть</text>
    <text x="91" y="130" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#4f5d75">encoding="utf-8"</text>
    <text x="91" y="150" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#4f5d75">режим чтения</text>

    <line x1="166" y1="112" x2="192" y2="112" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#arw-file)"/>

    <rect x="196" y="52" width="150" height="120" rx="10" fill="#ffffff" stroke="#2d3142"/>
    <rect x="208" y="64" width="126" height="24" rx="5" fill="#ddebe5"/>
    <text x="271" y="80" text-anchor="middle" font-family="Consolas,monospace" font-size="9" font-weight="600" fill="#2f6f5e">for line in f:</text>
    <text x="271" y="110" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#2d3142">Читать</text>
    <text x="271" y="130" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#4f5d75">одна строка</text>
    <text x="271" y="150" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#4f5d75">за шаг</text>

    <line x1="346" y1="112" x2="372" y2="112" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#arw-file)"/>

    <rect x="376" y="52" width="150" height="120" rx="10" fill="#ffffff" stroke="#2d3142"/>
    <rect x="388" y="64" width="126" height="24" rx="5" fill="#ddebe5"/>
    <text x="451" y="80" text-anchor="middle" font-family="Consolas,monospace" font-size="9" font-weight="600" fill="#2f6f5e">line.split(";")</text>
    <text x="451" y="110" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#2d3142">Разобрать</text>
    <text x="451" y="130" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#4f5d75">время · уровень</text>
    <text x="451" y="150" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#4f5d75">сообщение</text>

    <line x1="526" y1="112" x2="552" y2="112" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#arw-file)"/>

    <rect x="556" y="52" width="108" height="120" rx="10" fill="rgba(47,111,94,.06)" stroke="#2f6f5e"/>
    <rect x="566" y="64" width="88" height="24" rx="5" fill="#ddebe5"/>
    <text x="610" y="80" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" font-weight="600" fill="#2f6f5e">write(...)</text>
    <text x="610" y="110" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#2d3142">Записать</text>
    <text x="610" y="130" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#4f5d75">сводка</text>
    <text x="610" y="150" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#4f5d75">в новый файл</text>

    <rect x="16" y="200" width="648" height="52" rx="8" fill="#ffffff" stroke="#2d3142" stroke-dasharray="4 4"/>
    <text x="34" y="222" font-family="Consolas,monospace" font-size="10" fill="#4f5d75">with open("log.txt", encoding="utf-8") as f:</text>
    <text x="34" y="240" font-family="Consolas,monospace" font-size="10" fill="#2f6f5e">    for line in f: ...   # файл закроется сам</text>

    <text x="340" y="278" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#4f5d75">БЕЗ WITH ФАЙЛ НУЖНО ЗАКРЫВАТЬ ВРУЧНУЮ ЧЕРЕЗ f.close()</text>
  </svg>
</div>
</body>
</html>
