<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Условия и выбор: лестница if/elif/else</title>
<style>
  :root { --paper:#f7f4ee; --ink:#2d3142; --muted:#4f5d75; --accent:#bf4520; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Условия</p>
  <svg viewBox="0 0 680 700" role="img" aria-labelledby="cond-title cond-desc">
    <title id="cond-title">Лестница условий if, elif, else</title>
    <desc id="cond-desc">Если score не меньше 90, выводится Отлично. Иначе проверяется 75, затем 60. Если ни одно условие не выполнено, выводится Не зачтено.</desc>
    <defs>
      <marker id="arw-cond" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="arw-cond-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
    </defs>

    <line x1="280" y1="60" x2="280" y2="76" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arw-cond)"/>
    <line x1="280" y1="124" x2="280" y2="166" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arw-cond)"/>
    <line x1="280" y1="245" x2="280" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arw-cond)"/>
    <line x1="280" y1="375" x2="280" y2="426" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arw-cond)"/>
    <line x1="280" y1="505" x2="280" y2="536" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arw-cond)"/>

    <line x1="400" y1="200" x2="436" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arw-cond)"/>
    <line x1="400" y1="330" x2="436" y2="330" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arw-cond)"/>
    <line x1="400" y1="460" x2="436" y2="460" stroke="#bf4520" stroke-width="1.3" marker-end="url(#arw-cond-accent)"/>

    <line x1="560" y1="200" x2="610" y2="200" stroke="#4f5d75" stroke-width="1.1"/>
    <line x1="560" y1="330" x2="610" y2="330" stroke="#4f5d75" stroke-width="1.1"/>
    <line x1="560" y1="460" x2="610" y2="460" stroke="#bf4520" stroke-width="1.3"/>
    <line x1="610" y1="200" x2="610" y2="620" stroke="#4f5d75" stroke-width="1.1"/>
    <line x1="380" y1="560" x2="610" y2="560" stroke="#4f5d75" stroke-width="1.1"/>
    <line x1="610" y1="620" x2="610" y2="634" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arw-cond)"/>

    <rect x="210" y="20" width="140" height="40" rx="20" fill="rgba(45,49,66,.03)" stroke="#2d3142" stroke-width="1"/>
    <text x="280" y="45" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#2d3142">Начало</text>

    <polygon points="190,78 370,78 350,124 170,124" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="280" y="105" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#2d3142">Ввести score</text>

    <polygon points="280,168 400,200 280,245 160,200" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="280" y="199" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#2d3142">score &gt;= 90?</text>
    <text x="420" y="192" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#4f5d75">ДА</text>
    <text x="300" y="268" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#4f5d75">НЕТ</text>

    <polygon points="280,298 400,330 280,375 160,330" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="280" y="329" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#2d3142">score &gt;= 75?</text>
    <text x="420" y="322" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#4f5d75">ДА</text>
    <text x="300" y="398" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#4f5d75">НЕТ</text>

    <polygon points="280,428 400,460 280,505 160,460" fill="#ffffff" stroke="#bf4520" stroke-width="1.2"/>
    <text x="280" y="459" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#2d3142">score &gt;= 60?</text>
    <text x="420" y="452" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#bf4520">ДА</text>
    <text x="300" y="528" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#4f5d75">НЕТ</text>

    <rect x="440" y="178" width="120" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="500" y="205" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#2d3142">Отлично</text>
    <rect x="440" y="308" width="120" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="500" y="335" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#2d3142">Хорошо</text>
    <rect x="440" y="438" width="120" height="44" rx="6" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="1.2"/>
    <text x="500" y="465" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#bf4520">Зачтено</text>

    <rect x="220" y="538" width="160" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="300" y="565" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#2d3142">Не зачтено</text>

    <rect x="550" y="636" width="120" height="44" rx="22" fill="rgba(45,49,66,.03)" stroke="#2d3142" stroke-width="1"/>
    <text x="610" y="663" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#2d3142">Конец</text>
  </svg>
</div>
</body>
</html>
