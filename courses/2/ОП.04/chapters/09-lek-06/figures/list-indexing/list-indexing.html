<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Список: индексы и срезы</title>
<style>
  :root { --paper:#f7f4ee; --ink:#2d3142; --muted:#4f5d75; --accent:#2f6f5e; --accent-soft:#ddebe5; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .note { margin:10px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Список · индексы и срезы</p>
  <svg viewBox="0 0 680 292" role="img" aria-labelledby="lst-title lst-desc">
    <title id="lst-title">Индексы списка и срез</title>
    <desc id="lst-desc">Список из пяти элементов. Прямые индексы идут от 0 до 4, отрицательные от -5 до -1. Срез [1:4] выделяет элементы с индексами 1, 2 и 3.</desc>

    <text x="88" y="30" text-anchor="middle" font-family="Consolas,monospace" font-size="9" letter-spacing=".1em" fill="#4f5d75">ИНДЕКС</text>

    <text x="88" y="62" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#4f5d75">0</text>
    <rect x="48" y="70" width="80" height="48" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="88" y="100" text-anchor="middle" font-family="Consolas,monospace" font-size="16" font-weight="600" fill="#2d3142">12</text>

    <text x="176" y="62" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#4f5d75">1</text>
    <rect x="136" y="70" width="80" height="48" rx="7" fill="#ddebe5" stroke="#2f6f5e" stroke-width="1.4"/>
    <text x="176" y="100" text-anchor="middle" font-family="Consolas,monospace" font-size="16" font-weight="600" fill="#2d3142">7</text>

    <text x="264" y="62" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#4f5d75">2</text>
    <rect x="224" y="70" width="80" height="48" rx="7" fill="#ddebe5" stroke="#2f6f5e" stroke-width="1.4"/>
    <text x="264" y="100" text-anchor="middle" font-family="Consolas,monospace" font-size="16" font-weight="600" fill="#2d3142">25</text>

    <text x="352" y="62" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#4f5d75">3</text>
    <rect x="312" y="70" width="80" height="48" rx="7" fill="#ddebe5" stroke="#2f6f5e" stroke-width="1.4"/>
    <text x="352" y="100" text-anchor="middle" font-family="Consolas,monospace" font-size="16" font-weight="600" fill="#2d3142">42</text>

    <text x="440" y="62" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#4f5d75">4</text>
    <rect x="400" y="70" width="80" height="48" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="440" y="100" text-anchor="middle" font-family="Consolas,monospace" font-size="16" font-weight="600" fill="#2d3142">18</text>

    <text x="88" y="140" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#2f6f5e">-5</text>
    <text x="176" y="140" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#2f6f5e">-4</text>
    <text x="264" y="140" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#2f6f5e">-3</text>
    <text x="352" y="140" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#2f6f5e">-2</text>
    <text x="440" y="140" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#2f6f5e">-1</text>

    <rect x="120" y="170" width="112" height="32" rx="6" fill="#2f6f5e"/>
    <text x="176" y="191" text-anchor="middle" font-family="Consolas,monospace" font-size="11" font-weight="600" fill="#ffffff">list[1] = 7</text>

    <rect x="384" y="170" width="112" height="32" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="440" y="191" text-anchor="middle" font-family="Consolas,monospace" font-size="11" font-weight="600" fill="#2d3142">list[-1] = 18</text>

    <rect x="510" y="20" width="150" height="130" rx="8" fill="rgba(47,111,94,.06)" stroke="#2f6f5e" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="585" y="46" text-anchor="middle" font-family="Consolas,monospace" font-size="9" letter-spacing=".1em" fill="#2f6f5e">СРЕЗ</text>
    <text x="585" y="72" text-anchor="middle" font-family="Consolas,monospace" font-size="12" font-weight="600" fill="#2f6f5e">list[1:4]</text>
    <text x="585" y="94" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#4f5d75">индексы 1, 2, 3</text>
    <text x="585" y="114" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#2d3142">[7, 25, 42]</text>
    <text x="585" y="134" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" fill="#4f5d75">4 не входит</text>

    <rect x="510" y="170" width="150" height="112" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="585" y="194" text-anchor="middle" font-family="Consolas,monospace" font-size="11" font-weight="600" fill="#2d3142">len(list)</text>
    <text x="585" y="222" text-anchor="middle" font-family="Consolas,monospace" font-size="20" font-weight="600" fill="#2f6f5e">5</text>
    <text x="585" y="246" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" fill="#4f5d75">последний индекс</text>
    <text x="585" y="264" text-anchor="middle" font-family="Consolas,monospace" font-size="9.5" fill="#4f5d75">len(list) - 1 = 4</text>
  </svg>
  <p class="note">Сверху прямой индекс, снизу отсчёт с конца. Срез не включает верхнюю границу: list[1:4] берёт индексы 1, 2 и 3.</p>
</div>
</body>
</html>
