<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Линейный и бинарный поиск: число шагов</title>
<style>
  :root { --paper:#f7f4ee; --ink:#2d3142; --muted:#4f5d75; --accent:#2f6f5e; --accent-soft:#ddebe5; --bad:#bf4520; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .note { margin:10px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Поиск · число сравнений</p>
  <svg viewBox="0 0 680 340" role="img" aria-labelledby="sc-title sc-desc">
    <title id="sc-title">Линейный и бинарный поиск в списке из восьми чисел</title>
    <desc id="sc-desc">Линейный поиск проверяет элементы по порядку и находит 25 за пять сравнений. Бинарный поиск в отсортированном списке находит 25 за три сравнения.</desc>

    <text x="30" y="30" font-family="Consolas,monospace" font-size="9" letter-spacing=".1em" fill="#4f5d75">ЛИНЕЙНЫЙ ПОИСК · 5 СРАВНЕНИЙ</text>
    <text x="30" y="52" font-family="Segoe UI,sans-serif" font-size="11" fill="#4f5d75">Проверяет всё подряд, порядок не важен</text>

    <g font-family="Consolas,monospace" text-anchor="middle">
      <rect x="30" y="66" width="60" height="40" rx="6" fill="#f1ece3" stroke="#2d3142"/><text x="60" y="91" font-size="12" fill="#4f5d75">3</text>
      <rect x="96" y="66" width="60" height="40" rx="6" fill="#f1ece3" stroke="#2d3142"/><text x="126" y="91" font-size="12" fill="#4f5d75">7</text>
      <rect x="162" y="66" width="60" height="40" rx="6" fill="#f1ece3" stroke="#2d3142"/><text x="192" y="91" font-size="12" fill="#4f5d75">12</text>
      <rect x="228" y="66" width="60" height="40" rx="6" fill="#f1ece3" stroke="#2d3142"/><text x="258" y="91" font-size="12" fill="#4f5d75">19</text>
      <rect x="294" y="66" width="60" height="40" rx="6" fill="#ddebe5" stroke="#2f6f5e" stroke-width="1.6"/><text x="324" y="91" font-size="12" font-weight="600" fill="#2f6f5e">25</text>
      <rect x="360" y="66" width="60" height="40" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="390" y="91" font-size="12" fill="#2d3142">31</text>
      <rect x="426" y="66" width="60" height="40" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="456" y="91" font-size="12" fill="#2d3142">42</text>
      <rect x="492" y="66" width="60" height="40" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="522" y="91" font-size="12" fill="#2d3142">56</text>
    </g>
    <text x="294" y="124" font-family="Consolas,monospace" font-size="8.5" fill="#2f6f5e">проверено 3, 7, 12, 19, 25</text>

    <line x1="30" y1="146" x2="650" y2="146" stroke="rgba(45,49,66,.12)" stroke-dasharray="4 4"/>

    <text x="30" y="172" font-family="Consolas,monospace" font-size="9" letter-spacing=".1em" fill="#2f6f5e">БИНАРНЫЙ ПОИСК · 3 СРАВНЕНИЯ</text>
    <text x="30" y="190" font-family="Segoe UI,sans-serif" font-size="11" fill="#4f5d75">Список отсортирован, половина отбрасывается</text>

    <g font-family="Consolas,monospace" text-anchor="middle">
      <rect x="30" y="216" width="60" height="40" rx="6" fill="#f1ece3" stroke="#2d3142"/><text x="60" y="241" font-size="12" fill="#4f5d75">3</text>
      <rect x="96" y="216" width="60" height="40" rx="6" fill="#f1ece3" stroke="#2d3142"/><text x="126" y="241" font-size="12" fill="#4f5d75">7</text>
      <rect x="162" y="216" width="60" height="40" rx="6" fill="#f1ece3" stroke="#2d3142"/><text x="192" y="241" font-size="12" fill="#4f5d75">12</text>
      <rect x="228" y="216" width="60" height="40" rx="6" fill="#ddebe5" stroke="#2f6f5e" stroke-width="1.6"/><text x="258" y="241" font-size="12" font-weight="600" fill="#2f6f5e">19</text>
      <rect x="294" y="216" width="60" height="40" rx="6" fill="#2f6f5e" stroke="#2f6f5e"/><text x="324" y="241" font-size="12" font-weight="600" fill="#ffffff">25</text>
      <rect x="360" y="216" width="60" height="40" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="390" y="241" font-size="12" fill="#2d3142">31</text>
      <rect x="426" y="216" width="60" height="40" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="456" y="241" font-size="12" fill="#2d3142">42</text>
      <rect x="492" y="216" width="60" height="40" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="522" y="241" font-size="12" fill="#2d3142">56</text>
    </g>

    <circle cx="258" cy="204" r="9" fill="#ffffff" stroke="#2f6f5e"/><text x="258" y="207" text-anchor="middle" font-family="Consolas,monospace" font-size="8" fill="#2f6f5e">1</text>
    <circle cx="390" cy="204" r="9" fill="#ffffff" stroke="#2f6f5e"/><text x="390" y="207" text-anchor="middle" font-family="Consolas,monospace" font-size="8" fill="#2f6f5e">2</text>
    <circle cx="324" cy="204" r="9" fill="#ffffff" stroke="#2f6f5e"/><text x="324" y="207" text-anchor="middle" font-family="Consolas,monospace" font-size="8" font-weight="700" fill="#2f6f5e">3</text>

    <rect x="30" y="276" width="620" height="44" rx="8" fill="#ffffff" stroke="#2d3142" stroke-dasharray="4 4"/>
    <text x="46" y="296" font-family="Consolas,monospace" font-size="9.5" fill="#4f5d75">8 элементов: линейный до 8 шагов, бинарный до 3.</text>
    <text x="46" y="312" font-family="Consolas,monospace" font-size="9.5" fill="#4f5d75">1000 элементов: линейный до 1000 шагов, бинарный до 10.</text>
  </svg>
  <p class="note">Бинарный поиск работает только на отсортированных данных. Сортировка сама стоит времени.</p>
</div>
</body>
</html>
