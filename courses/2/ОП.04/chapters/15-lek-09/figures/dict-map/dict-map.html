<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Словарь и множества</title>
<style>
  :root { --paper:#f7f4ee; --ink:#2d3142; --muted:#4f5d75; --accent:#2f6f5e; --accent-soft:#ddebe5; --rule:rgba(45,49,66,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px 18px 14px; }
  .eyebrow { margin:0 0 8px; font:600 9px/1.2 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Словарь и множество</p>
  <svg viewBox="0 0 680 340" role="img" aria-labelledby="dict-title dict-desc">
    <title id="dict-title">Словарь ключ-значение и пересечение множеств</title>
    <desc id="dict-desc">Словарь сопоставляет товару цену: кружка 640, блюдце 420, коробка 40. Множества хранят уникальные значения: пересечение двух наборов содержит блюдце.</desc>

    <text x="150" y="30" text-anchor="middle" font-family="Consolas,monospace" font-size="9" letter-spacing=".1em" fill="#4f5d75">СЛОВАРЬ · КЛЮЧ → ЗНАЧЕНИЕ</text>

    <rect x="30" y="48" width="240" height="46" rx="8" fill="#ffffff" stroke="#2d3142"/>
    <text x="48" y="76" font-family="Consolas,monospace" font-size="11" font-weight="600" fill="#2d3142">"кружка"</text>
    <line x1="132" y1="71" x2="176" y2="71" stroke="#4f5d75" marker-end="url(#arw-d)"/>
    <text x="200" y="76" font-family="Consolas,monospace" font-size="12" font-weight="600" fill="#2f6f5e">640</text>

    <rect x="30" y="106" width="240" height="46" rx="8" fill="#ddebe5" stroke="#2f6f5e"/>
    <text x="48" y="134" font-family="Consolas,monospace" font-size="11" font-weight="600" fill="#2d3142">"блюдце"</text>
    <line x1="132" y1="129" x2="176" y2="129" stroke="#2f6f5e" marker-end="url(#arw-d2)"/>
    <text x="200" y="134" font-family="Consolas,monospace" font-size="12" font-weight="600" fill="#2f6f5e">420</text>

    <rect x="30" y="164" width="240" height="46" rx="8" fill="#ffffff" stroke="#2d3142"/>
    <text x="48" y="192" font-family="Consolas,monospace" font-size="11" font-weight="600" fill="#2d3142">"коробка"</text>
    <line x1="132" y1="187" x2="176" y2="187" stroke="#4f5d75" marker-end="url(#arw-d)"/>
    <text x="200" y="192" font-family="Consolas,monospace" font-size="12" font-weight="600" fill="#2f6f5e">40</text>

    <text x="150" y="240" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#4f5d75">prices["блюдце"] → 420</text>
    <text x="150" y="262" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#4f5d75">prices.get("чашка", 0) → 0</text>
    <text x="150" y="290" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9.5" fill="#4f5d75">ключи уникальны, значения могут повторяться</text>

    <line x1="316" y1="24" x2="316" y2="316" stroke="rgba(45,49,66,.12)" stroke-dasharray="4 4"/>

    <text x="500" y="30" text-anchor="middle" font-family="Consolas,monospace" font-size="9" letter-spacing=".1em" fill="#4f5d75">МНОЖЕСТВА · ПЕРЕСЕЧЕНИЕ</text>

    <circle cx="452" cy="170" r="84" fill="rgba(47,111,94,.10)" stroke="#2f6f5e"/>
    <circle cx="552" cy="170" r="84" fill="rgba(191,69,32,.08)" stroke="#bf4520"/>
    <text x="498" y="184" text-anchor="middle" font-family="Consolas,monospace" font-size="10" font-weight="600" fill="#2f6f5e">блюдце</text>
    <text x="400" y="150" text-anchor="middle" font-family="Consolas,monospace" font-size="9.5" fill="#2f6f5e">кружка</text>
    <text x="400" y="168" text-anchor="middle" font-family="Consolas,monospace" font-size="9.5" fill="#2f6f5e">чайник</text>
    <text x="606" y="150" text-anchor="middle" font-family="Consolas,monospace" font-size="9.5" fill="#bf4520">коробка</text>
    <text x="606" y="168" text-anchor="middle" font-family="Consolas,monospace" font-size="9.5" fill="#bf4520">ложка</text>

    <text x="452" y="86" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" fill="#4f5d75">набор A</text>
    <text x="560" y="86" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" fill="#4f5d75">набор B</text>

    <text x="500" y="286" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#2d3142">A &amp; B → {"блюдце"}</text>
    <text x="500" y="306" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#2d3142">A | B → 5 элементов, без повторов</text>
    <text x="500" y="326" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#2d3142">A - B → {"кружка", "чайник"}</text>

    <defs>
      <marker id="arw-d" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><polygon points="0 0, 7 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="arw-d2" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><polygon points="0 0, 7 3, 0 6" fill="#2f6f5e"/></marker>
    </defs>
  </svg>
</div>
</body>
</html>
