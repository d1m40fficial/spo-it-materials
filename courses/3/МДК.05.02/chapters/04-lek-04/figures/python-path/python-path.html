<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Как оболочка выбирает интерпретатор Python</title>
<style>
  :root { --paper:#EBE0EC; --card:#FBF7FC; --ink:#2A2233; --muted:#6B5F75; --rule:#D5C2DC; --accent:#8E5BC8; --soft:#E4D5EC; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px; }
  .eyebrow { margin:0 0 6px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .note { margin:10px 2px 0; font:12px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
  @media (max-width:560px) { .frame { padding:12px; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Python · поиск интерпретатора</p>
  <svg viewBox="0 0 680 402" role="img" aria-labelledby="pp-title pp-desc">
    <title id="pp-title">Порядок поиска python в PATH и три адреса окружения</title>
    <desc id="pp-desc">Оболочка перебирает каталоги PATH слева направо и берёт первый файл python. Затем показаны sys.executable, sys.prefix и sys.base_prefix для проекта с виртуальным окружением.</desc>

    <text x="16" y="22" font-family="Consolas,monospace" font-size="10" fill="#6B5F75">PATH: ПОИСК СВЕРХУ ВНИЗ, ПОБЕЖДАЕТ ПЕРВЫЙ ФАЙЛ</text>

    <g font-family="Segoe UI,system-ui,sans-serif">
      <rect x="16" y="32" width="330" height="42" rx="7" fill="#FBF7FC" stroke="#D5C2DC"/>
      <text x="28" y="49" font-size="12" font-weight="600" fill="#2A2233">...\WindowsApps\python.exe</text>
      <text x="28" y="65" font-size="10.5" fill="#6B5F75">псевдоним магазина, не интерпретатор</text>

      <rect x="16" y="82" width="330" height="42" rx="7" fill="#FBF7FC" stroke="#D5C2DC"/>
      <text x="28" y="99" font-size="12" font-weight="600" fill="#2A2233">...\Python313\python.exe</text>
      <text x="28" y="115" font-size="10.5" fill="#6B5F75">глобальная установка с python.org</text>

      <rect x="16" y="132" width="330" height="42" rx="7" fill="#E4D5EC" stroke="#8E5BC8" stroke-width="1.8"/>
      <text x="28" y="149" font-size="12" font-weight="600" fill="#2A2233">проект\.venv\Scripts\python.exe</text>
      <text x="28" y="165" font-size="10.5" fill="#5B3E76">окружение проекта, если стоит первым</text>

      <path d="M352 102h30" stroke="#8E5BC8" stroke-width="1.6" fill="none" marker-end="url(#pp-arrow)"/>
      <text x="390" y="96" font-size="11" font-weight="600" fill="#8E5BC8">побеждает первый</text>
      <text x="390" y="112" font-size="10.5" fill="#6B5F75">остальные не рассматриваются</text>

      <rect x="352" y="140" width="312" height="112" rx="8" fill="#FBF7FC" stroke="#D5C2DC"/>
      <text x="366" y="160" font-size="11" font-weight="700" fill="#8E5BC8">ЧТО ПОКАЗЫВАЕТ ПРОВЕРКА</text>
      <text x="366" y="180" font-family="Consolas,monospace" font-size="10" fill="#2A2233">sys.executable</text>
      <text x="510" y="180" font-size="10.5" fill="#6B5F75">файл, который работает</text>
      <text x="366" y="200" font-family="Consolas,monospace" font-size="10" fill="#2A2233">sys.prefix</text>
      <text x="510" y="200" font-size="10.5" fill="#6B5F75">текущее окружение</text>
      <text x="366" y="220" font-family="Consolas,monospace" font-size="10" fill="#2A2233">sys.base_prefix</text>
      <text x="510" y="220" font-size="10.5" fill="#6B5F75">базовый Python</text>
      <text x="366" y="240" font-size="10" fill="#6B5F75">Если prefix и base_prefix равны, окружение глобальное.</text>
    </g>

    <g font-family="Segoe UI,system-ui,sans-serif">
      <rect x="16" y="196" width="330" height="120" rx="8" fill="#FBF7FC" stroke="#D5C2DC"/>
      <text x="30" y="216" font-size="11" font-weight="700" fill="#8E5BC8">ПОЧЕМУ ЭТО ВАЖНО</text>
      <text x="30" y="238" font-size="11" fill="#2A2233">Команда python --version называет версию,</text>
      <text x="30" y="255" font-size="11" fill="#2A2233">но не говорит, какой файл запущен.</text>
      <text x="30" y="278" font-size="11" fill="#2A2233">pip ставит пакет в тот интерпретатор,</text>
      <text x="30" y="295" font-size="11" fill="#2A2233">который нашёлся первым в PATH.</text>
    </g>

    <rect x="16" y="330" width="648" height="40" rx="7" fill="#FBF7FC" stroke="#D5C2DC" stroke-dasharray="4 3"/>
    <text x="28" y="348" font-size="11" font-weight="600" fill="#2A2233">Проверка перед разбором ошибки импорта</text>
    <text x="28" y="363" font-family="Consolas,monospace" font-size="9.5" fill="#6B5F75">where python + python -c "import sys; print(sys.executable, sys.prefix != sys.base_prefix)"</text>

    <text x="16" y="390" font-family="Consolas,monospace" font-size="9.5" fill="#6B5F75">СНАЧАЛА СВЕРЯЮТ ПУТЬ, ПОТОМ ИЩУТ ОШИБКУ В КОДЕ</text>

    <defs>
      <marker id="pp-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8E5BC8"/></marker>
    </defs>
  </svg>
  <p class="note">Слева порядок поиска, справа три адреса, которые полезно сверить. Первый найденный файл определяет и запуск, и каталог установки пакетов.</p>
</div>
</body>
</html>
