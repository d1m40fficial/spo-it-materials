<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Одна схема и четыре потребителя</title>
<style>
  :root { --paper:#FAF7F6; --card:#FFFDFC; --ink:#2A2430; --muted:#6B6272; --rule:#E6D9EC; --accent:#8E5BC8; --soft:#EBE0EC; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px; }
  .eyebrow { margin:0 0 6px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .note { margin:10px 2px 0; font:12px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
  @media (max-width:560px) { .frame { padding:12px; } .note { font-size:11.5px; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">FastAPI · контракт</p>
  <svg viewBox="0 0 680 310" role="img" aria-labelledby="cs-title cs-desc">
    <title id="cs-title">Модель как единый источник контракта</title>
    <desc id="cs-desc">Одна модель Pydantic используется для проверки запроса, описания OpenAPI, страницы документации, клиентского кода и тестов.</desc>

    <line x1="340" y1="120" x2="340" y2="74" stroke="#8E5BC8" stroke-width="1.4"/>
    <line x1="230" y1="148" x2="180" y2="148" stroke="#8E5BC8" stroke-width="1.4"/>
    <line x1="450" y1="148" x2="500" y2="148" stroke="#8E5BC8" stroke-width="1.4"/>
    <line x1="340" y1="176" x2="340" y2="222" stroke="#8E5BC8" stroke-width="1.4"/>

    <g font-family="Segoe UI,system-ui,sans-serif">
      <rect x="240" y="20" width="200" height="54" rx="8" fill="#FFFDFC" stroke="#8E5BC8" stroke-width="1.6"/>
      <text x="340" y="42" text-anchor="middle" font-size="12" font-weight="700" fill="#2A2430">проверка запроса</text>
      <text x="340" y="58" text-anchor="middle" font-size="10" fill="#6B6272">типы и ограничения</text>

      <rect x="16" y="116" width="164" height="64" rx="8" fill="#FFFDFC" stroke="#D8C7E2"/>
      <text x="98" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#2A2430">OpenAPI и /docs</text>
      <text x="98" y="156" text-anchor="middle" font-size="10" fill="#6B6272">описание маршрутов</text>
      <text x="98" y="170" text-anchor="middle" font-size="10" fill="#6B6272">и полей</text>

      <rect x="230" y="116" width="220" height="64" rx="9" fill="#EBE0EC" stroke="#8E5BC8" stroke-width="1.8"/>
      <text x="340" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#2A2430">модель Pydantic</text>
      <text x="340" y="157" text-anchor="middle" font-size="10" fill="#2A2430">одно объявление полей</text>
      <text x="340" y="171" text-anchor="middle" font-size="10" fill="#2A2430">и правил</text>

      <rect x="500" y="116" width="164" height="64" rx="8" fill="#FFFDFC" stroke="#D8C7E2"/>
      <text x="582" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#2A2430">клиентский код</text>
      <text x="582" y="156" text-anchor="middle" font-size="10" fill="#6B6272">генерация по схеме</text>
      <text x="582" y="170" text-anchor="middle" font-size="10" fill="#6B6272">и Postman</text>

      <rect x="240" y="222" width="200" height="54" rx="8" fill="#FFFDFC" stroke="#D8C7E2"/>
      <text x="340" y="244" text-anchor="middle" font-size="12" font-weight="700" fill="#2A2430">тесты контракта</text>
      <text x="340" y="260" text-anchor="middle" font-size="10" fill="#6B6272">коды и структура</text>
    </g>

    <text x="340" y="298" text-anchor="middle" font-family="Consolas,monospace" font-size="9.5" fill="#6B6272">РАСХОЖДЕНИЕ ВОЗНИКАЕТ ТАМ, ГДЕ ОПИСАНИЕ ПИШУТ ВТОРОЙ РАЗ</text>
  </svg>
  <p class="note">Модель не заменяет архитектуру, но убирает ручное дублирование контракта. Чем больше клиентов, тем заметнее экономия.</p>
</div>
</body>
</html>
