<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Одна сборка на восемь узлов</title>
<style>
  :root { --paper:#FBF8FC; --card:#FFFFFF; --ink:#2A2430; --muted:#6B6175; --rule:#E0D3E6; --accent:#8E5BC8; --soft:#EBE0EC; --stop:#A85672; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:14px; }
  .eyebrow { margin:0 0 6px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .node rect { stroke-width:1.3; transition:stroke .15s, stroke-width .15s; cursor:pointer; }
  .node.good rect { fill:#FFFFFF; stroke:#D3C1DE; }
  .node.bad rect { fill:#F6E7EC; stroke:#A85672; }
  .node.on rect { stroke-width:2.6; stroke:#8E5BC8; }
  .node.bad.on rect { stroke:#A85672; }
  .status { min-height:70px; margin-top:8px; padding:10px 12px; border-radius:9px; background:var(--soft); font-size:13px; line-height:1.45; }
  .status b { color:var(--accent); }
  .note { margin:9px 2px 0; font:11.5px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
  @media (max-width:560px) { .frame { padding:10px; } .status { font-size:12.5px; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Структура · выпуск версии</p>
  <svg viewBox="0 0 680 292" role="img" aria-labelledby="rp2-title rp2-desc">
    <title id="rp2-title">Восемь узлов и одна сборка</title>
    <desc id="rp2-desc">Сборка версии 1.5 установлена на восемь узлов. На одном узле осталась версия 1.4. Нажмите узел, чтобы увидеть последствие.</desc>

    <g font-family="Segoe UI,system-ui,sans-serif">
      <text x="14" y="20" font-family="Consolas,monospace" font-size="9.5" fill="#6B6175">ВЫПУСК ОДНОЙ ВЕРСИИ</text>

      <rect x="14" y="112" width="124" height="68" rx="9" fill="#EBE0EC" stroke="#8E5BC8" stroke-width="1.8"/>
      <text x="76" y="136" text-anchor="middle" font-size="12" font-weight="700" fill="#2A2430">Сборка</text>
      <text x="76" y="154" text-anchor="middle" font-size="11" fill="#5A4A66">один артефакт</text>
      <text x="76" y="170" text-anchor="middle" font-size="11" font-weight="700" fill="#8E5BC8">версия 1.5</text>

      <line x1="138" y1="146" x2="166" y2="146" stroke="#8E5BC8" stroke-width="2"/>
      <path d="M160 140 L169 146 L160 152" fill="none" stroke="#8E5BC8" stroke-width="2"/>

      <line x1="172" y1="72" x2="172" y2="206" stroke="#B49AC6" stroke-width="2"/>
      <line x1="172" y1="72" x2="644" y2="72" stroke="#B49AC6" stroke-width="1.6"/>
      <line x1="172" y1="206" x2="644" y2="206" stroke="#B49AC6" stroke-width="1.6"/>

      <g class="node good" data-k="n1">
        <rect x="204" y="44" width="104" height="56" rx="7"/>
        <text x="256" y="66" text-anchor="middle" font-size="11" fill="#2A2430">узел 1</text>
        <text x="256" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#2A2430">1.5</text>
      </g>
      <g class="node good" data-k="n2">
        <rect x="324" y="44" width="104" height="56" rx="7"/>
        <text x="376" y="66" text-anchor="middle" font-size="11" fill="#2A2430">узел 2</text>
        <text x="376" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#2A2430">1.5</text>
      </g>
      <g class="node good" data-k="n3">
        <rect x="444" y="44" width="104" height="56" rx="7"/>
        <text x="496" y="66" text-anchor="middle" font-size="11" fill="#2A2430">узел 3</text>
        <text x="496" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#2A2430">1.5</text>
      </g>
      <g class="node good" data-k="n4">
        <rect x="564" y="44" width="102" height="56" rx="7"/>
        <text x="615" y="66" text-anchor="middle" font-size="11" fill="#2A2430">узел 4</text>
        <text x="615" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#2A2430">1.5</text>
      </g>

      <g class="node bad" data-k="n5">
        <rect x="204" y="178" width="104" height="56" rx="7"/>
        <text x="256" y="200" text-anchor="middle" font-size="11" fill="#2A2430">узел 5</text>
        <text x="256" y="220" text-anchor="middle" font-size="11" font-weight="700" fill="#A85672">1.4</text>
      </g>
      <g class="node good" data-k="n6">
        <rect x="324" y="178" width="104" height="56" rx="7"/>
        <text x="376" y="200" text-anchor="middle" font-size="11" fill="#2A2430">узел 6</text>
        <text x="376" y="220" text-anchor="middle" font-size="11" font-weight="700" fill="#2A2430">1.5</text>
      </g>
      <g class="node good" data-k="n7">
        <rect x="444" y="178" width="104" height="56" rx="7"/>
        <text x="496" y="200" text-anchor="middle" font-size="11" fill="#2A2430">узел 7</text>
        <text x="496" y="220" text-anchor="middle" font-size="11" font-weight="700" fill="#2A2430">1.5</text>
      </g>
      <g class="node good" data-k="n8">
        <rect x="564" y="178" width="102" height="56" rx="7"/>
        <text x="615" y="200" text-anchor="middle" font-size="11" fill="#2A2430">узел 8</text>
        <text x="615" y="220" text-anchor="middle" font-size="11" font-weight="700" fill="#2A2430">1.5</text>
      </g>

      <text x="14" y="272" font-size="11" fill="#6B6175">Семь узлов обновили, один забыли. Именно на нём осталась функция, которую считали удалённой.</text>
    </g>
  </svg>
  <div class="status" id="rp2-status"></div>
  <p class="note">Нажмите узел. Для семи узлов версия совпадает, для одного отличается, и это отличие решает исход выпуска.</p>
</div>
<script>
(function () {
  var good = '<b>Версия совпадает.</b> Узел работает на той же сборке 1.5, что и остальные. Поведение одинаково, сравнение журналов имеет смысл, откат затрагивает все машины сразу.';
  var bad = '<b>Версия отличается.</b> На этом узле осталась сборка 1.4 со старой функцией. Пока запросы приходят на другие узлы, различий не видно. Как только нагрузка попадает сюда, включается код, который считали удалённым. Один узел из восьми способен изменить поведение всей системы.';
  var nodes = document.querySelectorAll('.node');
  var status = document.getElementById('rp2-status');
  nodes.forEach(function (n) {
    n.addEventListener('click', function () {
      nodes.forEach(function (x) { x.classList.toggle('on', x === n); });
      status.innerHTML = n.classList.contains('bad') ? bad : good;
    });
  });
  nodes[4].classList.add('on');
  status.innerHTML = bad;
})();
</script>
</body>
</html>
