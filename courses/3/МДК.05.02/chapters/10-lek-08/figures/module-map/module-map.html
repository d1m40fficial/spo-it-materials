<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Направление зависимостей между модулями</title>
<style>
  :root { --paper:#FBF7FC; --card:#FFFFFF; --ink:#2A2233; --muted:#6B6076; --rule:#DCCDE4; --accent:#8E5BC8; --soft:#EBE0EC; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:14px; }
  .eyebrow { margin:0 0 6px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.13em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  text { font-family:"Segoe UI",system-ui,sans-serif; }
  .note { margin:9px 2px 0; font:11.5px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
  @media (max-width:560px) { .frame { padding:10px; } .note { font-size:11px; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Модули · направление импорта</p>
  <svg viewBox="0 0 680 336" role="img" aria-labelledby="mm-title mm-desc">
    <title id="mm-title">Зависимости учебного проекта</title>
    <desc id="mm-desc">Отчёт и API вызывают пакет sklad, пакет вызывает модуль reorder. Обратный импорт из reorder в report перечёркнут, потому что он создаёт цикл.</desc>

    <rect x="24" y="26" width="190" height="54" rx="8" fill="#FFFFFF" stroke="#DCCDE4"/>
    <text x="38" y="48" font-size="12" font-weight="700" fill="#2A2233">report.py</text>
    <text x="38" y="66" font-size="10.5" fill="#6B6076">консольный отчёт</text>

    <rect x="466" y="26" width="190" height="54" rx="8" fill="#FFFFFF" stroke="#DCCDE4"/>
    <text x="480" y="48" font-size="12" font-weight="700" fill="#2A2233">api.py</text>
    <text x="480" y="66" font-size="10.5" fill="#6B6076">обработчик запросов</text>

    <rect x="245" y="120" width="190" height="58" rx="8" fill="#EBE0EC" stroke="#8E5BC8" stroke-width="1.5"/>
    <text x="259" y="142" font-size="12" font-weight="700" fill="#2A2233">sklad/__init__.py</text>
    <text x="259" y="160" font-size="10.5" fill="#6B6076">публичные имена, __all__</text>

    <rect x="245" y="226" width="190" height="58" rx="8" fill="#FFFFFF" stroke="#8E5BC8" stroke-width="2"/>
    <text x="259" y="248" font-size="12" font-weight="700" fill="#2A2233">sklad/reorder.py</text>
    <text x="259" y="266" font-size="10.5" fill="#6B6076">расчёт, чистая функция</text>

    <line x1="156" y1="80" x2="290" y2="116" stroke="#8E5BC8" stroke-width="1.6"/>
    <polygon points="286,108 293,114 297,106" fill="#8E5BC8"/>
    <text x="168" y="108" font-size="9.5" fill="#6B6076">from sklad.reorder import ...</text>

    <line x1="524" y1="80" x2="390" y2="116" stroke="#8E5BC8" stroke-width="1.6"/>
    <polygon points="394,106 383,114 390,120" fill="#8E5BC8"/>
    <text x="420" y="108" font-size="9.5" fill="#6B6076">тот же импорт</text>

    <line x1="340" y1="178" x2="340" y2="222" stroke="#8E5BC8" stroke-width="1.6"/>
    <polygon points="335,218 345,218 340,226" fill="#8E5BC8"/>
    <text x="350" y="204" font-size="9.5" fill="#6B6076">внутри пакета</text>

    <path d="M435 226 C 590 210, 590 120, 470 88" fill="none" stroke="#A34A5E" stroke-width="1.4" stroke-dasharray="6 4"/>
    <line x1="558" y1="136" x2="580" y2="158" stroke="#A34A5E" stroke-width="2.4"/>
    <line x1="580" y1="136" x2="558" y2="158" stroke="#A34A5E" stroke-width="2.4"/>
    <text x="470" y="200" font-size="3.2" fill="#A34A5E"> </text>

    <rect x="470" y="226" width="186" height="58" rx="8" fill="#FBF2F4" stroke="#E3BCC6"/>
    <text x="482" y="246" font-size="10.5" font-weight="700" fill="#A34A5E">цикл запрещён</text>
    <text x="482" y="262" font-size="9.5" fill="#2A2233">reorder не импортирует report:</text>
    <text x="482" y="276" font-size="9.5" fill="#2A2233">расчёт не знает о выводе.</text>

    <text x="24" y="314" font-family="Consolas,monospace" font-size="9.5" fill="#6B6076">СТРЕЛКА ЗНАЧИТ «ИМПОРТИРУЕТ». ЗАВИСИМОСТЬ ИДЁТ В ОДНУ СТОРОНУ, ОТ ВЫВОДА К РАСЧЁТУ.</text>
  </svg>
  <p class="note">Отчёт и API знают про расчёт, расчёт не знает про них. Обратная стрелка создала бы циклический импорт и связала бы формулу с интерфейсом.</p>
</div>
</body>
</html>
