<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лаборатория контракта функции</title>
<style>
  :root { --paper:#FBF7FC; --card:#FFFFFF; --ink:#2A2233; --muted:#6B6076; --rule:#DCCDE4; --accent:#8E5BC8; --soft:#EBE0EC; --good:#3F7A5A; --bad:#A34A5E; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:14px; }
  .eyebrow { margin:0 0 6px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.13em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  text { font-family:"Segoe UI",system-ui,sans-serif; }
  .row { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 6px; }
  .row span { align-self:center; font:600 10px/1.2 Consolas,monospace; color:var(--muted); letter-spacing:.04em; }
  button { font:600 11px/1.1 "Segoe UI",system-ui,sans-serif; padding:6px 8px; border-radius:8px; border:1px solid var(--rule); background:var(--card); color:var(--ink); cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .panels { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .panel { padding:8px 10px; border:1px solid var(--rule); border-radius:8px; background:var(--card); font-size:11.5px; line-height:1.45; min-height:66px; }
  .panel h4 { margin:0 0 4px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
  .panel code { font-family:Consolas,monospace; font-size:11px; }
  .status { margin-top:8px; padding:9px 11px; border-radius:9px; background:var(--soft); font-size:12px; line-height:1.45; min-height:50px; }
  .status b { color:var(--accent); }
  .ok { color:var(--good); font-weight:700; }
  .err { color:var(--bad); font-weight:700; }
  .note { margin:8px 2px 0; font:11px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
  @media (max-width:520px) { .frame { padding:10px; } .panels { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Функции · контракт и побочный эффект</p>
  <svg viewBox="0 0 680 156" role="img" aria-labelledby="cl-title cl-desc">
    <title id="cl-title">Вызов функции и два канала результата</title>
    <desc id="cl-desc">Аргументы входят в функцию, возвращаемое значение идёт вызывающему коду, а побочный эффект уходит в консоль или глобальную переменную.</desc>

    <rect x="12" y="46" width="138" height="54" rx="8" fill="#FFFFFF" stroke="#DCCDE4"/>
    <text x="26" y="68" font-size="11" font-weight="700" fill="#2A2233">вызывающий код</text>
    <text x="26" y="86" font-size="10" fill="#6B6076">аргументы 12, 40, 10</text>

    <rect x="210" y="34" width="220" height="78" rx="9" fill="#EBE0EC" stroke="#8E5BC8" stroke-width="1.6"/>
    <text x="226" y="56" font-size="11" font-weight="700" fill="#2A2233">reorder_quantity</text>
    <text x="226" y="74" font-size="10" fill="#6B6076">предусловие: pack &gt; 0</text>
    <text x="226" y="89" font-size="10" fill="#6B6076">постусловие: кратно упаковке</text>
    <text x="226" y="104" font-size="10" fill="#8E5BC8">инвариант: список не меняется</text>

    <rect x="500" y="24" width="168" height="46" rx="8" fill="#FFFFFF" stroke="#DCCDE4"/>
    <text x="514" y="43" font-size="10" font-weight="700" fill="#2A2233">возврат значения</text>
    <text x="514" y="59" font-size="10" fill="#6B6076" id="ret-label">30 штук</text>

    <rect x="500" y="86" width="168" height="46" rx="8" fill="#FFFFFF" stroke="#DCCDE4"/>
    <text x="514" y="105" font-size="10" font-weight="700" fill="#2A2233">побочный канал</text>
    <text x="514" y="121" font-size="10" fill="#6B6076" id="side-label">нет</text>

    <line x1="150" y1="73" x2="206" y2="73" stroke="#8E5BC8" stroke-width="1.6"/>
    <polygon points="206,69 206,77 214,73" fill="#8E5BC8"/>
    <line x1="430" y1="62" x2="496" y2="47" stroke="#8E5BC8" stroke-width="1.6"/>
    <polygon points="496,43 497,51 505,45" fill="#8E5BC8"/>
    <line x1="430" y1="86" x2="496" y2="104" stroke="#A34A5E" stroke-width="1.4" stroke-dasharray="5 3"/>
    <polygon points="496,100 497,108 505,102" fill="#A34A5E"/>

    <text x="12" y="132" font-family="Consolas,monospace" font-size="9.5" fill="#6B6076">ВОЗВРАТ И ПОБОЧНЫЙ ЭФФЕКТ ЭТО РАЗНЫЕ КАНАЛЫ. ВЫЗЫВАЮЩИЙ КОД ЖДЁТ ТОЛЬКО ПЕРВЫЙ.</text>
  </svg>

  <div class="row" id="impl">
    <span>РЕАЛИЗАЦИЯ:</span>
    <button data-i="pure" class="on">чистая</button>
    <button data-i="print">с печатью</button>
    <button data-i="global">с глобальным итогом</button>
  </div>
  <div class="row" id="inputs">
    <span>ВХОД:</span>
    <button data-x="normal" class="on">12 / 40 / 10</button>
    <button data-x="enough">96 / 60 / 12</button>
    <button data-x="zero">0 / 25 / 5</button>
    <button data-x="bad">12 / 40 / 0</button>
    <button id="repeat">Вызвать ещё раз</button>
  </div>

  <div class="panels">
    <div class="panel"><h4>Консоль</h4><div id="console">пусто</div></div>
    <div class="panel"><h4>Глобальный итог</h4><div id="globals">0</div></div>
  </div>
  <div class="status" id="status" aria-live="polite"></div>
  <p class="note">Один и тот же вход, три реализации. Смотрите не только на ответ, но и на консоль, глобальный итог и второй вызов.</p>
</div>
<script>
(function () {
  var inputs = {
    normal: { q: 12, m: 40, p: 10 },
    enough: { q: 96, m: 60, p: 12 },
    zero: { q: 0, m: 25, p: 5 },
    bad: { q: 12, m: 40, p: 0 }
  };
  var impl = "pure", input = "normal", globalTotal = 0, consoleLines = [];
  var consoleBox = document.getElementById("console");
  var globalBox = document.getElementById("globals");
  var status = document.getElementById("status");
  var retLabel = document.getElementById("ret-label");
  var sideLabel = document.getElementById("side-label");
  var ib = document.querySelectorAll("#impl button");
  var xb = document.querySelectorAll("#inputs button[data-x]");

  function compute(x) {
    if (x.p <= 0) throw new Error("Кратность упаковки должна быть больше нуля");
    if (x.q >= x.m) return { order: 0, missing: 0, packs: 0 };
    var missing = x.m - x.q;
    var packs = Math.floor((missing + x.p - 1) / x.p);
    return { order: packs * x.p, missing: missing, packs: packs };
  }

  function render(keep) {
    var x = inputs[input];
    if (!keep) consoleLines = [];
    var result, error = "";
    try {
      var c = compute(x);
      result = c.order;
      if (impl === "print") {
        consoleLines.push("Заказ: " + result);
      }
      if (impl === "global") {
        globalTotal += result;
      }
    } catch (e) {
      error = e.message;
    }
    if (error) {
      retLabel.textContent = "ошибка";
      sideLabel.textContent = impl === "pure" ? "нет" : "нет, но ошибка";
      status.innerHTML = "<span class=\"err\">Отказ:</span> " + error + ". Проверка входа стоит до расчёта, поэтому деления на ноль нет.";
    } else {
      retLabel.textContent = result + " штук";
      sideLabel.textContent = impl === "pure" ? "нет" : (impl === "print" ? "строка в консоли" : "итог +" + result);
      if (impl === "pure") {
        status.innerHTML = "<b>Чистая функция.</b> Вернула " + result + ". Второй вызов с теми же аргументами вернёт " + result + ", потому что результат зависит только от входа.";
      } else if (impl === "print") {
        status.innerHTML = "<b>Печать внутри расчёта.</b> Вернула " + result + ", но в консоль ушла строка. Второй вызов добавит ещё одну такую же строку.";
      } else {
        status.innerHTML = "<b>Скрытое состояние.</b> Вернула " + result + ", а глобальный итог стал " + globalTotal + ". Следующий вызов увеличит его снова, хотя аргументы те же.";
      }
    }
    consoleBox.innerHTML = consoleLines.length ? consoleLines.map(function (l) { return "<code>" + l + "</code>"; }).join("<br>") : "пусто";
    globalBox.textContent = String(globalTotal);
    for (var i = 0; i < ib.length; i++) ib[i].classList.toggle("on", ib[i].dataset.i === impl);
    for (var j = 0; j < xb.length; j++) xb[j].classList.toggle("on", xb[j].dataset.x === input);
  }

  function pickImpl(k) { impl = k; globalTotal = 0; render(false); }
  function pickInput(k) { input = k; globalTotal = 0; render(false); }
  for (var i = 0; i < ib.length; i++) ib[i].addEventListener("click", function () { pickImpl(this.dataset.i); });
  for (var j = 0; j < xb.length; j++) xb[j].addEventListener("click", function () { pickInput(this.dataset.x); });
  document.getElementById("repeat").addEventListener("click", function () { render(true); });
  render(false);
})();
</script>
</body>
</html>
