<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каналы утечки секрета</title>
<style>
  :root { --paper:#F8F4FA; --card:#FFFDFF; --ink:#241C2B; --muted:#6C6076; --rule:#DCCDE3; --accent:#8E5BC8; --soft:#EBE0EC; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px; }
  .eyebrow { margin:0 0 6px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .ch rect { fill:var(--card); stroke:#C9B6D4; stroke-width:1.3; cursor:pointer; transition:fill .15s, stroke .15s; }
  .ch text { pointer-events:none; }
  .ch.on rect { fill:var(--soft); stroke:var(--accent); stroke-width:2; }
  .status { min-height:78px; margin-top:8px; padding:10px 12px; border-radius:9px; background:var(--soft); font-size:12.8px; line-height:1.5; }
  .status b { color:var(--accent); }
  .controls { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  button { font:600 11.5px/1.1 "Segoe UI",system-ui,sans-serif; padding:8px 9px; border-radius:8px; border:1px solid var(--rule); background:var(--card); color:var(--ink); cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .note { margin:9px 2px 0; font:11.5px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
  @media (max-width:560px) { .frame { padding:12px; } .status { font-size:12px; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Секреты · куда утекает значение</p>
  <svg viewBox="0 0 680 236" role="img" aria-labelledby="sc-title sc-desc">
    <title id="sc-title">Шесть каналов утечки секрета</title>
    <desc id="sc-desc">История Git, журнал, страница ошибки, снимок экрана, резервная копия и конвейер сборки. Нажмите канал, чтобы увидеть механизм утечки и контроль.</desc>

    <g class="ch" data-k="git">
      <rect x="12" y="22" width="208" height="88" rx="9"/>
      <text x="26" y="44" font-size="12" font-weight="700">История Git</text>
      <text x="26" y="64" font-size="10" fill="#6C6076">пароль в коммите</text>
      <text x="26" y="80" font-size="10" fill="#6C6076">остаётся в старых</text>
      <text x="26" y="96" font-size="10" fill="#6C6076">версиях файла</text>
    </g>

    <g class="ch" data-k="log">
      <rect x="236" y="22" width="208" height="88" rx="9"/>
      <text x="250" y="44" font-size="12" font-weight="700">Журнал</text>
      <text x="250" y="64" font-size="10" fill="#6C6076">строка отладки</text>
      <text x="250" y="80" font-size="10" fill="#6C6076">с токеном или</text>
      <text x="250" y="96" font-size="10" fill="#6C6076">строкой подключения</text>
    </g>

    <g class="ch" data-k="error">
      <rect x="460" y="22" width="208" height="88" rx="9"/>
      <text x="474" y="44" font-size="12" font-weight="700">Страница ошибки</text>
      <text x="474" y="64" font-size="10" fill="#6C6076">стек вызовов</text>
      <text x="474" y="80" font-size="10" fill="#6C6076">и текст SQL</text>
      <text x="474" y="96" font-size="10" fill="#6C6076">уходят клиенту</text>
    </g>

    <g class="ch" data-k="shot">
      <rect x="12" y="122" width="208" height="88" rx="9"/>
      <text x="26" y="144" font-size="12" font-weight="700">Снимок и чат</text>
      <text x="26" y="164" font-size="10" fill="#6C6076">окно настроек</text>
      <text x="26" y="180" font-size="10" fill="#6C6076">попало в кадр</text>
      <text x="26" y="196" font-size="10" fill="#6C6076">или в переписку</text>
    </g>

    <g class="ch" data-k="backup">
      <rect x="236" y="122" width="208" height="88" rx="9"/>
      <text x="250" y="144" font-size="12" font-weight="700">Резервная копия</text>
      <text x="250" y="164" font-size="10" fill="#6C6076">архив с базой</text>
      <text x="250" y="180" font-size="10" fill="#6C6076">и ключом</text>
      <text x="250" y="196" font-size="10" fill="#6C6076">в одном месте</text>
    </g>

    <g class="ch" data-k="ci">
      <rect x="460" y="122" width="208" height="88" rx="9"/>
      <text x="474" y="144" font-size="12" font-weight="700">Конвейер сборки</text>
      <text x="474" y="164" font-size="10" fill="#6C6076">секрет в логе</text>
      <text x="474" y="180" font-size="10" fill="#6C6076">сборки и в</text>
      <text x="474" y="196" font-size="10" fill="#6C6076">артефакте</text>
    </g>
  </svg>
  <div class="status" id="sc-status"></div>
  <div class="controls" id="sc-buttons"></div>
  <p class="note">Нажмите канал. Сравните, какие каналы закрываются настройкой, а какие требуют привычки не показывать и не пересылать секрет.</p>
</div>
<script>
(function () {
  var data = {
    git: '<b>История Git.</b> Строку удалили из файла, но коммит остался, а вместе с ним и пароль. Копия могла уйти в форк или архив. Контроль: секрет живёт вне репозитория, а попавший в историю пароль меняют, а не только вычищают.',
    log: '<b>Журнал.</b> Отладочная строка печатает строку подключения или заголовок Authorization. Файл журнала переживает смену пароля и попадает в архив. Контроль: фильтр секретов в журнале, запрет печатать тело запроса и заголовки целиком.',
    error: '<b>Страница ошибки.</b> Драйвер возвращает текст исключения со строкой подключения, а приложение показывает его клиенту. Контроль: короткое сообщение с идентификатором запроса, подробности в журнал без секретов.',
    shot: '<b>Снимок и чат.</b> На совещании в кадр попадает окно с настройками, а в переписку уходит файл конфигурации. Контроль: секрет не показывают на экране, для передачи используют хранилище с ограниченным доступом и сроком.',
    backup: '<b>Резервная копия.</b> Зашифрованная база лежит в одном архиве с ключом. Кража архива даёт и замок, и ключ. Контроль: ключ хранится отдельно, копия ключа в другом месте, доступ к архиву ограничен.',
    ci: '<b>Конвейер сборки.</b> Пароль к базе или токен реестра лежит в настройках сборочной системы и печатается в логе. Контроль: секреты на одну задачу, маскирование вывода, отдельные значения для стенда и рабочей среды.'
  };
  var names = { git:'История Git', log:'Журнал', error:'Страница ошибки', shot:'Снимок и чат', backup:'Резервная копия', ci:'Конвейер сборки' };
  var key = 'git';
  var status = document.getElementById('sc-status');
  var buttons = document.getElementById('sc-buttons');

  function paint() {
    document.querySelectorAll('.ch').forEach(function (c) { c.classList.toggle('on', c.dataset.k === key); });
    buttons.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b.dataset.k === key); });
    status.innerHTML = data[key];
  }

  document.querySelectorAll('.ch').forEach(function (c) {
    c.addEventListener('click', function () { key = c.dataset.k; paint(); });
  });
  Object.keys(names).forEach(function (k) {
    var b = document.createElement('button');
    b.textContent = names[k];
    b.dataset.k = k;
    b.addEventListener('click', function () { key = k; paint(); });
    buttons.appendChild(b);
  });
  paint();
})();
</script>
</body>
</html>
