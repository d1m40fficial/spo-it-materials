<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Устройство замечания в рецензии</title>
<style>
  :root { --paper:#EBE0EC; --card:#FFFDFF; --ink:#2A2430; --muted:#6B5F72; --rule:#D6C4DB; --accent:#8E5BC8; --soft:#F3EAF6; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px; }
  .eyebrow { margin:0 0 6px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .part { cursor:pointer; }
  .part rect { fill:#FFFDFF; stroke:#C9AFD2; stroke-width:1.3; transition:fill .15s, stroke .15s; }
  .part.on rect { fill:#8E5BC8; stroke:#8E5BC8; }
  .part.on text { fill:#FFF; }
  .part text { font-family:"Segoe UI",system-ui,sans-serif; pointer-events:none; }
  .hl { opacity:0; transition:opacity .15s; }
  .hl.on { opacity:1; }
  .status { min-height:64px; margin-top:8px; padding:10px 12px; border-radius:9px; background:var(--soft); font-size:13px; line-height:1.45; }
  .status b { color:var(--accent); }
  .controls { display:flex; gap:5px; flex-wrap:wrap; margin-top:10px; }
  button { font:600 11px/1.1 "Segoe UI",system-ui,sans-serif; padding:8px 8px; border-radius:8px; border:1px solid var(--rule); background:var(--card); color:var(--ink); cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .note { margin:9px 2px 0; font:11.5px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
  @media (max-width:560px) { .frame { padding:12px; } .status { font-size:12.5px; } button { font-size:10.5px; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Code review · замечание</p>
  <svg viewBox="0 0 680 300" role="img" aria-labelledby="ca-title ca-desc">
    <title id="ca-title">Из чего состоит замечание в рецензии</title>
    <desc id="ca-desc">Пример комментария с местом, уровнем, наблюдением, причиной и предложением. Нажмите часть, чтобы увидеть её роль.</desc>

    <rect x="16" y="30" width="648" height="122" rx="10" fill="#FFFDFF" stroke="#C9AFD2"/>
    <rect class="hl" data-hl="place" x="24" y="42" width="632" height="22" rx="5" fill="#F3EAF6"/>
    <rect class="hl" data-hl="observation" x="24" y="66" width="632" height="22" rx="5" fill="#F3EAF6"/>
    <rect class="hl" data-hl="cause" x="24" y="88" width="632" height="22" rx="5" fill="#F3EAF6"/>
    <rect class="hl" data-hl="proposal" x="24" y="112" width="632" height="22" rx="5" fill="#F3EAF6"/>

    <text x="34" y="58" font-family="Consolas,monospace" font-size="11.5" font-weight="700" fill="#8E5BC8">src/stock.py:11  ·  блокирующее</text>
    <text x="34" y="82" font-family="Segoe UI,system-ui,sans-serif" font-size="11.5" fill="#2A2430">Условие сравнивает запрос с общим остатком.</text>
    <text x="34" y="104" font-family="Segoe UI,system-ui,sans-serif" font-size="11.5" fill="#2A2430">При 40, 30 и 25 вернётся 15 вместо ошибки.</text>
    <text x="34" y="128" font-family="Segoe UI,system-ui,sans-serif" font-size="11.5" fill="#2A2430">Нужно вычесть резерв до проверки.</text>

    <g class="part" data-k="place">
      <rect x="16" y="170" width="122" height="38" rx="8"/>
      <text x="77" y="194" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2A2430">Место</text>
    </g>
    <g class="part" data-k="level">
      <rect x="146" y="170" width="122" height="38" rx="8"/>
      <text x="207" y="194" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2A2430">Уровень</text>
    </g>
    <g class="part" data-k="observation">
      <rect x="276" y="170" width="122" height="38" rx="8"/>
      <text x="337" y="194" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2A2430">Наблюдение</text>
    </g>
    <g class="part" data-k="cause">
      <rect x="406" y="170" width="122" height="38" rx="8"/>
      <text x="467" y="194" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2A2430">Причина</text>
    </g>
    <g class="part" data-k="proposal">
      <rect x="536" y="170" width="128" height="38" rx="8"/>
      <text x="600" y="194" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2A2430">Предложение</text>
    </g>

    <text x="16" y="244" font-family="Consolas,monospace" font-size="9.5" fill="#6B5F72">БЕЗ МЕСТА АВТОР ИЩЕТ САМ, БЕЗ ПРИЧИНЫ СПОРИТ, БЕЗ ПРЕДЛОЖЕНИЯ НЕ ЗНАЕТ, ЧТО ДЕЛАТЬ</text>
    <text x="16" y="266" font-family="Segoe UI,system-ui,sans-serif" font-size="10.5" fill="#6B5F72">Наблюдение и причина проверяемы: их можно подтвердить конкретным входом.</text>
    <text x="16" y="284" font-family="Segoe UI,system-ui,sans-serif" font-size="10.5" fill="#6B5F72">Уровень говорит, обязательно ли исправление до слияния.</text>
  </svg>
  <div class="status" id="ca-status"></div>
  <div class="controls" id="ca-buttons">
    <button data-k="place" class="on">Место</button>
    <button data-k="level">Уровень</button>
    <button data-k="observation">Наблюдение</button>
    <button data-k="cause">Причина</button>
    <button data-k="proposal">Предложение</button>
  </div>
  <p class="note">Нажмите часть замечания. Обратите внимание: «блокирующее» относится к уровню, а не к тону комментария.</p>
</div>
<script>
(function () {
  var data = {
    place: '<b>Место.</b> Файл и строка: src/stock.py:11. Без места автор ищет проблему по всему изменению, а переписка растягивается. Место также помогает понять, о какой версии кода идёт речь после новых коммитов.',
    level: '<b>Уровень.</b> «Блокирующее» означает, что изменение нельзя сливать до исправления. Уровень задаёт приоритет, но не оправдывает резкий тон. Если замечание необязательное, так и пишут: nit или незначительное.',
    observation: '<b>Наблюдение.</b> Что именно происходит: условие сравнивает запрос с общим остатком. Это факт о коде, его можно проверить по diff. Наблюдение не должно содержать оценку автора или догадку о его намерениях.',
    cause: '<b>Причина.</b> Почему это проблема: при 40, 30 и 25 вернётся 15 вместо ошибки. Конкретный вход превращает замечание в проверяемое утверждение и показывает цену ошибки.',
    proposal: '<b>Предложение.</b> Что сделать: вычесть резерв до проверки. Предложение может быть не единственным правильным, поэтому его отделяют от факта. Автор вправе предложить другое решение, если объяснит его.'
  };
  var parts = document.querySelectorAll('.part');
  var buttons = document.querySelectorAll('#ca-buttons button');
  var status = document.getElementById('ca-status');
  var highlights = document.querySelectorAll('.hl');

  function apply(key) {
    parts.forEach(function (p) { p.classList.toggle('on', p.dataset.k === key); });
    buttons.forEach(function (b) { b.classList.toggle('on', b.dataset.k === key); });
    status.innerHTML = data[key];
    highlights.forEach(function (h) { h.classList.toggle('on', h.dataset.hl === key); });
  }
  parts.forEach(function (p) { p.addEventListener('click', function () { apply(p.dataset.k); }); });
  buttons.forEach(function (b) { b.addEventListener('click', function () { apply(b.dataset.k); }); });
  apply('place');
})();
</script>
</body>
</html>
