<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Уровни тестов и цена проверки</title>
<style>
  :root { --paper:#FBF7FC; --card:#FFFFFF; --ink:#2B2433; --muted:#6E6278; --rule:#E0D2E6; --accent:#8E5BC8; --soft:#EBE0EC; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px; }
  .eyebrow { margin:0 0 6px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .note { margin:10px 2px 0; font:12px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Тесты · уровни</p>
  <svg viewBox="0 0 680 336" role="img" aria-labelledby="tcl-title tcl-desc">
    <title id="tcl-title">Пирамида тестов и цена одного прогона</title>
    <desc id="tcl-desc">Внизу 210 модульных тестов по 1-5 миллисекунд, в середине 34 интеграционных по 0,2-2 секунды, вверху 6 сквозных по несколько минут. Чем выше уровень, тем дороже проверка и тем шире круг поиска при падении.</desc>

    <text x="16" y="24" font-size="16" font-weight="700" fill="#2B2433">Дешёвых проверок должно быть больше</text>
    <text x="16" y="43" font-size="11" fill="#6E6278">уровень выбирают по вопросу, а не по привычке</text>

    <g font-family="Segoe UI,system-ui,sans-serif">
      <rect x="150" y="58" width="120" height="46" rx="7" fill="#EBE0EC" stroke="#C9AFD6"/>
      <text x="210" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#5E338F">6 сквозных</text>
      <text x="210" y="94" text-anchor="middle" font-family="Consolas,monospace" font-size="9.5" fill="#6E6278">минуты</text>

      <rect x="105" y="112" width="210" height="54" rx="7" fill="#F1E7F5" stroke="#C9AFD6"/>
      <text x="210" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#5E338F">34 интеграционных</text>
      <text x="210" y="150" text-anchor="middle" font-family="Consolas,monospace" font-size="9.5" fill="#6E6278">0,2-2 с</text>

      <rect x="56" y="174" width="308" height="60" rx="7" fill="#FBF7FC" stroke="#9D7BB3"/>
      <text x="210" y="198" text-anchor="middle" font-size="13" font-weight="700" fill="#5E338F">210 модульных</text>
      <text x="210" y="214" text-anchor="middle" font-family="Consolas,monospace" font-size="9.5" fill="#6E6278">1-5 мс</text>

      <text x="400" y="72" font-size="11" font-weight="700" fill="#2B2433">Что доказывает</text>
      <text x="400" y="87" font-size="10.5" fill="#6E6278">путь пользователя целиком</text>
      <text x="400" y="126" font-size="10.5" fill="#6E6278">связку модулей, базы и API</text>
      <text x="400" y="141" font-size="10.5" fill="#6E6278">формат данных и схему</text>
      <text x="400" y="190" font-size="10.5" fill="#6E6278">формулу, разбор, границы</text>

      <text x="400" y="222" font-size="11" font-weight="700" fill="#2B2433">Кому указывает ошибку</text>
      <text x="400" y="237" font-size="10.5" fill="#6E6278">команде и заказчику</text>
      <text x="400" y="252" font-size="10.5" fill="#6E6278">разработчику и тестировщику</text>
      <text x="400" y="267" font-size="10.5" fill="#6E6278">разработчику, почти в строку</text>
    </g>

    <line x1="40" y1="252" x2="370" y2="252" stroke="#D9C8E0" stroke-width="1"/>
    <text x="40" y="272" font-family="Consolas,monospace" font-size="9.5" fill="#6E6278">ЦЕНА ПРОВЕРКИ РАСТЁТ СНИЗУ ВВЕРХ</text>
    <text x="40" y="290" font-size="11" fill="#2B2433">Частота запуска падает сверху вниз: модульные идут после каждой правки,</text>
    <text x="40" y="306" font-size="11" fill="#2B2433">сквозные на каждую сборку или перед выпуском.</text>

    <rect x="40" y="316" width="600" height="1" fill="#E0D2E6"/>
  </svg>
  <p class="note">Числа взяты из учебного проекта «Склад+» и показывают пропорцию, а не норматив. В другом проекте пропорция может быть иной, но дешёвые проверки всё равно остаются основой.</p>
</div>
</body>
</html>
