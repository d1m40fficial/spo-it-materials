<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Матрица дефектов и уровней тестов</title>
<style>
  :root { --paper:#FBF7FC; --card:#FFFFFF; --ink:#2B2433; --muted:#6E6278; --rule:#E0D2E6; --accent:#8E5BC8; --soft:#EBE0EC; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px; }
  .eyebrow { margin:0 0 6px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .note { margin:10px 2px 0; font:12px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Тесты · матрица</p>
  <svg viewBox="0 0 680 318" role="img" aria-labelledby="tm-title tm-desc">
    <title id="tm-title">Какие дефекты ловит каждый уровень тестов</title>
    <desc id="tm-desc">Таблица из шести дефектов и трёх уровней. Закрашенный круг означает, что уровень ловит дефект, пустой что пропускает. Ошибку формулы ловят все уровни, опечатку в колонке только интеграционный, не тот маршрут только сквозной.</desc>

    <text x="16" y="24" font-size="16" font-weight="700" fill="#2B2433">Кто поймает этот дефект</text>
    <text x="16" y="43" font-size="11" fill="#6E6278">закрашенный круг: уровень ловит дефект, пустой: пропускает</text>

    <g font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="700" fill="#2B2433">
      <text x="340" y="72" text-anchor="middle">модульный</text>
      <text x="470" y="72" text-anchor="middle">интеграционный</text>
      <text x="600" y="72" text-anchor="middle">сквозной</text>
    </g>
    <line x1="16" y1="80" x2="664" y2="80" stroke="#D9C8E0"/>

    <g font-family="Segoe UI,system-ui,sans-serif" font-size="11.5" fill="#2B2433">
      <text x="16" y="102">Неверная формула остатка</text>
      <text x="16" y="136">Опечатка в имени колонки</text>
      <text x="16" y="170">Забытый commit после записи</text>
      <text x="16" y="204">Ограничение базы отвергает значение</text>
      <text x="16" y="238">Неверный код ответа API</text>
      <text x="16" y="272">Кнопка вызывает не тот маршрут</text>
    </g>

    <g>
      <circle cx="340" cy="98" r="8" fill="#8E5BC8"/>
      <circle cx="470" cy="98" r="8" fill="#8E5BC8"/>
      <circle cx="600" cy="98" r="8" fill="#8E5BC8"/>

      <circle cx="340" cy="132" r="8" fill="#FFFFFF" stroke="#C9AFD6" stroke-width="1.6"/>
      <circle cx="470" cy="132" r="8" fill="#8E5BC8"/>
      <circle cx="600" cy="132" r="8" fill="#8E5BC8"/>

      <circle cx="340" cy="166" r="8" fill="#FFFFFF" stroke="#C9AFD6" stroke-width="1.6"/>
      <circle cx="470" cy="166" r="8" fill="#8E5BC8"/>
      <circle cx="600" cy="166" r="8" fill="#8E5BC8"/>

      <circle cx="340" cy="200" r="8" fill="#FFFFFF" stroke="#C9AFD6" stroke-width="1.6"/>
      <circle cx="470" cy="200" r="8" fill="#8E5BC8"/>
      <circle cx="600" cy="200" r="8" fill="#8E5BC8"/>

      <circle cx="340" cy="234" r="8" fill="#FFFFFF" stroke="#C9AFD6" stroke-width="1.6"/>
      <circle cx="470" cy="234" r="8" fill="#8E5BC8"/>
      <circle cx="600" cy="234" r="8" fill="#8E5BC8"/>

      <circle cx="340" cy="268" r="8" fill="#FFFFFF" stroke="#C9AFD6" stroke-width="1.6"/>
      <circle cx="470" cy="268" r="8" fill="#FFFFFF" stroke="#C9AFD6" stroke-width="1.6"/>
      <circle cx="600" cy="268" r="8" fill="#8E5BC8"/>
    </g>

    <line x1="16" y1="286" x2="664" y2="286" stroke="#E0D2E6"/>
    <text x="16" y="304" font-family="Consolas,monospace" font-size="9.5" fill="#6E6278">ПОСЛЕ НАЙДЕННОГО ДЕФЕКТА ДОБАВЛЯЮТ ПРОВЕРКУ НА САМОМ ДЕШЁВОМ УРОВНЕ, КОТОРЫЙ ЕГО ЛОВИТ</text>
  </svg>
  <p class="note">Матрица помогает не дублировать одну проверку на всех уровнях. Дефект формулы дешевле поймать модульным тестом, а не тот маршрут интерфейса можно проверить только сквозным сценарием.</p>
</div>
</body>
</html>
