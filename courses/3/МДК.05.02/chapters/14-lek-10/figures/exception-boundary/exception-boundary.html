<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Путь ошибки через слои приложения</title>
<style>
  :root { --paper:#F7F0FA; --card:#FFFFFF; --ink:#2B2333; --muted:#6E6179; --rule:#DCCBE6; --accent:#8E5BC8; --soft:#EBE0EC; --deep:#5B2E86; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px; }
  .eyebrow { margin:0 0 6px; font:600 10.5px/1.2 Consolas,monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .note { margin:10px 2px 0; font:12px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Исключения · граница модуля</p>
  <svg viewBox="0 0 680 392" role="img" aria-labelledby="eb-title eb-desc">
    <title id="eb-title">Путь ошибки через четыре слоя</title>
    <desc id="eb-desc">Снизу вверх: доступ к данным переводит сбой драйвера в StorageError, бизнес-логика поднимает SkladError, интерфейс превращает тип в код ответа, точка входа пишет стек в журнал.</desc>

    <defs>
      <marker id="eb-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#8E5BC8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <line x1="24" y1="322" x2="24" y2="46" stroke="#8E5BC8" stroke-width="1.8" marker-end="url(#eb-arrow)"/>
    <text x="38" y="20" font-family="Consolas,monospace" font-size="9.5" fill="#5B2E86">ОШИБКА ИДЁТ ВВЕРХ</text>

    <g font-family="Segoe UI,system-ui,sans-serif">
      <rect x="44" y="24" width="604" height="58" rx="8" fill="#EBE0EC" stroke="#8E5BC8" stroke-width="1.8"/>
      <text x="58" y="45" font-size="13.5" font-weight="700" fill="#2B2333">Точка входа</text>
      <text x="58" y="64" font-size="11.5" fill="#4E4358">ловит непредвиденное, пишет стек в журнал</text>
      <text x="410" y="45" font-size="10.5" fill="#6E6179">пользователь</text>
      <text x="410" y="63" font-size="12" font-weight="600" fill="#5B2E86">код возврата 3</text>

      <rect x="44" y="100" width="604" height="58" rx="8" fill="#FFFFFF" stroke="#C9B6D6"/>
      <text x="58" y="121" font-size="13.5" font-weight="700" fill="#2B2333">HTTP-обработчик или CLI</text>
      <text x="58" y="140" font-size="11.5" fill="#4E4358">переводит тип ошибки в понятный ответ</text>
      <text x="410" y="121" font-size="10.5" fill="#6E6179">ответ</text>
      <text x="410" y="139" font-size="12" font-weight="600" fill="#5B2E86">400, 404, 409</text>

      <rect x="44" y="176" width="604" height="58" rx="8" fill="#FFFFFF" stroke="#C9B6D6"/>
      <text x="58" y="197" font-size="13.5" font-weight="700" fill="#2B2333">Бизнес-логика</text>
      <text x="58" y="216" font-size="11.5" fill="#4E4358">проверяет правила и поднимает SkladError с полями</text>
      <text x="410" y="197" font-size="10.5" fill="#6E6179">вызывающему</text>
      <text x="410" y="215" font-size="12" font-weight="600" fill="#5B2E86">SkladError</text>

      <rect x="44" y="252" width="604" height="58" rx="8" fill="#FFFFFF" stroke="#C9B6D6"/>
      <text x="58" y="273" font-size="13.5" font-weight="700" fill="#2B2333">Доступ к данным</text>
      <text x="58" y="292" font-size="11.5" fill="#4E4358">переводит сбой драйвера в StorageError, сохраняя причину</text>
      <text x="410" y="273" font-size="10.5" fill="#6E6179">наверх</text>
      <text x="410" y="291" font-size="12" font-weight="600" fill="#5B2E86">StorageError</text>

      <rect x="44" y="330" width="604" height="36" rx="7" fill="#F1E8F5" stroke="#C9B6D6" stroke-dasharray="4 3"/>
      <text x="58" y="353" font-size="11.5" fill="#4E4358">сбой драйвера, файла, сети или разбора данных</text>

      <text x="58" y="384" font-family="Consolas,monospace" font-size="9.5" fill="#6E6179">ЛОВЯТ ТАМ, ГДЕ ОШИБКУ ПРЕВРАЩАЮТ В ОТВЕТ ИЛИ ЗАПИСЬ ЖУРНАЛА</text>
    </g>
  </svg>
  <p class="note">Внутри слоёв ошибку не глотают: её переводят в понятный тип и передают выше. Журнал ведут один раз, на границе.</p>
</div>
</body>
</html>
