<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Замена файла: поверх и через временный файл</title>
<style>
  :root { --paper:#F7F0FA; --card:#FFFFFF; --ink:#2B2333; --muted:#6E6179; --rule:#DCCBE6; --accent:#8E5BC8; --soft:#EBE0EC; --deep:#5B2E86; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px; }
  .eyebrow { margin:0 0 6px; font:600 10.5px/1.2 Consolas,monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .note { margin:10px 2px 0; font:12px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Файлы · атомарная замена</p>
  <svg viewBox="0 0 680 336" role="img" aria-labelledby="ar-title ar-desc">
    <title id="ar-title">Две стратегии замены файла</title>
    <desc id="ar-desc">Запись поверх старого файла оставляет читателю половину данных при сбое. Запись во временный файл, сброс на диск и переименование дают читателю старую или новую версию целиком.</desc>

    <g font-family="Segoe UI,system-ui,sans-serif">
      <rect x="16" y="24" width="310" height="252" rx="9" fill="#FFFFFF" stroke="#DCCBE6"/>
      <text x="30" y="48" font-size="13.5" font-weight="700" fill="#2B2333">Запись поверх</text>
      <text x="30" y="66" font-size="10.5" fill="#8A4F6E">риск половины файла</text>

      <rect x="30" y="80" width="282" height="32" rx="6" fill="#F1E8F5" stroke="#C9B6D6" stroke-dasharray="4 3"/>
      <text x="42" y="101" font-size="11.5" fill="#4E4358">открыть итоговый файл в режиме w</text>
      <rect x="30" y="122" width="282" height="32" rx="6" fill="#F1E8F5" stroke="#C9B6D6" stroke-dasharray="4 3"/>
      <text x="42" y="143" font-size="11.5" fill="#4E4358">старое содержимое уже удалено</text>
      <rect x="30" y="164" width="282" height="32" rx="6" fill="#F1E8F5" stroke="#C9B6D6" stroke-dasharray="4 3"/>
      <text x="42" y="185" font-size="11.5" fill="#4E4358">записаны 2 строки из 5</text>
      <rect x="30" y="206" width="282" height="32" rx="6" fill="#FFFFFF" stroke="#8A4F6E" stroke-dasharray="4 3"/>
      <text x="42" y="227" font-size="11.5" font-weight="600" fill="#8A4F6E">сбой: читатель видит половину</text>

      <rect x="354" y="24" width="310" height="252" rx="9" fill="#FFFFFF" stroke="#8E5BC8" stroke-width="1.6"/>
      <text x="368" y="48" font-size="13.5" font-weight="700" fill="#2B2333">Временный файл</text>
      <text x="368" y="66" font-size="10.5" fill="#5B2E86">читатель видит целую версию</text>

      <rect x="368" y="80" width="282" height="32" rx="6" fill="#EBE0EC" stroke="#8E5BC8"/>
      <text x="380" y="101" font-size="11.5" fill="#4E4358">писать в файл рядом: ostatki.tmp</text>
      <rect x="368" y="122" width="282" height="32" rx="6" fill="#EBE0EC" stroke="#8E5BC8"/>
      <text x="380" y="143" font-size="11.5" fill="#4E4358">flush и fsync временного файла</text>
      <rect x="368" y="164" width="282" height="32" rx="6" fill="#EBE0EC" stroke="#8E5BC8"/>
      <text x="380" y="185" font-family="Consolas,monospace" font-size="11.5" fill="#4E4358">os.replace(tmp, path)</text>
      <rect x="368" y="206" width="282" height="32" rx="6" fill="#FFFFFF" stroke="#8E5BC8" stroke-width="1.6"/>
      <text x="380" y="227" font-size="11.5" font-weight="600" fill="#5B2E86">старая или новая версия целиком</text>

      <text x="30" y="310" font-family="Consolas,monospace" font-size="9.5" fill="#6E6179">ВРЕМЕННЫЙ ФАЙЛ ЛЕЖИТ В ТОЙ ЖЕ ПАПКЕ: ИНАЧЕ ЗАМЕНА НЕ АТОМАРНА</text>
      <text x="30" y="328" font-family="Consolas,monospace" font-size="9.5" fill="#6E6179">ЖУРНАЛ ДОПИСЫВАЮТ В КОНЕЦ, ВЫГРУЗКУ ЗАМЕНЯЮТ ЦЕЛИКОМ</text>
    </g>
  </svg>
  <p class="note">Слева файл теряет старое содержимое до того, как новое записано. Справа переименование в пределах одной файловой системы скрывает промежуточное состояние.</p>
</div>
</body>
</html>
