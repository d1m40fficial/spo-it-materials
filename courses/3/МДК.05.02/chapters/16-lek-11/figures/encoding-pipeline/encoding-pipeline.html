<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кодирование и декодирование текста</title>
<style>
  :root { --paper:#F7F0FA; --card:#FFFFFF; --ink:#2B2333; --muted:#6E6179; --rule:#DCCBE6; --accent:#8E5BC8; --soft:#EBE0EC; --deep:#5B2E86; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px; }
  .eyebrow { margin:0 0 6px; font:600 10.5px/1.2 Consolas,monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .note { margin:10px 2px 0; font:12px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Файлы · байты и символы</p>
  <svg viewBox="0 0 680 386" role="img" aria-labelledby="ep-title ep-desc">
    <title id="ep-title">Одна строка, две кодировки</title>
    <desc id="ep-desc">Строка Тула кодируется в восемь байтов UTF-8. Чтение этих байтов как UTF-8 возвращает Тула, чтение как cp1251 даёт РўСѓР»Р°. Та же строка в cp1251 занимает четыре байта.</desc>

    <defs>
      <marker id="ep-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#8E5BC8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <g font-family="Segoe UI,system-ui,sans-serif">
      <rect x="16" y="34" width="140" height="58" rx="8" fill="#FFFFFF" stroke="#C9B6D6"/>
      <text x="28" y="55" font-size="10.5" fill="#6E6179">строка</text>
      <text x="28" y="76" font-size="15" font-weight="700" fill="#2B2333">«Тула»</text>
      <text x="28" y="91" font-size="10.5" fill="#6E6179">4 символа</text>

      <rect x="180" y="34" width="130" height="58" rx="8" fill="#EBE0EC" stroke="#8E5BC8"/>
      <text x="192" y="55" font-size="10.5" fill="#6E6179">операция</text>
      <text x="192" y="76" font-family="Consolas,monospace" font-size="11.5" fill="#2B2333">encode</text>
      <text x="192" y="91" font-size="10.5" fill="#5B2E86">utf-8</text>

      <rect x="334" y="28" width="150" height="70" rx="8" fill="#FFFFFF" stroke="#C9B6D6"/>
      <text x="346" y="48" font-size="10.5" fill="#6E6179">файл на диске</text>
      <text x="346" y="66" font-family="Consolas,monospace" font-size="11.5" fill="#2B2333">D0 A2 D1 83</text>
      <text x="346" y="84" font-family="Consolas,monospace" font-size="11.5" fill="#2B2333">D0 BB D0 B0</text>
      <text x="346" y="99" font-size="10.5" fill="#5B2E86">8 байт</text>

      <rect x="510" y="34" width="154" height="58" rx="8" fill="#FFFFFF" stroke="#C9B6D6"/>
      <text x="522" y="55" font-size="10.5" fill="#6E6179">операция</text>
      <text x="522" y="76" font-family="Consolas,monospace" font-size="11.5" fill="#2B2333">decode</text>
      <text x="522" y="91" font-size="10.5" fill="#5B2E86">utf-8</text>

      <rect x="510" y="160" width="154" height="58" rx="8" fill="#FFFFFF" stroke="#C9B6D6"/>
      <text x="522" y="181" font-size="10.5" fill="#6E6179">та же операция</text>
      <text x="522" y="202" font-family="Consolas,monospace" font-size="11.5" fill="#2B2333">decode</text>
      <text x="522" y="217" font-size="10.5" fill="#5B2E86">cp1251</text>

      <text x="522" y="121" font-size="15" font-weight="700" fill="#5B2E86">Тула</text>
      <text x="522" y="247" font-size="15" font-weight="700" fill="#8A4F6E">РўСѓР»Р°</text>
      <text x="522" y="266" font-size="10.5" fill="#6E6179">без исключения</text>

      <path d="M156 63 H180" fill="none" stroke="#8E5BC8" stroke-width="1.6" marker-end="url(#ep-arrow)"/>
      <path d="M310 63 H334" fill="none" stroke="#8E5BC8" stroke-width="1.6" marker-end="url(#ep-arrow)"/>
      <path d="M484 63 H510" fill="none" stroke="#8E5BC8" stroke-width="1.6" marker-end="url(#ep-arrow)"/>
      <path d="M409 98 V189 H510" fill="none" stroke="#8E5BC8" stroke-width="1.6" marker-end="url(#ep-arrow)"/>

      <rect x="16" y="286" width="480" height="62" rx="8" fill="#F1E8F5" stroke="#C9B6D6" stroke-dasharray="4 3"/>
      <text x="28" y="307" font-size="11.5" font-weight="600" fill="#2B2333">Та же строка в cp1251: D2 F3 EB E0, 4 байта.</text>
      <text x="28" y="325" font-size="11" fill="#4E4358">UTF-8, прочитанный как cp1251, почти всегда даёт текст без ошибки.</text>
      <text x="28" y="341" font-size="11" fill="#4E4358">Именно поэтому кракозябры опаснее исключения.</text>

      <text x="16" y="374" font-family="Consolas,monospace" font-size="9.5" fill="#6E6179">BOM UTF-8: EF BB BF, ЕГО СКИДЫВАЕТ КОДЕК utf-8-sig</text>
    </g>
  </svg>
  <p class="note">Кодировка задаёт пару «байты плюс таблица». Один и тот же файл читается по-разному, если таблицы у писателя и читателя не совпали.</p>
</div>
</body>
</html>
