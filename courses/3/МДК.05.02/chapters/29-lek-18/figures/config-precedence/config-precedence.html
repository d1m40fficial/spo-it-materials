<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Источники конфигурации</title>
<style>
  :root { --paper:#FAF7F6; --card:#FFFDFC; --ink:#2A2430; --muted:#6B6272; --rule:#E6D9EC; --accent:#8E5BC8; --soft:#EBE0EC; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px; }
  .eyebrow { margin:0 0 6px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .note { margin:10px 2px 0; font:12px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
  @media (max-width:560px) { .frame { padding:12px; } .note { font-size:11.5px; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">ASP.NET Core · настройки</p>
  <svg viewBox="0 0 680 320" role="img" aria-labelledby="cp-title cp-desc">
    <title id="cp-title">Порядок источников конфигурации</title>
    <desc id="cp-desc">Настройки загружаются снизу вверх. Каждый следующий источник перекрывает предыдущий, поэтому аргументы командной строки побеждают все остальные.</desc>

    <line x1="30" y1="278" x2="30" y2="44" stroke="#8E5BC8" stroke-width="1.6" marker-end="url(#arw-c)"/>
    <text x="42" y="166" font-family="Consolas,monospace" font-size="9.5" fill="#8E5BC8" transform="rotate(-90 42 166)">ПОЗЖЕ ПЕРЕКРЫВАЕТ РАНЬШЕ</text>

    <g font-family="Segoe UI,system-ui,sans-serif">
      <rect x="64" y="42" width="360" height="40" rx="7" fill="#FFFDFC" stroke="#D8C7E2"/>
      <text x="78" y="60" font-size="12" font-weight="700" fill="#2A2430">аргументы командной строки</text>
      <text x="78" y="75" font-size="9.5" fill="#6B6272">разовый запуск и отладка</text>
      <text x="440" y="66" font-size="10" fill="#6B6272">вне репозитория</text>

      <rect x="64" y="90" width="360" height="40" rx="7" fill="#FFFDFC" stroke="#D8C7E2"/>
      <text x="78" y="108" font-size="12" font-weight="700" fill="#2A2430">переменные окружения</text>
      <text x="78" y="123" font-size="9.5" fill="#6B6272">ConnectionStrings__Sklad</text>
      <text x="440" y="114" font-size="10" fill="#6B6272">вне репозитория</text>

      <rect x="64" y="138" width="360" height="40" rx="7" fill="#FFFDFC" stroke="#8E5BC8" stroke-width="1.6"/>
      <text x="78" y="156" font-size="12" font-weight="700" fill="#2A2430">секреты разработчика</text>
      <text x="78" y="171" font-size="9.5" fill="#6B6272">dotnet user-secrets</text>
      <text x="440" y="162" font-size="10" fill="#8E5BC8">вне репозитория</text>

      <rect x="64" y="186" width="360" height="40" rx="7" fill="#FFFDFC" stroke="#D8C7E2"/>
      <text x="78" y="204" font-size="12" font-weight="700" fill="#2A2430">appsettings.{Среда}.json</text>
      <text x="78" y="219" font-size="9.5" fill="#6B6272">адреса стенда, уровень журнала</text>
      <text x="440" y="210" font-size="10" fill="#6B6272">в репозитории</text>

      <rect x="64" y="234" width="360" height="40" rx="7" fill="#EBE0EC" stroke="#8E5BC8" stroke-width="1.4"/>
      <text x="78" y="252" font-size="12" font-weight="700" fill="#2A2430">appsettings.json</text>
      <text x="78" y="267" font-size="9.5" fill="#2A2430">общие значения по умолчанию</text>
      <text x="440" y="258" font-size="10" fill="#6B6272">в репозитории</text>
    </g>

    <text x="64" y="300" font-family="Consolas,monospace" font-size="9.5" fill="#6B6272">ПОБЕЖДАЕТ ВЕРХНИЙ СЛОЙ, НО СЕКРЕТЫ НЕ ХРАНЯТ В НИЖНИХ</text>

    <defs>
      <marker id="arw-c" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8E5BC8"/></marker>
    </defs>
  </svg>
  <p class="note">Один и тот же ключ может быть задан в нескольких местах. Значение берётся из последнего источника в цепочке, поэтому стенд переопределяет локальный файл, не меняя код.</p>
</div>
</body>
</html>
