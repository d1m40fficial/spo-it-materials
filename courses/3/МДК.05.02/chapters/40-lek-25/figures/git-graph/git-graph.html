<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Граф коммитов и ссылки</title>
<style>
  :root { --paper:#EBE0EC; --card:#FFFDFF; --ink:#2A2430; --muted:#6B5F72; --rule:#D6C4DB; --accent:#8E5BC8; --soft:#F3EAF6; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px; }
  .eyebrow { margin:0 0 6px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .node { cursor:pointer; }
  .node circle { fill:var(--card); stroke:#B79AC2; stroke-width:2; transition:fill .15s, stroke .15s; }
  .node.on circle { fill:var(--accent); stroke:var(--accent); }
  .node.on text { fill:#fff; }
  .node text { font:700 11px "Segoe UI",system-ui,sans-serif; fill:var(--ink); pointer-events:none; }
  .status { min-height:58px; margin-top:8px; padding:10px 12px; border-radius:9px; background:var(--soft); font-size:13px; line-height:1.45; }
  .status b { color:var(--accent); }
  .controls { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  button { font:600 11.5px/1.1 "Segoe UI",system-ui,sans-serif; padding:8px 10px; border-radius:8px; border:1px solid var(--rule); background:var(--card); color:var(--ink); cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .note { margin:9px 2px 0; font:11.5px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
  @media (max-width:560px) { .frame { padding:12px; } .status { font-size:12.5px; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Git · граф и ссылки</p>
  <svg viewBox="0 0 680 330" role="img" aria-labelledby="gg-title gg-desc">
    <title id="gg-title">Граф коммитов с двумя ветками и слиянием</title>
    <desc id="gg-desc">Пять коммитов: общий предок, коммит главной ветки, два коммита рабочей ветки и коммит слияния. Нажмите на коммит, чтобы увидеть его родителей.</desc>

    <text x="16" y="20" font-family="Consolas,monospace" font-size="10" fill="#6B5F72">СНИЗУ ВВЕРХ: СТАРЫЕ КОММИТЫ, ВЫШЕ НОВЫЕ</text>

    <text x="16" y="132" font-family="Consolas,monospace" font-size="10" fill="#8E5BC8">FEATURE/DISCOUNT</text>
    <text x="16" y="262" font-family="Consolas,monospace" font-size="10" fill="#8E5BC8">MAIN</text>

    <line x1="60" y1="120" x2="640" y2="120" stroke="#D6C4DB" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="60" y1="250" x2="640" y2="250" stroke="#D6C4DB" stroke-width="2" stroke-dasharray="5 4"/>

    <path d="M92 250 L196 250" stroke="#B79AC2" stroke-width="2.5" fill="none"/>
    <path d="M204 250 C244 250 244 120 300 120" stroke="#B79AC2" stroke-width="2.5" fill="none"/>
    <path d="M308 120 L412 120" stroke="#B79AC2" stroke-width="2.5" fill="none"/>
    <path d="M412 120 C500 120 500 250 548 250" stroke="#B79AC2" stroke-width="2.5" fill="none"/>
    <path d="M204 250 L548 250" stroke="#B79AC2" stroke-width="2.5" fill="none"/>

    <g class="node" data-k="c1">
      <circle cx="84" cy="250" r="18"/>
      <text x="84" y="254" text-anchor="middle">C1</text>
    </g>
    <g class="node" data-k="c2">
      <circle cx="204" cy="250" r="18"/>
      <text x="204" y="254" text-anchor="middle">C2</text>
    </g>
    <g class="node" data-k="c3">
      <circle cx="308" cy="120" r="18"/>
      <text x="308" y="124" text-anchor="middle">C3</text>
    </g>
    <g class="node" data-k="c4">
      <circle cx="420" cy="120" r="18"/>
      <text x="420" y="124" text-anchor="middle">C4</text>
    </g>
    <g class="node" data-k="c5">
      <circle cx="556" cy="250" r="20" stroke-width="2.6"/>
      <text x="556" y="254" text-anchor="middle">C5</text>
    </g>

    <g font-family="Segoe UI,system-ui,sans-serif" font-size="10.5" fill="#2A2430">
      <text x="60" y="290">Добавить расчёт</text>
      <text x="170" y="290">Скидка 7%</text>
      <text x="260" y="92">Скидка 10%</text>
      <text x="390" y="92">Правка текста</text>
      <text x="500" y="290">Свести скидку</text>
    </g>

    <g font-family="Consolas,monospace" font-size="10" fill="#8E5BC8">
      <text x="518" y="222">main</text>
      <text x="396" y="146">feature/discount</text>
      <text x="584" y="240">HEAD</text>
      <line x1="580" y1="245" x2="562" y2="245" stroke="#8E5BC8" stroke-width="1.5"/>
    </g>

    <g font-family="Segoe UI,system-ui,sans-serif" font-size="10.5" fill="#6B5F72">
      <text x="16" y="316">C2 это база слияния: последний общий предок main и feature/discount</text>
    </g>
  </svg>
  <div class="status" id="gg-status"></div>
  <div class="controls" id="gg-buttons">
    <button data-k="c1">C1</button>
    <button data-k="c2" class="on">C2</button>
    <button data-k="c3">C3</button>
    <button data-k="c4">C4</button>
    <button data-k="c5">C5</button>
  </div>
  <p class="note">Нажмите коммит на схеме или кнопку. Обратите внимание: у C5 два родителя, а HEAD и main указывают на один и тот же коммит.</p>
</div>
<script>
(function () {
  var data = {
    c1: '<b>C1, первый коммит.</b> Родителей нет. На него опирается вся дальнейшая история: расчёт стоимости со скидкой появился здесь.',
    c2: '<b>C2, коммит main.</b> Родитель C1. Здесь скидка равна 7 процентам. Для ветки feature/discount этот коммит является базой слияния, потому что дальше истории разошлись.',
    c3: '<b>C3, первый коммит ветки.</b> Родитель C2. Ветка отделилась от main в этой точке. Скидка поднята до 10 процентов, но изменение пока живёт только в рабочей ветке.',
    c4: '<b>C4, второй коммит ветки.</b> Родитель C3. Изменение текста не пересекается с main, поэтому конфликта здесь нет. Ветка готова к слиянию.',
    c5: '<b>C5, коммит слияния.</b> Два родителя: C4 из рабочей ветки и C2 из main. В этом коммите разрешено расхождение по скидке. main и HEAD теперь указывают на C5.'
  };
  var nodes = document.querySelectorAll('.node');
  var buttons = document.querySelectorAll('#gg-buttons button');
  var status = document.getElementById('gg-status');

  function apply(key) {
    nodes.forEach(function (n) { n.classList.toggle('on', n.dataset.k === key); });
    buttons.forEach(function (b) { b.classList.toggle('on', b.dataset.k === key); });
    status.innerHTML = data[key];
  }
  nodes.forEach(function (n) { n.addEventListener('click', function () { apply(n.dataset.k); }); });
  buttons.forEach(function (b) { b.addEventListener('click', function () { apply(b.dataset.k); }); });
  apply('c2');
})();
</script>
</body>
</html>
