<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Слияние и перебазирование</title>
<style>
  :root { --paper:#EBE0EC; --card:#FFFDFF; --ink:#2A2430; --muted:#6B5F72; --rule:#D6C4DB; --accent:#8E5BC8; --soft:#F3EAF6; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px; }
  .eyebrow { margin:0 0 6px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .mode { display:none; }
  .mode.on { display:block; }
  .status { min-height:70px; margin-top:8px; padding:10px 12px; border-radius:9px; background:var(--soft); font-size:13px; line-height:1.45; }
  .status b { color:var(--accent); }
  .controls { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  button { font:600 11.5px/1.1 "Segoe UI",system-ui,sans-serif; padding:8px 11px; border-radius:8px; border:1px solid var(--rule); background:var(--card); color:var(--ink); cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .rows { margin-top:10px; border-top:1px solid var(--rule); }
  .row { display:grid; grid-template-columns:88px 1fr 1fr; gap:8px; padding:7px 2px; border-bottom:1px solid var(--rule); font-size:11.5px; line-height:1.4; }
  .row.head { font-weight:700; color:var(--accent); }
  .row span:first-child { color:var(--muted); }
  .note { margin:9px 2px 0; font:11.5px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
  @media (max-width:560px) { .frame { padding:12px; } .status { font-size:12.5px; } .row { grid-template-columns:70px 1fr 1fr; font-size:11px; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Git · две стратегии</p>
  <svg viewBox="0 0 680 300" role="img" aria-labelledby="mr-title mr-desc">
    <title id="mr-title">Слияние и перебазирование одной ветки</title>
    <desc id="mr-desc">Слева слияние сохраняет развилку и коммит с двумя родителями. Справа перебазирование переносит те же изменения в линию и меняет имена коммитов.</desc>

    <g class="mode on" data-mode="merge">
      <text x="16" y="20" font-family="Consolas,monospace" font-size="10" fill="#6B5F72">СЛИЯНИЕ: ИСТОРИЯ СОХРАНЯЕТ РАЗВИЛКУ</text>
      <line x1="40" y1="150" x2="640" y2="150" stroke="#D6C4DB" stroke-width="2" stroke-dasharray="5 4"/>
      <line x1="40" y1="80" x2="640" y2="80" stroke="#D6C4DB" stroke-width="2" stroke-dasharray="5 4"/>
      <text x="16" y="92" font-family="Consolas,monospace" font-size="10" fill="#8E5BC8">FEATURE</text>
      <text x="16" y="162" font-family="Consolas,monospace" font-size="10" fill="#8E5BC8">MAIN</text>

      <path d="M76 150 L188 150" stroke="#B79AC2" stroke-width="2.5" fill="none"/>
      <path d="M196 150 C236 150 236 80 292 80" stroke="#B79AC2" stroke-width="2.5" fill="none"/>
      <path d="M308 80 L404 80" stroke="#B79AC2" stroke-width="2.5" fill="none"/>
      <path d="M404 80 C480 80 480 150 528 150" stroke="#B79AC2" stroke-width="2.5" fill="none"/>
      <path d="M196 150 L528 150" stroke="#B79AC2" stroke-width="2.5" fill="none"/>

      <g font-family="Consolas,monospace" font-size="11" font-weight="700">
        <circle cx="68" cy="150" r="17" fill="#FFFDFF" stroke="#B79AC2" stroke-width="2"/><text x="68" y="154" text-anchor="middle" fill="#2A2430">A</text>
        <circle cx="196" cy="150" r="17" fill="#FFFDFF" stroke="#B79AC2" stroke-width="2"/><text x="196" y="154" text-anchor="middle" fill="#2A2430">B</text>
        <circle cx="300" cy="80" r="17" fill="#FFFDFF" stroke="#B79AC2" stroke-width="2"/><text x="300" y="84" text-anchor="middle" fill="#2A2430">C</text>
        <circle cx="412" cy="80" r="17" fill="#FFFDFF" stroke="#B79AC2" stroke-width="2"/><text x="412" y="84" text-anchor="middle" fill="#2A2430">D</text>
        <circle cx="536" cy="150" r="19" fill="#8E5BC8" stroke="#8E5BC8" stroke-width="2"/><text x="536" y="154" text-anchor="middle" fill="#FFFFFF">M</text>
      </g>

      <g font-family="Segoe UI,system-ui,sans-serif" font-size="10.5" fill="#2A2430">
        <text x="52" y="185">общий предок</text>
        <text x="176" y="185">работа в main</text>
        <text x="270" y="58">задача</text>
        <text x="386" y="58">доработка</text>
        <text x="500" y="185">слияние</text>
      </g>
      <g font-family="Consolas,monospace" font-size="10" fill="#8E5BC8">
        <text x="560" y="140">main, HEAD</text>
      </g>
      <text x="16" y="230" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#6B5F72">У M два родителя: D и B. Хэши A, B, C, D не изменились.</text>
    </g>

    <g class="mode" data-mode="rebase">
      <text x="16" y="20" font-family="Consolas,monospace" font-size="10" fill="#6B5F72">ПЕРЕБАЗИРОВАНИЕ: ТЕ ЖЕ ИЗМЕНЕНИЯ В ЛИНИЮ</text>
      <line x1="40" y1="150" x2="640" y2="150" stroke="#D6C4DB" stroke-width="2" stroke-dasharray="5 4"/>
      <text x="16" y="162" font-family="Consolas,monospace" font-size="10" fill="#8E5BC8">MAIN</text>

      <path d="M76 150 L604 150" stroke="#B79AC2" stroke-width="2.5" fill="none"/>

      <g font-family="Consolas,monospace" font-size="11" font-weight="700">
        <circle cx="68" cy="150" r="17" fill="#FFFDFF" stroke="#B79AC2" stroke-width="2"/><text x="68" y="154" text-anchor="middle" fill="#2A2430">A</text>
        <circle cx="196" cy="150" r="17" fill="#FFFDFF" stroke="#B79AC2" stroke-width="2"/><text x="196" y="154" text-anchor="middle" fill="#2A2430">B</text>
        <circle cx="324" cy="150" r="17" fill="#FFFDFF" stroke="#8E5BC8" stroke-width="2.4"/><text x="324" y="154" text-anchor="middle" fill="#8E5BC8">C1</text>
        <circle cx="452" cy="150" r="17" fill="#FFFDFF" stroke="#8E5BC8" stroke-width="2.4"/><text x="452" y="154" text-anchor="middle" fill="#8E5BC8">D1</text>
        <circle cx="580" cy="150" r="17" fill="#8E5BC8" stroke="#8E5BC8" stroke-width="2"/><text x="580" y="154" text-anchor="middle" fill="#FFFFFF">E</text>
      </g>

      <g font-family="Segoe UI,system-ui,sans-serif" font-size="10.5" fill="#2A2430">
        <text x="52" y="185">общий предок</text>
        <text x="176" y="185">работа в main</text>
        <text x="300" y="185">задача заново</text>
        <text x="428" y="185">доработка заново</text>
        <text x="556" y="185">новая вершина</text>
      </g>
      <g font-family="Consolas,monospace" font-size="10" fill="#8E5BC8">
        <text x="540" y="130">main, HEAD</text>
      </g>
      <text x="16" y="230" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#6B5F72">C1 и D1 это новые коммиты: содержимое похоже, родитель и хэш другие.</text>
      <text x="16" y="250" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#6B5F72">Старые C и D остаются только в reflog и в удалённой копии, если её не обновляли.</text>
    </g>
  </svg>
  <div class="status" id="mr-status"></div>
  <div class="controls" id="mr-buttons">
    <button data-mode="merge" class="on">Слияние</button>
    <button data-mode="rebase">Перебазирование</button>
  </div>
  <div class="rows">
    <div class="row head"><span>Свойство</span><span>Слияние</span><span>Перебазирование</span></div>
    <div class="row"><span>Хэши</span><span>не меняются</span><span>меняются</span></div>
    <div class="row"><span>Конфликты</span><span>один раз</span><span>на каждом коммите</span></div>
    <div class="row"><span>Общая ветка</span><span>безопасно</span><span>опасно после отправки</span></div>
  </div>
  <p class="note">Переключите режим. Сравните, где находится точка слияния и что происходит с именами коммитов.</p>
</div>
<script>
(function () {
  var data = {
    merge: '<b>Слияние.</b> Git создаёт коммит M с двумя родителями. Вся развилка видна в истории, старые хэши сохраняются. Конфликт разрешают один раз, в коммите слияния. Этот вариант безопасен для ветки, которую уже скачали коллеги.',
    rebase: '<b>Перебазирование.</b> Git заново применяет коммиты C и D поверх B, получаются C1 и D1 с другими хэшами. История линейная, но прежние коммиты исчезают из ветки. Конфликт может возникнуть на каждом переносимом коммите.'
  };
  var modes = document.querySelectorAll('.mode');
  var buttons = document.querySelectorAll('#mr-buttons button');
  var status = document.getElementById('mr-status');

  function apply(key) {
    modes.forEach(function (m) { m.classList.toggle('on', m.dataset.mode === key); });
    buttons.forEach(function (b) { b.classList.toggle('on', b.dataset.mode === key); });
    status.innerHTML = data[key];
  }
  buttons.forEach(function (b) { b.addEventListener('click', function () { apply(b.dataset.mode); }); });
  apply('merge');
})();
</script>
</body>
</html>
