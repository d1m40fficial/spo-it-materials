<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Единицы на стыке компонентов</title>
<style>
  :root { --paper:#F8F4FA; --card:#FFFDFF; --ink:#241C2B; --muted:#6C6076; --rule:#DCCDE3; --accent:#8E5BC8; --soft:#EBE0EC; --warn:#A34A5C; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px; }
  .eyebrow { margin:0 0 6px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .box { fill:var(--card); stroke:#C9B6D4; stroke-width:1.3; }
  .foot { margin:9px 2px 0; font:11.5px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
  @media (max-width:560px) { .frame { padding:12px; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Случай · Mars Climate Orbiter, 1999</p>
  <svg viewBox="0 0 680 306" role="img" aria-labelledby="um-title um-desc">
    <title id="um-title">Имперские и метрические единицы на стыке</title>
    <desc id="um-desc">Данные двигателей в имперских единицах прошли в модель, которая ждала метрические. Проверка единицы на стыке отсутствовала.</desc>

    <rect x="12" y="34" width="190" height="86" rx="9" class="box"/>
    <text x="26" y="56" font-size="11.5" font-weight="700">Lockheed Martin</text>
    <text x="26" y="74" font-size="10" fill="#6C6076">Денвер, Колорадо</text>
    <text x="26" y="94" font-size="10">данные двигателей:</text>
    <text x="26" y="110" font-size="10" class="mono" fill="#A34A5C">lbf·s, имперские</text>

    <rect x="246" y="34" width="188" height="86" rx="9" class="box"/>
    <text x="260" y="56" font-size="11.5" font-weight="700">SM_FORCES</text>
    <text x="260" y="74" font-size="10" fill="#6C6076">наземное ПО</text>
    <text x="260" y="94" font-size="10">интерфейс требует</text>
    <text x="260" y="110" font-size="10" class="mono" fill="#8E5BC8">N·s, метрические</text>

    <rect x="468" y="34" width="200" height="86" rx="9" class="box"/>
    <text x="482" y="56" font-size="11.5" font-weight="700">Модель траектории</text>
    <text x="482" y="74" font-size="10" fill="#6C6076">JPL, Калифорния</text>
    <text x="482" y="94" font-size="10">считает, что число</text>
    <text x="482" y="110" font-size="10" class="mono" fill="#8E5BC8">уже в N·s</text>

    <path d="M202 77 H242" stroke="#8E5BC8" stroke-width="1.6" marker-end="url(#a4)"/>
    <path d="M434 77 H464" stroke="#8E5BC8" stroke-width="1.6" marker-end="url(#a4)"/>
    <defs>
      <marker id="a4" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0 0 L8 4 L0 8 z" fill="#8E5BC8"/>
      </marker>
    </defs>

    <rect x="12" y="138" width="656" height="58" rx="9" fill="#F6E4E8" stroke="#A34A5C" stroke-width="1.2"/>
    <text x="26" y="160" font-size="11" font-weight="700" fill="#A34A5C">Проверка единицы на стыке отсутствует</text>
    <text x="26" y="180" font-size="10.5" fill="#241C2B">Число 12 прошло как 12. Каждая сторона по отдельности работала правильно.</text>

    <text x="12" y="222" font-family="Consolas,monospace" font-size="9.5" fill="#6C6076">9 МЕСЯЦЕВ ПОЛЁТА</text>
    <path d="M12 234 H668" stroke="#DCCDE3" stroke-width="1.5"/>
    <circle cx="14" cy="234" r="4" fill="#8E5BC8"/>
    <circle cx="666" cy="234" r="4" fill="#A34A5C"/>
    <text x="14" y="252" font-size="9.5" fill="#6C6076" class="mono">запуск 11.12.1998</text>
    <text x="666" y="252" text-anchor="end" font-size="9.5" fill="#6C6076" class="mono">23.09.1999</text>

    <text x="12" y="278" font-size="11" fill="#241C2B">Отклонение накопилось до 170 км ниже расчётной траектории.</text>
    <text x="12" y="296" font-size="11" font-weight="700" fill="#A34A5C">Аппарат вошёл в атмосферу и был потерян.</text>
  </svg>
  <p class="foot">Единица измерения это часть значения. Если она не передана в данных и не проверена на границе, формат числа остаётся верным, а расчёт неверным.</p>
</div>
</body>
</html>
