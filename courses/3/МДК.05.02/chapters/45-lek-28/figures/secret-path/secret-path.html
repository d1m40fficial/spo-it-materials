<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Путь секрета и места утечки</title>
<style>
  :root { --paper:#FAF7F6; --card:#FFFDFC; --ink:#2A2430; --muted:#6B6272; --rule:#E6D9EC; --accent:#8E5BC8; --soft:#EBE0EC; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px; }
  .eyebrow { margin:0 0 6px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .step { fill:var(--card); stroke:var(--accent); stroke-width:1.3; }
  .leak { fill:#FBEFEF; stroke:#D98A8A; stroke-width:1.1; }
  .st { font-size:11px; font-weight:700; fill:var(--ink); }
  .ss { font-size:9px; fill:var(--muted); }
  .lt { font-size:9px; fill:#8C2F2F; }
  .lb { font-size:9.5px; font-weight:700; fill:#8C2F2F; }
  .cap { font-size:10px; fill:var(--ink); }
  .ar { stroke:#B79AC8; stroke-width:1.6; fill:none; }
  @media (max-width:560px) { .frame { padding:12px; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Секрет: от источника до журнала</p>
  <svg viewBox="0 0 680 286" role="img" aria-labelledby="sp-title sp-desc">
    <title id="sp-title">Путь секрета и места утечки</title>
    <desc id="sp-desc">Пять шагов: источник, хранилище, передача, процесс, журнал и архив. Под каждым шагом указано типичное место утечки. Внизу три правила: меньше копий, короче жизнь, ротация по расписанию.</desc>

    <text class="cap" x="16" y="18">Значение появляется у человека, попадает в хранилище и живёт в процессе до первого вывода.</text>

    <rect class="step" x="16" y="34" width="116" height="62" rx="8"/>
    <text class="st" x="24" y="56">Источник</text>
    <text class="ss" x="24" y="72">пароль, ключ,</text>
    <text class="ss" x="24" y="85">токен сервиса</text>

    <rect class="step" x="152" y="34" width="116" height="62" rx="8"/>
    <text class="st" x="160" y="56">Хранилище</text>
    <text class="ss" x="160" y="72">.env, хранилище</text>
    <text class="ss" x="160" y="85">секретов, CI</text>

    <rect class="step" x="288" y="34" width="116" height="62" rx="8"/>
    <text class="st" x="296" y="56">Передача</text>
    <text class="ss" x="296" y="72">служба, контейнер,</text>
    <text class="ss" x="296" y="85">переменная</text>

    <rect class="step" x="424" y="34" width="116" height="62" rx="8"/>
    <text class="st" x="432" y="56">Процесс</text>
    <text class="ss" x="432" y="72">память, окружение,</text>
    <text class="ss" x="432" y="85">дочерние вызовы</text>

    <rect class="step" x="560" y="34" width="116" height="62" rx="8"/>
    <text class="st" x="568" y="56">Журнал</text>
    <text class="ss" x="568" y="72">лог, дамп, архив</text>
    <text class="ss" x="568" y="85">диагностики</text>

    <path class="ar" d="M132 65 H148 M268 65 H284 M404 65 H420 M540 65 H556"/>
    <path class="ar" d="M148 61 l-6 4 6 4 M284 61 l-6 4 6 4 M420 61 l-6 4 6 4 M556 61 l-6 4 6 4"/>

    <rect class="leak" x="16" y="108" width="116" height="56" rx="7"/>
    <text class="lb" x="24" y="124">клон и история</text>
    <text class="lt" x="24" y="139">секрет остаётся</text>
    <text class="lt" x="24" y="152">в каждом клоне</text>

    <rect class="leak" x="152" y="108" width="116" height="56" rx="7"/>
    <text class="lb" x="160" y="124">общий каталог</text>
    <text class="lt" x="160" y="139">права 644 и</text>
    <text class="lt" x="160" y="152">общий пользователь</text>

    <rect class="leak" x="288" y="108" width="116" height="56" rx="7"/>
    <text class="lb" x="296" y="124">журнал сборки</text>
    <text class="lt" x="296" y="139">echo и вывод</text>
    <text class="lt" x="296" y="152">команд целиком</text>

    <rect class="leak" x="424" y="108" width="116" height="56" rx="7"/>
    <text class="lb" x="432" y="124">память и дамп</text>
    <text class="lt" x="432" y="139">виден соседним</text>
    <text class="lt" x="432" y="152">процессам</text>

    <rect class="leak" x="560" y="108" width="116" height="56" rx="7"/>
    <text class="lb" x="568" y="124">архив и тикет</text>
    <text class="lt" x="568" y="139">объект настроек</text>
    <text class="lt" x="568" y="152">распечатан целиком</text>

    <rect x="16" y="186" width="648" height="78" rx="9" fill="#EBE0EC" stroke="#D9CBE0"/>
    <text x="30" y="208" font-size="11" font-weight="700" fill="#5F3A85">Три правила, которые уменьшают поверхность утечки</text>
    <text class="ss" x="30" y="228" font-size="10">Меньше копий: один источник истины и короткая выдача по роли.</text>
    <text class="ss" x="30" y="245" font-size="10">Короче жизнь: временный секрет для сборки, постоянный только для службы.</text>
    <text class="ss" x="30" y="262" font-size="10">Ротация по расписанию: процедура проверена до аварии, а не во время неё.</text>
  </svg>
</div>
</body>
</html>
