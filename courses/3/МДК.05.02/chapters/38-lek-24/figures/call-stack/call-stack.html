<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стек вызовов</title>
<style>
  :root { --paper:#FBF7FC; --card:#FFFFFF; --ink:#2B2433; --muted:#6E6278; --rule:#E0D2E6; --accent:#8E5BC8; --soft:#EBE0EC; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px; }
  .eyebrow { margin:0 0 6px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .note { margin:10px 2px 0; font:12px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Отладка · стек</p>
  <svg viewBox="0 0 680 336" role="img" aria-labelledby="cs-title cs-desc">
    <title id="cs-title">Четыре кадра стека вызовов</title>
    <desc id="cs-desc">Сверху точка входа, ниже вызовы функций, внизу текущий кадр line_qty. Справа указано, что доказывает каждый кадр. Читать нужно снизу вверх.</desc>

    <text x="16" y="24" font-size="16" font-weight="700" fill="#2B2433">Кто кого вызвал</text>
    <text x="16" y="43" font-size="11" fill="#6E6278">нижний кадр это текущая функция, верхние объясняют путь к ней</text>

    <g font-family="Consolas,monospace" font-size="10">
      <rect x="16" y="58" width="466" height="48" rx="7" fill="#FFFFFF" stroke="#D9C8E0"/>
      <text x="30" y="78" fill="#2B2433" font-weight="700">report.py:17  &lt;module&gt;</text>
      <text x="30" y="95" fill="#6E6278">rows = [...], 4 строки</text>

      <rect x="16" y="116" width="466" height="48" rx="7" fill="#FFFFFF" stroke="#D9C8E0"/>
      <text x="30" y="136" fill="#2B2433" font-weight="700">report.py:52  build_report(rows)</text>
      <text x="30" y="153" fill="#6E6278">rows: 4 строки</text>

      <rect x="16" y="174" width="466" height="48" rx="7" fill="#FFFFFF" stroke="#D9C8E0"/>
      <text x="30" y="194" fill="#2B2433" font-weight="700">report.py:7  batch_free(rows)</text>
      <text x="30" y="211" fill="#6E6278">rows: 4 строки, i = 1, total = 0</text>

      <rect x="16" y="232" width="466" height="48" rx="7" fill="#EBE0EC" stroke="#8E5BC8" stroke-width="2"/>
      <rect x="16" y="232" width="5" height="48" fill="#8E5BC8"/>
      <text x="30" y="252" fill="#2B2433" font-weight="700">&gt; report.py:12  line_qty(row)</text>
      <text x="30" y="269" fill="#5B4468">row: qty=7, reserved=2, вернёт 5</text>
    </g>

    <g stroke="#B08BC4" stroke-width="1.4" fill="none">
      <path d="M249 106v8"/><path d="M249 164v8"/><path d="M249 222v8"/>
    </g>
    <g fill="#B08BC4">
      <path d="M249 116l-3 -7h6z"/><path d="M249 174l-3 -7h6z"/><path d="M249 232l-3 -7h6z"/>
    </g>

    <g font-family="Segoe UI,system-ui,sans-serif" font-size="10.5">
      <text x="502" y="78" font-weight="700" fill="#2B2433">точка входа</text>
      <text x="502" y="94" fill="#6E6278">откуда пришли данные</text>

      <text x="502" y="136" font-weight="700" fill="#2B2433">кто вызвал</text>
      <text x="502" y="152" fill="#6E6278">с каким аргументом</text>

      <text x="502" y="194" font-weight="700" fill="#2B2433">кто передал</text>
      <text x="502" y="210" fill="#6E6278">виден i и total</text>

      <text x="502" y="252" font-weight="700" fill="#8E5BC8">где остановились</text>
      <text x="502" y="268" fill="#6E6278">текущая строка и row</text>
    </g>

    <rect x="16" y="294" width="648" height="30" rx="7" fill="#FFFFFF" stroke="#E0D2E6"/>
    <text x="28" y="313" font-family="Consolas,monospace" font-size="9.5" fill="#6E6278">ЧИТАТЬ СНИЗУ ВВЕРХ: ТЕКУЩАЯ ФУНКЦИЯ, ЕЁ ВЫЗЫВАЮЩИЙ, ПУТЬ ДО ВХОДА</text>
  </svg>
  <p class="note">Если аргумент неверен, поднимитесь на кадр выше. Ошибка может быть не в текущей функции, а в том, что ей передали.</p>
</div>
</body>
</html>
