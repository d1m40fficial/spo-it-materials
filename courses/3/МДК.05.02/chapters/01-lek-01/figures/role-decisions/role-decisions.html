<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Роли команды и их решения</title>
<style>
  :root { --paper:#FBF8FC; --card:#FFFFFF; --ink:#2A2430; --muted:#6B6175; --rule:#E0D3E6; --accent:#8E5BC8; --soft:#EBE0EC; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:14px; }
  .eyebrow { margin:0 0 6px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .role rect { fill:#FFFFFF; stroke:#CFBBDC; stroke-width:1.3; transition:fill .15s, stroke .15s; cursor:pointer; }
  .role.on rect { fill:#EBE0EC; stroke:#8E5BC8; stroke-width:2.2; }
  .status { min-height:74px; margin-top:8px; padding:10px 12px; border-radius:9px; background:var(--soft); font-size:13px; line-height:1.45; }
  .status b { color:var(--accent); }
  .controls { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  button { font:600 11.5px/1.1 "Segoe UI",system-ui,sans-serif; padding:8px 9px; border-radius:8px; border:1px solid var(--rule); background:var(--card); color:var(--ink); cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .note { margin:9px 2px 0; font:11.5px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
  @media (max-width:560px) { .frame { padding:10px; } .status { font-size:12.5px; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Разработка кода · роли</p>
  <svg viewBox="0 0 680 266" role="img" aria-labelledby="rd-title rd-desc">
    <title id="rd-title">Семь ролей команды разработки</title>
    <desc id="rd-desc">Аналитик, разработчик, тестировщик, администратор БД, DevOps, тимлид и владелец продукта. Нажмите роль, чтобы увидеть решение, которое принадлежит только ей.</desc>

    <g class="role" data-k="analyst">
      <rect x="14" y="30" width="155" height="92" rx="9"/>
      <text x="26" y="51" font-size="12.5" font-weight="700" fill="#2A2430">Аналитик</text>
      <text x="26" y="70" font-size="10.5" fill="#6B6175">решает:</text>
      <text x="26" y="87" font-size="10.5" fill="#2A2430">что считать</text>
      <text x="26" y="102" font-size="10.5" fill="#2A2430">правильным</text>
      <text x="26" y="117" font-size="10" fill="#8E5BC8">требования</text>
    </g>

    <g class="role" data-k="dev">
      <rect x="179" y="30" width="155" height="92" rx="9"/>
      <text x="191" y="51" font-size="12.5" font-weight="700" fill="#2A2430">Разработчик</text>
      <text x="191" y="70" font-size="10.5" fill="#6B6175">решает:</text>
      <text x="191" y="87" font-size="10.5" fill="#2A2430">как реализовать</text>
      <text x="191" y="102" font-size="10.5" fill="#2A2430">и разбить</text>
      <text x="191" y="117" font-size="10" fill="#8E5BC8">код и тесты</text>
    </g>

    <g class="role" data-k="qa">
      <rect x="344" y="30" width="155" height="92" rx="9"/>
      <text x="356" y="51" font-size="12.5" font-weight="700" fill="#2A2430">Тестировщик</text>
      <text x="356" y="70" font-size="10.5" fill="#6B6175">решает:</text>
      <text x="356" y="87" font-size="10.5" fill="#2A2430">что проверено</text>
      <text x="356" y="102" font-size="10.5" fill="#2A2430">и где риск</text>
      <text x="356" y="117" font-size="10" fill="#8E5BC8">тест-кейсы</text>
    </g>

    <g class="role" data-k="dba">
      <rect x="509" y="30" width="157" height="92" rx="9"/>
      <text x="521" y="51" font-size="12.5" font-weight="700" fill="#2A2430">Администратор БД</text>
      <text x="521" y="70" font-size="10.5" fill="#6B6175">решает:</text>
      <text x="521" y="87" font-size="10.5" fill="#2A2430">как хранить</text>
      <text x="521" y="102" font-size="10.5" fill="#2A2430">и кто видит</text>
      <text x="521" y="117" font-size="10" fill="#8E5BC8">схема и права</text>
    </g>

    <g class="role" data-k="devops">
      <rect x="14" y="134" width="155" height="92" rx="9"/>
      <text x="26" y="155" font-size="12.5" font-weight="700" fill="#2A2430">DevOps</text>
      <text x="26" y="174" font-size="10.5" fill="#6B6175">решает:</text>
      <text x="26" y="191" font-size="10.5" fill="#2A2430">как доставить</text>
      <text x="26" y="206" font-size="10.5" fill="#2A2430">сборку</text>
      <text x="26" y="221" font-size="10" fill="#8E5BC8">сборка, настройки</text>
    </g>

    <g class="role" data-k="lead">
      <rect x="179" y="134" width="155" height="92" rx="9"/>
      <text x="191" y="155" font-size="12.5" font-weight="700" fill="#2A2430">Тимлид</text>
      <text x="191" y="174" font-size="10.5" fill="#6B6175">решает:</text>
      <text x="191" y="191" font-size="10.5" fill="#2A2430">какое решение</text>
      <text x="191" y="206" font-size="10.5" fill="#2A2430">принять</text>
      <text x="191" y="221" font-size="10" fill="#8E5BC8">записанные решения</text>
    </g>

    <g class="role" data-k="po">
      <rect x="344" y="134" width="322" height="92" rx="9"/>
      <text x="356" y="155" font-size="12.5" font-weight="700" fill="#2A2430">Владелец продукта</text>
      <text x="356" y="174" font-size="10.5" fill="#6B6175">решает:</text>
      <text x="356" y="191" font-size="10.5" fill="#2A2430">что делать раньше при нехватке ресурса</text>
      <text x="356" y="221" font-size="10" fill="#8E5BC8">приоритеты и приёмка</text>
    </g>

    <text x="14" y="250" font-family="Consolas,monospace" font-size="9.5" fill="#6B6175">РОЛЬ ЭТО ВЛАДЕЛЕЦ РЕШЕНИЯ, А НЕ НАЗВАНИЕ В ТРУДОВОЙ КНИЖКЕ</text>
  </svg>
  <div class="status" id="rd-status"></div>
  <div class="controls" id="rd-buttons">
    <button data-k="analyst" class="on">Аналитик</button>
    <button data-k="dev">Разработчик</button>
    <button data-k="qa">Тестировщик</button>
    <button data-k="dba">Администратор БД</button>
    <button data-k="devops">DevOps</button>
    <button data-k="lead">Тимлид</button>
    <button data-k="po">Владелец продукта</button>
  </div>
  <p class="note">Нажмите роль на схеме или кнопку под ней. В карточке появится решение, которое нельзя молча передать другой роли.</p>
</div>
<script>
(function () {
  var data = {
    analyst: '<b>Аналитик.</b> Решает, что считать правильным результатом, и переводит потребность в проверяемое требование. Он не выбирает структуру таблиц и не назначает срок разработки. Пример: именно аналитик уточняет, что отчёт считается по площадке менеджера, а не по всем складам.',
    dev: '<b>Разработчик.</b> Решает, как реализовать правило и на какие модули его разбить. Он не решает, нужно ли новое поле в бизнес-процессе, и не подменяет тестировщика. Пример: разработчик выбирает параметризованный запрос вместо склейки строк, но не придумывает правило резерва.',
    qa: '<b>Тестировщик.</b> Решает, какие сценарии проверены и где остался риск. Он не переписывает код в чужой ветке и не подписывает приёмку вместо владельца продукта. Пример: тестировщик добавляет сценарий с четырьмя площадками, где сумма и остаток одной площадки различаются.',
    dba: '<b>Администратор БД.</b> Решает, как хранить данные, какие ограничения поставить и кто имеет доступ. Он не переписывает бизнес-логику. Пример: ограничение внешнего ключа и запрет отрицательного остатка ставятся в схеме, а не проверяются только на экране.',
    devops: '<b>DevOps.</b> Решает, как собрать и доставить приложение одинаково на все площадки. Он не выбирает, какое правило считать верным. Пример: одна сборка, один номер версии и запись в журнале, а не копирование файлов вручную по серверам.',
    lead: '<b>Тимлид.</b> Решает, какое техническое решение принять и как его записать. Он не присваивает себе право менять требования заказчика. Пример: выбор структуры каталогов и правила зависимостей фиксируется в документе решения, чтобы через год был ответ на вопрос «почему так».',
    po: '<b>Владелец продукта.</b> Решает, что делать раньше при ограниченном ресурсе, и принимает результат. Он не диктует, как устроен код. Пример: сначала исправляется отчёт по площадке, потому что ошибка мешает ежедневной отгрузке, а косметика меню ждёт.'
  };
  var cards = document.querySelectorAll('.role');
  var buttons = document.querySelectorAll('#rd-buttons button');
  var status = document.getElementById('rd-status');

  function apply(key) {
    cards.forEach(function (c) { c.classList.toggle('on', c.dataset.k === key); });
    buttons.forEach(function (b) { b.classList.toggle('on', b.dataset.k === key); });
    status.innerHTML = data[key];
  }
  cards.forEach(function (c) { c.addEventListener('click', function () { apply(c.dataset.k); }); });
  buttons.forEach(function (b) { b.addEventListener('click', function () { apply(b.dataset.k); }); });
  apply('analyst');
})();
</script>
</body>
</html>
