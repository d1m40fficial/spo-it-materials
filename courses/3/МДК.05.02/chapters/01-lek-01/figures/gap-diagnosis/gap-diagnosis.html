<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Где возник дефект</title>
<style>
  :root { --paper:#FBF8FC; --card:#FFFFFF; --ink:#2A2430; --muted:#6B6175; --rule:#E0D3E6; --accent:#8E5BC8; --soft:#EBE0EC; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:14px; }
  .eyebrow { margin:0 0 6px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .stage rect { fill:#FFFFFF; stroke:#D3C1DE; stroke-width:1.3; transition:fill .15s, stroke .15s; }
  .stage.on rect { fill:#EBE0EC; stroke:#8E5BC8; stroke-width:2.4; }
  .status { min-height:82px; margin-top:8px; padding:10px 12px; border-radius:9px; background:var(--soft); font-size:13px; line-height:1.45; }
  .status b { color:var(--accent); }
  .controls { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  button { font:600 11.5px/1.2 "Segoe UI",system-ui,sans-serif; padding:8px 9px; border-radius:8px; border:1px solid var(--rule); background:var(--card); color:var(--ink); cursor:pointer; text-align:left; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .note { margin:9px 2px 0; font:11.5px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
  @media (max-width:560px) { .frame { padding:10px; } .status { font-size:12.5px; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Разработка кода · происхождение дефекта</p>
  <svg viewBox="0 0 680 182" role="img" aria-labelledby="gd-title gd-desc">
    <title id="gd-title">Пять этапов, где может возникнуть дефект</title>
    <desc id="gd-desc">Требование, проект, код, проверка и выпуск. Нажмите симптом, чтобы увидеть, на каком этапе он возник и какой артефакт нужно исправить.</desc>

    <g font-family="Segoe UI,system-ui,sans-serif">
      <text x="14" y="22" font-family="Consolas,monospace" font-size="9.5" fill="#6B6175">СИМПТОМ ВИДЕН ЗДЕСЬ, А ПРИЧИНА МОЖЕТ БЫТЬ ЛЕВЕЕ</text>

      <g class="stage" data-k="req">
        <rect x="14" y="36" width="118" height="60" rx="8"/>
        <text x="73" y="60" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2A2430">Требование</text>
        <text x="73" y="78" text-anchor="middle" font-size="9.5" fill="#6B6175">что считать</text>
        <text x="73" y="89" text-anchor="middle" font-size="9.5" fill="#6B6175">верным</text>
      </g>
      <text x="136" y="70" font-size="14" fill="#B49AC6">›</text>

      <g class="stage" data-k="design">
        <rect x="148" y="36" width="118" height="60" rx="8"/>
        <text x="207" y="60" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2A2430">Проект</text>
        <text x="207" y="78" text-anchor="middle" font-size="9.5" fill="#6B6175">границы слоёв</text>
        <text x="207" y="89" text-anchor="middle" font-size="9.5" fill="#6B6175">и связи</text>
      </g>
      <text x="270" y="70" font-size="14" fill="#B49AC6">›</text>

      <g class="stage" data-k="code">
        <rect x="282" y="36" width="118" height="60" rx="8"/>
        <text x="341" y="60" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2A2430">Код</text>
        <text x="341" y="78" text-anchor="middle" font-size="9.5" fill="#6B6175">реализация</text>
        <text x="341" y="89" text-anchor="middle" font-size="9.5" fill="#6B6175">правила</text>
      </g>
      <text x="404" y="70" font-size="14" fill="#B49AC6">›</text>

      <g class="stage" data-k="test">
        <rect x="416" y="36" width="118" height="60" rx="8"/>
        <text x="475" y="60" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2A2430">Проверка</text>
        <text x="475" y="78" text-anchor="middle" font-size="9.5" fill="#6B6175">сценарии</text>
        <text x="475" y="89" text-anchor="middle" font-size="9.5" fill="#6B6175">и данные</text>
      </g>
      <text x="538" y="70" font-size="14" fill="#B49AC6">›</text>

      <g class="stage" data-k="release">
        <rect x="550" y="36" width="116" height="60" rx="8"/>
        <text x="608" y="60" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2A2430">Выпуск</text>
        <text x="608" y="78" text-anchor="middle" font-size="9.5" fill="#6B6175">сборка</text>
        <text x="608" y="89" text-anchor="middle" font-size="9.5" fill="#6B6175">и версия</text>
      </g>

      <text x="14" y="126" font-size="11" fill="#6B6175">Чинят не там, где заметили, а там, где возникло неверное решение.</text>
      <text x="14" y="143" font-size="11" fill="#6B6175">Иначе тот же дефект вернётся в следующей функции.</text>
    </g>
  </svg>
  <div class="status" id="gd-status"></div>
  <div class="controls" id="gd-buttons">
    <button data-k="req" class="on">Отчёт считает все площадки</button>
    <button data-k="design">Правило повторено в трёх местах</button>
    <button data-k="code">Функция падает на пустом справочнике</button>
    <button data-k="test">Тест зелёный, а дефект есть</button>
    <button data-k="release">На стенде работает, у кладовщика нет</button>
  </div>
  <p class="note">Нажмите симптом. Подсветится этап, где дефект возник, и артефакт, который нужно исправить.</p>
</div>
<script>
(function () {
  var data = {
    req: '<b>Дефект требования.</b> Формулировка «отчёт по остаткам» не уточняла площадку, поэтому код честно просуммировал всё. Исправляют требование, критерий приёмки и тест. В коде меняется только то, что следует из нового требования.',
    design: '<b>Дефект проекта.</b> Правило доступного остатка не имеет одного места, поэтому его копируют в отчёт, форму и API. Исправляют границу: правило переносят в сервис, а остальные части вызывают его. Иначе следующая копия снова разойдётся.',
    code: '<b>Дефект кода.</b> Реализация не обработала пустой результат запроса и упала на первом же отсутствующем справочнике. Исправляют функцию и добавляют тест на пустой результат, иначе дефект вернётся при следующей правке.',
    test: '<b>Дефект проверки.</b> Сценарий повторял удачный путь и не содержал граничного значения, поэтому тест был зелёным. Исправляют набор сценариев и данные, а не только найденную строку кода.',
    release: '<b>Дефект выпуска.</b> На площадку уехала сборка из другой ветки или с другим файлом настроек. Исправляют процесс: одна сборка, номер версии в журнале, проверка после установки. Правка кода здесь ничего не решает.'
  };
  var stages = document.querySelectorAll('.stage');
  var buttons = document.querySelectorAll('#gd-buttons button');
  var status = document.getElementById('gd-status');

  function apply(key) {
    stages.forEach(function (s) { s.classList.toggle('on', s.dataset.k === key); });
    buttons.forEach(function (b) { b.classList.toggle('on', b.dataset.k === key); });
    status.innerHTML = data[key];
  }
  stages.forEach(function (s) { s.addEventListener('click', function () { apply(s.dataset.k); }); });
  buttons.forEach(function (b) { b.addEventListener('click', function () { apply(b.dataset.k); }); });
  apply('req');
})();
</script>
</body>
</html>
