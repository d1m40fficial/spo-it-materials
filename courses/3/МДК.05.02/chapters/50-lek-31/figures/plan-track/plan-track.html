<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>План работ по этапам</title>
<style>
  :root { color-scheme:light; --bg:#EBE0EC; --paper:#FBF8FC; --ink:#2A2430; --muted:#6B5F75; --accent:#8E5BC8; --soft:#F1E7F5; --rule:#D9C9E2; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--bg); border:1px solid var(--rule); border-radius:12px; padding:16px 16px 12px; }
  .eyebrow { margin:0 0 4px; font:600 9px/1.3 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); }
  h3 { margin:0 0 6px; font-size:18px; line-height:1.2; }
  svg { display:block; width:100%; height:auto; }
  .pt-item { cursor:pointer; }
  .pt-item rect { fill:#FBF8FC; stroke:#D9C9E2; stroke-width:1; transition:fill .15s, stroke .15s; }
  .pt-item text { fill:#2A2430; }
  .pt-item.on rect { fill:#F1E7F5; stroke:#8E5BC8; stroke-width:1.6; }
  .pt-item.on text { fill:#4B2A73; }
  .pt-item:focus { outline:none; }
  .pt-item:focus rect { stroke:#8E5BC8; stroke-width:2; }
  .note { margin:8px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  @media (max-width:560px) { .frame { padding:12px; } h3 { font-size:16px; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Итоговый проект · план</p>
  <h3>Восемь этапов на шесть недель</h3>
  <svg viewBox="0 0 680 356" role="img" aria-labelledby="pt-t pt-d">
    <title id="pt-t">План работ по этапам итогового проекта</title>
    <desc id="pt-d">Список из восьми этапов. При выборе этапа справа видны результат, критерий готовности, риск и недели. Последняя неделя отведена проверке и репетиции показа.</desc>
    <g font-family="'Segoe UI',system-ui,sans-serif">
      <text x="14" y="18" font-size="9" font-family="Consolas,monospace" letter-spacing="1.2" fill="#6B5F75">ЭТАП</text>
      <text x="282" y="18" font-size="9" font-family="Consolas,monospace" letter-spacing="1.2" fill="#6B5F75">ЧТО ЗАКРЫВАЕТ ЭТАП</text>

      <g class="pt-item on" data-i="0" tabindex="0" role="button" aria-pressed="true">
        <rect x="14" y="28" width="254" height="32" rx="6"/>
        <text x="26" y="48" font-size="10" font-weight="600" fill="#8E5BC8">1</text>
        <text x="42" y="48" font-size="10">Границы и каркас</text>
      </g>
      <g class="pt-item" data-i="1" tabindex="0" role="button" aria-pressed="false">
        <rect x="14" y="64" width="254" height="32" rx="6"/>
        <text x="26" y="84" font-size="10" font-weight="600" fill="#8E5BC8">2</text>
        <text x="42" y="84" font-size="10">Схема базы и вход</text>
      </g>
      <g class="pt-item" data-i="2" tabindex="0" role="button" aria-pressed="false">
        <rect x="14" y="100" width="254" height="32" rx="6"/>
        <text x="26" y="120" font-size="10" font-weight="600" fill="#8E5BC8">3</text>
        <text x="42" y="120" font-size="10">Срез MVP</text>
      </g>
      <g class="pt-item" data-i="3" tabindex="0" role="button" aria-pressed="false">
        <rect x="14" y="136" width="254" height="32" rx="6"/>
        <text x="26" y="156" font-size="10" font-weight="600" fill="#8E5BC8">4</text>
        <text x="42" y="156" font-size="10">Операции и отказы</text>
      </g>
      <g class="pt-item" data-i="4" tabindex="0" role="button" aria-pressed="false">
        <rect x="14" y="172" width="254" height="32" rx="6"/>
        <text x="26" y="192" font-size="10" font-weight="600" fill="#8E5BC8">5</text>
        <text x="42" y="192" font-size="10">Тесты и отчёт о прогоне</text>
      </g>
      <g class="pt-item" data-i="5" tabindex="0" role="button" aria-pressed="false">
        <rect x="14" y="208" width="254" height="32" rx="6"/>
        <text x="26" y="228" font-size="10" font-weight="600" fill="#8E5BC8">6</text>
        <text x="42" y="228" font-size="10">Запуск и секреты</text>
      </g>
      <g class="pt-item" data-i="6" tabindex="0" role="button" aria-pressed="false">
        <rect x="14" y="244" width="254" height="32" rx="6"/>
        <text x="26" y="264" font-size="10" font-weight="600" fill="#8E5BC8">7</text>
        <text x="42" y="264" font-size="10">Документы и слайды</text>
      </g>
      <g class="pt-item" data-i="7" tabindex="0" role="button" aria-pressed="false">
        <rect x="14" y="280" width="254" height="32" rx="6"/>
        <text x="26" y="300" font-size="10" font-weight="600" fill="#8E5BC8">8</text>
        <text x="42" y="300" font-size="10">Репетиция показа</text>
      </g>

      <rect x="282" y="28" width="384" height="292" rx="9" fill="#FBF8FC" stroke="#D9C9E2"/>
      <text id="pt-title" x="298" y="54" font-size="13" font-weight="600" fill="#2A2430">Границы и каркас</text>
      <rect x="586" y="38" width="64" height="20" rx="10" fill="#F1E7F5" stroke="#8E5BC8"/>
      <text id="pt-week" x="618" y="52" text-anchor="middle" font-size="9" fill="#6B3E9B">нед. 1</text>
      <line x1="298" y1="68" x2="650" y2="68" stroke="#E4D6EC"/>

      <text x="298" y="88" font-size="8" font-family="Consolas,monospace" letter-spacing="1.2" fill="#8E5BC8">РЕЗУЛЬТАТ</text>
      <text id="pt-r1" x="298" y="106" font-size="10" fill="#2A2430">заявка, каркас репозитория,</text>
      <text id="pt-r2" x="298" y="120" font-size="10" fill="#2A2430">список «не входит»</text>

      <text x="298" y="148" font-size="8" font-family="Consolas,monospace" letter-spacing="1.2" fill="#8E5BC8">КРИТЕРИЙ ГОТОВНОСТИ</text>
      <text id="pt-c1" x="298" y="166" font-size="10" fill="#2A2430">11 путей на месте,</text>
      <text id="pt-c2" x="298" y="180" font-size="10" fill="#2A2430">первый коммит отправлен</text>

      <text x="298" y="208" font-size="8" font-family="Consolas,monospace" letter-spacing="1.2" fill="#8E5BC8">ГЛАВНЫЙ РИСК</text>
      <text id="pt-k1" x="298" y="226" font-size="10" fill="#2A2430">тема растёт в стороны</text>
      <text id="pt-k2" x="298" y="240" font-size="10" fill="#2A2430"></text>

      <text x="298" y="268" font-size="9" fill="#6B5F75">Этап закрыт, когда результат можно показать, а не когда истекло время.</text>

      <g id="pt-weeks" font-size="8" font-family="Consolas,monospace">
        <text x="298" y="292" fill="#6B5F75">НЕДЕЛИ</text>
        <g class="pt-wk" data-w="1"><rect x="358" y="281" width="38" height="17" rx="4" fill="#FBF8FC" stroke="#D9C9E2"/><text x="377" y="293" text-anchor="middle" fill="#6B5F75">1</text></g>
        <g class="pt-wk" data-w="2"><rect x="400" y="281" width="38" height="17" rx="4" fill="#FBF8FC" stroke="#D9C9E2"/><text x="419" y="293" text-anchor="middle" fill="#6B5F75">2</text></g>
        <g class="pt-wk" data-w="3"><rect x="442" y="281" width="38" height="17" rx="4" fill="#FBF8FC" stroke="#D9C9E2"/><text x="461" y="293" text-anchor="middle" fill="#6B5F75">3</text></g>
        <g class="pt-wk" data-w="4"><rect x="484" y="281" width="38" height="17" rx="4" fill="#FBF8FC" stroke="#D9C9E2"/><text x="503" y="293" text-anchor="middle" fill="#6B5F75">4</text></g>
        <g class="pt-wk" data-w="5"><rect x="526" y="281" width="38" height="17" rx="4" fill="#FBF8FC" stroke="#D9C9E2"/><text x="545" y="293" text-anchor="middle" fill="#6B5F75">5</text></g>
        <g class="pt-wk" data-w="6"><rect x="568" y="281" width="38" height="17" rx="4" fill="#FBF8FC" stroke="#D9C9E2"/><text x="587" y="293" text-anchor="middle" fill="#6B5F75">6</text></g>
      </g>
    </g>
  </svg>
  <p class="note">Выберите этап: справа показаны его результат, критерий и риск. Недели 1 и 6 нужны не только для кода, но и для проверки.</p>
</div>
<script>
(function () {
  var data = [
    { t: 'Границы и каркас', w: 'нед. 1', weeks: [1],
      r: ['заявка, каркас репозитория,', 'список «не входит»'],
      c: ['11 путей на месте,', 'первый коммит отправлен'],
      k: ['тема растёт в стороны', ''] },
    { t: 'Схема базы и вход', w: 'нед. 1-2', weeks: [1, 2],
      r: ['schema.sql, 4-6 таблиц,', 'три роли и вход'],
      c: ['база создаётся одной командой,', 'четыре случая входа проверены'],
      k: ['пароль остался в коде', ''] },
    { t: 'Срез MVP', w: 'нед. 2-3', weeks: [2, 3],
      r: ['вход и главный сценарий', 'через все слои'],
      c: ['сценарий проходит без правок,', 'данные видны в интерфейсе'],
      k: ['слои не стыкуются', ''] },
    { t: 'Операции и отказы', w: 'нед. 3-4', weeks: [3, 4],
      r: ['четыре операции CRUD', 'и пять отказов'],
      c: ['коды 400, 401, 403,', '404 и 409 различимы'],
      k: ['ошибка уходит с кодом 200', ''] },
    { t: 'Тесты и отчёт о прогоне', w: 'нед. 4-5', weeks: [4, 5],
      r: ['10 модульных и 3', 'интеграционных теста'],
      c: ['зелёный прогон', 'на чистой копии проекта'],
      k: ['проверен только успешный случай', ''] },
    { t: 'Запуск и секреты', w: 'нед. 5', weeks: [5],
      r: ['настройки вне кода,', 'README и .env.example'],
      c: ['клон, установка и запуск', 'по шагам инструкции'],
      k: ['работает только у автора', ''] },
    { t: 'Документы и слайды', w: 'нед. 5-6', weeks: [5, 6],
      r: ['README, описание API,', 'семь слайдов'],
      c: ['документы совпадают', 'с текущими маршрутами'],
      k: ['документы отстали от кода', ''] },
    { t: 'Репетиция показа', w: 'нед. 6', weeks: [6],
      r: ['прогон показа целиком', 'и запасной план'],
      c: ['семь шагов без правок,', 'время уложилось'],
      k: ['сбой на сцене без копии', ''] }
  ];
  var items = [].slice.call(document.querySelectorAll('.pt-item'));
  var weeks = [].slice.call(document.querySelectorAll('.pt-wk'));
  var el = function (id) { return document.getElementById(id); };

  function select(i) {
    var d = data[i];
    items.forEach(function (it, k) {
      it.classList.toggle('on', k === i);
      it.setAttribute('aria-pressed', k === i ? 'true' : 'false');
    });
    el('pt-title').textContent = d.t;
    el('pt-week').textContent = d.w;
    el('pt-r1').textContent = d.r[0];
    el('pt-r2').textContent = d.r[1];
    el('pt-c1').textContent = d.c[0];
    el('pt-c2').textContent = d.c[1];
    el('pt-k1').textContent = d.k[0];
    el('pt-k2').textContent = d.k[1];
    weeks.forEach(function (w) {
      var on = d.weeks.indexOf(Number(w.getAttribute('data-w'))) >= 0;
      w.querySelector('rect').setAttribute('fill', on ? '#8E5BC8' : '#FBF8FC');
      w.querySelector('rect').setAttribute('stroke', on ? '#8E5BC8' : '#D9C9E2');
      w.querySelector('text').setAttribute('fill', on ? '#FFFFFF' : '#6B5F75');
    });
  }
  items.forEach(function (it, i) {
    it.addEventListener('click', function () { select(i); });
    it.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(i); }
    });
  });
  select(0);
})();
</script>
</body>
</html>
