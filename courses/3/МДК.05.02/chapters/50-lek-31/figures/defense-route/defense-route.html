<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Маршрут показа на защите</title>
<style>
  :root { color-scheme:light; --bg:#EBE0EC; --paper:#FBF8FC; --ink:#2A2430; --muted:#6B5F75; --accent:#8E5BC8; --soft:#F1E7F5; --rule:#D9C9E2; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--bg); border:1px solid var(--rule); border-radius:12px; padding:16px 16px 12px; }
  .eyebrow { margin:0 0 4px; font:600 9px/1.3 Consolas,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); }
  h3 { margin:0 0 6px; font-size:18px; line-height:1.2; }
  svg { display:block; width:100%; height:auto; }
  .note { margin:8px 2px 0; font:11px/1.5 Consolas,monospace; color:var(--muted); }
  @media (max-width:560px) { .frame { padding:12px; } h3 { font-size:16px; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Итоговый проект · защита</p>
  <h3>Десять минут, в которых видно систему, а не файлы</h3>
  <svg viewBox="0 0 680 300" role="img" aria-labelledby="dr-t dr-d">
    <title id="dr-t">Маршрут показа проекта на защите</title>
    <desc id="dr-d">Полоса времени на десять минут: задача, главный сценарий, решения, доказательства и границы. Ниже три запасных варианта на случай сбоя.</desc>
    <g font-family="'Segoe UI',system-ui,sans-serif">
      <text x="40" y="26" font-size="9" font-family="Consolas,monospace" letter-spacing="1.2" fill="#6B5F75">ПОКАЗ</text>
      <text x="420" y="26" font-size="9" font-family="Consolas,monospace" letter-spacing="1.2" fill="#6B5F75">ДОКАЗАТЕЛЬСТВА ВАЖНЕЕ СЛАЙДОВ</text>

      <rect x="40" y="40" width="60" height="76" rx="6" fill="#F1E7F5" stroke="#8E5BC8"/>
      <text x="70" y="60" text-anchor="middle" font-size="9" font-weight="600" fill="#4B2A73">1 мин</text>
      <text x="70" y="80" text-anchor="middle" font-size="9.5" fill="#2A2430">задача</text>
      <text x="70" y="94" text-anchor="middle" font-size="8" fill="#6B5F75">кто и зачем</text>

      <rect x="100" y="40" width="180" height="76" rx="6" fill="#FBF8FC" stroke="#B99BD0"/>
      <text x="190" y="60" text-anchor="middle" font-size="9" font-weight="600" fill="#8E5BC8">3 мин</text>
      <text x="190" y="80" text-anchor="middle" font-size="9.5" fill="#2A2430">главный сценарий</text>
      <text x="190" y="94" text-anchor="middle" font-size="8" fill="#6B5F75">вход, выдача, отказ</text>

      <rect x="280" y="40" width="120" height="76" rx="6" fill="#FBF8FC" stroke="#B99BD0"/>
      <text x="340" y="60" text-anchor="middle" font-size="9" font-weight="600" fill="#8E5BC8">2 мин</text>
      <text x="340" y="80" text-anchor="middle" font-size="9.5" fill="#2A2430">решения</text>
      <text x="340" y="94" text-anchor="middle" font-size="8" fill="#6B5F75">схема и данные</text>

      <rect x="400" y="40" width="180" height="76" rx="6" fill="#FBF8FC" stroke="#B99BD0"/>
      <text x="490" y="60" text-anchor="middle" font-size="9" font-weight="600" fill="#8E5BC8">3 мин</text>
      <text x="490" y="80" text-anchor="middle" font-size="9.5" fill="#2A2430">доказательства</text>
      <text x="490" y="94" text-anchor="middle" font-size="8" fill="#6B5F75">тесты, журнал, API</text>

      <rect x="580" y="40" width="60" height="76" rx="6" fill="#F1E7F5" stroke="#8E5BC8"/>
      <text x="610" y="60" text-anchor="middle" font-size="9" font-weight="600" fill="#4B2A73">1 мин</text>
      <text x="610" y="80" text-anchor="middle" font-size="9.5" fill="#2A2430">границы</text>
      <text x="610" y="94" text-anchor="middle" font-size="8" fill="#6B5F75">что дальше</text>

      <line x1="40" y1="132" x2="640" y2="132" stroke="#B99BD0"/>
      <g font-size="8.5" fill="#6B5F75" font-family="Consolas,monospace">
        <line x1="40" y1="126" x2="40" y2="138" stroke="#B99BD0"/>
        <text x="40" y="150" text-anchor="middle">0</text>
        <line x1="100" y1="126" x2="100" y2="138" stroke="#B99BD0"/>
        <text x="100" y="150" text-anchor="middle">1</text>
        <line x1="280" y1="126" x2="280" y2="138" stroke="#B99BD0"/>
        <text x="280" y="150" text-anchor="middle">4</text>
        <line x1="400" y1="126" x2="400" y2="138" stroke="#B99BD0"/>
        <text x="400" y="150" text-anchor="middle">6</text>
        <line x1="580" y1="126" x2="580" y2="138" stroke="#B99BD0"/>
        <text x="580" y="150" text-anchor="middle">9</text>
        <line x1="640" y1="126" x2="640" y2="138" stroke="#B99BD0"/>
        <text x="640" y="150" text-anchor="middle">10</text>
      </g>

      <g font-size="8.5" fill="#2A2430">
        <rect x="40" y="172" width="192" height="54" rx="7" fill="#FBF8FC" stroke="#D9C9E2"/>
        <text x="54" y="192" font-weight="600" fill="#8E5BC8">приложение упало</text>
        <text x="54" y="208">перейти к записи прогона,</text>
        <text x="54" y="219">не отлаживать на сцене</text>

        <rect x="244" y="172" width="192" height="54" rx="7" fill="#FBF8FC" stroke="#D9C9E2"/>
        <text x="258" y="192" font-weight="600" fill="#8E5BC8">база пустая</text>
        <text x="258" y="208">выполнить seed-скрипт</text>
        <text x="258" y="219">из репозитория</text>

        <rect x="448" y="172" width="192" height="54" rx="7" fill="#FBF8FC" stroke="#D9C9E2"/>
        <text x="462" y="192" font-weight="600" fill="#8E5BC8">вопрос без ответа</text>
        <text x="462" y="208">показать артефакт</text>
        <text x="462" y="219">и назвать границу</text>
      </g>

      <text x="40" y="252" font-size="10" fill="#6B5F75">Показ идёт по сценарию пользователя. Слайды только называют решение и подтверждают его артефактом.</text>
      <text x="40" y="276" font-size="9" fill="#8A6DA1">Перед защитой: чистая база, семь шагов, запасная запись и известные ограничения.</text>
    </g>
  </svg>
  <p class="note">Три нижних блока это запасной план. Он готовится до защиты, а не придумывается в момент сбоя.</p>
</div>
</body>
</html>
