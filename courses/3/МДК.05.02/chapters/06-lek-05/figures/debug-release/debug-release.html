<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конфигурации Debug и Release</title>
<style>
  :root { --paper:#EBE0EC; --card:#FBF7FC; --ink:#2A2233; --muted:#6B5F75; --rule:#D5C2DC; --accent:#8E5BC8; --soft:#E4D5EC; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px; }
  .eyebrow { margin:0 0 6px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .note { margin:10px 2px 0; font:12px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
  @media (max-width:560px) { .frame { padding:12px; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">C# · две конфигурации</p>
  <svg viewBox="0 0 680 366" role="img" aria-labelledby="dr-title dr-desc">
    <title id="dr-title">Сравнение Debug и Release</title>
    <desc id="dr-desc">Две колонки: Debug с отладочными символами и без оптимизации, Release с оптимизацией и без отладочной информации. Показаны каталоги bin/Debug и bin/Release и назначение каждой конфигурации.</desc>

    <text x="16" y="22" font-family="Consolas,monospace" font-size="10" fill="#6B5F75">ОДИН КОД, ДВА РЕЖИМА СБОРКИ</text>

    <g font-family="Segoe UI,system-ui,sans-serif">
      <rect x="16" y="34" width="314" height="244" rx="10" fill="#FBF7FC" stroke="#8E5BC8" stroke-width="1.8"/>
      <text x="30" y="58" font-size="13" font-weight="700" fill="#2A2233">Debug</text>
      <text x="30" y="76" font-size="10.5" fill="#5B3E76">для поиска дефекта</text>
      <line x1="30" y1="86" x2="316" y2="86" stroke="#D5C2DC"/>

      <text x="30" y="106" font-size="10" font-weight="700" fill="#8E5BC8">СИМВОЛЫ</text>
      <text x="30" y="122" font-size="10.5" fill="#2A2233">есть .pdb, номера строк совпадают</text>

      <text x="30" y="146" font-size="10" font-weight="700" fill="#8E5BC8">ОПТИМИЗАЦИЯ</text>
      <text x="30" y="162" font-size="10.5" fill="#2A2233">выключена, код близок к исходнику</text>

      <text x="30" y="186" font-size="10" font-weight="700" fill="#8E5BC8">КАТАЛОГ</text>
      <text x="30" y="202" font-size="10.5" fill="#2A2233">bin/Debug/net10.0</text>

      <text x="30" y="226" font-size="10" font-weight="700" fill="#8E5BC8">ЗАПУСК</text>
      <text x="30" y="242" font-size="10.5" fill="#2A2233">F5, точки останова, шаги, Locals</text>

      <text x="30" y="264" font-size="10.5" fill="#6B5F75">медленнее, зато видно состояние</text>

      <rect x="350" y="34" width="314" height="244" rx="10" fill="#FBF7FC" stroke="#D5C2DC"/>
      <text x="364" y="58" font-size="13" font-weight="700" fill="#2A2233">Release</text>
      <text x="364" y="76" font-size="10.5" fill="#6B5F75">для передачи и проверки выпуска</text>
      <line x1="364" y1="86" x2="650" y2="86" stroke="#D5C2DC"/>

      <text x="364" y="106" font-size="10" font-weight="700" fill="#8E5BC8">СИМВОЛЫ</text>
      <text x="364" y="122" font-size="10.5" fill="#2A2233">отладочная информация урезана</text>

      <text x="364" y="146" font-size="10" font-weight="700" fill="#8E5BC8">ОПТИМИЗАЦИЯ</text>
      <text x="364" y="162" font-size="10.5" fill="#2A2233">включена, код переставлен и встроен</text>

      <text x="364" y="186" font-size="10" font-weight="700" fill="#8E5BC8">КАТАЛОГ</text>
      <text x="364" y="202" font-size="10.5" fill="#2A2233">bin/Release/net10.0</text>

      <text x="364" y="226" font-size="10" font-weight="700" fill="#8E5BC8">ЗАПУСК</text>
      <text x="364" y="242" font-size="10.5" fill="#2A2233">Ctrl+F5, dotnet run -c Release</text>

      <text x="364" y="264" font-size="10.5" fill="#6B5F75">быстрее, но шаги могут сбивать</text>
    </g>

    <g font-family="Segoe UI,system-ui,sans-serif">
      <rect x="16" y="292" width="648" height="44" rx="8" fill="#EFE3F3" stroke="#8E5BC8"/>
      <text x="30" y="310" font-size="10.5" font-weight="700" fill="#5B3E76">ПРАВИЛО</text>
      <text x="30" y="326" font-size="10.5" fill="#2A2233">дефект ищут в Debug, выпуск проверяют в Release, а путь к запущенному файлу сверяют всегда</text>
    </g>

    <text x="16" y="358" font-family="Consolas,monospace" font-size="9.5" fill="#6B5F75">СБОРКА В RELEASE НЕ ОТМЕНЯЕТ ПРОВЕРКУ ТИПОВ, НО МЕНЯЕТ РАСПОЛОЖЕНИЕ ИНСТРУКЦИЙ</text>
  </svg>
  <p class="note">Debug хранит отладочные символы и не оптимизирует код, Release оптимизирует и готовится к передаче. Файлы лежат в разных каталогах, поэтому старую сборку легко перепутать.</p>
</div>
</body>
</html>
