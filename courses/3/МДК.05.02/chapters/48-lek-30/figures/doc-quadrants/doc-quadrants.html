<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Четыре вида документации</title>
<style>
  :root { --paper:#FAF7F6; --card:#FFFDFC; --ink:#2A2430; --muted:#6B6272; --rule:#E6D9EC; --accent:#8E5BC8; --soft:#EBE0EC; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px; }
  .eyebrow { margin:0 0 6px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .q { cursor:pointer; }
  .q rect { fill:var(--card); stroke:var(--rule); stroke-width:1.3; transition:fill .15s, stroke .15s; }
  .q.on rect { fill:#F4EBF8; stroke:var(--accent); stroke-width:2; }
  .q text.t { font-size:12.5px; font-weight:700; fill:var(--ink); }
  .q text.s { font-size:9.5px; fill:var(--muted); }
  .ax { font-size:9.5px; fill:#5F3A85; font-weight:600; }
  .dim { font-size:9px; fill:var(--muted); }
  .status { min-height:72px; margin-top:8px; padding:9px 11px; border-radius:9px; background:var(--soft); font-size:12.5px; line-height:1.45; }
  .status b { color:var(--accent); }
  .note { margin:9px 2px 0; font:11.5px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
  @media (max-width:560px) { .frame { padding:12px; } .status { font-size:12px; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Задача читателя и форма текста</p>
  <svg viewBox="0 0 680 330" role="img" aria-labelledby="dq-title dq-desc">
    <title id="dq-title">Четыре вида документации</title>
    <desc id="dq-desc">Квадранты: обучающий материал, инструкция, объяснение, справочник. По горизонтали задача меняется от учения к работе, по вертикали от практики к пониманию. Нажмите квадрант, чтобы увидеть пример и проверку.</desc>

    <text class="ax" x="86" y="26">учение</text>
    <text class="ax" x="656" y="26" text-anchor="end">работа</text>
    <text class="dim" x="16" y="48">понимание</text>
    <text class="dim" x="16" y="316">практика</text>
    <line x1="76" y1="316" x2="76" y2="36" stroke="#D9CBE0" stroke-width="1.4"/>
    <line x1="76" y1="176" x2="656" y2="176" stroke="#D9CBE0" stroke-width="1.4"/>

    <g class="q on" data-k="tutorial">
      <rect x="86" y="42" width="278" height="124" rx="9"/>
      <text class="t" x="102" y="70">Обучающий материал</text>
      <text class="s" x="102" y="90">учебный сценарий с нуля</text>
      <text class="s" x="102" y="108">первая приёмка товара</text>
      <text class="s" x="102" y="130">новичок проходит шаги</text>
      <text class="s" x="102" y="148">с подсказками и повторами</text>
    </g>

    <g class="q" data-k="howto">
      <rect x="372" y="42" width="278" height="124" rx="9"/>
      <text class="t" x="388" y="70">Инструкция</text>
      <text class="s" x="388" y="90">короткий путь к задаче</text>
      <text class="s" x="388" y="108">восстановить базу из копии</text>
      <text class="s" x="388" y="130">задача выполнена</text>
      <text class="s" x="388" y="148">без обучения основам</text>
    </g>

    <g class="q" data-k="explanation">
      <rect x="86" y="184" width="278" height="124" rx="9"/>
      <text class="t" x="102" y="212">Объяснение</text>
      <text class="s" x="102" y="232">почему решение такое</text>
      <text class="s" x="102" y="250">почему резерв хранится отдельно</text>
      <text class="s" x="102" y="272">читатель может объяснить выбор</text>
      <text class="s" x="102" y="290">без пошаговых команд</text>
    </g>

    <g class="q" data-k="reference">
      <rect x="372" y="184" width="278" height="124" rx="9"/>
      <text class="t" x="388" y="212">Справочник</text>
      <text class="s" x="388" y="232">точные факты и значения</text>
      <text class="s" x="388" y="250">поля ответа и коды ошибок</text>
      <text class="s" x="388" y="272">значение совпало с системой</text>
      <text class="s" x="388" y="290">без примеров на полстраницы</text>
    </g>
  </svg>
  <div class="status" id="dq-status"></div>
  <p class="note">Нажмите квадрант. Обратите внимание: один и тот же вопрос «как принять товар» в обучении и в инструкции выглядит по-разному, потому что у читателей разные задачи.</p>
</div>
<script>
(function () {
  var data = {
    tutorial: '<b>Обучающий материал.</b> Ведёт новичка от первого входа до результата, объясняет термины и разрешает повторять шаги. Пример: «Первая приёмка товара», где описаны вход, выбор накладной, проверка количества и подтверждение. Проверка: человек без опыта прошёл сценарий целиком. Ошибка: превратить обучение в справочник параметров.',
    howto: '<b>Инструкция.</b> Предполагает знакомство с основами и даёт короткий порядок под конкретную задачу. Пример: «Восстановить базу из копии» с предусловиями, командами и проверкой. Проверка: задача выполнена на чистом окружении. Ошибка: спрятать команду среди рассуждений о выборе СУБД.',
    explanation: '<b>Объяснение.</b> Отвечает на «почему», а не на «как». Пример: почему резерв хранится отдельно от остатка и какие ошибки это предотвращает. Проверка: читатель может объяснить решение коллеге. Ошибка: вставить пошаговые команды, которые устареют.',
    reference: '<b>Справочник.</b> Перечисляет факты в предсказуемом порядке: маршруты, поля, коды, ограничения. Пример: таблица ответов и ошибок API. Проверка: значение совпало с поведением системы. Ошибка: добавить учебный рассказ, из-за которого нужная строка теряется.'
  };
  var cells = document.querySelectorAll('.q');
  var status = document.getElementById('dq-status');
  function apply(k) {
    cells.forEach(function (c) { c.classList.toggle('on', c.dataset.k === k); });
    status.innerHTML = data[k];
  }
  cells.forEach(function (c) { c.addEventListener('click', function () { apply(c.dataset.k); }); });
  apply('tutorial');
})();
</script>
</body>
</html>
