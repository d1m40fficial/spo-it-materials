<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Слои ORM</title>
<style>
  :root { color-scheme:light; --paper:#EBE0EC; --card:#FFFDFC; --ink:#2A2430; --muted:#6B6272; --rule:#CDBBD6; --accent:#8E5BC8; --soft:#F3EAF4; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px; }
  .eyebrow { margin:0 0 6px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .note { margin:9px 2px 0; font:11.5px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
  @media (max-width:560px) { .frame { padding:12px; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">ORM · слои отображения</p>
  <svg viewBox="0 0 680 372" role="img" aria-labelledby="ol-title ol-desc">
    <title id="ol-title">Слои ORM: модель, сессия, SQL и таблица</title>
    <desc id="ol-desc">Класс модели описывает схему, сессия хранит состояние операции, генератор строит SQL, таблица хранит строки. Стрелки показывают чтение и запись.</desc>

    <g font-family="Segoe UI,system-ui,sans-serif">
      <rect x="16" y="24" width="466" height="58" rx="9" fill="#FFFDFC" stroke="#8E5BC8" stroke-width="1.6"/>
      <text x="30" y="45" font-size="12.5" font-weight="700" fill="#2A2430">Класс Product</text>
      <text x="30" y="63" font-size="10.5" fill="#2A2430" font-family="Consolas,monospace">id, sku, title, price, stock</text>
      <text x="30" y="77" font-size="10" fill="#6B6272">имена таблиц и колонок описаны один раз</text>

      <text x="500" y="48" font-size="10" fill="#8E5BC8" font-weight="600">схема</text>
      <text x="500" y="63" font-size="10" fill="#6B6272">живёт здесь</text>

      <path d="M249 82 L249 96" stroke="#8E5BC8" stroke-width="1.5"/>
      <path d="M243 90 L249 96 L255 90" fill="none" stroke="#8E5BC8" stroke-width="1.5"/>
      <path d="M249 96 L249 82" stroke="#CDBBD6" stroke-width="1.2" stroke-dasharray="3 3"/>

      <rect x="16" y="100" width="466" height="76" rx="9" fill="#F3EAF4" stroke="#8E5BC8" stroke-width="1.6"/>
      <text x="30" y="121" font-size="12.5" font-weight="700" fill="#2A2430">Сессия</text>
      <text x="30" y="140" font-size="10.5" fill="#2A2430">identity map: один объект на строку</text>
      <text x="30" y="155" font-size="10.5" fill="#2A2430">dirty checking: что изменено</text>
      <text x="30" y="170" font-size="10.5" fill="#2A2430">unit of work: какие команды отправить при commit</text>

      <text x="500" y="130" font-size="10" fill="#8E5BC8" font-weight="600">состояние</text>
      <text x="500" y="145" font-size="10" fill="#6B6272">конкретной</text>
      <text x="500" y="160" font-size="10" fill="#6B6272">операции</text>

      <path d="M249 176 L249 190" stroke="#8E5BC8" stroke-width="1.5"/>
      <path d="M243 184 L249 190 L255 184" fill="none" stroke="#8E5BC8" stroke-width="1.5"/>
      <path d="M249 190 L249 176" stroke="#CDBBD6" stroke-width="1.2" stroke-dasharray="3 3"/>

      <rect x="16" y="194" width="466" height="66" rx="9" fill="#FFFDFC" stroke="#CDBBD6"/>
      <text x="30" y="215" font-size="12.5" font-weight="700" fill="#2A2430">Сгенерированный SQL</text>
      <text x="30" y="234" font-size="10.5" fill="#2A2430" font-family="Consolas,monospace">SELECT id, sku, title, price FROM products</text>
      <text x="30" y="250" font-size="10.5" fill="#2A2430" font-family="Consolas,monospace">WHERE price &lt; ? ORDER BY title</text>

      <text x="500" y="220" font-size="10" fill="#8E5BC8" font-weight="600">запрос</text>
      <text x="500" y="235" font-size="10" fill="#6B6272">строится</text>
      <text x="500" y="250" font-size="10" fill="#6B6272">здесь</text>

      <path d="M249 260 L249 274" stroke="#8E5BC8" stroke-width="1.5"/>
      <path d="M243 268 L249 274 L255 268" fill="none" stroke="#8E5BC8" stroke-width="1.5"/>
      <path d="M249 274 L249 260" stroke="#CDBBD6" stroke-width="1.2" stroke-dasharray="3 3"/>

      <rect x="16" y="278" width="466" height="66" rx="9" fill="#FFFDFC" stroke="#CDBBD6"/>
      <text x="30" y="299" font-size="12.5" font-weight="700" fill="#2A2430">Таблица products</text>
      <g font-family="Consolas,monospace" font-size="10" fill="#6B6272">
        <text x="30" y="318">1  SKU-1005  Кабель ВВГнг 3x2,5  13500</text>
        <text x="30" y="334">2  SKU-1002  Молоток слесарный   69000</text>
      </g>

      <text x="500" y="304" font-size="10" fill="#8E5BC8" font-weight="600">строки</text>
      <text x="500" y="319" font-size="10" fill="#6B6272">хранятся</text>
      <text x="500" y="334" font-size="10" fill="#6B6272">в файле</text>
    </g>
  </svg>
  <p class="note">Сверху вниз: описание схемы, состояние операции, SQL, строки таблицы. Стрелки показывают, что чтение идёт снизу вверх, а запись начинается в сессии.</p>
</div>
</body>
</html>
