<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Повтор запроса и ключ идемпотентности</title>
<style>
  :root { --paper:#FAF7F6; --card:#FFFDFC; --ink:#2A2430; --muted:#6B6272; --rule:#E6D9EC; --accent:#8E5BC8; --soft:#EBE0EC; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px; }
  .eyebrow { margin:0 0 6px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .note { margin:10px 2px 0; font:12px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
  @media (max-width:560px) { .frame { padding:12px; } .note { font-size:11.5px; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">HTTP · повтор после сбоя</p>
  <svg viewBox="0 0 680 330" role="img" aria-labelledby="rt-title rt-desc">
    <title id="rt-title">Повтор POST с ключом идемпотентности и без него</title>
    <desc id="rt-desc">Верхняя линия показывает повтор с тем же ключом: сервер возвращает одну накладную. Нижняя линия показывает повтор без ключа: создаются две накладные.</desc>

    <text x="16" y="22" font-family="Consolas,monospace" font-size="10" fill="#6B6272">С КЛЮЧОМ</text>
    <text x="16" y="180" font-family="Consolas,monospace" font-size="10" fill="#6B6272">БЕЗ КЛЮЧА</text>

    <g font-family="Segoe UI,system-ui,sans-serif">
      <rect x="16" y="38" width="128" height="56" rx="7" fill="#FFFDFC" stroke="#8E5BC8" stroke-width="1.6"/>
      <text x="28" y="60" font-size="11.5" font-weight="700" fill="#2A2430">POST + ключ</text>
      <text x="28" y="76" font-size="9.5" fill="#6B6272">Idempotency-Key</text>
      <text x="28" y="88" font-size="9.5" fill="#6B6272">ship-1042</text>

      <line x1="144" y1="66" x2="185" y2="66" stroke="#8E5BC8" stroke-width="1.4" marker-end="url(#arw-r)"/>

      <rect x="190" y="38" width="126" height="56" rx="7" fill="#FFFDFC" stroke="#D8C7E2" stroke-dasharray="4 3"/>
      <text x="202" y="60" font-size="11.5" font-weight="700" fill="#2A2430">ответ потерян</text>
      <text x="202" y="76" font-size="9.5" fill="#6B6272">таймаут клиента</text>
      <text x="202" y="88" font-size="9.5" fill="#6B6272">операция могла пройти</text>

      <line x1="316" y1="66" x2="357" y2="66" stroke="#8E5BC8" stroke-width="1.4" marker-end="url(#arw-r)"/>

      <rect x="362" y="38" width="132" height="56" rx="7" fill="#FFFDFC" stroke="#8E5BC8" stroke-width="1.6"/>
      <text x="374" y="60" font-size="11.5" font-weight="700" fill="#2A2430">повтор с ключом</text>
      <text x="374" y="76" font-size="9.5" fill="#6B6272">тот же ship-1042</text>
      <text x="374" y="88" font-size="9.5" fill="#6B6272">сервер ищет ключ</text>

      <line x1="494" y1="66" x2="535" y2="66" stroke="#8E5BC8" stroke-width="1.4" marker-end="url(#arw-r)"/>

      <rect x="540" y="38" width="124" height="56" rx="7" fill="#EBE0EC" stroke="#8E5BC8" stroke-width="1.8"/>
      <text x="552" y="58" font-size="11.5" font-weight="700" fill="#2A2430">201</text>
      <text x="552" y="74" font-size="9.5" fill="#2A2430">та же накладная</text>
      <text x="552" y="86" font-size="9.5" fill="#6B6272">дубля нет</text>

      <rect x="16" y="196" width="128" height="56" rx="7" fill="#FFFDFC" stroke="#D8C7E2"/>
      <text x="28" y="218" font-size="11.5" font-weight="700" fill="#2A2430">POST без ключа</text>
      <text x="28" y="234" font-size="9.5" fill="#6B6272">обычный JSON</text>
      <text x="28" y="246" font-size="9.5" fill="#6B6272">без заголовка</text>

      <line x1="144" y1="224" x2="185" y2="224" stroke="#8E5BC8" stroke-width="1.4" marker-end="url(#arw-r)"/>

      <rect x="190" y="196" width="126" height="56" rx="7" fill="#FFFDFC" stroke="#D8C7E2" stroke-dasharray="4 3"/>
      <text x="202" y="218" font-size="11.5" font-weight="700" fill="#2A2430">ответ потерян</text>
      <text x="202" y="234" font-size="9.5" fill="#6B6272">таймаут клиента</text>
      <text x="202" y="246" font-size="9.5" fill="#6B6272">клиент не знает исхода</text>

      <line x1="316" y1="224" x2="357" y2="224" stroke="#8E5BC8" stroke-width="1.4" marker-end="url(#arw-r)"/>

      <rect x="362" y="196" width="132" height="56" rx="7" fill="#FFFDFC" stroke="#D8C7E2"/>
      <text x="374" y="218" font-size="11.5" font-weight="700" fill="#2A2430">повтор без ключа</text>
      <text x="374" y="234" font-size="9.5" fill="#6B6272">новое тело</text>
      <text x="374" y="246" font-size="9.5" fill="#6B6272">новая операция</text>

      <line x1="494" y1="224" x2="535" y2="224" stroke="#B3261E" stroke-width="1.4" marker-end="url(#arw-b)"/>

      <rect x="540" y="196" width="124" height="56" rx="7" fill="#FBEAE8" stroke="#B3261E" stroke-width="1.6"/>
      <text x="552" y="216" font-size="11.5" font-weight="700" fill="#B3261E">201</text>
      <text x="552" y="232" font-size="9.5" fill="#2A2430">вторая накладная</text>
      <text x="552" y="244" font-size="9.5" fill="#6B6272">склад изменился дважды</text>
    </g>

    <text x="16" y="292" font-family="Consolas,monospace" font-size="9.5" fill="#6B6272">КЛЮЧ РАБОТАЕТ ТОЛЬКО С УНИКАЛЬНЫМ ИНДЕКСОМ В БАЗЕ</text>
    <text x="16" y="310" font-family="Segoe UI,system-ui,sans-serif" font-size="10.5" fill="#6B6272">Повторяйте GET, PUT, DELETE и POST с ключом. Пауза растёт, число попыток ограничено.</text>

    <defs>
      <marker id="arw-r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8E5BC8"/></marker>
      <marker id="arw-b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#B3261E"/></marker>
    </defs>
  </svg>
  <p class="note">Без ключа клиент не может отличить «запрос не дошёл» от «запрос выполнен, ответ потерян». С ключом сервер распознаёт повтор и возвращает прежний результат.</p>
</div>
</body>
</html>
