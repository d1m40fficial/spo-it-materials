<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Формула в CSV и её выполнение в Excel</title>
<style>
  :root { --paper:#F7F0FA; --card:#FFFFFF; --ink:#2B2333; --muted:#6E6179; --rule:#DCCBE6; --accent:#8E5BC8; --soft:#EBE0EC; --deep:#5B2E86; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px; }
  .eyebrow { margin:0 0 6px; font:600 10.5px/1.2 Consolas,monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .note { margin:10px 2px 0; font:12px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Обмен · CSV injection</p>
  <svg viewBox="0 0 680 374" role="img" aria-labelledby="ci-title ci-desc">
    <title id="ci-title">Как текст из CSV становится формулой</title>
    <desc id="ci-desc">Внешнее поле начинается со знака равенства, попадает в CSV и при открытии в Excel выполняется как формула. Внизу перечислены опасные начала ячеек и два способа защиты.</desc>

    <defs>
      <marker id="ci-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#8E5BC8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <g font-family="Segoe UI,system-ui,sans-serif">
      <rect x="16" y="26" width="300" height="92" rx="8" fill="#FFFFFF" stroke="#C9B6D6"/>
      <text x="28" y="47" font-size="10.5" fill="#6E6179">поле из внешней системы</text>
      <text x="28" y="68" font-family="Consolas,monospace" font-size="10.5" fill="#2B2333">supplier =</text>
      <text x="28" y="84" font-family="Consolas,monospace" font-size="10" fill="#8A4F6E">"=HYPERLINK(""http://..."" ,"</text>
      <text x="28" y="100" font-family="Consolas,monospace" font-size="10" fill="#8A4F6E">"""Открыть"")"</text>

      <rect x="360" y="26" width="304" height="92" rx="8" fill="#FFFFFF" stroke="#C9B6D6"/>
      <text x="372" y="47" font-size="10.5" fill="#6E6179">файл stock.csv</text>
      <text x="372" y="68" font-family="Consolas,monospace" font-size="10" fill="#2B2333">sku;supplier</text>
      <text x="372" y="85" font-family="Consolas,monospace" font-size="10" fill="#2B2333">SKU-1042;"=HYPERLINK(...)"</text>
      <text x="372" y="104" font-size="10.5" fill="#8A4F6E">кавычки только экранируют разделитель</text>

      <path d="M316 72 H360" fill="none" stroke="#8E5BC8" stroke-width="1.6" marker-end="url(#ci-arrow)"/>
      <path d="M512 118 V154 H470" fill="none" stroke="#8E5BC8" stroke-width="1.6" marker-end="url(#ci-arrow)"/>

      <rect x="120" y="156" width="380" height="112" rx="8" fill="#FFFFFF" stroke="#8E5BC8" stroke-width="1.6"/>
      <rect x="120" y="156" width="380" height="24" rx="8" fill="#EBE0EC"/>
      <text x="132" y="173" font-family="Consolas,monospace" font-size="10" fill="#5B2E86">fx  =HYPERLINK("http://...","Открыть")</text>
      <line x1="120" y1="180" x2="500" y2="180" stroke="#DCCBE6"/>
      <text x="132" y="202" font-size="10.5" fill="#6E6179">A</text>
      <text x="300" y="202" font-size="10.5" fill="#6E6179">B</text>
      <text x="132" y="226" font-family="Consolas,monospace" font-size="10.5" fill="#2B2333">1</text>
      <text x="164" y="226" font-family="Consolas,monospace" font-size="10.5" fill="#2B2333">SKU-1042</text>
      <text x="300" y="226" font-family="Consolas,monospace" font-size="10.5" fill="#2B2333">=HYPERLINK(...)</text>
      <text x="132" y="250" font-family="Consolas,monospace" font-size="10.5" fill="#2B2333">2</text>
      <text x="164" y="250" font-family="Consolas,monospace" font-size="10.5" fill="#2B2333">SKU-2210</text>
      <text x="300" y="250" font-family="Consolas,monospace" font-size="10.5" fill="#4E4358">обычный текст</text>
      <rect x="294" y="210" width="118" height="22" rx="3" fill="none" stroke="#8A4F6E" stroke-width="1.8"/>

      <text x="524" y="182" font-size="12" font-weight="700" fill="#8A4F6E">Excel выполняет</text>
      <text x="524" y="200" font-size="12" font-weight="700" fill="#8A4F6E">формулу</text>
      <text x="524" y="220" font-size="10.5" fill="#6E6179">текст стал</text>
      <text x="524" y="236" font-size="10.5" fill="#6E6179">действием</text>

      <rect x="16" y="292" width="648" height="58" rx="8" fill="#F1E8F5" stroke="#C9B6D6" stroke-dasharray="4 3"/>
      <text x="28" y="313" font-size="11.5" font-weight="600" fill="#2B2333">Опасные начала ячейки: = + - @, табуляция, перевод строки и их полноширинные варианты.</text>
      <text x="28" y="332" font-size="11" fill="#4E4358">Защита: апостроф перед значением для Excel или отказ от опасных символов при выгрузке.</text>
      <text x="28" y="347" font-size="11" fill="#4E4358">Табуляция надёжнее в Excel, но остаётся в данных и мешает программному импорту.</text>

      <text x="16" y="368" font-family="Consolas,monospace" font-size="9.5" fill="#6E6179">НЕТ УНИВЕРСАЛЬНОГО ЭКРАНИРОВАНИЯ ДЛЯ ВСЕХ ТАБЛИЦ</text>
    </g>
  </svg>
  <p class="note">Формула не обязана быть вредоносной, чтобы стать проблемой. Достаточно, чтобы поле поставщика начиналось с равенства и попало в ячейку без проверки.</p>
</div>
</body>
</html>
