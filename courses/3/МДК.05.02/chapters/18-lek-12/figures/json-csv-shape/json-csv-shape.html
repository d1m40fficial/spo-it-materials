<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Одна накладная в JSON и CSV</title>
<style>
  :root { --paper:#F7F0FA; --card:#FFFFFF; --ink:#2B2333; --muted:#6E6179; --rule:#DCCBE6; --accent:#8E5BC8; --soft:#EBE0EC; --deep:#5B2E86; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px; }
  .eyebrow { margin:0 0 6px; font:600 10.5px/1.2 Consolas,monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .note { margin:10px 2px 0; font:12px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Обмен · дерево и таблица</p>
  <svg viewBox="0 0 680 424" role="img" aria-labelledby="jc-title jc-desc">
    <title id="jc-title">Накладная в JSON и в CSV</title>
    <desc id="jc-desc">В JSON накладная это объект с массивом строк. В CSV те же строки лежат в плоской таблице, а номер накладной повторяется в каждой строке.</desc>

    <defs>
      <marker id="jc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#8E5BC8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <g font-family="Segoe UI,system-ui,sans-serif">
      <text x="16" y="20" font-family="Consolas,monospace" font-size="9.5" fill="#6E6179">JSON: ОБЪЕКТ С МАССИВОМ СТРОК</text>

      <rect x="16" y="30" width="150" height="64" rx="8" fill="#EBE0EC" stroke="#8E5BC8" stroke-width="1.6"/>
      <text x="28" y="51" font-size="12.5" font-weight="700" fill="#2B2333">поставка</text>
      <text x="28" y="69" font-family="Consolas,monospace" font-size="10.5" fill="#4E4358">НК-2026-0417</text>
      <text x="28" y="85" font-size="10.5" fill="#5B2E86">объект</text>

      <rect x="196" y="24" width="130" height="34" rx="6" fill="#FFFFFF" stroke="#C9B6D6"/>
      <text x="206" y="46" font-family="Consolas,monospace" font-size="10.5" fill="#2B2333">number</text>
      <rect x="196" y="66" width="130" height="34" rx="6" fill="#FFFFFF" stroke="#C9B6D6"/>
      <text x="206" y="88" font-family="Consolas,monospace" font-size="10.5" fill="#2B2333">warehouse</text>
      <rect x="196" y="108" width="130" height="38" rx="6" fill="#FFFFFF" stroke="#C9B6D6"/>
      <text x="206" y="124" font-family="Consolas,monospace" font-size="10.5" fill="#2B2333">items</text>
      <text x="206" y="139" font-size="10" fill="#5B2E86">массив из 2</text>

      <rect x="356" y="94" width="176" height="50" rx="6" fill="#FFFFFF" stroke="#C9B6D6"/>
      <text x="366" y="112" font-family="Consolas,monospace" font-size="10.5" fill="#2B2333">sku: SKU-1042</text>
      <text x="366" y="130" font-family="Consolas,monospace" font-size="10.5" fill="#4E4358">qty: 48, price: 312.50</text>
      <rect x="356" y="152" width="176" height="50" rx="6" fill="#FFFFFF" stroke="#C9B6D6"/>
      <text x="366" y="170" font-family="Consolas,monospace" font-size="10.5" fill="#2B2333">sku: SKU-2210</text>
      <text x="366" y="188" font-family="Consolas,monospace" font-size="10.5" fill="#4E4358">qty: 12, price: 890.00</text>

      <path d="M166 62 H180 V41 H196 M166 62 H196 V83 M166 62 H180 V127 H196" fill="none" stroke="#8E5BC8" stroke-width="1.4" marker-end="url(#jc-arrow)"/>
      <path d="M326 127 H340 V119 H356 M326 127 H340 V177 H356" fill="none" stroke="#8E5BC8" stroke-width="1.4" marker-end="url(#jc-arrow)"/>

      <text x="546" y="112" font-size="10.5" fill="#6E6179">вложенность</text>
      <text x="546" y="128" font-size="10.5" fill="#6E6179">и типы</text>
      <text x="546" y="170" font-size="10.5" fill="#6E6179">число</text>
      <text x="546" y="186" font-size="10.5" fill="#6E6179">в JSON</text>

      <text x="16" y="238" font-family="Consolas,monospace" font-size="9.5" fill="#6E6179">CSV: ПЛОСКАЯ ТАБЛИЦА, ВСЕ ЯЧЕЙКИ СТРОКИ</text>

      <rect x="16" y="248" width="648" height="32" rx="5" fill="#EBE0EC" stroke="#8E5BC8"/>
      <text x="26" y="269" font-size="11" font-weight="700" fill="#2B2333">number</text>
      <text x="146" y="269" font-size="11" font-weight="700" fill="#2B2333">sku</text>
      <text x="246" y="269" font-size="11" font-weight="700" fill="#2B2333">title</text>
      <text x="446" y="269" font-size="11" font-weight="700" fill="#2B2333">qty</text>
      <text x="526" y="269" font-size="11" font-weight="700" fill="#2B2333">price</text>

      <rect x="16" y="280" width="648" height="32" fill="#FFFFFF" stroke="#DCCBE6"/>
      <text x="26" y="301" font-family="Consolas,monospace" font-size="10" fill="#2B2333">НК-2026-0417</text>
      <text x="146" y="301" font-family="Consolas,monospace" font-size="10" fill="#2B2333">SKU-1042</text>
      <text x="246" y="301" font-size="10.5" fill="#4E4358">Перчатки нитриловые</text>
      <text x="446" y="301" font-family="Consolas,monospace" font-size="10" fill="#2B2333">"48"</text>
      <text x="526" y="301" font-family="Consolas,monospace" font-size="10" fill="#2B2333">"312,50"</text>

      <rect x="16" y="312" width="648" height="32" fill="#FFFFFF" stroke="#DCCBE6"/>
      <text x="26" y="333" font-family="Consolas,monospace" font-size="10" fill="#2B2333">НК-2026-0417</text>
      <text x="146" y="333" font-family="Consolas,monospace" font-size="10" fill="#2B2333">SKU-2210</text>
      <text x="246" y="333" font-size="10.5" fill="#4E4358">Стрейч-плёнка</text>
      <text x="446" y="333" font-family="Consolas,monospace" font-size="10" fill="#2B2333">"12"</text>
      <text x="526" y="333" font-family="Consolas,monospace" font-size="10" fill="#2B2333">"890,00"</text>

      <text x="16" y="368" font-size="11.5" fill="#4E4358">Номер накладной повторяется в каждой строке, а вложенный массив исчез.</text>
      <text x="16" y="388" font-size="11.5" fill="#4E4358">Кавычки в CSV экранируют разделитель, но не задают тип значения.</text>
      <text x="16" y="412" font-family="Consolas,monospace" font-size="9.5" fill="#6E6179">JSON ЭКОНОМИТ ПОВТОРЫ, CSV УДОБЕН ДЛЯ ТАБЛИЦЫ</text>
    </g>
  </svg>
  <p class="note">Одна и та же информация организована по-разному. При переходе из JSON в CSV теряется вложенность, а типы приходится восстанавливать по договору.</p>
</div>
</body>
</html>
