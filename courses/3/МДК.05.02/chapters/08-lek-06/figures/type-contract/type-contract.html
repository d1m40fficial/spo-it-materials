<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Где хранится тип в Python и C#</title>
<style>
  :root { --paper:#EBE0EC; --card:#FBF7FC; --ink:#2A2233; --muted:#6B5F75; --rule:#D5C2DC; --accent:#8E5BC8; --soft:#E4D5EC; --bad:#A8455A; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px; }
  .eyebrow { margin:0 0 6px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .note { margin:10px 2px 0; font:12px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
  @media (max-width:560px) { .frame { padding:12px; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Типы · две модели</p>
  <svg viewBox="0 0 680 352" role="img" aria-labelledby="tc-title tc-desc">
    <title id="tc-title">Тип в Python и тип в C#</title>
    <desc id="tc-desc">Слева имя в Python ссылается на объект, который несёт тип, поэтому имя можно перепривязать к строке. Справа переменная C# объявлена целой, и присваивание строки не собирается.</desc>

    <g font-family="Segoe UI,system-ui,sans-serif">
      <rect x="16" y="28" width="314" height="238" rx="10" fill="#FBF7FC" stroke="#D5C2DC"/>
      <text x="30" y="50" font-size="12.5" font-weight="700" fill="#2A2233">Python: тип в объекте</text>
      <text x="30" y="66" font-size="10" fill="#6B5F75">имя это ссылка, тип проверяется при операции</text>

      <rect x="30" y="80" width="62" height="30" rx="6" fill="#EFE3F3" stroke="#8E5BC8"/>
      <text x="45" y="99" font-family="Consolas,monospace" font-size="10" fill="#2A2233">value</text>
      <path d="M94 95h18" stroke="#8E5BC8" stroke-width="1.4" fill="none" marker-end="url(#tc-arrow)"/>
      <rect x="116" y="76" width="198" height="38" rx="6" fill="#FFFFFF" stroke="#D5C2DC"/>
      <text x="128" y="92" font-size="10.5" fill="#2A2233">объект 4800</text>
      <text x="128" y="106" font-size="10" fill="#8E5BC8">тип int</text>

      <rect x="30" y="142" width="62" height="30" rx="6" fill="#EFE3F3" stroke="#8E5BC8"/>
      <text x="45" y="161" font-family="Consolas,monospace" font-size="10" fill="#2A2233">value</text>
      <path d="M94 157h18" stroke="#8E5BC8" stroke-width="1.4" fill="none" marker-end="url(#tc-arrow)"/>
      <rect x="116" y="138" width="198" height="38" rx="6" fill="#FFFFFF" stroke="#D5C2DC"/>
      <text x="128" y="154" font-size="10.5" fill="#2A2233">объект "4800"</text>
      <text x="128" y="168" font-size="10" fill="#8E5BC8">тип str</text>

      <text x="30" y="198" font-size="10.5" fill="#2A2233">Одно имя, два разных объекта.</text>
      <text x="30" y="214" font-size="10.5" fill="#6B5F75">Переприсваивание разрешено,</text>
      <text x="30" y="229" font-size="10.5" fill="#6B5F75">ошибка появится только в операции.</text>
      <text x="30" y="250" font-size="10" font-weight="700" fill="#8E5BC8">ПРОВЕРКА: ВО ВРЕМЯ ВЫПОЛНЕНИЯ</text>
    </g>

    <g font-family="Segoe UI,system-ui,sans-serif">
      <rect x="350" y="28" width="314" height="238" rx="10" fill="#FBF7FC" stroke="#D5C2DC"/>
      <text x="364" y="50" font-size="12.5" font-weight="700" fill="#2A2233">C#: тип в объявлении</text>
      <text x="364" y="66" font-size="10" fill="#6B5F75">переменная объявлена один раз</text>

      <rect x="364" y="76" width="198" height="34" rx="6" fill="#FFFFFF" stroke="#D5C2DC"/>
      <text x="374" y="97" font-family="Consolas,monospace" font-size="9.5" fill="#2A2233">int value = 4800;</text>
      <rect x="572" y="76" width="78" height="34" rx="6" fill="#EFE3F3" stroke="#8E5BC8"/>
      <text x="582" y="92" font-size="9.5" fill="#8E5BC8">4 байта</text>
      <text x="582" y="104" font-size="9.5" fill="#2A2233">диапазон</text>

      <rect x="364" y="128" width="198" height="34" rx="6" fill="#FBEDF0" stroke="#A8455A" stroke-dasharray="4 3"/>
      <text x="374" y="149" font-family="Consolas,monospace" font-size="9.5" fill="#A8455A">value = "4800";</text>
      <text x="572" y="142" font-size="10" font-weight="700" fill="#A8455A">CS0029</text>
      <text x="572" y="154" font-size="8.5" fill="#A8455A">не собирается</text>

      <text x="364" y="190" font-size="10.5" fill="#2A2233">Строку нельзя положить в int.</text>
      <text x="364" y="206" font-size="10.5" fill="#6B5F75">Ошибка видна до запуска,</text>
      <text x="364" y="221" font-size="10.5" fill="#6B5F75">компилятор проверяет все ветки.</text>
      <text x="364" y="250" font-size="10" font-weight="700" fill="#8E5BC8">ПРОВЕРКА: ПРИ СБОРКЕ</text>
    </g>

    <rect x="16" y="282" width="648" height="42" rx="8" fill="#EFE3F3" stroke="#8E5BC8"/>
    <text x="30" y="300" font-size="10.5" font-weight="700" fill="#5B3E76">ДОГОВОР ТИПА</text>
    <text x="30" y="316" font-size="10.5" fill="#2A2233">множество значений · допустимые операции · способ хранения в памяти</text>

    <text x="16" y="342" font-family="Consolas,monospace" font-size="9.5" fill="#6B5F75">ТИП ОТВЕЧАЕТ НА ВОПРОС, ЧТО ЗНАЧИТ ЗНАЧЕНИЕ, А НЕ ТОЛЬКО СКОЛЬКО ОНО ЗАНИМАЕТ</text>

    <defs>
      <marker id="tc-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8E5BC8"/></marker>
    </defs>
  </svg>
  <p class="note">Слева тип принадлежит объекту, справа типом объявлена переменная. Поэтому одинаковая запись присваивания означает в двух языках разное.</p>
</div>
</body>
</html>
