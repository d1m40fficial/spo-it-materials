<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Куда отнести фрагмент кода</title>
<style>
  :root { --paper:#FBF8FC; --card:#FFFFFF; --ink:#2A2430; --muted:#6B6175; --rule:#E0D3E6; --accent:#8E5BC8; --soft:#EBE0EC; --stop:#A85672; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:14px; }
  .eyebrow { margin:0 0 6px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .zone rect { fill:#FFFFFF; stroke:#D3C1DE; stroke-width:1.3; transition:fill .15s, stroke .15s; }
  .zone.on rect { fill:#EBE0EC; stroke:#8E5BC8; stroke-width:2.4; }
  .zone.bad rect { fill:#F6E7EC; stroke:#A85672; stroke-width:2.4; }
  .status { min-height:92px; margin-top:8px; padding:10px 12px; border-radius:9px; background:var(--soft); font-size:13px; line-height:1.45; }
  .status b { color:var(--accent); }
  .controls { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  button { font:600 11.5px/1.2 "Segoe UI",system-ui,sans-serif; padding:8px 9px; border-radius:8px; border:1px solid var(--rule); background:var(--card); color:var(--ink); cursor:pointer; text-align:left; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .note { margin:9px 2px 0; font:11.5px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
  @media (max-width:560px) { .frame { padding:10px; } .status { font-size:12.5px; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Архитектура · разбор фрагмента</p>
  <svg viewBox="0 0 680 218" role="img" aria-labelledby="bc-title bc-desc">
    <title id="bc-title">Четыре зоны ответственности</title>
    <desc id="bc-desc">Интерфейс, логика, данные и точка входа. Нажмите фрагмент кода, чтобы увидеть, в какой зоне ему место и почему.</desc>

    <g font-family="Segoe UI,system-ui,sans-serif">
      <text x="14" y="22" font-family="Consolas,monospace" font-size="9.5" fill="#6B6175">МЕСТО ОПРЕДЕЛЯЕТ ПРИЧИНА ИЗМЕНЕНИЯ</text>

      <g class="zone" data-k="ui">
        <rect x="14" y="36" width="150" height="66" rx="8"/>
        <text x="89" y="62" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2A2430">Интерфейс</text>
        <text x="89" y="80" text-anchor="middle" font-size="9.5" fill="#6B6175">текст, поля, команды</text>
        <text x="89" y="93" text-anchor="middle" font-size="9.5" fill="#6B6175">формат ответа</text>
      </g>

      <g class="zone" data-k="service">
        <rect x="176" y="36" width="150" height="66" rx="8"/>
        <text x="251" y="62" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2A2430">Логика</text>
        <text x="251" y="80" text-anchor="middle" font-size="9.5" fill="#6B6175">правила и проверки</text>
        <text x="251" y="93" text-anchor="middle" font-size="9.5" fill="#6B6175">порядок операции</text>
      </g>

      <g class="zone" data-k="repo">
        <rect x="338" y="36" width="150" height="66" rx="8"/>
        <text x="413" y="62" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2A2430">Данные</text>
        <text x="413" y="80" text-anchor="middle" font-size="9.5" fill="#6B6175">SQL и параметры</text>
        <text x="413" y="93" text-anchor="middle" font-size="9.5" fill="#6B6175">строки в объекты</text>
      </g>

      <g class="zone" data-k="entry">
        <rect x="500" y="36" width="166" height="66" rx="8"/>
        <text x="583" y="62" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2A2430">Точка входа</text>
        <text x="583" y="80" text-anchor="middle" font-size="9.5" fill="#6B6175">настройки и сборка</text>
        <text x="583" y="93" text-anchor="middle" font-size="9.5" fill="#6B6175">запуск цикла</text>
      </g>

      <text x="14" y="140" font-size="11" fill="#6B6175">Фрагмент может быть технически правильным, но стоять не на своём месте.</text>
      <text x="14" y="157" font-size="11" fill="#6B6175">Тогда его нельзя проверить отдельно и трудно заменить.</text>
      <text x="14" y="176" font-size="11" fill="#2A2430">Проверка: что изменится, если поменяется только это правило?</text>
    </g>
  </svg>
  <div class="status" id="bc-status"></div>
  <div class="controls" id="bc-buttons">
    <button data-k="repo" class="on">SQL-запрос с параметром</button>
    <button data-k="service">Проверка «резерв не больше остатка»</button>
    <button data-k="ui">Текст «Площадка не найдена»</button>
    <button data-k="entry">Чтение пути к базе из настроек</button>
    <button data-k="leak">import sqlite3 в обработчике кнопки</button>
  </div>
  <p class="note">Нажмите фрагмент. Подсветится зона, где ему место, и объяснение. Красная подсветка означает нарушение.</p>
</div>
<script>
(function () {
  var data = {
    repo: '<b>Слой данных.</b> Запрос с параметром знает таблицу и тип поля, но не знает, зачем нужен остаток. Он меняется вместе со схемой базы. Проверяется тестом на настоящей базе в памяти.',
    service: '<b>Слой логики.</b> Проверка резерва это правило склада. Оно меняется, когда меняется политика компании, а не дизайн экрана. Проверяется без базы: достаточно передать два числа.',
    ui: '<b>Слой интерфейса.</b> Текст сообщения меняется вместе с пожеланиями к экрану. Сервис сообщает, что площадка не найдена, а интерфейс решает, какими словами это сказать.',
    entry: '<b>Точка входа.</b> Чтение пути к базе и создание объектов это сборка приложения. Такой код знает про окружение и потому не может жить в сервисе, который должен работать в тесте.',
    leak: '<b>Нарушение.</b> Фрагмент стоит в интерфейсе, но по смыслу принадлежит слою данных. Импорт драйвера в обработчике кнопки означает, что экран знает про базу, а правило расчёта рискует переехать в обработчик.'
  };
  var zones = document.querySelectorAll('.zone');
  var buttons = document.querySelectorAll('#bc-buttons button');
  var status = document.getElementById('bc-status');

  function apply(key) {
    var zoneKey = key === 'leak' ? 'ui' : key;
    zones.forEach(function (z) {
      z.classList.toggle('on', z.dataset.k === zoneKey && key !== 'leak');
      z.classList.toggle('bad', z.dataset.k === zoneKey && key === 'leak');
    });
    buttons.forEach(function (b) { b.classList.toggle('on', b.dataset.k === key); });
    status.innerHTML = data[key];
  }
  zones.forEach(function (z) { z.addEventListener('click', function () { apply(z.dataset.k); }); });
  buttons.forEach(function (b) { b.addEventListener('click', function () { apply(b.dataset.k); }); });
  apply('repo');
})();
</script>
</body>
</html>
