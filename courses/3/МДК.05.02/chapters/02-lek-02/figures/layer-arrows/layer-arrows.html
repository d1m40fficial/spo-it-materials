<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Слои и направление зависимостей</title>
<style>
  :root { --paper:#FBF8FC; --card:#FFFFFF; --ink:#2A2430; --muted:#6B6175; --rule:#E0D3E6; --accent:#8E5BC8; --soft:#EBE0EC; --stop:#A85672; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; }
  .frame { background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:14px; }
  .eyebrow { margin:0 0 6px; font:600 10px/1.2 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  svg { display:block; width:100%; height:auto; }
  .layer rect { fill:#FFFFFF; stroke:#D3C1DE; stroke-width:1.3; transition:fill .15s, stroke .15s; cursor:pointer; }
  .layer.on rect { fill:#EBE0EC; stroke:#8E5BC8; stroke-width:2.4; }
  .status { min-height:80px; margin-top:8px; padding:10px 12px; border-radius:9px; background:var(--soft); font-size:13px; line-height:1.45; }
  .status b { color:var(--accent); }
  .controls { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  button { font:600 11.5px/1.2 "Segoe UI",system-ui,sans-serif; padding:8px 10px; border-radius:8px; border:1px solid var(--rule); background:var(--card); color:var(--ink); cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .note { margin:9px 2px 0; font:11.5px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--muted); }
  @media (max-width:560px) { .frame { padding:10px; } .status { font-size:12.5px; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Архитектура · слои</p>
  <svg viewBox="0 0 680 386" role="img" aria-labelledby="la-title la-desc">
    <title id="la-title">Три слоя приложения и база данных</title>
    <desc id="la-desc">Интерфейс, бизнес-логика и доступ к данным. Стрелки идут вниз, к базе. Обратная зависимость от данных к интерфейсу запрещена. Нажмите слой, чтобы увидеть его обязанности.</desc>

    <g font-family="Segoe UI,system-ui,sans-serif">
      <text x="14" y="20" font-family="Consolas,monospace" font-size="9.5" fill="#6B6175">ЗАВИСИМОСТИ ИДУТ ВНИЗ</text>

      <g class="layer" data-k="ui">
        <rect x="96" y="34" width="452" height="66" rx="9"/>
        <text x="112" y="59" font-size="14" font-weight="700" fill="#2A2430">Интерфейс</text>
        <text x="112" y="78" font-size="11" fill="#6B6175">экран, команды, меню, формат ответа</text>
        <text x="112" y="92" font-size="10" fill="#8E5BC8">знает, что показать</text>
        <text x="536" y="82" text-anchor="end" font-size="10" fill="#6B6175">меняется с дизайном</text>
      </g>

      <line x1="322" y1="100" x2="322" y2="124" stroke="#8E5BC8" stroke-width="2"/>
      <path d="M316 118 L322 127 L328 118" fill="none" stroke="#8E5BC8" stroke-width="2"/>
      <text x="336" y="118" font-size="10" fill="#6B6175">вызов</text>

      <g class="layer" data-k="service">
        <rect x="96" y="127" width="452" height="66" rx="9"/>
        <text x="112" y="152" font-size="14" font-weight="700" fill="#2A2430">Бизнес-логика</text>
        <text x="112" y="171" font-size="11" fill="#6B6175">правила, проверки, расчёт остатка</text>
        <text x="112" y="185" font-size="10" fill="#8E5BC8">знает, что можно сделать</text>
        <text x="536" y="175" text-anchor="end" font-size="10" fill="#6B6175">меняется с правилами</text>
      </g>

      <line x1="322" y1="193" x2="322" y2="217" stroke="#8E5BC8" stroke-width="2"/>
      <path d="M316 211 L322 220 L328 211" fill="none" stroke="#8E5BC8" stroke-width="2"/>
      <text x="336" y="211" font-size="10" fill="#6B6175">вызов</text>

      <g class="layer" data-k="repo">
        <rect x="96" y="220" width="452" height="66" rx="9"/>
        <text x="112" y="245" font-size="14" font-weight="700" fill="#2A2430">Доступ к данным</text>
        <text x="112" y="264" font-size="11" fill="#6B6175">запросы, строки, преобразование в объекты</text>
        <text x="112" y="278" font-size="10" fill="#8E5BC8">знает, где лежит запись</text>
        <text x="536" y="268" text-anchor="end" font-size="10" fill="#6B6175">меняется со схемой</text>
      </g>

      <line x1="322" y1="286" x2="322" y2="308" stroke="#B49AC6" stroke-width="2"/>
      <path d="M316 302 L322 311 L328 302" fill="none" stroke="#B49AC6" stroke-width="2"/>

      <ellipse cx="322" cy="330" rx="86" ry="15" fill="#FFFFFF" stroke="#D3C1DE"/>
      <path d="M236 330 L236 346 A86 15 0 0 0 408 346 L408 330" fill="#FFFFFF" stroke="#D3C1DE"/>
      <text x="322" y="344" text-anchor="middle" font-size="11" fill="#2A2430">База данных</text>

      <path d="M596 250 C640 250 640 70 600 70" fill="none" stroke="#A85672" stroke-width="2" stroke-dasharray="6 4"/>
      <path d="M606 78 L597 68 L606 60" fill="none" stroke="#A85672" stroke-width="2"/>
      <text x="662" y="160" text-anchor="middle" font-size="10" fill="#A85672" transform="rotate(90 662 160)">нельзя: данные не знают об экране</text>

      <text x="14" y="376" font-family="Consolas,monospace" font-size="9.5" fill="#6B6175">СЛОЙ ОПРЕДЕЛЯЕТ ПРИЧИНА ИЗМЕНЕНИЯ, А НЕ ИМЯ ПАПКИ</text>
    </g>
  </svg>
  <div class="status" id="la-status"></div>
  <div class="controls" id="la-buttons">
    <button data-k="ui" class="on">Интерфейс</button>
    <button data-k="service">Бизнес-логика</button>
    <button data-k="repo">Доступ к данным</button>
  </div>
  <p class="note">Нажмите слой на схеме. В карточке появятся его обязанности, разрешённые вызовы и типичная ошибка.</p>
</div>
<script>
(function () {
  var data = {
    ui: '<b>Интерфейс.</b> Показывает данные и принимает действия: меню, поля, команды, сообщения. Может вызывать сервис, но не базу. Типичная ошибка: обработчик кнопки сам собирает SQL и форматирует результат, из-за чего правило расползается по экранам.',
    service: '<b>Бизнес-логика.</b> Держит правила предметной области: доступный остаток, право на приёмку, порядок шагов операции. Вызывает репозиторий и возвращает данные, а не готовый текст. Типичная ошибка: печатать строку в консоль вместо возврата значения.',
    repo: '<b>Доступ к данным.</b> Выполняет запросы, превращает строки в объекты и не знает, зачем эти данные нужны. Типичная ошибка: форматировать сообщение для пользователя или решать, можно ли отгрузить товар.'
  };
  var cards = document.querySelectorAll('.layer');
  var buttons = document.querySelectorAll('#la-buttons button');
  var status = document.getElementById('la-status');

  function apply(key) {
    cards.forEach(function (c) { c.classList.toggle('on', c.dataset.k === key); });
    buttons.forEach(function (b) { b.classList.toggle('on', b.dataset.k === key); });
    status.innerHTML = data[key];
  }
  cards.forEach(function (c) { c.addEventListener('click', function () { apply(c.dataset.k); }); });
  buttons.forEach(function (b) { b.addEventListener('click', function () { apply(b.dataset.k); }); });
  apply('ui');
})();
</script>
</body>
</html>
